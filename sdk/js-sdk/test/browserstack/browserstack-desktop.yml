userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

envFile: test/.env

projectName: FHEVM SDK (Desktop)
buildName: bstack-fhevm-sdk-desktop
buildIdentifier: '#${BUILD_NUMBER}'

idleTimeout: 300

platforms:
  - os: Windows
    osVersion: 11
    browserName: chrome
    browserVersion: latest
  - os: OS X
    osVersion: Tahoe
    browserName: chrome
    browserVersion: latest

parallelsPerPlatform: 1

browserstackLocal: true
forceLocal: true

debug: false
networkLogs: true
consoleLogs: verbose
video: true

testReporting: true
# Session pass/fail is set by test/browser-smoke/fixtures.ts while the page is
# still open; the SDK's own attempt runs after the page is closed and fails.
testContextOptions:
  skipSessionStatus: true
