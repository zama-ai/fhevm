# Four nodes rate-limit twice: the retries wait one window (1 s) then two, the third attempt succeeds at 3.03 s.
flow: user_decrypt
threshold: 9
timeout: 5s
rate_limit: { max_retries: 2 }
nodes:
  - { count: 9, replies: [ok] }
  - { count: 4, replies: [rate_limited, rate_limited, ok] }
expect:
  outcome: ok
  counted: 13
  responses: 13
  elapsed: 3030ms
  attempts: 21
