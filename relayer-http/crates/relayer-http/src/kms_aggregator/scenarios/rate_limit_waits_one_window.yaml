# A rate-limited call waits one proxy window (initial_delay 1 s) before its retry, never inside the window that
# rejected it: four nodes answer 429 once, their retries succeed at 1.02 s.
flow: user_decrypt
threshold: 9
timeout: 5s
rate_limit: { max_retries: 1, initial_delay: 1s }
nodes:
  - { count: 9, replies: [ok] }
  - { count: 4, replies: [rate_limited, ok] }
expect:
  outcome: ok
  counted: 13
  responses: 13
  elapsed: 1020ms
  attempts: 17
  metrics:
    answered: 17
    errors: { rate_limited: 4 }
