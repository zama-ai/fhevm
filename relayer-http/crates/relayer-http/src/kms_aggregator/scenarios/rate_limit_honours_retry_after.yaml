# A Retry-After above the configured floor becomes the wait: four nodes send Retry-After: 2 with their 429, their
# retries run at 2.02 s instead of 1.02 s.
flow: user_decrypt
threshold: 9
timeout: 5s
rate_limit: { max_retries: 1, initial_delay: 1s }
nodes:
  - { count: 9, replies: [ok] }
  - { count: 4, replies: [{ rate_limited_after: 2s }, ok] }
expect:
  outcome: ok
  counted: 13
  responses: 13
  elapsed: 2020ms
  attempts: 17
  metrics:                     # the header changes the wait, not the code the attempt is recorded under
    answered: 17
    errors: { rate_limited: 4 }
