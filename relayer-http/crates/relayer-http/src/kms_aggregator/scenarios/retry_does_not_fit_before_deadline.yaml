# Slow attempts (850 ms) under a 1 s deadline: the 200 ms retry would end after the deadline, so the failing nodes
# give up at once instead of sleeping.
flow: user_decrypt
threshold: 9
timeout: 1s
retries: { waits: [200ms, 400ms] }
attempt_latency: 850ms
nodes:
  - { count: 9, replies: [ok] }
  - { count: 4, replies: [acl_denied] }
expect:
  outcome: ok
  counted: 9
  responses: 9
  elapsed: 850ms
  attempts: 13
