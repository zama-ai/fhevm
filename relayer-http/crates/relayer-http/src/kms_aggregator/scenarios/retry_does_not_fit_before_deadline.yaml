# Slow attempts (550 ms) under a 700 ms deadline: the 200 ms retry would end after the deadline, so the failing
# nodes give up at once instead of sleeping.
flow: user_decrypt
threshold: 9
timeout: 700ms
retries: { max_retries: 2 }
attempt_latency: 550ms
nodes:
  - { count: 9, replies: [ok] }
  - { count: 4, replies: [acl_denied] }
expect:
  outcome: ok
  counted: 9
  responses: 9
  elapsed: 550ms
  attempts: 13
