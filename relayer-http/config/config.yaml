name: zama-relayer-http
log:                        # optional: without this block the process logs JSON lines (production defaults)
  format: "pretty"          # json (default), pretty, or compact; the level filter is RUST_LOG (default "warn,relayer_http=info")
  show_file_line: false
  show_thread_ids: false
  show_timestamp: true
  show_target: true
http:
  endpoint: "0.0.0.0:8080"     # the API and the probes (/liveness, /healthz) on one port
  max_body_bytes: 1048576      # 1 MiB, the connector's limit; bigger request bodies are answered 400 malformed
  body_read_timeout: 10s       # total time to receive a request body; after headers a request lasts at most this + call.timeout
  supported_chain_ids: [1, 137]   # host chain ids a ciphertext handle may carry (bytes 22..30 of the handle)
kms_aggregator:
  allow_insecure_http: false   # local/compose only: allows plain http to non-loopback hosts
  max_concurrent_calls: 4096   # HTTP calls in flight at once, all aggregations together (>= number of endpoints); ~200 decryptions/s with 13 nodes, see kms_aggregator/docs.md
  call:
    timeout: 5000ms            # the deadline: one aggregation, and every call in it, ends by then
    retries:                   # retryable connector errors only; a retry never starts past the deadline
      max_retries: 5           # retries after the first attempt; 0 = single attempt; the deadline is the real bound
      delay: 200ms             # retry k waits min(delay * 2^(k-1), backoff_max)
      backoff_max: 4s          # cap of the exponential delay; <= call.timeout
  public_decrypt:
    threshold: 5               # identical (decryptedResult, extraData) answers needed; protocol config value (5 at n = 13) (t + 1)
  user_decrypt:
    threshold: 9               # shares needed; protocol config value (9 at n = 13) (2t + 1)
    checks:                    # optional response checks, all off by default
      decryption_id_match: false     # reject a response whose decryptionId is not the request's content hash
      decryption_id_majority: false  # count and return only the shares carrying the majority decryptionId
  auth:                        # FhevmSig (RFC-038) signing of every connector call; each connector allows the signer's address
    chain_id: 1                # Ethereum chain id, part of the EIP-712 domain
    protocol_config: "0x0000000000000000000000000000000000000000"   # ProtocolConfig address on Ethereum, part of the EIP-712 domain (placeholder)
    validity: 2m               # header lifetime: > call.timeout, <= 5m (the longest the connectors accept)
    address: "0x00000000000000000000000000000000000000ee"   # the signing key's address, allowed by every connector; startup fails on a mismatch (placeholder)
    signer: { type: private_key, value_env: RELAYER_SIGNER_KEY }   # or { type: aws_kms, key_id: "..." }, region and credentials from the AWS environment (IRSA)
  endpoints:                   # one entry per KMS node; `audience` is required: the FhevmSig audience the connector accepts, today its KMS
                               # tx-sender address (the proxy's `tx_sender_address`); non-zero, unique per endpoint
    - name: kms_00
      url: "https://kms-00.example.net:8443"   # origin only: the connector proxy matches /v1/... exactly
      audience: "0x0000000000000000000000000000000000000001"   # FhevmSig audience that node accepts (placeholder)
    - name: kms_01
      url: "https://kms-01.example.net:8443"   # origin only: the connector proxy matches /v1/... exactly
      audience: "0x0000000000000000000000000000000000000002"   # FhevmSig audience that node accepts (placeholder)
    - name: kms_02
      url: "https://kms-02.example.net:8443"   # origin only: the connector proxy matches /v1/... exactly
