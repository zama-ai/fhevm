# Local stack with 1 KMS connector(s), MPC threshold t=0: centralized mode, every scenario without a kms block.
# user decrypt needs 1 shares, public decrypt 1 identical answers. Generated by
# dev/scripts/gen-config.sh 1 0. Each 127.0.0.1:808x is a forwarder to one connector proxy (dev/scripts/proxies-up.sh);
# the proxy checks the Bearer key from KMS_API_KEY.
name: relayer-http-dev
log:
  format: pretty
  show_file_line: false
  show_thread_ids: false
  show_timestamp: true
  show_target: false
http:
  endpoint: "0.0.0.0:8080"
  max_body_bytes: 2097152
  supported_chain_ids: [12345, 67890]   # the two local host chains
kms_aggregator:
  allow_insecure_http: false            # loopback http is allowed as is
  max_concurrent_calls: 16
  call:
    timeout: 60s                        # local decrypts are slow; 60s is the configured maximum
    retries:
      max_retries: 0
      delay: 500ms
      backoff_max: 4s
  public_decrypt:
    threshold: 1
  user_decrypt:
    threshold: 1
  endpoints:
    - { name: kms_1, url: "http://127.0.0.1:8081", auth: { type: api_key, value_env: KMS_API_KEY } }
