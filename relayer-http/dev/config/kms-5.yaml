# Local stack with 5 KMS connector(s), MPC threshold t=1: five-party-swap-threshold-kms, 4-node committee plus 1 spare whose connector may not answer.
# user decrypt needs 3 shares, public decrypt 2 identical answers. Generated by
# dev/scripts/gen-config.sh 5 1. Each 127.0.0.1:808x is a forwarder to one connector proxy (dev/scripts/proxies-up.sh);
# the proxy checks the Bearer key from KMS_API_KEY.
name: relayer-http-dev
log:
  format: pretty
  show_file_line: false
  show_thread_ids: false
  show_timestamp: true
  show_target: false
http:
  endpoint: "0.0.0.0:8080"
  max_body_bytes: 2097152
  supported_chain_ids: [12345, 67890]   # the two local host chains
kms_aggregator:
  allow_insecure_http: false            # loopback http is allowed as is
  max_concurrent_calls: 16
  call:
    timeout: 60s                        # local decrypts are slow; 60s is the configured maximum
    retries:
      max_retries: 0
      delay: 500ms
      backoff_max: 4s
  public_decrypt:
    threshold: 2
  user_decrypt:
    threshold: 3
  endpoints:
    - { name: kms_1, url: "http://127.0.0.1:8081", auth: { type: api_key, value_env: KMS_API_KEY } }
    - { name: kms_2, url: "http://127.0.0.1:8082", auth: { type: api_key, value_env: KMS_API_KEY } }
    - { name: kms_3, url: "http://127.0.0.1:8083", auth: { type: api_key, value_env: KMS_API_KEY } }
    - { name: kms_4, url: "http://127.0.0.1:8084", auth: { type: api_key, value_env: KMS_API_KEY } }
    - { name: kms_5, url: "http://127.0.0.1:8085", auth: { type: api_key, value_env: KMS_API_KEY } }
