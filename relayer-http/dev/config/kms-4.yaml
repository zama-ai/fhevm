# Local stack with 4 KMS connector(s), MPC threshold t=1: four-party-threshold-kms.
# user decrypt needs 3 shares, public decrypt 2 identical answers. Generated by
# dev/scripts/gen-config.sh 4 1. Each 127.0.0.1:808x is a forwarder to one connector proxy (dev/scripts/proxies-up.sh);
# the proxy checks the FhevmSig signed with RELAYER_SIGNER_KEY for that party's tx-sender (the endpoint's audience).
name: relayer-http-dev
log:
  format: pretty
  show_file_line: false
  show_thread_ids: false
  show_timestamp: true
  show_target: false
http:
  endpoint: "0.0.0.0:8080"
  max_body_bytes: 1048576               # 1 MiB, the connector's limit
  body_read_timeout: 10s                # total time to receive a request body
  supported_chain_ids: [12345, 67890]   # the two local host chains
kms_aggregator:
  allow_insecure_http: false            # loopback http is allowed as is
  max_concurrent_calls: 16
  call:
    timeout: 5s                         # the deadline of one aggregation
    retries:
      max_retries: 5                    # retryable connector errors only: waits 200, 400, 800, 1600 ms (the 5th, 3.2 s, does not fit the deadline)
      delay: 200ms
      backoff_max: 4s
  public_decrypt:
    threshold: 2
  user_decrypt:
    threshold: 3
  auth:
    chain_id: 12345                     # the default host chain, the one the connectors read
    protocol_config: "0x0000000000000000000000000000000000000000"   # set by relayer-run.sh from the running stack
    validity: 2m
    signer: { type: private_key, value_env: RELAYER_SIGNER_KEY }
  endpoints:
    - { name: kms_1, url: "http://127.0.0.1:8081", audience: "0xEEcE0864CCAB13866AdCa8319B278b6d4af40484" }
    - { name: kms_2, url: "http://127.0.0.1:8082", audience: "0x0425EB924AcCc9199ebf98038Dea9cA4823bC3e9" }
    - { name: kms_3, url: "http://127.0.0.1:8083", audience: "0x885B871b70335f1A8111F4B2BEB533821Ef4b86C" }
    - { name: kms_4, url: "http://127.0.0.1:8084", audience: "0x0D836d479DfA383be1f855688bE699CF69c3f1ce" }
