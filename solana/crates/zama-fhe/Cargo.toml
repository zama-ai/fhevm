[package]
name = "zama-fhe"
version = "0.1.0"
description = "App-facing helpers for building ZamaHost Solana FHE eval requests"
authors.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
cpi = ["zama-host/cpi"]
# For a program that installs its own allocator: lifts the on-chain step ceiling
# (`MAX_ON_CHAIN_BATCH_OPS`) back to the host's `MAX_FHE_BATCH_OPS`. Off-chain builds are unaffected
# either way.
raised-heap = []

[dependencies]
anchor-lang = "1.0.2"
zama-host = { path = "../../programs/zama-host", features = ["no-entrypoint"] }
zama-solana-acl = { path = "../zama-solana-acl" }
