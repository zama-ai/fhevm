[package]
name = "zama-host"
version = "0.1.0"
description = "Solana PoC host program for Zama FHEVM ACL and compute events"
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "zama_host"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
# Off-chain instruction/event decoding for indexers (host-listener, proof
# service). Not reachable from the SBF builds we run: `anchor build` and
# `cargo build-sbf -p zama-host` both resolve `feature="default"` only. A
# workspace-wide SBF build would feature-unify it in from the off-chain crates
# that request it -- as it already would `cpi`/`no-entrypoint`, the more
# serious half, since that would ship a `.so` with no entrypoint.
decode = []
# Off-chain fhe_execute encoding for clients and tests (runtime-tests). Same
# unification caveat as `decode` above.
encode = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["event-cpi"] }
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
solana-sha256-hasher = "3.1.0"
solana-instructions-sysvar = "3.0.1"
solana-sysvar = { version = "3.1.1", features = ["bytemuck"] }
solana-ed25519-instruction = { path = "../../crates/solana-ed25519-instruction" }
solana-secp256k1-recover = "3.1.1"
zama-solana-acl = { path = "../../crates/zama-solana-acl" }
borsh = "1"

[dev-dependencies]
k256 = { version = "0.13.4", features = ["ecdsa"] }
sha2 = "0.10"
