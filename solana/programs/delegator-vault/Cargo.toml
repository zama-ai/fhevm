[package]
name = "delegator-vault"
version = "0.1.0"
description = "Test-only CPI probe: a program PDA as delegator or pauser, a nested transient-store close, and CPI return-data checks"
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "delegator_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "zama-host/idl-build"]

[dependencies]
anchor-lang = "1.2.0"
zama-host = { path = "../zama-host", features = ["cpi"] }
