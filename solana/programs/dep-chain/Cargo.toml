[package]
name = "dep-chain"
version = "0.1.0"
description = "Specimen zama-host consumer: a long dependent FHE step chain for load smoke"
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "dep_chain"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "zama-host/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
zama-fhe = { path = "../../crates/zama-fhe", features = ["cpi"] }
zama-host = { path = "../zama-host", features = ["cpi"] }
