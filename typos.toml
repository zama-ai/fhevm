# typos configuration for FHEVM monorepo
# https://github.com/crate-ci/typos

[files]
# Directories to exclude from checking
extend-exclude = [
    # Dependencies and build artifacts
    "node_modules/",
    "target/",
    "dist/",
    "build/",
    "artifacts/",
    "cache/",

    # Generated code
    "rust_bindings/",
    "typechain-types/",
    "codegen/",

    # External libraries
    "lib/forge-std/",
    "lib/openzeppelin-contracts/",
    "lib/openzeppelin-contracts-upgradeable/",
    # Specific docs with known legacy typos (tracked separately)
    "coprocessor/fhevm-engine/host-listener/README.md",
    "sdk/js-sdk/src/wasm/tfhe/v1.6.1/tfhe-worker.mjs",

    # Vendored TKMS wasm blobs and their generated typings: copied verbatim from
    # the kms repo by scripts/regen-tkms-wasm.sh, so any wording fixed here comes
    # back on the next regeneration. The directory rather than the file, because
    # the filenames carry the source commit and change with it.
    "sdk/js-sdk/src/wasm/tkms/",

    # Keys and charts (binary/config data)
    "fhevm-keys/",
    "charts/",

    # Generated permit vectors: the signed texts embed base58 pubkeys, whose
    # random fragments read as misspelled words. The keys are part of the frozen
    # canon four implementations consume, so they cannot be reworded.
    "solana/test-fixtures/permit/permit_v1.json",

    # Protocol buffers (generated)
    "proto/",

    # cargo-chef recipe (generated; embeds crate names like `writeable`)
    "listener/recipe.json",

    # Lock files and binaries
    "*.lock",
    "*.pdf",
    "*.png",
    "*.jpg",
    "*.jpeg",
    "*.gif",
    "*.ico",
    "*.woff",
    "*.woff2",
    "*.ttf",
    "*.eot",
    "*.min.js",
    "*.min.css",
    # Docs-only scope for now: exclude source/config/test files
    "*.sol",
    "*.js",
    "*.sql",
    "*.toml",
    "*.yaml",
    "*.yml",
    "*.sh",
    "*.bash",
    "*.zsh",
    "*.txt",
]

[default]
# Locale for spell checking
locale = "en-us"

[default.extend-words]
# British English variants accepted
behaviour = "behaviour"
behaviours = "behaviours"
colour = "colour"
colours = "colours"
centre = "centre"
centres = "centres"
analyse = "analyse"
analysed = "analysed"
analysing = "analysing"
apologise = "apologise"
apologised = "apologised"
apologising = "apologising"
finalise = "finalise"
finalised = "finalised"
finalising = "finalising"
initialise = "initialise"
initialised = "initialised"
initialising = "initialising"
initialisation = "initialisation"
serialise = "serialise"
serialised = "serialised"
serialising = "serialising"
serialisation = "serialisation"
optimise = "optimise"
optimised = "optimised"
optimiser = "optimiser"
organisation = "organisation"
uncomplete = "uncomplete" # metric identifiers in docs/code
organised = "organised"
customise = "customise"
authorise = "authorise"
authorised = "authorised"
decentralised = "decentralised"
artefacts = "artefacts"
misbehaviour = "misbehaviour"
randomise = "randomise"
randomised = "randomised"
randomising = "randomising"
randomisation = "randomisation"
rerandomise = "rerandomise"
rerandomised = "rerandomised"
rerandomising = "rerandomising"
rerandomisation = "rerandomisation"

# FHE/TFHE terminology - these are valid domain-specific terms
euint = "euint"           # encrypted unsigned integer type prefix
ebool = "ebool"           # encrypted boolean
eaddress = "eaddress"     # encrypted address
ebytes = "ebytes"         # encrypted bytes
einput = "einput"         # encrypted input

# Common abbreviations and technical terms
reencrypt = "reencrypt"   # re-encryption operation
reencryption = "reencryption"
decryptor = "decryptor"   # entity that decrypts
bimap = "bimap"           # Rust crate name
ciphertext = "ciphertext" # encrypted data
ciphertexts = "ciphertexts"
plaintext = "plaintext"   # unencrypted data
plaintexts = "plaintexts"

# Project-specific identifiers
fhevm = "fhevm"           # FHE Virtual Machine
tfhe = "tfhe"             # TFHE library
kms = "kms"               # Key Management Service
acl = "acl"               # Access Control List

# Crypto/blockchain terms
uint = "uint"             # unsigned integer (Solidity)
abi = "abi"               # Application Binary Interface
eip = "eip"               # Ethereum Improvement Proposal
calldata = "calldata"     # Solidity calldata keyword
bytecode = "bytecode"     # compiled contract code
hardhat = "hardhat"       # Ethereum dev framework
datas = "datas"           # required JSON key in governance remote-proposal format

# Common variable/function name patterns that might be flagged
noop = "noop"             # no operation
keypair = "keypair"       # cryptographic key pair
keygen = "keygen"         # key generation
pubkey = "pubkey"         # public key
privkey = "privkey"       # private key

# Rust module/variable naming conventions
consts = "consts"         # common Rust module name for constants
dbe = "dbe"               # variable name (DbError)

# External project/service names
Hashi = "Hashi"           # HashiCorp (Hashi bridge project)

# AWS AMI IDs contain random hex strings
caf = "caf"               # appears in AWS AMI IDs

# Test variable naming patterns
BA = "BA"                 # used in test variable names (e.g., wrongOrderBAInsteadOfAB)

# Doc
PN = "PN"                 # abbreviation P1, ..., PN

[default.extend-identifiers]
# Solana SlotHashes sysvar address — a base58 "vanity" pubkey that reads as
# "SysvarSlotHashes" with a digit 1 in place of the l; whitelist the whole
# identifier so typos doesn't split it and flag the "ot" fragment.
SysvarS1otHashes111111111111111111111111111 = "SysvarS1otHashes111111111111111111111111111"
# Encrypted-value-account address fixture shared by the runtime-test SDK cross-pins and the
# relayer's PDA-derivation test — a derived PDA whose random "cUeQ" fragment splits into a
# flagged "Ue". The literal is the cross-side pin and cannot be reworded.
"5K29xw8jynL8Vw63cRm6cUeQK1dfs5M2Vx3r5inwos5p" = "5K29xw8jynL8Vw63cRm6cUeQK1dfs5M2Vx3r5inwos5p"
