# The contract allowed for user decryption on user_ct_handles
allowed_contract = "0x5ffdaAB0373E62E2ea2944776209aEf29E631A64"

# The time during which the tool will send request bursts to the Gateway/Connectors' DBs
# Format documentation: https://docs.rs/humantime/latest/humantime/
tests_duration = "500ms"

# The time to wait between two request bursts
# Format documentation: https://docs.rs/humantime/latest/humantime/
tests_interval = "1s"

# The number of parallel requests to send to the Gateway/Connectors' DBs, at each interval
parallel_requests = 1

# # If requests burst must be sent sequentially only when the previous one has been completed
# # Defaults to false, if set to true, then `tests_interval` is ignored
# sequential = false

# The ciphertexts to use for public decryptions
[[public_ct]]
# The handle used of the ciphertext
handle = "0xda3d66e55d4e9d1ddd3b92e6a2aa18b395682a66b4ff00000000000030390500"

# The ciphertexts to use for user decryptions
[[user_ct]]
# The handle used of the ciphertext
handle = "0x40adb5c10021bc48db12559b699cff2357a492d1d1ff00000000000030390500"

# Configuration section for stress test using the Gateway chain
[blockchain]
# Gateway WebSocket RPC URL endpoint (required)
gateway_url = "http://localhost:8546"

# Chain ID for the Host network (required)
host_chain_id = 12345

# Chain ID for the Gateway network (required)
gateway_chain_id = 54321

# Address of the Decryption contract (required)
decryption_address = "0xF0bFB159C7381F7CB332586004d8247252C5b816"

# Wallet's private key as a hex string (funded deployer account on the Gateway chain)
private_key = "e746bc71f6bee141a954e6a49bc9384d334e393a7ea1e70b50241cb2e78e9e4c"


# Configuration section for stress test using the Connectors' DBs
[database]
# The URLs of the Connectors' DBs (one per KMS-connector party in the four-party-threshold-kms scenario)
urls = [
    "postgresql://postgres:postgres@localhost:5432/kms-connector",
    "postgresql://postgres:postgres@localhost:5432/kms-connector-2",
    "postgresql://postgres:postgres@localhost:5432/kms-connector-3",
    "postgresql://postgres:postgres@localhost:5432/kms-connector-4",
]

# The pool size for each connection to a Connector's DB
pool_size = 10

# The timeout for the connection to a Connector's DB
connection_timeout = "30s"

# The number of requests to insert in one insertion query (should be smaller than the
# `events_batch_size` setting of the KMS Workers)
insertion_chunk_size = 10


# Configuration section for stress test using the Connectors' HTTP endpoints
[http]
urls = [
    "https://kms-connector-proxy:8443",
    "https://kms-connector-2-proxy:8443",
    "https://kms-connector-3-proxy:8443",
    "https://kms-connector-4-proxy:8443",
]

# Each party's KMS tx-sender address, aligned with `urls`: the `audience` of the `FhevmSig` headers
# its proxy accepts. Here, the fhevm-cli stack's (KMS_CONNECTOR_TX_SENDER_ADDRESSES of the test-suite env).
tx_sender_addresses = [
    "0xEEcE0864CCAB13866AdCa8319B278b6d4af40484",
    "0x0425EB924AcCc9199ebf98038Dea9cA4823bC3e9",
    "0x885B871b70335f1A8111F4B2BEB533821Ef4b86C",
    "0x0D836d479DfA383be1f855688bE699CF69c3f1ce",
]

# The host chain id and `ProtocolConfig` contract address, forming the `FhevmSig` EIP-712 domain.
ethereum_chain_id = 12345
# The `ProtocolConfig` contract address for the `FhevmSig` EIP-712 domain (here, the one of the test-suite env).
protocol_config_address = "0x52054F36036811ca418be59e41Fc6DD1b9e4F4c8"

# Key signing the `FhevmSig` headers: its address must be in the proxies' `allowed_senders`. Testing
# only: this is the e2e test key (address 0xAE808c0968fF9557C8E0EAbcf57747c75B490Aa0).
sender_private_key = "0xdcd7f0c4990a3df000d45f6eb2728a8cf93f0d16b1f6bdffbe07f5a250250e6c"

# The proxies' certificate to trust.
# tls_ca_cert = "/etc/kms-connector/proxy/tls.crt"

# Skip TLS certificate verification instead of trusting `tls_ca_cert`. Testing only.
danger_accept_invalid_certs = true

# How long each `FhevmSig` header is valid for (at most 5m, the proxies' limit). Defaults to
# `request_timeout`.
# auth_validity = "120s"

# Client-side timeout of each request.
request_timeout = "120s"
