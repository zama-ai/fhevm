apiVersion: fhevm.zama.ai/profile/v1
kind: Profile
metadata:
  name: fx-secret
  description: Fixture profile with every kind of value source, including a secret.
spec:
  envFiles:
    - ./fx-secret.env
    - path: ./does-not-exist.env
      optional: true
  settings:
    fixture.secret: { env: TE_FIXTURE_SECRET, secret: true }
    fixture.literal: { value: hello-literal }
    fixture.from-file: { env: TE_FIXTURE_FROM_FILE }
    fixture.with-default: { env: TE_FIXTURE_UNSET_VARIABLE, default: fallback-value }
