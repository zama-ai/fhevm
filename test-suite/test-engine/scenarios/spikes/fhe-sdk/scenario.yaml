apiVersion: fhevm.zama.ai/scenario/v1
kind: Scenario

metadata:
  id: spike.fhe-sdk
  name: Spike S4 - fhEVM SDK inside the engine
  owner: qa
  description: >-
    Throwaway spike (phase-1b.md section 13). Encrypts a uint64 with an input proof, has the TestInput contract add 42,
    then user-decrypts and publicly decrypts the result through @fhevm/sdk, and checks that nothing the SDK opened stays
    alive once released. Needs the local stack and the TestInput artifact (see fetch-artifact.sh).
  tags: [spike, fhe]

spec:
  runtime: cucumber
  entrypoint: ./fhe-sdk.feature
  supportCode:
    - ./steps.ts
  timeoutSeconds: 300
  targets: [local]
