apiVersion: fhevm.zama.ai/profile/v1
kind: Profile
metadata:
  name: local
  description: Local stack started with fhevm-cli (ephemeral, throwaway secrets)
spec:
  requiresConfirmation: false
  # Written by `fhevm-cli up`. The RPC address is the one seen from the stack's containers: the
  # engine runs in a container on that network.
  envFiles:
    - path: ../../../.fhevm/runtime/env/test-suite.env
      optional: true
  chain:
    rpcUrl: { env: RPC_URL }
    chainId: { env: CHAIN_ID_HOST, default: 12345 }
    mnemonic: { env: MNEMONIC, secret: true }
  # The local relayer requires no API key.
  relayer:
    url: { env: RELAYER_URL }
    gateway:
      chainId: { env: CHAIN_ID_GATEWAY, default: 54321 }
      decryption: { env: DECRYPTION_ADDRESS }
      inputVerification: { env: INPUT_VERIFICATION_ADDRESS }
  contracts:
    acl: { env: ACL_CONTRACT_ADDRESS }
    inputVerifier: { env: INPUT_VERIFIER_CONTRACT_ADDRESS }
    kmsVerifier: { env: KMS_VERIFIER_CONTRACT_ADDRESS }
    protocolConfig: { env: PROTOCOL_CONFIG_CONTRACT_ADDRESS }
  settings: {}
