apiVersion: fhevm.zama.ai/profile/v1
kind: Profile
metadata:
  name: devnet
  description: DevNet (zws-dev), Sepolia host chain
spec:
  requiresConfirmation: false
  # The variable names are those of the DevNet e2e pods (namespace relayer on zws-dev), which hold
  # every host chain of the cluster: the host chain's values carry the ETH_ prefix.
  chain:
    rpcUrl: { env: ETH_RPC_URL, secret: true }
    chainId: { value: 11155111 }
    mnemonic: { env: MNEMONIC, secret: true }
  relayer:
    url: { env: RELAYER_URL }
    # Empty means no authentication; set it once the DevNet relayer requires a key.
    apiKey: { env: ZAMA_FHEVM_API_KEY, secret: true, default: "" }
    gateway:
      chainId: { env: CHAIN_ID_GATEWAY }
      decryption: { env: DECRYPTION_ADDRESS }
      inputVerification: { env: INPUT_VERIFICATION_ADDRESS }
  contracts:
    acl: { env: ETH_ACL_CONTRACT_ADDRESS }
    executor: { env: ETH_FHEVM_EXECUTOR_CONTRACT_ADDRESS }
    inputVerifier: { env: ETH_INPUT_VERIFIER_CONTRACT_ADDRESS }
    kmsVerifier: { env: ETH_KMS_VERIFIER_CONTRACT_ADDRESS }
    protocolConfig: { env: ETH_PROTOCOL_CONFIG_CONTRACT_ADDRESS }
  settings: {}
