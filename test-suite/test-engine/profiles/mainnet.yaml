apiVersion: fhevm.zama.ai/profile/v1
kind: Profile
metadata:
  name: mainnet
  description: "Mainnet. Real funds: requires --confirm mainnet and an explicit spec.targets entry"
spec:
  requiresConfirmation: true
  chain:
    rpcUrl: { env: MAINNET_ETH_RPC_URL, secret: true }
    chainId: { value: 1 }
    mnemonic: { env: MNEMONIC, secret: true }
  # The relayer and contracts sections arrive with the modules that own them.
  settings: {}
