version: 1
kind: coprocessor-consensus
name: Two Of Three Multi Chain
description: 3 coprocessors with threshold 2 across two host chains — enables consensus mismatch detection (for drift auto-recovery) plus multi-chain coverage.
hostChains:
  - key: host
    chainId: "12345"
    rpcPort: 8545
  - key: chain-b
    chainId: "67890"
    rpcPort: 8547
topology:
  count: 3
  threshold: 2
# 4-party threshold KMS (t=1). Insecure keygen keeps boot fast; the real MPC keygen is covered
# by the four-party-threshold-kms and five-party-swap-threshold-kms legs.
kms:
  mode: threshold
  parties: 4
  threshold: 1
  fheParams: Test
  insecureTestKeygen: true
