version: 1
kind: blue-green
name: Blue-Green Upgrade
description: >
  Single-operator Blue-Green upgrade flow. BCS runs a pinned 0.15.0 image; GCS is built locally
  from HEAD. Override BCS via `--bcs-tag <tag-or-sha>`.

    ./fhevm-cli up --scenario blue-green --build
    ./fhevm-cli test blue-green

bcs:
  source:
    mode: registry
    # 0.15.0 from main, not the 0.14 release: this round is 0.15.0 -> 0.15.1 (consensus 2 -> 3).
    tag: c3115a0

gcs:
  source:
    mode: local
