version: 1
kind: blue-green
name: Blue-Green Upgrade
description: >
  Single-operator Blue-Green upgrade flow. BCS runs a pinned previous-release
  image; GCS is built locally from HEAD. Override BCS via `--bcs-tag <tag-or-sha>`.

    ./fhevm-cli up --scenario blue-green --build
    ./fhevm-cli test blue-green

bcs:
  source:
    mode: registry
    tag: v0.14.2-0

gcs:
  source:
    mode: local

# The pinned Blue (tfhe-rs 1.6) cannot read key material from a 0.15+ KMS core, so the contracts,
# KMS core and connector and listener-core boot on the last 0.14 release and generate the keys
# there. The bootstrap step then upgrades them to the resolved bundle in place and starts Green:
# the same order as a production 0.14 to 0.15 rollout.
bootstrap:
  tag: v0.14.2-0
