version: 1
kind: blue-green
name: Blue-Green Upgrade (2-of-3)
description: >
  Three-operator Blue-Green upgrade with threshold 2 (matches `two-of-three`
  drift-revert). Cutover still requires unanimity across all N operators
  per RFC-021. See blue-green.yaml for details.

topology:
  count: 3
  threshold: 2

bcs:
  source:
    mode: registry
    tag: v0.14.2-0

gcs:
  source:
    mode: local

# The pinned Blue (tfhe-rs 1.6) cannot read key material from a 0.15+ KMS core, so the contracts,
# KMS core and connector and listener-core boot on the last 0.14 release and generate the keys
# there. The bootstrap step then upgrades them to the resolved bundle in place and starts Green:
# the same order as a production 0.14 to 0.15 rollout.
bootstrap:
  tag: v0.14.2-0
