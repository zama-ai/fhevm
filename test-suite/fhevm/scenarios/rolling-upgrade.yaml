version: 1
kind: coprocessor-consensus
name: Rolling Upgrade
description: >
  Two coprocessors on the same consensus version, each running its own image.
  Both stay live and process traffic together; removing one must not interrupt
  the other. This is the shape of a release that does not change consensus.
  Run it with --build so each instance builds from the working tree.

    ./fhevm-cli up --scenario rolling-upgrade --build
    ./fhevm-cli test rolling-upgrade

  In CI, dispatch `test-suite-e2e-tests` with scenario `rolling-upgrade` and
  test-profile `rolling-upgrade`.

topology:
  count: 2
  # Threshold below count: a rolling upgrade must keep quorum while one
  # coprocessor is being replaced.
  threshold: 1

instances:
  - index: 0
    args:
      host-listener-consumer:
        - --service-name=coprocessor-host-listener-consumer
  - index: 1
    args:
      host-listener-consumer:
        - --service-name=coprocessor1-host-listener-consumer
