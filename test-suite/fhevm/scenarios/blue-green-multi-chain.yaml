version: 1
kind: blue-green
name: Blue-Green Upgrade (multi-chain)
description: >
  Two-host-chain Blue-Green upgrade. A single coprocessor stack serves
  both host chains; the upgrade proposal carries one ChainUpgradeWindow per chain
  and cutover fires only after BOTH chains (and the Gateway) reach unanimity.
  Runs the same failed-then-successful flow as blue-green.yaml, over two chains.

    ./fhevm-cli up --scenario blue-green-multi-chain --build
    ./fhevm-cli test blue-green

hostChains:
  - key: host
    chainId: "12345"
    rpcPort: 8545
  - key: chain-b
    chainId: "67890"
    rpcPort: 8547

bcs:
  source:
    mode: registry
    tag: v0.14.2-0

gcs:
  source:
    mode: local

# The pinned Blue (tfhe-rs 1.6) cannot read key material from a 0.15+ KMS core, so the core boots
# on the last 0.14 release, generates the keys, and is upgraded to the resolved bundle once the
# operators have ingested them: the same order as a production KMS upgrade over existing keys.
kms:
  bootstrap:
    coreVersion: v0.14.2-0
