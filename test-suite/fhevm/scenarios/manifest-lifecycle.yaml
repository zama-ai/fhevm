version: 1
kind: coprocessor-consensus
name: Manifest lifecycle
description: Three local coprocessors, quorum two, with startup-file manifest injection on coprocessor 2.
topology:
  count: 3
  threshold: 2
instances:
  - index: 0
    args:
      consensus-detector:
        - --manifest-discovery-interval=1s
        - --manifest-verification-retry-count=300
  - index: 1
    args:
      consensus-detector:
        - --manifest-discovery-interval=1s
        - --manifest-verification-retry-count=300
  - index: 2
    args:
      consensus-detector:
        - --manifest-discovery-interval=1s
        - --manifest-verification-retry-count=300
        - --dangerous-drift-injection=/manifest-drift/injection.json
