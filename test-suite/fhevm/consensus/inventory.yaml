  # ---------------------------------------------------------------- gpu lifecycle
  - id: GPU-01-MIXED-BACKEND-GUARD
    family: gpu-lifecycle
    property: >-
      The mixed-backend guard detects a deliberately created doubly-served queue,
      names it, and clears once the queue has one worker again - leaving no mixed
      output for subsequent cases.
    # Every GPU case is established on the heterogeneous-scheduling stack, which
    # is one stack for the whole leg: under a GPU session the container worker
    # arguments a scenario sets are inert -- the units serve the queues -- so the
    # scenario is neutral for the lifecycle cases and keeps SCH-01/SCH-02's
    # precondition available in the same session. The heterogeneity SCH-01
    # asserts is read from the resolved unit configuration at runtime, never from
    # this name.
    topology: { scenario: three-of-three-heterogeneous-scheduling, operators: 3, threshold: 3, backends: [gpu] }
    services: [tfhe-worker]
    capabilities: [gpu, systemd-user, service-control]
    workload: A deliberate CPU container started beside an active GPU unit, then removed.
    fault: { mechanism: mixed-backend-split, stage: both implementations serving one queue, observation: the launcher's conflicts command exits non-zero and names the queue }
    participants: { compute: all, submit: all, quorum: not_checked }
    assertions:
      - precondition: the guard is quiet before the split
      - fault: the guard fires and names the operator, kind, unit and container
      - liveness: the guard clears after repair rather than latching
      - safety: readiness/preflight rejects the split too, not only the launcher command
      - cleanup: the diagnostic workload is cleaned up or the stack is declared contaminated
    timeout_s: 900
    cleanup: [stop the CPU container; verify one worker per queue; clean or quarantine diagnostic rows]
    runner: scripts/run-gpu-lifecycle-cases.sh --case gpu-01 --operator 1
    ci: { leg: gpu, backend: gpu }
    artifacts: [case-results, guard-output]
    acceptance: required

  - id: GPU-02-DB-REVERT-QUIESCENCE
    family: gpu-lifecycle
    property: >-
      The coprocessor database revert cannot start while any GPU writer is live: all
      writers are stopped and verified stopped first, and are restored afterwards with
      their recorded configuration.
    topology: { scenario: three-of-three-heterogeneous-scheduling, operators: 3, threshold: 3, backends: [gpu] }
    services: [tfhe-worker, zkproof-worker, sns-worker]
    capabilities: [gpu, systemd-user, service-control]
    workload: The db-state-revert profile against a stack whose worker queues are served by GPU units.
    fault: { mechanism: none, stage: none, observation: every writer verified not running before any SQL executes }
    participants: { compute: none, submit: none, quorum: not_checked }
    assertions:
      - safety: no SQL runs while any relevant writer is live
      - safety: a writer that cannot be quiesced aborts the profile rather than proceeding
      - cleanup: only roles active before the operation are restarted
      - cleanup: exactly one worker implementation per queue afterwards
      - cleanup: a failed revert restores the original ownership without reviving CPU competitors
    timeout_s: 1800
    cleanup: [ownership record retained until verified restoration]
    runner: scripts/run-gpu-lifecycle-cases.sh --case gpu-02
    ci: { leg: gpu, backend: gpu }
    artifacts: [case-results, quiescence-evidence, ownership-record]
    acceptance: required

  - id: GPU-03-CONFIG-PRESERVING-RESTART
    family: gpu-lifecycle
    property: >-
      A stopped heterogeneous GPU operator returns with the identical recorded tuning
      and device placement, rather than silently taking fleet defaults from the
      caller's environment.
    topology: { scenario: three-of-three-heterogeneous-scheduling, operators: 3, threshold: 3, backends: [gpu] }
    services: [tfhe-worker]
    capabilities: [gpu, systemd-user]
    workload: Stop and restart one operator's units from a shell without the override variables set.
    fault: { mechanism: unit-stop-and-restore, stage: none, observation: the restored unit's recorded invocation configuration equals the original }
    participants: { compute: all, submit: all, quorum: not_checked }
    assertions:
      - safety: the restored unit's resolved configuration is byte-identical to the recorded one
      - safety: restoration from an environment without overrides does NOT revert to fleet defaults
      - cleanup: invocation metadata is refreshed for the new invocation
    timeout_s: 900
    cleanup: [session record retained until restoration is verified]
    runner: scripts/run-gpu-lifecycle-cases.sh --case gpu-03 --operator 1
    ci: { leg: gpu, backend: gpu }
    artifacts: [case-results, invocation-config]
    acceptance: required

  - id: GPU-04-LOCK-LOG-VALIDITY
    family: gpu-lifecycle
    property: >-
      The lock-loss validity gate reads the ACTIVE execution backend's logs -
      systemd journals under a GPU session, including restarted invocations - and
      rejects a run whose evidence cannot be collected.
    topology: { scenario: three-of-three-heterogeneous-scheduling, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker]
    capabilities: [service-control]
    workload: A completed consensus run, scoped to its own time window.
    fault: { mechanism: none, stage: none, observation: the gate names which log sources it read }
    participants: { compute: all, submit: all, quorum: not_checked }
    assertions:
      - safety: under a GPU session the gate reads unit journals, not stopped containers' logs
      - safety: an unreadable log source or a missing expected worker is INVALID, not clean
      - safety: only occurrences inside the run window are counted
    timeout_s: 300
    cleanup: [none]
    runner: scripts/run-gpu-lifecycle-cases.sh --case gpu-04
    ci: { leg: gpu, backend: gpu }
    artifacts: [case-results, log-source-list]
    acceptance: required

  # ---------------------------------------------------------------- scheduling
  - id: SCH-01-HETEROGENEOUS
    family: scheduling
    property: >-
      Three operators with deliberately different scheduling configuration agree byte
      for byte, and the run proves the workload actually exercised the different
      batch/window behaviour rather than only that the flags were set.
    topology: { scenario: three-of-three-heterogeneous-scheduling, operators: 3, threshold: 3, backends: [gpu] }
    services: [tfhe-worker]
    capabilities: [gpu, systemd-user]
    workload: Enough independent chains and transactions to exercise serial, batched, adaptive and non-adaptive paths.
    fault: { mechanism: none, stage: none, observation: per-operator executed batch/window evidence from worker metrics }
    participants: { compute: all, submit: all, quorum: required }
    assertions:
      - precondition: running flags and environment are verified, plus persisted restart configuration
      - precondition: the operators' resolved scheduling classes are genuinely distinct
      - evidence: executed batch/window distributions differ across operators, not only the configured values
      - bytes: byte and digest agreement across operators
    timeout_s: 3600
    cleanup: [GPU session stopped and queues handed back]
    runner: scripts/run-materialization-consensus.sh --heterogeneous --suite materialization
    ci: { leg: gpu, backend: gpu }
    artifacts: [case-results, node-config, executed-scheduling-evidence]
    acceptance: required

  - id: SCH-02-DEVICE-SPLIT
    family: scheduling
    property: >-
      Operators placed on distinct physical GPUs agree byte for byte, with evidence
      that distinct devices performed the selected work. Pinning each operator to a
      different card is a per-worker configuration difference, so this is established
      on the heterogeneous-scheduling stack, alongside SCH-01.
    topology: { scenario: three-of-three-heterogeneous-scheduling, operators: 3, threshold: 3, backends: [gpu] }
    services: [tfhe-worker]
    capabilities: [gpu, two-gpus, systemd-user]
    workload: The materialization fixture with operators pinned to different CUDA devices.
    fault: { mechanism: none, stage: none, observation: per-device compute-process mapping for the selected work }
    participants: { compute: all, submit: all, quorum: required }
    assertions:
      - precondition: at least two compatible GPUs, and the split is asserted rather than assumed
      - evidence: distinct physical devices are observed executing the selected work
      - bytes: byte agreement across devices
    timeout_s: 3600
    cleanup: [GPU session stopped]
    runner: scripts/run-materialization-consensus.sh --device-split --suite materialization
    ci: { leg: none, backend: gpu }
    artifacts: [case-results, nvidia-smi-capture]
    acceptance: deferred
    deferral:
      boundary: Optional local device-placement experiment; excluded from CI acceptance.
      reason: CI provides a single GPU. Local two-H100 agreement was checked separately; scheduling diversity is covered by SCH-01 on one GPU.

  - id: SCH-03-SQUASH-DETERMINISM
    family: scheduling
    property: >-
      Repeated squash_noise over extracted fixtures is deterministic for a fixed key
      and input.
    topology: { scenario: none, operators: 0, threshold: 0, backends: [cpu, gpu] }
    services: []
    capabilities: []
    workload: Extracted ciphertext fixtures squashed repeatedly.
    fault: { mechanism: none, stage: none, observation: none }
    participants: { compute: none, submit: none, quorum: not_checked }
    assertions:
      - scope: diagnostic. Prints distinct digest counts; not a regression gate.
    timeout_s: 1800
    cleanup: [none]
    runner: cargo test -p sns-worker --features gpu squash_determinism -- --ignored
    ci: { leg: none, backend: cpu }
    artifacts: [suite-log]
    acceptance: deferred
    deferral:
      boundary: >-
        The squash determinism experiments remain labelled diagnostics: they are
        `#[ignore]`d, acquire fixtures from a developer path, and print rather than
        assert.
      reason: >-
        Turning them into a gate needs versioned or generative fixture acquisition and a
        CI target, which is out of scope here.

  # ---------------------------------------------------------------- regressions
  - id: REG-01-LISTENER-POOL-REBIND
    family: regression
    property: >-
      The stack-version listener rebinds to the pool that replaced its own, responds
      to a subsequent version transition, and survives repeated replacement and
      cancellation without leaking listeners or deadlocking.
    topology: { scenario: none, operators: 0, threshold: 0, backends: [cpu] }
    services: []
    capabilities: [postgres]
    workload: >-
      A real database lifecycle: start the wrapper, replace/close its pool through the
      production reconnect path, then drive a version transition.
    fault: { mechanism: pool-replacement, stage: listener subscribed, observation: the listener's own rebind and the transition it observes afterwards }
    participants: { compute: none, submit: none, quorum: not_checked }
    assertions:
      - liveness: a version transition after rebind is observed
      - liveness: a transition occurring DURING the disconnect window is reconciled after re-subscription
      - safety: repeated replacement and cancellation leak no listeners and do not deadlock
      - safety: the transaction-level cutover write fences and required final mode still hold
      - sensitivity: reverting the production fix fails this test for the intended reason
    timeout_s: 600
    cleanup: [test database dropped]
    runner: scripts/run-stackless-cases.sh --leg rust-regression (cargo test -p host-listener --test stack_version_listener_tests)
    ci: { leg: rust-regression, backend: cpu }
    artifacts: [suite-log]
    acceptance: required

  - id: REG-02-TFHE-DAEMON-EXIT
    family: regression
    property: >-
      A fatal runtime failure on the tfhe-worker daemon path terminates the process
      with a non-zero status within a bound, while voluntary shutdown stays successful
      and the in-process close path does not kill an embedding test process.
    topology: { scenario: none, operators: 0, threshold: 0, backends: [cpu] }
    services: []
    capabilities: []
    workload: A subprocess-level controlled fatal failure, plus a voluntary-shutdown control.
    fault: { mechanism: induced-runtime-failure, stage: daemon running, observation: subprocess exit status and duration }
    participants: { compute: none, submit: none, quorum: not_checked }
    assertions:
      - safety: non-zero exit within the bound on fatal failure
      - liveness: voluntary shutdown exits zero
      - safety: the in-process close_recv path does not terminate the embedding process
      - sensitivity: reverting the production fix fails this test for the intended reason
    timeout_s: 600
    cleanup: [none]
    runner: scripts/run-stackless-cases.sh --leg rust-regression (cargo test -p tfhe-worker --test daemon_exit)
    ci: { leg: rust-regression, backend: cpu }
    artifacts: [suite-log]
    acceptance: required

  - id: REG-03-SUPERVISED-DAEMON-RECOVERY
    family: regression
    property: In stack execution, the supervisor restarts a daemon that exited non-zero and the selected pending work recovers.
    topology: { scenario: three-of-three, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker]
    capabilities: [service-control]
    workload: The CR-01 target work.
    fault: { mechanism: kill, stage: work acquired, observation: supervisor restart evidence (restart counter or new invocation) }
    participants: { compute: all, submit: all, quorum: not_checked }
    assertions:
      - fault: supervisor restart observed, not a manual start
      - liveness: the selected pending work recovers
    timeout_s: 2400
    cleanup: [none]
    runner: scripts/run-crash-retry-consensus.sh --victim 1 --boundary before-commit
    ci: { leg: crash-retry, backend: cpu }
    artifacts: [case-results, restart-evidence]
    acceptance: required

  # ---------------------------------------------------------------- harness contracts
  - id: HAR-01-FAULT-CONTRACTS
    family: harness
    property: >-
      The fault-control layer fails closed: failed injection, failed heal, a missing
      GPU unit or PID, a target that was not actually interrupted, an after-hook
      failure despite "1 passing", and a failed cleanup all produce non-PASS results.
    topology: { scenario: none, operators: 0, threshold: 0, backends: [none] }
    services: []
    capabilities: []
    workload: Narrow fake command adapters driving the real control functions.
    fault: { mechanism: adapter-injected-failure, stage: various, observation: the resulting case result state }
    participants: { compute: none, submit: none, quorum: not_checked }
    assertions:
      - safety: each listed condition yields FAIL or INVALID, never PASS
    timeout_s: 300
    cleanup: [none]
    runner: scripts/run-stackless-cases.sh --leg harness (scripts/test-fault-contracts.sh)
    ci: { leg: harness, backend: none }
    artifacts: [suite-log]
    acceptance: required

  - id: HAR-02-INVENTORY-AGGREGATE
    family: harness
    property: >-
      The aggregate command rejects missing required cases, duplicate conflicting
      results, unknown selections, and results produced against a mismatched revision
      or topology; a partial run is labelled partial and cannot satisfy the full gate.
    topology: { scenario: none, operators: 0, threshold: 0, backends: [none] }
    services: []
    capabilities: []
    workload: Synthetic result sets against the checked-in inventory.
    fault: { mechanism: synthetic-result-corruption, stage: aggregation, observation: aggregate exit status and report }
    participants: { compute: none, submit: none, quorum: not_checked }
    assertions:
      - safety: every listed corruption is rejected
      - safety: an empty selection is not a green aggregate
    timeout_s: 300
    cleanup: [none]
    runner: scripts/run-stackless-cases.sh --leg harness (bun test src/consensus)
    ci: { leg: harness, backend: none }
    artifacts: [suite-log]
    acceptance: required

  - id: HAR-03-READINESS-CONTRACTS
    family: harness
    property: >-
      Readiness and validity gates reject unevaluable evidence: a failed or malformed
      key-material query is never "ready", and an unreadable metrics or log source is
      INVALID rather than clean.
    topology: { scenario: none, operators: 0, threshold: 0, backends: [none] }
    services: []
    capabilities: []
    workload: Fake command and fetch adapters.
    fault: { mechanism: adapter-injected-failure, stage: readiness evaluation, observation: the gate's own outcome }
    participants: { compute: none, submit: none, quorum: not_checked }
    assertions:
      - safety: empty, non-numeric and error output never counts as ready
      - safety: an unreadable source is INVALID
    timeout_s: 300
    cleanup: [none]
    runner: scripts/run-stackless-cases.sh --leg harness (bun test src/readiness.test.ts)
    ci: { leg: harness, backend: none }
    artifacts: [suite-log]
    acceptance: required
