# The consensus coverage inventory.
#
# One row per case, and the row is the contract: what property a green
# establishes, which topology it needs, which fault is applied at which stage,
# how that fault is independently observed, what the quorum outcome must be,
# and which runner executes it.
#
# It exists because a reader could not previously tell what a green consensus
# run established. The suites carried the answer in prose comments, the runners
# carried it in shell control flow, and the workflow carried a third version in
# `if:` conditions -- so "the failure matrix passed" said nothing about whether
# any fault had actually landed. Everything that selects, runs, or reports on a
# case now derives from this file, and `consensus-inventory.ts aggregate`
# refuses a run whose results do not match the plan it claims to implement.
#
# Field contract (validated by src/consensus/inventory.ts):
#
#   id           stable, unique, upper-kebab. Referenced by runners, results
#                and CI selections; never renamed silently.
#   property     what a PASS establishes, in one sentence. Not a restatement of
#                the mechanism.
#   family       selection unit. A CI leg selects families, not individual ids.
#   topology     scenario/operators/threshold and locally compatible backends.
#                This list does not claim CI executes every backend.
#   services     container roles that must be present; a case whose service is
#                absent is NOT_APPLICABLE for that topology, never PASS.
#   capabilities host facilities the case needs (docker-socket, systemd-user,
#                gpu, two-gpus, dual-anvil, isolated-stack).
#   workload     the work whose fate is asserted. "fresh work after recovery"
#                is a smoke test and must say so.
#   fault        mechanism/stage/observation. `observation` is the independent
#                postcondition proving the fault landed -- a successful signal
#                command is not one.
#   participants compute/submit sets and the quorum mode:
#                  required     quorum must form for the case's workload
#                  forbidden    quorum must NOT form during the window
#                  not_checked  allowed only for a named lower-layer case
#   assertions   the case contract, stated separately for safety, liveness,
#                quorum, bytes/digests and cleanup.
#   timeout_s    the case's own deadline. A timeout is INVALID, not PASS.
#   cleanup      what must be restored, and verified restored, afterwards.
#   runner       the command that executes it.
#   ci           workflow leg and the one backend whose coverage CI requires.
#   artifacts    evidence a run must retain.
#   acceptance   required | deferred | smoke
#                  required   must PASS in its environment for delivery
#                  smoke      supplementary liveness/regression signal; a green
#                             does NOT establish a failure-recovery property
#                  deferred   named, out of scope, with a boundary and reason
schema_version: 2

# Named selections, so the workflow does not carry a second copy of them in a
# shell `case`. `full` is checked by a unit test against the required set: a
# selection named full that omits a required case is a defect, and that is
# exactly what `--column all` silently was.
selections:
  harness: [harness]
  rust-regression: [rust-regression]
  smoke: [byte-agreement]
  standard: [harness, rust-regression, byte-agreement, degraded, fork, failure-matrix, failure-matrix-db, crash-retry]
  full:
    - harness
    - rust-regression
    - byte-agreement
    - degraded
    - fork
    - failure-matrix
    - failure-matrix-db
    - crash-retry
    - gpu

families:
  materialization:
    description: "The byte oracle: raw bytes, digest bindings, provenance, transaction completion, gateway quorum, plaintext."
  reorg:
    description: Replacement-block identity on one chain.
  fork:
    description: Competing branches, orphaned content, stale dependencies, replay.
  degraded:
    description: Quorum safety and liveness with an operator removed.
  crash-retry:
    description: Interruption of identified in-flight work, and its recovery.
  failure-matrix:
    description: Per-service fault injection with service-appropriate workloads.
  failure-matrix-db:
    description: Shared-database faults, isolated because they hit the whole fleet.
  gpu-lifecycle:
    description: GPU worker ownership, restoration, exclusivity and safe database revert.
  scheduling:
    description: Execution diversity - scheduling and device placement independence.
  regression:
    description: Targeted regression tests for the production changes in this PR.
  harness:
    description: Contract tests for the harness itself; no stack required.

cases:
  # ---------------------------------------------------------------- materialization
  - id: MAT-01-BOUNDARY-FANOUT
    family: materialization
    property: >-
      Operators running one software/backend/hardware class persist byte-identical
      ciphertexts for same-block cross-transaction boundaries and for
      intra-transaction fan-out, with identical digests, provenance and atomic
      transaction completion.
    topology: { scenario: three-of-three, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker, sns-worker, zkproof-worker, transaction-sender, host-listener, gw-listener]
    capabilities: []
    workload: MaterializationFixture staged/derived/independent/terminal transaction graph, genuinely encrypted inputs.
    fault: { mechanism: none, stage: none, observation: none }
    participants: { compute: all, submit: all, quorum: required }
    assertions:
      - bytes: raw ciphertext, type and version identical across operators
      - digest: keccak binding of raw bytes, and SNS digest present for every expected participant
      - provenance: producing operation, transaction, host chain and block identical
      - liveness: every fixture transaction completes with exact computation counts and zero errors
      - quorum: exactly one AddCiphertextMaterialConsensus event per canonical handle
    timeout_s: 900
    cleanup: [none]
    runner: scripts/run-materialization-consensus.sh --suite materialization
    ci: { leg: byte-agreement, backend: cpu }
    artifacts: [case-results, execution-class, suite-log]
    acceptance: required

  - id: MAT-02-ALIAS-SOURCING
    family: materialization
    property: >-
      Two transactions with identical operand sourcing alias to one handle and one
      value on every operator, while a transaction that recomputes the same operands
      locally mints a distinct handle.
    topology: { scenario: three-of-three, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker, sns-worker, transaction-sender, host-listener]
    capabilities: []
    workload: AliasFixture same-sourcing pair plus a locally-recomputed variant.
    fault: { mechanism: none, stage: none, observation: none }
    participants: { compute: all, submit: all, quorum: required }
    assertions:
      - bytes: one canonical value per aliased handle on every operator
      - safety: storage row uniqueness asserted separately from the number of joined computation rows
      - safety: mixed sourcing mints a different handle, so representation mixing cannot collide
    timeout_s: 900
    cleanup: [none]
    runner: scripts/run-materialization-consensus.sh --suite materialization
    ci: { leg: byte-agreement, backend: cpu }
    artifacts: [case-results, suite-log]
    acceptance: required

  - id: MAT-03-PLAINTEXT-ORACLE
    family: materialization
    property: >-
      The fixture's terminal outputs decrypt to the arithmetically expected
      plaintexts, so byte agreement is agreement on the right value rather than on
      a shared mistake.
    topology: { scenario: three-of-three, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker, sns-worker, transaction-sender, gw-listener, kms-connector, relayer]
    capabilities: []
    workload: User-decryption of the materialization fixture's terminal handles.
    fault: { mechanism: none, stage: none, observation: none }
    participants: { compute: all, submit: all, quorum: required }
    assertions:
      - correctness: decrypted plaintexts equal the expected arithmetic results
    timeout_s: 900
    cleanup: [none]
    runner: scripts/run-materialization-consensus.sh --suite materialization
    ci: { leg: byte-agreement, backend: cpu }
    artifacts: [case-results, suite-log]
    acceptance: required

  - id: MAT-04-CANARY-COMPUTE-DIGEST
    family: materialization
    property: >-
      The comparator the suite actually calls rejects a fleet in which one operator's
      stored compute digest has been poisoned, with a digest-mismatch classification
      rather than a timeout or a read failure.
    topology: { scenario: three-of-three, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker, sns-worker]
    capabilities: []
    workload: A published handle whose digest is flipped on one compared operator and then restored.
    fault: { mechanism: digest-tamper, stage: after-publication, observation: comparator rejection classified as digest mismatch }
    participants: { compute: all, submit: all, quorum: not_checked }
    assertions:
      - safety: clean comparison passes, poisoned comparison fails with a digest mismatch, restored comparison passes
      - safety: a database outage or timeout does NOT satisfy the poisoned arm
    timeout_s: 900
    cleanup: [restore the original digest bytes]
    runner: scripts/run-degraded-consensus.sh --case canary
    ci: { leg: degraded, backend: cpu }
    artifacts: [case-results, canary-classification]
    acceptance: required

  - id: MAT-05-CANARY-CLASSES
    family: harness
    property: >-
      Each falsification class the comparator claims to detect is detected with its
      own classification: raw byte mismatch, compute digest mismatch, SNS digest
      mismatch, missing participant SNS evidence, wrong key/context, and provenance
      mismatch.
    topology: { scenario: none, operators: 0, threshold: 0, backends: [none] }
    services: []
    capabilities: []
    workload: Synthetic operator rows fed to the real comparator.
    fault: { mechanism: synthetic-row-mutation, stage: comparator-input, observation: thrown classification }
    participants: { compute: none, submit: none, quorum: not_checked }
    assertions:
      - safety: every mutation class produces its own failure classification
      - safety: alias ordering differences do NOT produce a failure
    timeout_s: 120
    cleanup: [none]
    runner: scripts/run-stackless-cases.sh --leg comparator
    ci: { leg: harness, backend: none }
    artifacts: [suite-log]
    acceptance: required

  # ---------------------------------------------------------------- reorg
  - id: REORG-01-REPLACEMENT-BLOCK
    family: reorg
    property: >-
      A block replaced by a distinct sibling with the same parent and timestamp
      re-mints the same handle, every listener observes the replacement, and the
      fleet holds one set of bytes for it across the reorg.
    topology: { scenario: three-of-three, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker, sns-worker, host-listener, host-listener-poller]
    capabilities: [anvil-control]
    workload: One AliasFixture add included in B1, then re-included in sibling B2 after evm_revert.
    fault:
      mechanism: chain-reorg-one-chain
      stage: after the fleet has computed and stored B1's output
      observation: B1 and B2 hashes differ, and every operator's listener records ingestion of B2's height after the revert
    participants: { compute: all, submit: all, quorum: required }
    assertions:
      - quorum: every recovered target handle reaches the required commitment from distinct authorized members
      - precondition: B1 and B2 share parent, timestamp and height, and their block hashes DIFFER
      - precondition: the chain's EVM BLOCKHASH agrees with its own headers before the sibling is built
      - liveness: replacement ingestion is observed on every operator before any comparison
      - bytes: the handle's bytes are unchanged from the pre-reorg value on every operator
      - safety: exactly one canonical storage row per operator for the re-minted handle
      - provenance: first-write-wins attribution is asserted as the documented contract
    timeout_s: 1800
    cleanup: [restore interval mining and automine to their recorded pre-case values]
    runner: scripts/run-materialization-consensus.sh --suite reorg
    ci: { leg: byte-agreement, backend: cpu }
    artifacts: [case-results, block-headers, ingestion-watermarks]
    acceptance: required

  # ---------------------------------------------------------------- fork
  - id: FORK-01-COLLIDING-HANDLE
    family: fork
    property: >-
      A handle minted on two competing branches that share a parent and timestamp
      carries one set of bytes fleet-wide, and reaches quorum rather than splitting.
    topology: { scenario: three-of-three-fork, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker, sns-worker, host-listener, transaction-sender]
    capabilities: [dual-anvil]
    workload: The same AliasFixture add included on both branches under a pinned shared timestamp.
    fault: { mechanism: competing-branches, stage: inclusion, observation: both inclusion receipts, matching parent/timestamp/height, differing branch tips }
    participants: { compute: all, submit: all, quorum: required }
    assertions:
      - precondition: both branches share an EVM-visible parent hash at height-1 and the pinned timestamp
      - precondition: a failed precondition INVALIDATES the case rather than skipping it green
      - bytes: identical ciphertext and compute digest on every operator
      - quorum: the colliding handle reaches quorum from distinct authorized members
    timeout_s: 1800
    cleanup: [restore canonical interval mining, reseed the fork, verify both chains advance]
    runner: scripts/run-fork-consensus.sh --case main
    ci: { leg: fork, backend: cpu }
    artifacts: [case-results, branch-headers]
    acceptance: required

  - id: FORK-02-DISTINCT-HANDLES
    family: fork
    property: >-
      Branch content that differs in the handle preimage mints distinct handles, and
      each branch's handle is observed only where that branch was observed.
    topology: { scenario: three-of-three-fork, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker, host-listener]
    capabilities: [dual-anvil]
    workload: The same call on both branches under deliberately different timestamps.
    fault: { mechanism: competing-branches, stage: inclusion, observation: differing minted handles and per-branch ingestion watermarks }
    participants: { compute: all, submit: all, quorum: not_checked }
    assertions:
      - safety: the two branches mint different handles
      - safety: the branch-only handle is absent from operators past their ingestion watermark for that height
    timeout_s: 1800
    cleanup: [none beyond FORK-01's]
    runner: scripts/run-fork-consensus.sh --case main
    ci: { leg: fork, backend: cpu }
    artifacts: [case-results, ingestion-watermarks]
    acceptance: required

  - id: FORK-03-ORPHAN-ALLOW-INERT
    family: fork
    property: >-
      An ACL allow observed only on an orphaned branch never authorizes canonical
      decryption of its handle, while the same interface authorizes a canonical
      control.
    topology: { scenario: three-of-three-fork, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker, host-listener, gw-listener, relayer, kms-connector]
    capabilities: [dual-anvil]
    workload: The orphan-only handle from FORK-02 plus a canonical positive control.
    fault: { mechanism: branch-replacement, stage: after the orphan allow was ingested, observation: the forked operator follows canonical history and processes a canonical sentinel }
    participants: { compute: all, submit: all, quorum: forbidden }
    assertions:
      - safety: the orphan handle does not reach quorum
      - safety: a real decryption request for the orphan handle is REJECTED through the authorization interface
      - liveness: the canonical control decrypts successfully through the same interface
      - safety: absence of quorum alone is NOT reported as an exercised authorization test
    timeout_s: 1800
    cleanup: [none beyond FORK-01's]
    runner: scripts/run-fork-consensus.sh --case main
    ci: { leg: fork, backend: cpu }
    artifacts: [case-results, decryption-rejection]
    acceptance: required

  - id: FORK-04-STRANDED-CHILD
    family: fork
    property: >-
      After branch replacement, a lost producer-release decrement must not strand
      its identified cross-block child. A disabled-repair mutation leaves the
      actual child stuck; enabling repair acquires and completes that same work.
    topology: { scenario: three-of-three-fork, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker, host-listener, host-listener-poller]
    capabilities: [dual-anvil]
    workload: A real producer and dependent child; the producer completes but a scoped SQL fault loses its gate decrement after branch replacement.
    fault:
      mechanism: branch-replacement-with-lost-gate-decrement
      stage: child gated, producer not yet released
      observation: the child remains gated and unowned with no unprocessed producer while its actual stale-gate repair attempts are suppressed
    participants: { compute: all, submit: all, quorum: not_checked }
    assertions:
      - precondition: the selected child is observed gated, by chain id, before the disruptive event
      - liveness: enabling repair records a committed repair acquisition and completes the selected child without a computation error
      - bytes: the repaired orphan child materializes ciphertext bound to its own durable compute and SNS digests
      - safety: no chain matching the stranded predicate survives on any operator
      - sensitivity: with repair disabled the case FAILS (verified by the mutation control)
    timeout_s: 1800
    cleanup: [remove per-child SQL controls and audit, resume the worker]
    runner: scripts/run-fork-consensus.sh --case f4
    ci: { leg: fork, backend: cpu }
    artifacts: [case-results, dependence-chain-snapshots]
    acceptance: required

  - id: FORK-05-REPLAY
    family: fork
    property: >-
      Replaying an identified, already-ingested block range through the ordinary
      poller path re-ingests exactly those events and changes no committed state.
    topology: { scenario: three-of-three-fork, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [host-listener-poller]
    capabilities: [dual-anvil, service-control]
    workload: A newly minted, identified producer and cross-block child with observed computations, allows and dependence chains in their receipt block range.
    fault:
      mechanism: cursor-rewind-with-poller-restart
      stage: poller stopped, watermark recorded, cursor rewound, poller restarted
      observation: the selected graph has nonempty persisted effects; committed insert-conflict attempts from the restarted poller's DB-client IP prove delivery before its cursor passes the watermark
    participants: { compute: all, submit: all, quorum: not_checked }
    assertions:
      - precondition: the rewound range contains the selected computations and dependents
      - liveness: each exact producer and child event reaches a committed insert attempt from the restarted poller, and its cursor advances
      - safety: selected computation rows, allow observations and dependence chains are unchanged
      - safety: no dependents array gains a duplicate entry
      - safety: a successful cursor UPDATE alone does NOT satisfy the replay evidence
    timeout_s: 1800
    cleanup: [restart the poller with its original configuration and verify it advances]
    runner: scripts/run-fork-consensus.sh --case f5
    ci: { leg: fork, backend: cpu }
    artifacts: [case-results, poller-watermarks, poller-journal]
    acceptance: required

  # ---------------------------------------------------------------- degraded
  - id: DEG-01-AGREEMENT-QUORUM
    family: degraded
    property: >-
      The fleet agrees and reaches its configured quorum on an ordinary encrypted
      operation. Established under unanimity, which is the strongest form of the
      claim: every operator must compute the same bytes AND submit. DEG-03 carries
      the majority-threshold form.
    topology: { scenario: three-of-three, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker, sns-worker, transaction-sender, gw-listener]
    capabilities: []
    workload: One AliasFixture add over persisted boundary operands.
    fault: { mechanism: none, stage: none, observation: none }
    participants: { compute: all, submit: all, quorum: required }
    assertions:
      - bytes: identical bytes, compute digests and SNS digests across all operators
      - quorum: quorum forms from distinct authorized gateway members at the configured threshold
    timeout_s: 1800
    cleanup: [none]
    runner: scripts/run-degraded-consensus.sh --case agreement
    ci: { leg: degraded, backend: cpu }
    artifacts: [case-results, gateway-threshold]
    acceptance: required

  - id: DEG-02-SAME-BLOCK-PAIR
    family: degraded
    property: >-
      A prior-block boundary consumed by two independent same-block transactions
      converges to one value, attributed to both producing transactions. The
      threshold is not load-bearing here -- the claim is about aliasing within one
      block -- so it is established on the same stack as the rest of the byte
      cases.
    topology: { scenario: three-of-three, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker, sns-worker, host-listener]
    capabilities: [anvil-control]
    workload: Two transactions consuming the same persisted boundaries, mined into one block under controlled mining.
    fault: { mechanism: none, stage: none, observation: none }
    participants: { compute: all, submit: all, quorum: required }
    assertions:
      - precondition: both receipts report the SAME block number, and both producing transactions are identified
      - bytes: one value per aliased handle on every operator
      - provenance: the normalized producing-transaction set is identical across operators
    timeout_s: 1800
    cleanup: [restore the recorded mining configuration]
    runner: scripts/run-degraded-consensus.sh --case same-block
    ci: { leg: degraded, backend: cpu }
    artifacts: [case-results, receipts]
    acceptance: required

  - id: DEG-03-MAJORITY-AVAILABLE
    family: degraded
    property: >-
      With one operator fully offline, a 2-of-3 topology still reaches its configured
      quorum on work submitted DURING the outage, and the survivors agree on it.
    topology: { scenario: two-of-three, operators: 3, threshold: 2, backends: [cpu, gpu] }
    services: [tfhe-worker, sns-worker, transaction-sender, host-listener, gw-listener, host-listener-poller, host-listener-consumer]
    capabilities: [service-control]
    workload: A handle minted while the victim operator's every ingestion and submission path is down.
    fault:
      mechanism: operator-offline
      stage: before the workload is submitted
      observation: every configured service of the victim is confirmed not running, and the victim's database records no ingestion of the workload's block
    participants: { compute: survivors, submit: survivors, quorum: required }
    assertions:
      - precondition: the victim is verified offline across ALL its configured services, not a hardcoded subset
      - bytes: survivors agree on bytes, compute digests and SNS digests
      - quorum: quorum forms at the configured threshold from surviving members only
      - safety: the returning operator is not needed for this case's quorum
    timeout_s: 2400
    cleanup: [restore the victim with its recorded configuration and verify one worker implementation per queue]
    runner: scripts/run-degraded-consensus.sh --case outage
    ci: { leg: degraded, backend: cpu }
    artifacts: [case-results, fault-evidence, gateway-threshold]
    acceptance: required

  - id: DEG-04-UNANIMOUS-NO-QUORUM
    family: degraded
    property: >-
      With one operator offline in a 3-of-3 topology, the survivors still compute
      consistently but NO consensus event forms for that work during the observation
      window.
    topology: { scenario: three-of-three, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker, sns-worker, transaction-sender, host-listener, gw-listener, host-listener-poller, host-listener-consumer]
    capabilities: [service-control]
    workload: A handle minted while the victim operator is fully offline.
    fault:
      mechanism: operator-offline
      stage: before the workload is submitted
      observation: every configured service of the victim is confirmed not running
    participants: { compute: survivors, submit: survivors, quorum: forbidden }
    assertions:
      - precondition: gateway reads succeed and the gateway chain advances throughout the window
      - bytes: survivors agree on bytes and digests
      - quorum: no consensus event exists for the workload's handle within a window tied to the observed submission timing
      - safety: an RPC error is NOT accepted as proof of absent quorum
    timeout_s: 2400
    cleanup: [restore the victim with its recorded configuration]
    runner: scripts/run-degraded-consensus.sh --case outage
    ci: { leg: degraded, backend: cpu }
    artifacts: [case-results, fault-evidence, gateway-head-progress]
    acceptance: required

  - id: DEG-05-BACKLOG-CONVERGENCE
    family: degraded
    property: >-
      A returning operator consumes the backlog created while it was offline and
      agrees on those SAME handles; a unanimous topology then reaches quorum for them.
    topology: { scenario: three-of-three, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker, sns-worker, transaction-sender, host-listener, gw-listener]
    capabilities: [service-control]
    workload: The handles minted during DEG-04's outage - the same fixture and the same handles, NOT a redeployment.
    fault: { mechanism: operator-restored, stage: after the outage workload exists, observation: the victim's services are running again with recorded configuration }
    participants: { compute: all, submit: all, quorum: required }
    assertions:
      - liveness: the returned operator produces rows for the original handles
      - bytes: its bytes and digests equal the survivors' for those handles
      - quorum: those same handles reach quorum once the operator has returned
      - safety: a fresh handle minted after recovery does NOT satisfy this case
    timeout_s: 2400
    cleanup: [verify one worker implementation per queue and no orphaned units]
    runner: scripts/run-degraded-consensus.sh --case outage
    ci: { leg: degraded, backend: cpu }
    artifacts: [case-results, backlog-handles]
    acceptance: required

  - id: DEG-06-GW-LISTENER-INFLIGHT
    family: degraded
    property: >-
      A gateway event pending when every gw-listener restarts is compared by each
      replacement, proved by one event-specific drift warning against a safely poisoned
      published local digest; the originals are restored and the commitment remains valid.
    topology: { scenario: three-of-three, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [gw-listener]
    capabilities: [service-control]
    workload: An identified gateway event created BEFORE the restart and still unacknowledged at restart time.
    fault:
      mechanism: service-restart-in-flight
      stage: event observed pending, before acknowledgement
      observation: the event is pending pre-restart; the old process is killed while frozen; each replacement warns with the exact handle, block hash, transaction hash and log index
    participants: { compute: all, submit: all, quorum: required }
    assertions:
      - precondition: the selected event is observed at the pending stage before any restart
      - liveness: the exact event is ingested after the restart
      - safety: exactly one matching drift warning per replacement in the observation window
      - safety: every poisoned digest is restored, including when arming or recovery fails
      - quorum: the workload's commitment forms
      - safety: restarting, sleeping and minting a NEW handle does not satisfy this case
    timeout_s: 2400
    cleanup: [restore-published-digests, resume-listeners]
    runner: scripts/run-degraded-consensus.sh --case gw
    ci: { leg: degraded, backend: cpu }
    artifacts: [case-results, event-stage-evidence, gw-listener-journal]
    acceptance: required

  # ---------------------------------------------------------------- crash-retry
  - id: CR-01-INTERRUPT-BEFORE-COMMIT
    family: crash-retry
    property: >-
      A worker interrupted after it began executing an IDENTIFIED transaction and
      before durable commit re-executes that same work after supervisor restart, and
      the result is byte-identical to operators that executed it once.
    topology: { scenario: three-of-three, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker]
    capabilities: [service-control, failpoints]
    workload: A published set of target transaction and handle ids, handed to the orchestrator through a structured handshake.
    fault:
      mechanism: sigkill-to-worker-main-process
      stage: the victim has acquired and begun executing the target transaction, before its durable completion
      observation: >-
        the target's computations are recorded as claimed by the victim's worker before the
        signal; the old process/invocation exits; a new invocation appears; and the target
        work is claimed again afterwards
    participants: { compute: all, submit: all, quorum: required }
    assertions:
      - quorum: every recovered target handle reaches the required commitment from distinct authorized members
      - precondition: the target transaction is observed ACQUIRED by the victim, not merely pending
      - fault: process death and supervisor restart are both observed
      - liveness: the same target work is retried and completes
      - bytes: the victim's bytes and digests equal the uninterrupted operators' for the target handles
      - safety: every target transaction completes atomically with zero errored computations
      - safety: exactly one canonical storage row per target handle
      - safety: no orphaned locks or gates remain after the recovery deadline
      - safety: a run that required manual recovery is reported as a DIFFERENT outcome, not PASS
    timeout_s: 2400
    cleanup: [verify the victim is served by exactly one worker implementation]
    runner: scripts/run-crash-retry-consensus.sh --victim 1 --boundary before-commit
    ci: { leg: crash-retry, backend: cpu }
    artifacts: [case-results, claim-evidence, process-identities, worker-journal]
    acceptance: required

  - id: CR-02-INTERRUPT-AFTER-COMMIT
    family: crash-retry
    property: >-
      A worker interrupted after durable commit but before downstream release does
      not lose or duplicate the committed work: the gate is released after recovery
      and the bytes are unchanged.
    topology: { scenario: three-of-three, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker]
    capabilities: [service-control, failpoints]
    workload: A dependent pair whose producer commits and is interrupted before releasing its dependents.
    fault:
      mechanism: test-feature-post-commit-hook-and-sigkill
      stage: after the producer's durable commit, before dependent release
      observation: the producer's rows are committed while its dependents' gate is still closed at the moment of the abort
    participants: { compute: all, submit: all, quorum: required }
    assertions:
      - quorum: every recovered target handle reaches the required commitment from distinct authorized members
      - precondition: the post-commit, pre-release boundary is observed
      - liveness: the dependent's gate is released after recovery and the dependent completes
      - safety: the producer's committed bytes are unchanged and not duplicated
    timeout_s: 1800
    cleanup: [failpoint disabled and verified inactive]
    runner: scripts/run-crash-retry-consensus.sh --victim 1 --boundary after-commit
    ci: { leg: crash-retry, backend: cpu }
    artifacts: [case-results, boundary-evidence]
    acceptance: required

  - id: CR-03-EXPIRED-LEASE-RECLAIM
    family: crash-retry
    property: >-
      Work whose lease expires while held is reclaimed by another legitimate claimant
      and re-executed to byte-identical output, with attribution recorded rather than
      suppressed.
    topology: { scenario: three-of-three, operators: 3, threshold: 3, backends: [cpu, gpu] }
    services: [tfhe-worker]
    capabilities: [service-control, failpoints]
    workload: An identified dependence chain held by a stalled worker until its lease lapses.
    fault:
      mechanism: sigstop-until-lease-expiry
      stage: chain acquired by the victim, lease not yet extended
      observation: >-
        the victim is frozen FIRST and the chain is then chosen from what it still holds under the
        freeze -- a frozen process cannot release, so what it holds then it keeps. Choosing first and
        freezing second raced the worker and lost: the chain had already been released, its
        `lock_expires_at` was NULL, and `NULL < NOW()` is never true, so the run waited out its
        timeout on a condition that could not become true. The lease then ages past expiry (~30s,
        measured) and a different owner is recorded.
    participants: { compute: all, submit: all, quorum: required }
    assertions:
      - quorum: every recovered target handle reaches the required commitment from distinct authorized members
      - precondition: the chain is observed owned by the stalled worker
      - fault: the process is verified stopped, and resumed afterwards
      - liveness: the chain is reclaimed and completes
      - bytes: the reclaimed output is byte-identical across operators
      - safety: the lock-loss event is recorded and attributed rather than disabling validity checks
    timeout_s: 1800
    cleanup: [resume the stopped process and verify it is running]
    runner: scripts/run-crash-retry-consensus.sh --victim 1 --boundary expired-lease
    ci: { leg: crash-retry, backend: cpu }
    artifacts: [case-results, lease-snapshots, lock-loss-attribution]
    acceptance: required

