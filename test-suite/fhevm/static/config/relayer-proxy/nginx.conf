# relayer-proxy: one relayer base URL for fhevm-sdk in the local stack.
#
# Listens on:
#   3003  (host: http://localhost:3003, stack: http://fhevm-relayer-proxy:3003)
#
# Routes:
#   /v2/*, /v3/*
#     -> relayer, fhevm-relayer:3000
#   /v4/*
#     -> relayer-http, fhevm-relayer-http:3002
#     -> 502 when the bundle has no relayer-http
#   anything else
#     -> 404
#     -> includes /v1: the test suites of all supported profiles call /v2
#
# Upstreams go through variables, resolved per request by Docker's embedded DNS, so nginx
# starts even when fhevm-relayer-http does not exist. A variable proxy_pass with no URI part
# forwards the original request URI unchanged.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  server_tokens off;

  resolver 127.0.0.11 valid=10s ipv6=off;

  # relayer-http caps bodies at 1 MiB (max_body_bytes); v2 input proofs can be larger.
  client_max_body_size 10m;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 10s;
  # /v4 decrypts answer synchronously and can take tens of seconds.
  proxy_send_timeout 120s;
  proxy_read_timeout 120s;

  server {
    listen 3003;

    location /v2/ {
      set $relayer fhevm-relayer:3000;
      proxy_pass http://$relayer;
    }

    location /v3/ {
      set $relayer fhevm-relayer:3000;
      proxy_pass http://$relayer;
    }

    location /v4/ {
      set $relayer_http fhevm-relayer-http:3002;
      proxy_pass http://$relayer_http;
    }

    location / {
      return 404;
    }
  }
}
