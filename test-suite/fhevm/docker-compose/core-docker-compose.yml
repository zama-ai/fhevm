services:

  kms-core:
    container_name: kms-core
    image: ghcr.io/zama-ai/kms/core-service:${CORE_VERSION}
    # v0.14.2-0 and later core tags are published amd64-only; pin so arm64 hosts run it emulated.
    platform: linux/amd64
    user: root
    env_file:
      - ${FHEVM_STATE_DIR:-../../../.fhevm}/runtime/env/core.env
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p "$$KMS_CORE__PRIVATE_VAULT__STORAGE__FILE__PATH"
        chown -R kms:kms "$$KMS_CORE__PRIVATE_VAULT__STORAGE__FILE__PATH"
        exec su kms -s /bin/sh -c '
          set -e
          export AWS_ACCESS_KEY_ID=$$(cat /minio_secrets/access_key)
          export AWS_SECRET_ACCESS_KEY=$$(cat /minio_secrets/secret_key)
          echo "=================GENERATING SIGNING KEYS================="
          # The kms-gen-keys CLI changed across core images: newer cores (v0.14.1+) take a single TOML
          # --config-file (centralized = no [threshold] section; private vault is file-backed),
          # while older cores (v0.13.x, still pinned by the devnet/testnet/mainnet targets) took
          # --public-storage/--aws-region/... flags with a `centralized` subcommand (and a
          # --cmd signing-keys selector on the oldest). Probe --help for "--config-file" — the same
          # string the threshold gen-keys job probes (KMS_GEN_KEYS_CONFIG_PROBE in kms-core.ts) — so
          # a pinned old or new CORE_VERSION both boot.
          if kms-gen-keys --help 2>&1 | grep -q -- "--config-file"; then
            # Heredoc body sits at the block-scalar indent so its lines (and EOF) land at column 0.
            cat > /tmp/kms-gen-keys.toml <<EOF
        [keygen]
        overwrite = false
        show_existing = false

        [aws]
        region = "$$S3_REGION"
        s3_endpoint = "$$S3_ENDPOINT"

        [public_vault.storage.s3]
        bucket = "$$KMS_CORE__PUBLIC_VAULT__STORAGE__S3__BUCKET"
        prefix = "$$KMS_CORE__PUBLIC_VAULT__STORAGE__S3__PREFIX"

        [private_vault.storage.file]
        path = "$$KMS_CORE__PRIVATE_VAULT__STORAGE__FILE__PATH"
        EOF
            kms-gen-keys --config-file /tmp/kms-gen-keys.toml
          else
            if kms-gen-keys --help 2>&1 | grep -q -- "--cmd"; then CMD="--cmd signing-keys"; else CMD=""; fi
            kms-gen-keys --public-storage s3 --public-s3-bucket "$$KMS_CORE__PUBLIC_VAULT__STORAGE__S3__BUCKET" --public-s3-prefix "$$KMS_CORE__PUBLIC_VAULT__STORAGE__S3__PREFIX" --aws-s3-endpoint "$$S3_ENDPOINT" --aws-region "$$S3_REGION" --private-storage file --private-file-path "$$KMS_CORE__PRIVATE_VAULT__STORAGE__FILE__PATH" $$CMD centralized
          fi
          echo "=================STARTING KMS SERVICE================="
          kms-server --config-file config/config.toml
        '
    volumes:
      - fhevm_minio_secrets:/minio_secrets
      - fhevm_kms_core_keys:/app/kms/core/service/keys
      - ${FHEVM_STATE_DIR:-../../../.fhevm}/runtime/config/kms-core.toml:/app/kms/core/service/config/config.toml
    ports:
      - "50051:50051"
    healthcheck:
      disable: true

volumes:
  fhevm_minio_secrets:
    external: true
  fhevm_kms_core_keys:
