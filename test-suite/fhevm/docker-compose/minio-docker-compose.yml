services:
  # RustFS stands in for MinIO, whose public images are no longer published. The service,
  # container and env names keep `minio` so the `http://minio:9000` URLs, the
  # `docker inspect fhevm-minio` lookups and the secrets volume used across the stack hold.
  # RustFS reads the `MINIO_ROOT_USER`/`MINIO_ROOT_PASSWORD` root credentials as aliases.
  minio:
    container_name: fhevm-minio
    image: rustfs/rustfs:1.0.0
    env_file:
      - ${FHEVM_STATE_DIR:-../../../.fhevm}/runtime/env/minio.env
    environment:
      # Log to stdout rather than to files under /logs.
      RUSTFS_OBS_LOG_DIRECTORY: ""
      # Skip the startup update check, which calls out to version.rustfs.com.
      RUSTFS_CHECK_UPDATE: "false"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      # `/health/ready` only succeeds once storage and IAM are initialized.
      test: [ "CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready" ]
      interval: 1s
      timeout: 10s
      retries: 30

  minio-setup:
    container_name: fhevm-minio-setup
    image: rustfs/rustfs:1.0.0
    # The image runs as an unprivileged user, which can't write to the root-owned secrets volume.
    user: root
    env_file:
      - ${FHEVM_STATE_DIR:-../../../.fhevm}/runtime/env/minio.env
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        # SigV4-signed requests with the root credentials, standing in for `mc`.
        s3() { curl -fsS --aws-sigv4 aws:amz:us-east-1:s3 --user "$${MINIO_ROOT_USER}:$${MINIO_ROOT_PASSWORD}" "$$@"; }
        # Object Lock can only be enabled at bucket creation, as `mc mb --with-lock` did.
        mb() {
          s3 -o /dev/null -I "$${MINIO_ENDPOINT}/$$1" 2>/dev/null ||
            s3 -X PUT -H "x-amz-bucket-object-lock-enabled: true" "$${MINIO_ENDPOINT}/$$1"
        }
        # Same statements as `mc anonymous set public`.
        public() {
          s3 -X PUT "$${MINIO_ENDPOINT}/$$1?policy" -d '{
            "Version": "2012-10-17",
            "Statement": [
              { "Effect": "Allow", "Principal": { "AWS": ["*"] }, "Resource": ["arn:aws:s3:::'"$$1"'"],
                "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"] },
              { "Effect": "Allow", "Principal": { "AWS": ["*"] }, "Resource": ["arn:aws:s3:::'"$$1"'/*"],
                "Action": ["s3:AbortMultipartUpload", "s3:DeleteObject", "s3:GetObject", "s3:ListMultipartUploadParts", "s3:PutObject"] }
            ]
          }'
        }
        s3 -X PUT "$${MINIO_ENDPOINT}/rustfs/admin/v3/add-user?accessKey=$${ACCESS_KEY}" \
          -d '{"secretKey":"'"$${SECRET_KEY}"'","status":"enabled"}'
        s3 -X PUT "$${MINIO_ENDPOINT}/rustfs/admin/v3/set-user-or-group-policy?policyName=readwrite&userOrGroup=$${ACCESS_KEY}&isGroup=false"
        echo $${ACCESS_KEY}
        echo $${SECRET_KEY}
        echo $${ACCESS_KEY} > /minio_secrets/access_key
        echo $${SECRET_KEY} > /minio_secrets/secret_key
        cat /minio_secrets/access_key
        cat /minio_secrets/secret_key
        mb kms-public
        # Per-coprocessor buckets, holding both ct128 and ct64 under their key
        # prefixes, as deployed in production.
        # See test-suite/fhevm/src/generate/env.ts:buildInstanceEnvs.
        for i in 0 1 2 3 4; do
          mb coproc-$$i
          public coproc-$$i
        done
        public kms-public
    volumes:
      - minio_secrets:/minio_secrets
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio_secrets:
