services:

  test-suite-e2e-debug:
    container_name: fhevm-test-suite-e2e-debug
    image: ghcr.io/zama-ai/fhevm/test-suite/e2e:${TEST_SUITE_VERSION}
    platform: linux/amd64
    # Share the object store's network namespace so the `http://localhost:9000` key URLs published by
    # pre-v0.13 KMS cores resolve inside this container. Each component is composed from its
    # own file, so `service:object-store` is not addressable here and the container name is used
    # instead: the object store must already be running (it starts in the `base` step), and recreating
    # the object store also requires recreating this container.
    network_mode: "container:fhevm-object-store"
    env_file:
      - ${FHEVM_STATE_DIR:-../../../.fhevm}/runtime/env/test-suite.env
    # The kms-connector proxies' self-signed test certificate, trusted through NODE_EXTRA_CA_CERTS.
    volumes:
      - ../static/config/kms-connector-proxy/tls.crt:/etc/kms-connector/proxy/tls.crt:ro
    command:
      - tail -f /dev/null
