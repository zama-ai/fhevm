services:
  host-node:
    container_name: host-node
    image: ghcr.io/foundry-rs/foundry:v1.3.5
    env_file:
      - ${FHEVM_STATE_DIR:-../../../.fhevm}/runtime/env/host-node.env
    entrypoint:
      - anvil
      - --block-time
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "${HOST_NODE_PORT:-8545}"
      - --chain-id
      - "${HOST_NODE_CHAIN_ID:-12345}"
      - --accounts
      - "120"
      - --mnemonic
      - "${MNEMONIC}"
      # Reduce number of slots in an epoch to consider transaction as finalized ASAP.
      # A tx is generally considered finalized after two epochs.
      - --slots-in-an-epoch
      - "1"
    ports:
      - "127.0.0.1:${HOST_NODE_PORT:-8545}:${HOST_NODE_PORT:-8545}"
    # Anvil keeps all chain state in memory and grows without bound under
    # benchmark load: a 1500-transfer burst run drove it to 228 GB RSS on a 235 GB
    # host, and the kernel OOM-killer picked it only because it happened to be the
    # largest process — postgres or a GPU worker could have gone instead, which
    # would have corrupted a run rather than merely ending it. Cap it so anvil dies
    # alone, visibly, and long before the host is at risk.
    mem_limit: ${HOST_NODE_MEM_LIMIT:-64g}
