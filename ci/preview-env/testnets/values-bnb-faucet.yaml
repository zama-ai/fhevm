# sync-secrets values: BSC testnet treasury key (gitops zws-dev bnb faucet).
# Helm release name is the ExternalSecret name (preview-bnb-faucet).
externalSecret:
  enabled: true
  targetSecretName: bnb-faucet
  data:
    - keyReference: "zws-dev/bnb-faucet"
      propertyReference: private-key
      secretKeyName: private_key
  template:
    data:
      private-key: '{{ .private_key }}'
