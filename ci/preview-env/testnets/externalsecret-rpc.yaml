# chain_mode=testnets secrets from AWS Secrets Manager via the cluster's External Secrets Operator:
# Sepolia + Amoy RPC URLs (same AWS keys and Secret shape as zama-zws/gitops gives the coprocessor)
# plus the treasury key that funds the preview's wallets. Applied by deploy-rpc-secret.sh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: preview-rpc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: rpc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ethereum-rpc-url: "{{ .eth_http }}"
        ethereum-rpc-ws-url: "{{ .eth_ws }}"
        polygon-rpc-url: "{{ .polygon_http }}"
        polygon-rpc-ws-url: "{{ .polygon_ws }}"
        funder-private-key: "{{ .funder_key }}"
  data:
    - secretKey: eth_http
      remoteRef: {key: zws-dev/external-eth-rpcs, property: fhevm-ethereum-sepolia-rpc-url}
    - secretKey: eth_ws
      remoteRef: {key: zws-dev/external-eth-rpcs, property: fhevm-ethereum-sepolia-rpc-ws-url}
    - secretKey: polygon_http
      remoteRef: {key: zws-dev/external-polygon-rpcs, property: polygon-amoy-rpc-coprocessor-http-url}
    - secretKey: polygon_ws
      remoteRef: {key: zws-dev/external-polygon-rpcs, property: polygon-amoy-rpc-coprocessor-ws-url}
    # Treasury holding Sepolia ETH + Amoy POL (created by an admin; see README "testnets").
    - secretKey: funder_key
      remoteRef: {key: zws-dev/fhevm-preview-funder, property: private-key}
