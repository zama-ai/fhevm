# sync-secrets values: treasury key that funds preview wallets on Sepolia + Amoy.
# Same split as gitops faucets (Secret `funder` / key `private-key`), not mixed into `rpc`.
# Helm release name is the ExternalSecret name (preview-funder).
# AWS secret is created by an admin (see README "testnets").
externalSecret:
  enabled: true
  targetSecretName: funder
  data:
    - keyReference: "zws-dev/fhevm-preview-funder"
      propertyReference: private-key
      secretKeyName: private_key
  template:
    data:
      private-key: '{{ .private_key }}'
