# ADDITIVE overlay for each kms-connector-<i> release, passed as an EXTRA `-f`
# AFTER values-kms-connector-e2e.yaml ONLY when deploy_polygon=true (see
# deploy-kms-connector.sh). Adds the Polygon host chain to commonConfig.hostChains
# so the KMS can verify ACL permissions for Polygon ciphertexts.
commonConfig:
  hostChains:
    - name: ethereum
      url: "http://anvil-host-anvil-node:8545"
      chainId: "12345"
      aclAddress: ""
    - name: polygon
      url: "http://anvil-host-polygon-anvil-node:8545"
      chainId: "80002"
      aclAddress: ""
