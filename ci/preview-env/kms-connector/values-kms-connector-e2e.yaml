# kms-connector chart values overlay for the fhevm e2e preview namespace.
#
# ONE RELEASE PER kms-core PARTY: scripts/deploy-kms-connector.sh installs this
# file NB_KMS_CORE times (kms-connector-<i>, i=1..N), each --set-string-overriding
# the 3 per-party fields below (databaseUrl, kmsCoreEndpoints, wallet.secret.name)
# to point at that party's own DB/kms-core/wallet.
#
# commonConfig.network stays "" (the chart default): no bundled devnet/testnet/
# mainnet preset applies to a per-PR anvil, so every chain id / address is given
# explicitly here or by the script.
#
# kmsWorker's config.kmsCoreEndpoints (below) points at the dedicated per-PR
# KMS's parties. Confirmed live via `kubectl get svc` against a running
# deploy: each party is its own StatefulSet/Service pair named
# kms-core-<i>-core-<i>, exposing 3 named ports: client (50100, what
# connector/kms-worker's gRPC client uses - scheme "http://", not "https://":
# kms-connector/crates/utils/src/conn.rs's shared connect_to_rpc_node_inner
# always uses connect_http, and the chart's own default confirms this:
# charts/kms-connector/values.yaml's kmsCoreEndpoints: "http://kms-core:50051"),
# peer (50001, inter-party MPC - not for the connector) and metrics (9646).
#
# Deployed as:
#   helm upgrade --install kms-connector-<i> ../../charts/kms-connector \
#     -n <namespace> -f this-file --set-string commonConfig.databaseUrl=... --set-string ...
commonConfig:
  # Dedicated in-cluster Postgres release PER PARTY (../kms-connector/values-
  # postgres-connector-e2e.yaml, deployed as postgres-connector-<i>) - NOT
  # shared with coprocessor/relayer-migrate's instance, nor across parties.
  # Overridden per-release by the script to postgres-connector-<i>; this is
  # just party 1's value as a standalone-template-safe default.
  databaseUrl: "postgresql://zama:zama@postgres-connector-1:5432/connector"
  gatewayUrl: "http://anvil-gateway-anvil-node:8546"
  gatewayChainId: "54321"
  # Chart 1.5.3 (v0.14.2) reads these flat keys. Chart 2.x ignores them and
  # reads hostChains below. apply-chain-env.sh rewrites both shapes together.
  # ethereumContractAddresses.acl is injected by deploy-kms-connector.sh, same
  # as kmsGeneration / protocolConfig. gatewayContractAddresses.* too.
  ethereumUrl: "http://anvil-host-anvil-node:8545"
  ethereumChainId: "12345"

  # url/chainId are rewritten by apply-chain-env.sh; aclAddress by
  # deploy-kms-connector.sh. Chart 2.x shape.
  hostChains:
    ethereum:
      url: "http://anvil-host-anvil-node:8545"
      chainId: "12345"
      aclAddress: ""
    polygon: null

kmsConnectorKmsWorker:
  config:
    # Overridden per-release to this party's own kms-core-<i>-core-<i> - see
    # header note. Party 1's endpoint is the standalone-template-safe default.
    kmsCoreEndpoints: "http://kms-core-1-core-1:50100"
    # Chart 1.5.3 renders KMS_CONNECTOR_HOST_CHAINS from this list and expands
    # the $(...) refs from KMS_CONNECTOR_ETHEREUM_* at runtime. Its chart default
    # also lists Polygon, whose empty chain id is not valid JSON once expanded.
    # Chart 2.x builds that env from commonConfig.hostChains and ignores this
    # list. The Polygon overlay replaces it when deploy_polygon is set.
    hostChains:
      - url: "$(KMS_CONNECTOR_ETHEREUM_URL)"
        chainId: "$(KMS_CONNECTOR_ETHEREUM_CHAIN_ID)"
        aclAddress: "$(KMS_CONNECTOR_ETHEREUM_ACL_ADDRESS)"

# kmsConnectorTxSender.wallet.secret defaults to {name: kms-connector-tx-sender, key: kms-wallet}
# - overridden per-release by the script to kms-connector-tx-sender-<i>. The
# Secret itself is created out-of-band by preview-env-deploy.yml's "Create
# kms-connector-tx-sender secrets" step (must run before this chart installs,
# unlike coprocessor's txSender which has a wallet.secret.value literal option
# and needs no such out-of-band step).

kmsConnectorProxy:
  apiKeyDigest:
    value: "0x75e65d843ac0b8656e1d75b2efc1cc7879e4b6c1854651cb28664686625a6e23"
  # `kubernetes.io/tls` Secret the chart does NOT create. deploy-kms-connector.sh
  # generates ONE self-signed certificate per namespace and stores it under this
  # name before the first release installs. So all N releases share it and the
  # test-suite trusts a single CA.
  tls:
    secretName: kms-connector-proxy-tls
