# common chart overlay for relayer-http in a Solana preview, deployed like the relayer
# (ci/preview-env/relayer/values-relayer-e2e.yaml). deploy-preview.sh sets image.tag and
# configmapFiles.files."config.yaml": relayer-http/config/config.yaml with the namespace's host
# chains, proxy endpoints and thresholds merged in.
fullnameOverride: relayer-http

# The common chart does not set a pull secret for private hub.zama.org images.
imagePullSecrets:
  - name: registry-credentials

image:
  repository: hub.zama.org/ghcr/zama-ai/fhevm/relayer-http

deployment:
  enabled: true

service:
  enabled: true
  ports:
    - {name: http, port: 8080}

livenessProbe:
  httpGet: {path: /liveness, port: http}
readinessProbe:
  httpGet: {path: /healthz, port: http}

# The image runs `relayer-http /app/config/config.yaml`.
configmapFiles:
  enabled: true
  volumeMount:
    mountPath: /app/config
    subPath: ""
    readOnly: true

env:
  # FhevmSig test key; its address is kmsConnectorProxy.allowedSenders in values-kms-connector-e2e.yaml.
  - {name: RELAYER_SIGNER_KEY, value: "0xdcd7f0c4990a3df000d45f6eb2728a8cf93f0d16b1f6bdffbe07f5a250250e6c"}
  # The proxies' test CA (deploy-kms-connector.sh creates the Secret) is the only CA relayer-http
  # needs to trust.
  - name: SSL_CERT_FILE
    value: /etc/relayer-http/proxy-ca/ca.crt

volumes:
  - name: proxy-ca
    secret:
      secretName: kms-connector-proxy-tls
      items:
        - {key: ca.crt, path: ca.crt}
volumeMounts:
  - {name: proxy-ca, mountPath: /etc/relayer-http/proxy-ca, readOnly: true}
