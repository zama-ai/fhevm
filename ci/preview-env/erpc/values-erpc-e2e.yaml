# `listener` chart overlay rendering ONLY its bundled eRPC (no listener): the public-RPC
# proxy for chain_mode=testnets, at http://preview-erpc:4000/listener-indexer/evm/<chainId>
# (11155111 Sepolia, 80002 Amoy). Same public-endpoints profile the listener uses in prod.
# Deployed as: helm upgrade --install preview-erpc <listener chart> -n <ns> -f this-file --wait
fullnameOverride: preview   # -> "preview-erpc" via listener.erpcName

# Harbor ghcr proxy-cache like every other preview image; registry-credentials exists (KMS deploy.sh installs it).
imagePullSecrets:
  - name: registry-credentials

# Every listener template is `if .Values.listeners`-guarded, so only the eRPC resources render.
listeners: []

erpc:
  enabled: true
  # Public nodes with failover, tuned for indexer reads; tx-heavy deploys go through it too (slower, accepted).
  baseConfig: erpc-public.yaml
  image:
    repository: hub.zama.org/ghcr/erpc/erpc
  nodeSelector:
    karpenter.sh/nodepool: zws-pool
  tolerations:
    - {key: karpenter.sh/nodepool, operator: Equal, value: zws-pool, effect: NoSchedule}
