# charts/contracts overlay for a same-committee KMS context switch on the host.
#
# Preview counterpart of zama-zws/gitops
# values/eth-blockchain/eth-sc-define-new-kms-context/values-zws-dev.yaml.
# Not part of preview-env-deploy.
#
# The network, RPC, chain ids, and deployer below are the Anvil defaults from
# values-host-contracts-e2e.yaml. kms-context-switch.sh overwrites any of them
# the live host-contracts release already set, and appends the committee.
# It then replaces KMS_NODE_CA_CERT_<i> with the PEM from that party's public
# vault, KMS_SOFTWARE_VERSION with the running core-service-enclave tag, and
# KMS_PCR_VALUES with the trusted-release triple from kms-core-1. The values
# below are only the placeholders the original host deploy stored. A preview
# cannot pin the committee here because party count and addresses are per namespace:
#   NUM_KMS_NODES
#   PUBLIC_DECRYPTION_THRESHOLD USER_DECRYPTION_THRESHOLD
#   KMS_GEN_THRESHOLD MPC_THRESHOLD
#   KMS_TX_SENDER_ADDRESS_<i> KMS_SIGNER_ADDRESS_<i>
#   KMS_NODE_IP_<i> KMS_NODE_STORAGE_URL_<i> KMS_NODE_PARTY_ID_<i>
#   KMS_NODE_MPC_IDENTITY_<i> KMS_NODE_CA_CERT_<i> KMS_NODE_STORAGE_PREFIX_<i>
#
# ProtocolConfig is not an env var here. --use-internal-proxy-address reads it
# from the reused host-contracts PVC (addresses/.env.host). Gitops sets
# PROTOCOL_CONFIG_CONTRACT_ADDRESS from the eth-sc-addresses ConfigMap.
# The build task prints the next context id (allocation counter + 1). The script
# feeds that id to the gateway overlay. defineNewKmsContextAndEpoch reverts with
# KmsLifecycleOperationInFlight while the previous attempt is still Pending or
# Created, so the first command destroys that id when it is live and is not the
# active context. The active context is left in place. This broadcast only mines
# the tx; the cores still have to confirm creation and activate the epoch.
scDeploy:
  enabled: true
  preventRedeployment: false
  image:
    name: hub.zama.org/ghcr/zama-ai/fhevm/host-contracts
    tag: latest
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  configmap:
    name: host-sc-addresses
  env:
    - {name: HARDHAT_NETWORK, value: "staging"}
    - {name: MNEMONIC, value: "test test test test test test test test test test test junk"}
    - {name: RPC_URL, value: "http://anvil-host-anvil-node:8545"}
    - {name: CHAIN_ID, value: "12345"}
    - {name: CHAIN_ID_GATEWAY, value: "54321"}
    # Anvil account #9. Same key as values-host-contracts-e2e.yaml.
    - {name: DEPLOYER_PRIVATE_KEY, value: "0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6"}
    # Placeholders. kms-context-switch.sh replaces both from the running kms-core.
    - {name: KMS_SOFTWARE_VERSION, value: "0.1.0"}
    - {name: KMS_PCR_VALUES, value: '[{"pcr0":"0x00","pcr1":"0x00","pcr2":"0x00"}]'}
  deployCommands:
    # Counter is the latest issued id. It stays above the active id while a switch
    # is Pending or Created. Destroy that id so the define below is allowed.
    # A destroyed id is not live, so a rerun does not destroy it again.
    - |
      node -e "
      const { ethers } = require('ethers');
      const fs = require('fs');
      const env = fs.readFileSync('addresses/.env.host', 'utf8');
      const address = env.match(/^PROTOCOL_CONFIG_CONTRACT_ADDRESS=(.*)$/m)[1].trim();
      const abi = [
        'function getCurrentKmsContextId() view returns (uint256)',
        'function getCurrentKmsContextIdCounter() view returns (uint256)',
        'function isLiveKmsContext(uint256) view returns (bool)',
      ];
      (async () => {
        const contract = new ethers.Contract(address, abi, new ethers.JsonRpcProvider(process.env.RPC_URL));
        const active = await contract.getCurrentKmsContextId();
        const counter = await contract.getCurrentKmsContextIdCounter();
        const live = await contract.isLiveKmsContext(counter);
        const inflight = live && counter !== active ? counter.toString() : '';
        console.log('active context ' + active.toString() + ', counter ' + counter.toString() + (inflight ? ', destroying ' + inflight : ', nothing in flight'));
        fs.writeFileSync('/tmp/inflight-context-id', inflight);
      })().catch((e) => { console.error(e); process.exit(1); });
      "
    - |
      inflight=$(tr -d '[:space:]' < /tmp/inflight-context-id)
      if [[ -n "${inflight}" ]]; then
        npx hardhat task:destroyKmsContext --context-id "${inflight}" --use-internal-proxy-address true
      fi
    - npx hardhat task:buildDefineNewKmsContextAndEpochCalldata --use-internal-proxy-address true
    - npx hardhat task:defineNewKmsContextAndEpoch --use-internal-proxy-address true
  verifyContracts: false
persistence:
  enabled: true
  mountPath: /app/addresses
  volumeClaim:
    name: host-sc-deploy-workdir
    create: false
scUpgrade:
  enabled: false
nodeSelector:
  karpenter.sh/nodepool: zws-pool
tolerations:
  - key: "karpenter.sh/nodepool"
    operator: "Equal"
    value: "zws-pool"
    effect: "NoSchedule"
