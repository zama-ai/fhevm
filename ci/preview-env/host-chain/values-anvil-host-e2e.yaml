# anvil-node values overlay for the fhevm-e2e "simplest scenario" host chain.
# Deployed as: helm upgrade --install anvil-host charts/anvil-node -n fhevm-e2e -f this-file
nameOverride: anvil-host
image:
  name: ghcr.io/foundry-rs/foundry
  tag: v1.3.5
network:
  blockTime: "1"
  host: "0.0.0.0"
  chainId: "12345"
  accounts: "120"
  slotsInAnEpoch: "1"
  mnemonic: "test test test test test test test test test test test junk"
port: 8545
storage:
  size: 1Gi
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "4"
    memory: 2Gi

# Anvil keeps the chain in memory only: a rescheduled pod restarts at genesis,
# wiping every deployed contract and breaking the whole env. zws-pool consolidates
# underutilized nodes outside its weekday 06:00-19:00 UTC budget window, so block
# that voluntary disruption for the node hosting this pod.
podAnnotations:
  karpenter.sh/do-not-disrupt: "true"

# Pins onto the zws-pool Karpenter node pool - see
# ../coprocessor-infra/values-postgres-coprocessor-e2e.yaml's matching note.
nodeSelector:
  karpenter.sh/nodepool: zws-pool
tolerations:
  - key: "karpenter.sh/nodepool"
    operator: "Equal"
    value: "zws-pool"
    effect: "NoSchedule"
