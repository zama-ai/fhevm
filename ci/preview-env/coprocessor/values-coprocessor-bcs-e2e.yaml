# BCS (blue) overlay for RFC-021 preview-env. Applied on top of
# values-coprocessor-e2e.yaml for release coprocessor-<i>.
#
# Images stay on the previous-release registry pin (workflow --set
# v0.14.1). Helm stackVersion is a label only; mode is the compiled
# STACK_VERSION in that pin. extraSelectorLabels let this release coexist
# with coprocessor-<i>-gcs in the same namespace.
commonConfig:
  stackVersion: "0.14.1"
  extraSelectorLabels:
    fhevm.zama.ai/fleet: bcs
  # Anvil host chain id. apply-chain-env.sh overwrites this for blockchain-dev.
  canonicalProtocolConfigChainId: "12345"

# v0.14.1 still takes --bucket-name-ct64/--bucket-name-ct128 (same bucket,
# prefix paths). HEAD unified those to --bucket-name; the template injects
# the new flag, which this image rejects. extraArgs replaces the e2e list.
snsWorker:
  disabledArgs: ["bucket-name"]
  extraArgs:
    - --pg-listen-channels
    - event_pbs_computations
    - event_ciphertext_computed
    - --pg-notify-channel
    - event_ciphertext128_computed
    - --bucket-name-ct64=$(S3_BUCKET_NAME)
    - --bucket-name-ct128=$(S3_BUCKET_NAME)

# The Gateway transport moved from WebSocket to HTTP after this release, and the base values set
# txSender.config.gatewayUrl to the HTTP endpoint for it. v0.14.x speaks WebSocket, so pin it back
# here. apply-chain-env.sh overwrites the value for the deployed chain mode.
txSender:
  config:
    gatewayUrl:
      value: "ws://anvil-gateway-anvil-node:8546"

# TEMPORARY — manufactures a predecessor identity so the one-off migration can
# be exercised. Drop this block and its twin in values-coprocessor-gcs-e2e.yaml
# together, along with the --migrate-from-service-name flag itself.
#
# v0.14.1 derives its broker identity from --service-name, so naming it here
# makes Blue register host-listener-consumer-legacy.12345 and the listener fan
# out to that identity's own four streams. That is a predecessor identity
# created the way the real one was: by a rename. Green runs HEAD, whose
# identity is compiled in and cannot be renamed, and carries
# --migrate-from-service-name pointed back at this name.
#
# This departs from the default topology on purpose. Unmodified, both fleets
# share one identity and are separated by consumer group; that is what the
# overlay deploys normally. A single run cannot cover both arrangements,
# because manufacturing the predecessor is what splits them apart.
hostListenerConsumerShared:
  args:
    serviceName: host-listener-consumer-legacy
