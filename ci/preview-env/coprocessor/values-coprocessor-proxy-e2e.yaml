# coprocessor-proxy, prf-service and consensus-detector of party i.
# scripts/deploy/deploy-coprocessor.sh applies it, except on blue-green stacks, and sets the
# per-party values. apply-chain-env.sh sets the chain ID.
commonConfig:
  canonicalProtocolConfigChainId: "12345"

coprocessorProxy:
  enabled: true
  image:
    name: hub.zama.org/ghcr/zama-ai/fhevm/coprocessor/coprocessor-proxy
    tag: latest
  # Created by scripts/deploy/deploy-coprocessor.sh.
  tls:
    secretName: coprocessor-proxy-tls
  prfServiceNetworkPolicy:
    # The PRF port of prf-service.
    ports:
      - {port: 8090, protocol: TCP}
    # Test-suite pods reach only the metrics port.
    extraIngress:
      - from:
          - podSelector:
              matchLabels:
                app: fhevm-test-suite
        ports:
          - {port: 9100, protocol: TCP}

prfService:
  enabled: true
  image:
    name: hub.zama.org/ghcr/zama-ai/fhevm/coprocessor/prf-service
    tag: latest
  # deploy-coprocessor.sh creates this role before the migration, which grants its rights.
  databaseUser: {value: prf_service}
  databasePassword: {value: prf_service}
  # e2e limits: 2,048 pending bits and 8 requests in progress for each connector.
  limits:
    maxConcurrentPerConnector: 2048
    maxInFlightPerConnector: 8
    padPendingMaxAgeSeconds: 60

# Compares the reference digests of the lanes of all operators, so that the lanes start.
consensusDetector:
  enabled: true
  image: {name: hub.zama.org/ghcr/zama-ai/fhevm/coprocessor/consensus-detector, tag: latest}
