# coprocessor-proxy and the prf-service behind it. scripts/deploy/deploy-coprocessor.sh applies it to
# the coprocessor-<i> release, except on blue-green stacks, and sets the image tags, the signer and
# the NetworkPolicy's podSelector per party. It also creates the prf_service role below in each
# party's Postgres, from this file. apply-chain-env.sh sets canonicalProtocolConfigChainId to the
# host chain.
commonConfig:
  canonicalProtocolConfigChainId: "12345"

coprocessorProxy:
  enabled: true
  image:
    name: hub.zama.org/ghcr/zama-ai/fhevm/coprocessor/coprocessor-proxy
    tag: latest
  # Created by scripts/deploy/deploy-coprocessor.sh.
  tls:
    secretName: coprocessor-proxy-tls
  prfServiceNetworkPolicy:
    # The e2e suite counts the requests prf-service answered from its metrics; it reaches nothing
    # else of prf-service.
    extraIngress:
      - from:
          - podSelector:
              matchLabels:
                app: fhevm-test-suite
        ports:
          - {port: 9100, protocol: TCP}

prfService:
  enabled: true
  image:
    name: hub.zama.org/ghcr/zama-ai/fhevm/coprocessor/prf-service
    tag: latest
  # Fixed test credentials, like commonConfig's.
  databaseUser: {value: "prf_service"}
  databasePassword: {value: "prf_service"}
