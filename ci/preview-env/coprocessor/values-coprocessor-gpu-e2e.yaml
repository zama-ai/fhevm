# GPU overlay for HEAD FHE workers (tfhe / sns / zkproof).
#
# Applied on the standalone coprocessor-<i> release, and on coprocessor-<i>-gcs
# in Blue/Green. BCS (v0.14.0-7 CPU images) stays on the `coprocessor` nodepool
# so it does not consume MIG slices it cannot use.
#
# deploy-coprocessor.sh pairs this scheduling with the pinned GPU worker
# tag b358436-cuda12.8-sm70 (override with GPU_IMAGE_TAG).
tfheWorker:
  resources:
    requests:
      cpu: "16"
      memory: 32Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "16"
      memory: 32Gi
      nvidia.com/gpu: "1"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: karpenter.sh/nodepool
                operator: In
                values:
                  - coprocessor-gpu
  tolerations:
    - key: karpenter.sh/nodepool
      operator: Equal
      value: coprocessor-gpu
      effect: NoSchedule

