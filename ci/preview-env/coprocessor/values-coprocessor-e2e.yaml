# coprocessor chart values overlay for the fhevm e2e preview namespace.
#
# Contract addresses are wired from the real addresses emitted by the
# `contracts` chart's deploy Jobs (host-contracts / gateway-contracts), via
# valueFrom.configMapKeyRef against the host-sc-addresses / gw-sc-addresses
# ConfigMaps - the same pattern production GitOps uses. Service DNS names
# below are unqualified (no ".<namespace>.svc.cluster.local" suffix) so this
# file works unchanged under any per-PR namespace.
#
# All image tags are overridden at deploy time via --set-string in
# preview-env-deploy.yml (real per-PR short-SHA image tags) - the values here
# are just fallback defaults so this file stays valid standalone.
#
# databaseUser/databasePassword/databaseEndpoint below are already real, not
# placeholders: they point at the in-cluster Postgres release deployed by
# ../coprocessor-infra/values-postgres-coprocessor-e2e.yaml, whose Service
# name + fixed ephemeral test credentials are known ahead of deploy time (see
# that file's header) - no --set-string/secret discovery needed for the DB.
#
# Deployed as:
#   helm upgrade --install coprocessor oci://hub.zama.org/ghcr/zama-ai/fhevm/charts/coprocessor \
#     -n <namespace> -f this-file
commonConfig:
  forceLegacyServerKey: false
  databaseUser: {value: "zama"}
  databasePassword: {value: "zama"}
  databaseEndpoint: {value: "postgres-coprocessor:5432"}
  databaseUrl: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_ENDPOINT)/fhevm_e2e"
  databaseAuthMode: password
  # Must be ws:// (not http://): both gwListener's --gw-url and txSender's
  # --gateway-url alloy providers use ProviderBuilder::connect_ws/WsConnect
  # (confirmed via coprocessor/fhevm-engine/{gw-listener/src/bin/gw_listener.rs,
  # transaction-sender/src/bin/transaction_sender.rs}) - there's no separate
  # ws/http split field here the way chains[].wsUrl/httpUrl has for the host
  # chain, since neither consumer needs an HTTP connection to the gateway. anvil serves both HTTP and WS on the same port (see
  # ../gateway-chain/values-anvil-gateway-e2e.yaml's single `port: 8546`), so
  # only the scheme changes, not the host:port.
  gatewayUrl: {value: "ws://anvil-gateway-anvil-node:8546"}
  gatewayContractAddresses:
    inputVerification:
      valueFrom: {configMapKeyRef: {name: gw-sc-addresses, key: input_verification.address}}
    ciphertextCommits:
      valueFrom: {configMapKeyRef: {name: gw-sc-addresses, key: ciphertext_commits.address}}
    gatewayConfig:
      valueFrom: {configMapKeyRef: {name: gw-sc-addresses, key: gateway_config.address}}
    # multichainAcl intentionally omitted: task:deployAllGatewayContracts (see
    # ../gateway-chain/values-gateway-contracts-e2e.yaml) doesn't deploy a
    # MultichainAcl contract at this contracts version, so gw-sc-addresses has
    # no multichain_acl.address key - confirmed via `kubectl get configmap`.
    # txSender.disabledArgs below drops the corresponding legacy CLI arg.

#=======================================================
# The tag is a placeholder - deploy-coprocessor.sh overrides every
# component's image.tag via --set-string with the real per-PR short-SHA tag
# (or `latest` when that component didn't change in the PR).
defaults:
  image:
    registry: hub.zama.org/ghcr/zama-ai/fhevm
    tag: latest
  # IRSA-annotated SA created by coprocessor-infra's Crossplane chart (see
  # ../coprocessor-infra/values-coprocessor-infra-e2e.yaml's
  # coprocessorBucket.irsa block) - matches zama-zws/gitops's
  # values-zws-testnet.yaml pairing. The S3-touching workers (tfheWorker,
  # zkProofWorker, snsWorker, host listeners) need it: on the namespace's
  # `default` SA the AWS SDK has no credentials at all ("Failed to check
  # bucket existence" / "dispatch failure"); host-listener downloads key
  # material from S3 on ActivateKey events. gwListener, txSender and
  # dbMigration run on the namespace default SA: they unset it below.
  # deploy-coprocessor.sh overrides this per party (coprocessor-<i>).
  serviceAccountName: coprocessor

#=======================================================
dbMigration:
  serviceAccountName: ""
  # The coprocessor-<i> release runs first on each party's empty database, so it
  # is allowed to create it. values-coprocessor-gcs-e2e.yaml sets this to false
  # for the coprocessor-<i>-gcs release: it must find the database, not create it.
  allowBootstrap: true

#=======================================================
# NOTE: the poller is NOT run inside this coprocessor release. It is the
# DB-side background processor that downloads key/CRS material from the KMS
# public-vault S3 on pending kms_key_activation_events (the consumer only
# records the event; only the poller does the S3 download that fills the
# `keys`/`crs` tables). It is deployed as its OWN release per party
# (coprocessor-poller-<i>, ../coprocessor/values-coprocessor-poller-e2e.yaml),
# mirroring zama-zws/gitops's eth-coproc-listener-poller app - so it stays
# disabled in chains[] below.
hostListener:
  modes:
    consumer:
      config:
        # Broker URL for the host-listener-consumer, rendered as BROKER_URL /
        # --broker-url. Points at THIS party's Redis
        # (coprocessor-redis-<i>-master, standalone -> "<fullname>-master" Service),
        # which the party's listener producer (listener-<i>) publishes to. The
        # workflow overrides .value per party via --set; the default below is the
        # single-party (N=1) shape. Unlike the old built-in hostListener (which read
        # the chain directly and wrote the DB), the producer here is the dedicated
        # `listener` chart, so this consumer is the ONLY host-chain event path (the
        # built-in listener + poller are disabled in chains[] below).
        brokerUrl: {value: "redis://coprocessor-redis-1-master:6379"}

#=======================================================
gwListener:
  enabled: true
  serviceAccountName: ""

#=======================================================
tfheWorker:
  enabled: true
  # --run-bg-worker is what actually starts the background compute loop; without
  # it the tfhe_worker process comes up idle and never polls the `computations`
  # table, so FHE ops (incl. trivial encrypts) never produce ct64 -> no SnS ->
  # ciphertexts never reach the gateway -> every decrypt readiness-check times
  # out. Chart default extraArgs is [], so it must be set here. Mirrors
  # zama-zws/gitops coproc-workers/values-zws-dev.yaml's tfheWorker.
  extraArgs:
    - --run-bg-worker
    - --worker-polling-interval-ms=10000
    # Keep chains-per-batch WELL BELOW work-items-batch-size. The adaptive
    # window gives each acquired chain ceil(work-items / chains) transactions,
    # so equal values yield one transaction per chain per cycle and a larger
    # chains-per-batch disables the adaptive window at runtime. 100/20 matches
    # the shipped defaults (share of 5), which is what a preview env should be
    # exercising. The previous 100 here was chosen while
    # --dependence-chains-per-batch was inert; it now bounds how many chain
    # locks a worker actually holds.
    - --work-items-batch-size=100
    - --dependence-chains-per-batch=20
    - --key-cache-size=32
    - --coprocessor-fhe-threads=64
    - --tokio-threads=16
    - --pg-pool-max-connections=10
    - --log-level=INFO
  # Chart default (512Mi) OOMs once --run-bg-worker loads the FHE ServerKey
  # (tfhe-rs 1.6.x). Pinned to the hpc7a `coprocessor` karpenter nodepool with
  # dev-like sizing (see zama-zws/gitops coproc-workers/values-zws-dev.yaml).
  resources:
    requests: {cpu: "16", memory: 32Gi}
    limits: {cpu: "16", memory: 32Gi}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - {key: karpenter.sh/nodepool, operator: In, values: [coprocessor]}
  tolerations:
    - {key: karpenter.sh/nodepool, effect: NoSchedule, operator: Equal, value: coprocessor}

#=======================================================
zkProofWorker:
  enabled: true
  # --pg-listen-channel/--pg-notify-channel aren't chart-templated (see
  # charts/coprocessor/values.yaml's zkProofWorker.extraArgs comment) - the
  # binary refuses to start without them ("required arguments were not
  # provided"). Channel names match test-suite/fhevm/docker-compose's
  # coprocessor-docker-compose.yml reference topology.
  extraArgs:
    - --pg-listen-channel=event_zkpok_new_work
    - --pg-notify-channel=event_zkpok_computed
  # Chart default (512Mi) OOMs on envs that generate Default FHE parameters, whose CRS is far
  # larger than the test one. 4Gi still OOMed during startup; 8Gi is stable.
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "4", memory: 8Gi}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - {key: karpenter.sh/nodepool, operator: In, values: [coprocessor]}
  tolerations:
    - {key: karpenter.sh/nodepool, effect: NoSchedule, operator: Equal, value: coprocessor}

#=======================================================
snsWorker:
  enabled: true
  # HEAD sns-worker images sign ciphertext attestations and REQUIRE a PrivateKey
  # signer - they abort startup with "Private key is required for PrivateKey
  # signer" when none is wired (the chart default wallet.enabled=false leaves it
  # unset). Mirrors the docker-compose reference topology
  # (test-suite/fhevm/docker-compose/coprocessor-docker-compose.yml:
  # --signer-type=private-key --private-key=${TX_SENDER_PRIVATE_KEY}) - the SAME
  # coprocessor key txSender uses (both the tx-sender and attestation signer are
  # the one on-chain COPROCESSOR_SIGNER_ADDRESS_<i-1> identity). secret.value is
  # overridden per party via --set-string in preview-env-deploy.yml; the
  # placeholder below (account #4, matching txSender.wallet) keeps this file
  # valid standalone.
  wallet:
    enabled: true
    secret: {value: "0x47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a"}
  config:
    # Chart default is empty (see charts/coprocessor/values.yaml's
    # snsWorker.config.s3BucketName comment) - matches zama-zws/gitops's
    # values-zws-testnet.yaml pairing. coprocessor-infra's Crossplane chart
    # (../coprocessor-infra/values-coprocessor-infra-e2e.yaml) writes this
    # ConfigMap (name overridden there to "coprocessor", not the chart's
    # release-derived default) - confirmed live via `kubectl get configmap
    # coprocessor -o yaml`: S3_BUCKET_NAME/S3_ENDPOINT/S3_URI_KEY keys.
    s3BucketName:
      valueFrom: {configMapKeyRef: {name: coprocessor, key: S3_BUCKET_NAME}}
  # Same as zkProofWorker.extraArgs above - required, not chart-templated.
  # --pg-listen-channels takes multiple positional values.
  extraArgs:
    - --pg-listen-channels
    - event_pbs_computations
    - event_ciphertext_computed
    - --pg-notify-channel
    - event_ciphertext128_computed
  # SnS (switch-and-squash) is the most memory-heavy step - it loads the SnS key
  # and squashes ct64 -> ct128 before commit to the gateway. Chart default 512Mi
  # OOMs here. Pinned to the hpc7a `coprocessor` nodepool with dev-like sizing
  # (see zama-zws/gitops coproc-workers/values-zws-dev.yaml's snsWorker).
  resources:
    requests: {cpu: "16", memory: 32Gi}
    limits: {cpu: "16", memory: 32Gi}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - {key: karpenter.sh/nodepool, operator: In, values: [coprocessor]}
  tolerations:
    - {key: karpenter.sh/nodepool, effect: NoSchedule, operator: Equal, value: coprocessor}

#=======================================================
txSender:
  enabled: true
  serviceAccountName: ""
  # Hardhat/anvil account #4 (addr 0x15d34AAf54267DB7D7c367839AAf71A00a2C6A65).
  # MUST match the coprocessor identity registered on-chain in GatewayConfig -
  # see ../gateway-chain/values-gateway-contracts-e2e.yaml's
  # COPROCESSOR_TX_SENDER_ADDRESS_0 / COPROCESSOR_SIGNER_ADDRESS_0. The tx-sender
  # both signs the InputVerification EIP-712 response and sends the tx with this
  # one key; if it differs, verifyProofResponse reverts with
  # NotCoprocessorTxSender(<addr>) (non-retryable) and input proofs never verify,
  # so the relayer polls forever and the e2e input test times out.
  wallet: {secret: {value: "0x47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a"}}
  config:
    # From 0.15 the sender talks HTTP to the gateway and aborts at startup on a
    # ws:// URL ("Gateway URL is not usable by this build"). Unset, the template
    # falls back to commonConfig.gatewayUrl, which stays ws:// for gwListener -
    # anvil serves both schemes on the same port (see ../gateway-chain/
    # values-anvil-gateway-e2e.yaml's single `port: 8546`). apply-chain-env.sh
    # overwrites this for blockchain-dev/testnets, and the BCS overlay pins it
    # back to ws:// for the v0.14.x sender.
    gatewayUrl: {value: "http://anvil-gateway-anvil-node:8546"}
  # --multichain-acl-address (see charts/coprocessor/values.yaml's
  # txSender.disabledArgs comment) would reference a nonexistent
  # gw-sc-addresses key: gateway-contracts still doesn't deploy a
  # MultichainAcl contract even at v0.13.0 (see commonConfig.
  # gatewayContractAddresses above; confirmed via `kubectl get configmap
  # gw-sc-addresses` - no multichain_acl.address key) - caused
  # CreateContainerConfigError without this.
  disabledArgs: ["multichain-acl-address"]
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - {key: karpenter.sh/nodepool, operator: In, values: [coprocessor]}
  tolerations:
    - {key: karpenter.sh/nodepool, effect: NoSchedule, operator: Equal, value: coprocessor}

#=======================================================
# Unknown chains default to K=30. Overlay the preview-env Anvil host (12345)
# and classic Anvil (31337) so a due manifest is every block.
consensusDetector:
  config:
    manifestPublicationCadence:
      - "12345:1"
      - "31337:1"

#=======================================================
chains:
  - name: host
    chainId: "12345"
    wsUrl: "ws://anvil-host-anvil-node:8545"
    httpUrl: "http://anvil-host-anvil-node:8545"
    aclContractAddressValueFrom: {configMapKeyRef: {name: host-sc-addresses, key: acl.address}}
    fhevmExecutorContractAddressValueFrom: {configMapKeyRef: {name: host-sc-addresses, key: fhevm_executor.address}}
    kmsGenerationContractAddressValueFrom: {configMapKeyRef: {name: host-sc-addresses, key: kms_generation.address}}
    protocolConfigContractAddressValueFrom: {configMapKeyRef: {name: host-sc-addresses, key: protocol_config.address}}
    hostListener:
      # Built-in real-time (WebSocket) producer DISABLED: the dedicated `listener`
      # chart (listener-<i>, ../listener/values-listener-e2e.yaml) is the producer
      # now. It indexes the host chain and publishes to coprocessor-redis-<i>, and
      # the consumer below ingests those events into the DB. This mirrors
      # zama-zws/gitops's producer(listener)/broker(redis)/consumer/poller split
      # (eth-listener + eth-coproc-listener-{consumer,poller}).
      listener: {enabled: false, useLegacyName: true}
      # Poller runs as its OWN release (coprocessor-poller-<i>), not here - see the
      # hostListener note above and values-coprocessor-poller-e2e.yaml.
      poller: {enabled: false, useLegacyName: true}
      # Catchup-only stays off: it backfills historical blocks on a live chain
      # (prod mainnet); a fresh per-PR anvil has no history to catch up on.
      catchupOnly: {enabled: false, useLegacyName: true}
      # Real-time host-chain event path: reads this party's Redis broker (filled by
      # listener-<i>) and writes decoded ACL/executor/kms-generation events to the
      # coprocessor DB. brokerUrl is set in hostListener.modes.consumer above.
      consumer: {enabled: true, useLegacyName: true}
