# common chart overlay for coprocessor-<i>-standin-pad-worker: the PRF spike's stand-in for the
# RFC-038 pad-worker of party i (coprocessor/fhevm-engine/prf-standins). It claims the `pads` rows
# that prf-service adds, writes a keccak pad, and signs the attestation with the party's key.
# `faults` selects injected faults by label first byte (see prf-standins/src/faults.rs).
# scripts/deploy/deploy-coprocessor.sh sets every value per party.
#
# Deployed as:
#   helm upgrade --install coprocessor-<i>-standin-pad-worker \
#     oci://hub.zama.org/ghcr/zama-zws/helm-charts/common -n <namespace> -f this-file
padWorker:
  image: ""
  party: ""
  databaseUrl: ""
  # Secret with the party's signing key under `private-key`.
  keySecret: ""
  faults: ""
  # Bytes per 2-bit PRF block: 100 gives a 2048-bit ct128 of about 100 KB.
  blockBytes: "100"
  # The stand-in PRF_MAX_CONCURRENT (C), and the evaluation time E = costBase + costPerBit x
  # padLength of a label without a fault: 1.1 s at 64 bits, 4.1 s at 2048 bits.
  concurrency: "16"
  costBase: "1s"
  costPerBit: "1500us"

additionalResources:
  - enabled: true
    object:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ .Release.Name }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: standin-pad-worker
            fhevm.zama.ai/party: "{{ .Values.padWorker.party }}"
        template:
          metadata:
            labels:
              app: standin-pad-worker
              fhevm.zama.ai/party: "{{ .Values.padWorker.party }}"
          spec:
            imagePullSecrets:
              - name: registry-credentials
            containers:
              - name: standin-pad-worker
                image: "{{ .Values.padWorker.image }}"
                command: ["standin-pad-worker"]
                env:
                  - {name: DATABASE_URL, value: "{{ .Values.padWorker.databaseUrl }}"}
                  - {name: PAD_WORKER_FAULTS, value: "{{ .Values.padWorker.faults }}"}
                  - {name: PAD_WORKER_BLOCK_BYTES, value: "{{ .Values.padWorker.blockBytes }}"}
                  - {name: PAD_WORKER_CONCURRENCY, value: "{{ .Values.padWorker.concurrency }}"}
                  - {name: PAD_WORKER_COST_BASE, value: "{{ .Values.padWorker.costBase }}"}
                  - {name: PAD_WORKER_COST_PER_BIT, value: "{{ .Values.padWorker.costPerBit }}"}
                  - name: PAD_WORKER_PRIVATE_KEY
                    valueFrom:
                      secretKeyRef: {name: "{{ .Values.padWorker.keySecret }}", key: private-key}
