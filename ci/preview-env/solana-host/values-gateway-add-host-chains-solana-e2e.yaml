# charts/contracts overlay that registers the Solana host chain on GatewayConfig after
# solana-programs has deployed. Companion to values-gateway-add-host-chains-e2e.yaml (ETH) and
# values-gateway-add-host-chains-polygon-e2e.yaml (opt-in extra EVM host).
#
# GatewayConfig.HostChain.aclAddress / fhevmExecutorAddress are EVM `address` fields, so they
# cannot hold a Solana program id. Local e2e (test-suite/fhevm/src/solana/deploy.ts) registers
# zeros here; the coprocessor DB row (later, not this Job) stores the zama_host program id as
# acl_contract_address. Chain id MUST stay a quoted string: 9223372036854788153 is above
# JS MAX_SAFE_INTEGER.
#
# task:addHostChainsToGatewayConfig is additive. This Job appends the Solana chain without
# touching the ETH registration. Runs after gateway-contracts AND solana-programs.
#
#   helm upgrade --install gateway-add-host-chains-solana \
#     oci://hub.zama.org/ghcr/zama-ai/fhevm/charts/contracts --version 0.8.2 \
#     -n <ns> -f this-file \
#     --set-string scDeploy.image.tag=<gateway-contracts tag> \
#     --wait --wait-for-jobs --timeout=10m
#
# Reuses gateway-contracts' PVC so --use-internal-proxy-address true can read
# GATEWAY_CONFIG_ADDRESS from addresses/.env.gateway.
scDeploy:
  enabled: true
  image:
    name: hub.zama.org/ghcr/zama-ai/fhevm/gateway-contracts
    tag: latest
  configmap:
    name: gw-sc-addresses
  env:
    - {name: HARDHAT_NETWORK, value: "staging"}
    - {name: MNEMONIC, value: "test test test test test test test test test test test junk"}
    - {name: RPC_URL, value: "http://anvil-gateway-anvil-node:8546"}
    - {name: DEPLOYER_PRIVATE_KEY, value: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"}
    - {name: NUM_HOST_CHAINS, value: "1"}
    - {name: HOST_CHAIN_CHAIN_ID_0, value: "9223372036854788153"}
    - {name: HOST_CHAIN_NAME_0, value: "fhevm-ci solana host chain"}
    - {name: HOST_CHAIN_WEBSITE_0, value: "https://example.invalid"}
    - {name: HOST_CHAIN_FHEVM_EXECUTOR_ADDRESS_0, value: "0x0000000000000000000000000000000000000000"}
    - {name: HOST_CHAIN_ACL_ADDRESS_0, value: "0x0000000000000000000000000000000000000000"}
  deployCommands:
    - npx hardhat task:addHostChainsToGatewayConfig --use-internal-proxy-address true
  verifyContracts: false
persistence:
  enabled: true
  mountPath: /app/addresses
  volumeClaim:
    name: gateway-sc-deploy-workdir
    create: false
scUpgrade:
  enabled: false
