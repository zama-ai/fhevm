# Protocol host only. Install after gateway contracts; demos use a separate release.
scDeploy:
  enabled: true
  image:
    name: hub.zama.org/ghcr/zama-ai/fhevm/solana-programs
    tag: latest
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  configmap:
    name: solana-host-addresses
  env:
    - {name: SOLANA_ARTIFACTS_DIR, value: "/app/programs"}
    - {name: ADDRESSES_DIR, value: "/app/addresses"}
    - {name: SOLANA_ENVIRONMENT, value: "preview-env"}
    - name: SOLANA_RPC_URL
      valueFrom:
        secretKeyRef:
          name: solana-rpc
          key: rpc-url
    - {name: GATEWAY_RPC_URL, value: "http://anvil-gateway-anvil-node:8546"}
    - name: GATEWAY_CONFIG_ADDRESS
      valueFrom:
        configMapKeyRef:
          name: gw-sc-addresses
          key: gateway_config.address
    - name: INPUT_VERIFICATION_ADDRESS
      valueFrom:
        configMapKeyRef:
          name: gw-sc-addresses
          key: input_verification.address
    - name: DECRYPTION_ADDRESS
      valueFrom:
        configMapKeyRef:
          name: gw-sc-addresses
          key: decryption.address
    - name: SOLANA_DEPLOYER_KEYPAIR_JSON
      valueFrom:
        secretKeyRef:
          name: solana-deployer
          key: deployer.json
    - name: SOLANA_ZAMA_HOST_KEYPAIR_JSON
      valueFrom:
        secretKeyRef:
          name: solana-deployer
          key: zama_host.json
          optional: true
    # deploy-preview.sh appends KMS_THRESHOLD and COPROCESSOR_THRESHOLD from the party counts.
  # Each preview namespace binds HostConfig to its own Gateway, and every branch head brings
  # different bytecode to the same program id (DD-051). Close the previous namespace's accounts,
  # then deploy or upgrade in place.
  deployCommands:
    - node /app/cli.mjs host wipe
    - node /app/cli.mjs host deploy --allow-upgrade
  verifyContracts: false
nodeSelector:
  kubernetes.io/arch: amd64
persistence:
  enabled: false
  volumeClaim:
    create: false
scUpgrade:
  enabled: false
