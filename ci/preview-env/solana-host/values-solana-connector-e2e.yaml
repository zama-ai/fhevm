# Merge after values-kms-connector-e2e.yaml for every KMS party.
# commonConfig.hostChains is a map, so this adds the Solana chain next to the party's EVM chains.
# $(...) placeholders resolve against the kms-worker env below. deploy-preview.sh sets
# solanaProofRoutes to one listener Service per coprocessor; the preview's coprocessors share one
# key, so every route carries $(SOLANA_PROOF_API_KEY).
commonConfig:
  hostChains:
    solana:
      url: "$(SOLANA_RPC_URL)"
      chainId: "130140237723663404"
      solanaHostProgramId: "$(SOLANA_HOST_PROGRAM_ID)"

kmsConnectorKmsWorker:
  env:
    - name: SOLANA_RPC_URL
      valueFrom:
        secretKeyRef: {name: solana-rpc, key: rpc-url}
    - name: SOLANA_PROOF_API_KEY
      valueFrom:
        secretKeyRef: {name: solana-proof-api, key: api-key}
    - name: SOLANA_HOST_PROGRAM_ID
      valueFrom:
        configMapKeyRef: {name: solana-host-addresses, key: zama_host.address}
