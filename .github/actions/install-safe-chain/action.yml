name: Install safe-chain
description: >
  Install safe-chain (malicious package guard for npm/yarn/pnpm/pip) in CI mode.
  The installer script is checked against a pinned SHA-256 before it runs; the
  installer then verifies the safe-chain binary against the checksums baked into
  the release. Requires the repository to be checked out first.

runs:
  using: composite
  steps:
    - name: Install safe-chain
      shell: bash
      env:
        # Do not rename to SAFE_CHAIN_VERSION: the installer reads that variable and
        # switches to its deprecated legacy install path when it is set.
        SAFE_CHAIN_RELEASE: "1.5.3"
        # sha256 of install-safe-chain.sh from the immutable 1.5.3 release asset.
        # It matches the digest GitHub publishes for the asset. Update both values together.
        SAFE_CHAIN_INSTALLER_SHA256: "0107cbbbf90159379756157e902acae512d62ffbd174307e42c5fe9f266792d3"
      run: |
        installer="${RUNNER_TEMP}/install-safe-chain.sh"
        curl -fsSL -o "${installer}" "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_RELEASE}/install-safe-chain.sh"
        echo "${SAFE_CHAIN_INSTALLER_SHA256}  ${installer}" | sha256sum -c -
        sh "${installer}" --ci
