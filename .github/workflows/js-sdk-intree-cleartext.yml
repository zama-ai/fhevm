name: js-sdk-intree-cleartext

# Drift guard for the intree cleartext host: the SDK overlay runs on this tree's host-contracts
# and overrides executor internals, so a change on either side can break it without failing a
# build. Runs the build and one e2e suite on the host.
on:
  pull_request:
    branches:
      - main
      - feature/solana
    paths:
      - ".github/workflows/js-sdk-intree-cleartext.yml"
      - "host-contracts/contracts/**"
      - "library-solidity/**"
      - "sdk/js-sdk/**"
      - "test-suite/e2e/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# No permissions at the workflow level — each job declares only what it needs.
permissions: {}

jobs:
  intree-cleartext:
    name: js-sdk-intree-cleartext/test
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache
    timeout-minutes: 30
    permissions:
      contents: "read" # Required to checkout repository code
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: "false"

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22.x

      - name: Install safe-chain
        shell: bash
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          version: stable

      - name: Update npm
        run: npm install -g npm@11.7.0

      # The root install covers the test-suite/e2e and library-solidity workspaces.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix sdk/js-sdk

      - name: Setup Forge Soldeer
        working-directory: sdk/js-sdk/contracts
        run: forge soldeer install

      # Not --silent: the compiler output must surface here.
      - name: Build the intree slot
        working-directory: sdk/js-sdk/contracts
        run: FOUNDRY_PROFILE=intree forge build

      - name: Install the local SDK into test-suite/e2e
        run: ./test-suite/e2e/scripts/install-sdk.sh local

      - name: Start the intree cleartext host
        working-directory: sdk/js-sdk
        run: |
          log="$RUNNER_TEMP/intree-host.log"
          nohup npm run start:localcleartext:intree > "$log" 2>&1 &
          for _ in $(seq 1 300); do
            if grep -q "stack deployed" "$log"; then exit 0; fi
            if grep -qE "Stopping Anvil|❌" "$log"; then break; fi
            sleep 1
          done
          cat "$log"
          exit 1

      # The e2e test task compiles contracts only on the in-process hardhat network.
      - name: Compile the e2e contracts
        working-directory: test-suite/e2e
        run: npx hardhat compile

      - name: Run EncryptedERC20 on the cleartext host
        working-directory: test-suite/e2e
        run: npm run test:localcleartext -- test/encryptedERC20/EncryptedERC20.ts
