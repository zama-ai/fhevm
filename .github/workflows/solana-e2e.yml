name: solana-e2e

# Brings up a fresh lifecycle-owned demo stack with the Solana host (`bun run demo up`) and runs
# the typed bun:test scenario suite (test-suite/fhevm/e2e/scenarios) against it: the decrypt
# vertical (input ZK + on-chain secp256k1 bind -> compute -> public-decrypt -> PURE-SDK
# user-decrypt, no kms checkout), the fhe_execute operator wiring, the confidential-transfer arc,
# and the token consume arc (wrap -> burn -> seal -> certified decrypt -> redeem -> disclose) with
# its adversarial context-mismatch tail. Every assertion is typed — the retired full-vertical.sh
# label greps (and the checker that policed them) have no successor because the failure mode is
# structurally gone.
#
# Ordinary computation ingestion is Yellowstone-first: the coprocessor is fed by gRPC off-chain
# reconstruction. Created-public lifecycle outputs also emit their narrow CPI event because their
# public-leaf append is not reconstructible from the computation alone. The single-value `reconstruct` matrix is
# kept so the job/artifact names keep their `-reconstruct` suffix; the side-stack setup
# (test-suite/fhevm/src/solana/deploy.ts) no longer keys off it.
#
# The lifecycle bring-up also deploys and seeds the confidential-vault demo (#1760). After the e2e
# phases, the same job refreshes that still-owned boot:
#   - `bun run demo reseed`: re-deploy the two demo programs, seed fresh, rotate authorization
#   - deposit-arc smoke (bun run demo:smoke): the live exercise of the vault's full forward path
#     (fund -> init accounts -> wrap -> join -> dispatch -> settle -> claim -> decrypt), hard-gated
#   - browser-reality: CORS preflight against relayer (with RELAYER_PERMISSIVE_CORS set) + proof
#     service, and the faucet endpoints callable from a browser origin
# The two demo programs (demo_vault, confidential_batcher) deploy from committed keypairs under
# solana/scripts/demo/demo-keypairs/ (see its README).
on:
  # Auto-run on PRs targeting the Solana feature branch *or* the stacked recovery
  # base used by vertical cutover PRs (#3214/#3215). workflow_dispatch remains for
  # manual re-runs / demo rehearsals with custom values at an arbitrary head.
  pull_request:
    branches:
      - feature/solana
      - elias/solana-proof-service-recovery
  workflow_dispatch:
    inputs:
      deposit-amount:
        description: "USDC the deposit-arc persona wraps + joins with (fresh per run avoids PDA reuse)."
        default: "1000"
        type: string
      kms-mode:
        description: "KMS topology. `centralized` is the single-party PoC default; `threshold` runs the 4-party (3t+1, t=1) cluster (fhevm-internal#1746)."
        default: "centralized"
        type: choice
        options:
          - centralized
          - threshold

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solana-e2e:
    # Status-check consumers: this check was named solana-e2e/full-vertical-reconstruct until the
    # bash vertical retired (fhevm-internal#1876).
    name: solana-e2e/scenarios${{ matrix.reconstruct && '-reconstruct' || '' }}
    runs-on: runs-on=${{ github.run_id }}/runner=32cpu-linux-x64/volume=160gb
    # The e2e lane's own history: median successful runs ~50-53 min, observed successful tail up
    # to 72 min (run 29830123609). The demo phase adds ~2 min on the already-built stack. The
    # owned-boot status gate before reseed fails fast if an e2e phase degraded the stack. 120
    # rather than the bash-era 90: the token-vertical scenario (its own 20-min budget) landed
    # after the 72-min tail was measured.
    timeout-minutes: 120
    strategy:
      matrix:
        # Single-value matrix: only the Yellowstone reconstruction arm remains (the emit/RPC arm
        # was retired). Kept as a matrix so `${{ matrix.reconstruct }}` keeps the `-reconstruct`
        # suffix on the job and artifact names.
        reconstruct: [true]
    permissions:
      contents: "read" # checkout
      packages: "read" # pull repo-owned images from ghcr.io
    env:
      DEMO_DEPOSIT_AMOUNT: ${{ inputs.deposit-amount || '1000' }}
      # Opt-in permissive CORS for the demo dApp origin (relayer + proof service default OFF; only
      # demo mode sets these). Set at the job level so the relayer and proof-service containers come
      # up with the demo CORS layer on at bring-up time; each is delivered to its container via a
      # ${..._PERMISSIVE_CORS:-} passthrough in the respective compose file. Intentional in this
      # per-PR lane: the browser-reality step below asserts the demo CORS behavior every run.
      RELAYER_PERMISSIVE_CORS: "1"
      SOLANA_PROOF_PERMISSIVE_CORS: "1"
      # Acceptance clients read the protected token file directly. Never persist the fragment token
      # in GitHub Actions logs; interactive local runs keep printing the launch URL by default.
      DEMO_PRINT_LAUNCH_URL: "0"
      # Absolute demo-config path so every producer/consumer agrees regardless of the step's working
      # directory (the seed and the smoke both run from test-suite/fhevm, but the path resolves to
      # the same repo-root file demo-up.sh advertises). See demo/config.ts.
      DEMO_CONFIG_PATH: ${{ github.workspace }}/.fhevm/runtime/solana-demo.json
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"
          # Depth 2 so the pull_request merge commit's parents are available: HEAD^1 is the base
          # branch commit the PR is applied onto, which the override selection below diffs against
          # and whose branch-published images (:feature-solana-<sha>) it uses for untouched groups.
          fetch-depth: 2

      - name: Setup Node
        # The lifecycle bring-up builds the SDK with npm and the runtime-dependency canary below
        # imports it under Node.
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0

      - name: Setup Solana + Anchor toolchain
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          # Retry the network fetches below: a CI run failed on a transient crates.io download.
          retry() { local n; for n in 1 2 3; do "$@" && return 0; echo "attempt $n failed; retrying in 5s" >&2; sleep 5; done; return 1; }
          # Pin agave v4.1.2 (the Yellowstone geyser plugin's ABI is patch-coupled to it, so this
          # must match the `+solana.` suffix in solana/geyser/build-yellowstone-plugin.sh).
          retry curl -sSfL https://release.anza.xyz/v4.1.2/install -o /tmp/anza-install.sh
          # Retry the installer itself, not just the fetch of it: the script downloads the ~100MB
          # release tarball from GitHub, which is the part that actually flakes.
          retry sh /tmp/anza-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          # anchor-cli from the prebuilt release binary, NOT `cargo install --git`: the latter builds
          # avm+anchor from source and fetches dozens of crates from crates.io, which flaked (a
          # `chrono` download failed). One retried binary download, no compilation, no crates.io.
          mkdir -p "$HOME/.cargo/bin"
          retry curl -sSfL https://github.com/solana-foundation/anchor/releases/download/v1.1.2/anchor-1.1.2-x86_64-unknown-linux-gnu -o "$HOME/.cargo/bin/anchor"
          chmod +x "$HOME/.cargo/bin/anchor"
          anchor --version

      - name: Setup protoc (host-listener builds fhevm-engine-common via prost-build)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "26.x"

      - name: Login to ghcr.io
        uses: zama-ai/ci-templates/.github/actions/retry@542103e14b9ae6a9aea27787b8724b3b35bb3918 # v1.0.9
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GHCR_READ_TOKEN }} # zizmor: ignore[secrets-outside-env] registry read token, same pattern as test-suite-e2e workflows
        with:
          command: |
            echo "$GHCR_PASSWORD" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      - name: Login to cgr.dev
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: cgr.dev
          username: ${{ secrets.CGR_USERNAME }} # zizmor: ignore[secrets-outside-env] registry creds, same pattern as test-suite-e2e workflows
          password: ${{ secrets.CGR_PASSWORD }} # zizmor: ignore[secrets-outside-env] registry creds, same pattern as test-suite-e2e workflows

      - name: Select source-built overrides (skip components this PR does not touch)
        # #1766 step 3: build from source only the component groups whose docker-image inputs the
        # PR changes; the rest run the branch-published images from solana-images-publish.yml.
        # Runs after the ghcr.io login (the script probes image existence with docker manifest
        # inspect) and only on PRs: workflow_dispatch runs keep the build-everything default in
        # clean-e2e.sh (the selection step is skipped, so both outputs stay empty).
        id: select-overrides
        if: github.event_name == 'pull_request'
        run: bash solana/scripts/e2e/select-overrides.sh "$(git rev-parse HEAD^1)"

      - name: Bring up fresh lifecycle-owned stack + demo
        env:
          # Override selection computed above (empty on workflow_dispatch or if the step was
          # skipped, in which case clean-e2e.sh keeps its build-everything default).
          SOLANA_E2E_OVERRIDES: ${{ steps.select-overrides.outputs.overrides }}
          SOLANA_E2E_LOCK_PINS: ${{ steps.select-overrides.outputs.lock_pins }}
          # KMS topology. Empty (PR runs) keeps clean-e2e.sh's centralized defaults, so the PR lane
          # is unchanged. `threshold` selects the 4-party scenario and sets the corruption threshold
          # t=1, from which the live client derives the 2t+1=3 on-chain certificate thresholds.
          SOLANA_E2E_SCENARIO: ${{ inputs.kms-mode == 'threshold' && 'solana-threshold-kms' || '' }}
          KMS_THRESHOLD: ${{ inputs.kms-mode == 'threshold' && '1' || '' }}
        run: bun run demo up

      - name: Verify @fhevm/sdk runtime deps and demo consumer build
        # Lifecycle bring-up builds the SDK, then refreshes each frozen consumer graph. Assert the
        # public Solana entrypoint before spending the remainder of the job on the vertical. The
        # vault module is no longer an SDK subpath (it lives in the demo dapp), so the dapp build
        # below is what proves it resolves.
        run: |
          cd "$GITHUB_WORKSPACE/test-suite/fhevm"
          node --input-type=module -e "await import('@fhevm/sdk/solana'); console.log('@fhevm/sdk/solana imports OK')"
          cd "$GITHUB_WORKSPACE/solana/demo-dapp"
          bun run build

      # The deposit-arc scenario drives the demo dapp's vault module from bun, and the vault reaches
      # into SDK *sources* (`@sdk-src`) for internals the published package deliberately does not
      # export (fhevm-internal#1859 §6d). Source resolution starts at sdk/js-sdk/, so the SDK's own
      # runtime dependencies have to exist there or at the repo root — the frozen consumer graph
      # under test-suite/fhevm only serves the *built* package, which is why the suite below failed on
      # `Cannot find module '@noble/hashes/sha2.js'` while the import check above passed.
      #
      # After the bring-up, not before: with no node_modules anywhere, bun installs test-suite/fhevm's
      # own graph on demand, and creating a root tree first suppresses that — an earlier attempt at
      # this position broke `bun run demo up` on `Cannot find module '@solana/kit'`. The lifecycle's
      # consumer graphs live in their own directories and are not touched by this root install.
      - name: Install the SDK's own dependency graph (bun resolves SDK sources)
        run: npm ci --workspace=@fhevm/sdk-dev --workspace=@fhevm/sdk --include-workspace-root=false

      - name: Run the Solana e2e scenario suite (SDK-driven, against the up stack)
        # The lifecycle-owned stack is still up. These bun:test scenarios drive product arcs through
        # @fhevm/sdk Solana actions only; the confidential-transfer arc (encrypt input ->
        # submitInputProof -> confidentialTransfer -> current user-decrypt) was moved here from
        # full-vertical.sh's [sdk-transfer] phase. See solana/docs/TESTING.md ("Scenario layer").
        working-directory: test-suite/fhevm
        run: bun run test:e2e

      - name: Require a healthy owned boot before the demo phase
        run: bun run demo status

      - name: Refresh demo programs, state, and authorization
        id: demo-reseed
        run: bun run demo reseed --direct

      - name: Deposit-arc smoke (bun run demo:smoke) — full arc live via the SDK, hard gate
        # demo:smoke sets RUN_DEMO_SCENARIOS=1 itself, so the deposit-arc scenario only runs here
        # (the earlier test:e2e pass leaves it gated off). No continue-on-error: a broken arc
        # fails the job.
        working-directory: test-suite/fhevm
        run: bun run demo:smoke

      - name: Browser-reality checks (CORS preflight + faucet endpoints)
        # Runs even when the smoke fails (browser-reality is an independent acceptance criterion;
        # an arc failure must not mask a CORS regression) — but only once the demo reseed
        # succeeded, so an earlier e2e-phase failure does not fire it against a stack with no
        # demo layer.
        if: ${{ !cancelled() && steps.demo-reseed.outcome == 'success' }}
        working-directory: test-suite/fhevm
        # fetch() OPTIONS preflights (relayer with RELAYER_PERMISSIVE_CORS on, proof service, faucet)
        # from the exact 127.0.0.1 dApp origin, then exercise the current boot capability against the
        # protected faucet and the same-origin, current-boot Vite session. TS, not bash: the
        # assertions are logic.
        run: bun run demo:check-cors

      - name: Collect stack logs on failure
        if: ${{ failure() }}
        run: |
          mkdir -p /tmp/solana-e2e-logs
          # Capture every lifecycle-owned native and container log before exact teardown.
          bun run demo logs --no-follow > /tmp/solana-e2e-logs/lifecycle.log 2>&1 || true
          cp /tmp/solana-*.log /tmp/solana-e2e-logs/ 2>/dev/null || true
          # The validator's own log lives inside the ledger dir, not next to the other /tmp logs,
          # and it is the only place a geyser plugin load failure is explained.
          # Name each copy after its ledger dir: a reseed can leave more than one ledger under
          # /tmp/fhevm-demo-<uid>/, and a fixed destination would silently keep only the last.
          for v in /tmp/fhevm-demo-*/*.ledger/validator.log; do
            [ -f "$v" ] || continue
            d="$(basename "$(dirname "$v")")"
            cp "$v" "/tmp/solana-e2e-logs/validator-${d}.log"
          done 2>/dev/null || true
          docker ps -a > /tmp/solana-e2e-logs/docker-ps.txt 2>&1 || true
          # Dump every container's logs so a downstream failure (e.g. public-decrypt: relayer ->
          # gateway -> kms-connector -> kms-core) is diagnosable from the artifact.
          for c in $(docker ps -aq); do
            n="$(docker inspect -f '{{.Name}}' "$c" 2>/dev/null | sed 's#^/##')"
            docker logs "$c" > "/tmp/solana-e2e-logs/container-${n:-$c}.log" 2>&1 || true
          done

      - name: Upload failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          # Distinct per matrix leg: upload-artifact v4 requires unique names within a run.
          name: solana-e2e${{ matrix.reconstruct && '-reconstruct' || '' }}-logs
          path: /tmp/solana-e2e-logs
          retention-days: 7

      - name: Tear down the stack
        if: ${{ always() }}
        run: bun run demo down

  # The worker boundary vertical (fhevm-internal#1876): tfhe-worker's solana_vertical test drives
  # a LiteSVM confidential transfer through off-chain reconstruction into the REAL TFHE worker
  # against a disposable migrated Postgres (testcontainers), then decrypts the computed
  # ciphertexts. The scenario job above proves the same arc on the live stack; only this test pins
  # the reconstruct-to-worker seam against real ciphertexts with no stack in between. It started
  # life as solana_poc.rs, #[ignore]d and manual-only — this job is what finally runs it on every PR.
  worker-vertical:
    name: solana-e2e/worker-vertical
    runs-on: runs-on=${{ github.run_id }}/runner=16cpu-linux-x64/volume=80gb
    # Cold-cache ceiling: the tfhe-worker build dominates; the SBF builds and the test itself
    # (six real euint64 ops) are minutes.
    timeout-minutes: 90
    permissions:
      contents: "read" # checkout (incl. the LFS test keys the harness loads into Postgres)
    steps:
      - name: Checkout (with the LFS test keys)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Setup Rust toolchain file
        run: cp coprocessor/fhevm-engine/rust-toolchain.toml .

      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1

      - name: Install build dependencies (protoc for prost-build; mold for link speed)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang

      - name: Setup Solana + Anchor toolchain
        # Same pins and retry shape as the scenario job above: agave from the anza installer,
        # anchor-cli from the prebuilt release binary (no crates.io compile).
        run: |
          set -euo pipefail
          retry() { local n; for n in 1 2 3; do "$@" && return 0; echo "attempt $n failed; retrying in 5s" >&2; sleep 5; done; return 1; }
          retry curl -sSfL https://release.anza.xyz/v4.1.2/install -o /tmp/anza-install.sh
          retry sh /tmp/anza-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.cargo/bin"
          retry curl -sSfL https://github.com/solana-foundation/anchor/releases/download/v1.1.2/anchor-1.1.2-x86_64-unknown-linux-gnu -o "$HOME/.cargo/bin/anchor"
          chmod +x "$HOME/.cargo/bin/anchor"
          anchor --version

      - name: Cache cargo
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            coprocessor/fhevm-engine/target
          key: ${{ runner.os }}-cargo-solana-worker-vertical-${{ hashFiles('coprocessor/fhevm-engine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-solana-worker-vertical-

      - name: Build the programs the vertical loads into LiteSVM
        # Per-crate builds, same shape as deploy-demo-programs.sh (--ignore-keys: keep the
        # declare_id!-pinned ids; --no-idl: the vertical only needs the .so artifacts).
        working-directory: solana
        run: |
          anchor build --ignore-keys --no-idl -p zama_host
          anchor build --ignore-keys --no-idl -p confidential_token

      - name: Run the worker vertical (real TFHE worker + disposable Postgres)
        working-directory: coprocessor/fhevm-engine
        env:
          SQLX_OFFLINE: "true"
          # mold only for this native build — job-wide RUSTFLAGS leaked into the anchor/SBF
          # build above, where rust-lld rejects `-fuse-ld=mold` (measured, not hypothetical).
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        # The trailing grep is the vacuous-filter guard (same lesson as solana-tests'
        # host-listener-reconstruct job): `cargo test` exits 0 when a renamed filter matches
        # nothing, so the job must fail unless exactly the one expected test ran and passed.
        run: |
          set -o pipefail
          cargo test -p tfhe-worker tests::solana_vertical -- --ignored --nocapture | tee /tmp/worker-vertical.log
          grep -E "test result: ok\. 1 passed" /tmp/worker-vertical.log
