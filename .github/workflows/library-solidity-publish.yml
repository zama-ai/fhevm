name: library-solidity-publish

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Set to true for release tagging"
        type: boolean
        required: false
        default: false
      dry-run:
        description: "Run every publish step in dry-run mode (nothing is published)"
        type: boolean
        required: false
        default: true

permissions: {}

# One run at a time: a second dispatch waits for the running one instead of
# publishing concurrently. Never cancel a run that may be publishing.
concurrency:
  group: library-solidity-publish
  cancel-in-progress: false

# ------------------------------------------------------------------------------
# Publish @fhevm/solidity: a Solidity ONLY npm package
# ------------------------------------------------------------------------------
#
# The published `package.json` is generated from `package.json.publish.template`,
# not taken from the repo: it keeps only what users need (no scripts, no
# devDependencies or other dev-only entries), so installing `@fhevm/solidity`
# pulls in nothing beyond its real dependencies.
#
# Jobs, in order (pack -> verify -> publish-npmjs -> publish-soldeer):
#
# - pack
#   What: stages lib/, config/, README.md, LICENSE and a minimal package.json (from
#         package.json.publish.template), runs `npm pack`, checks the tarball and
#         saves it as a workflow artifact for the next jobs (nothing is published here).
#   Why:  the published package.json has no devDependencies, scripts, etc., and no
#         dependency code (`npm ci`) runs before packing.
#
# - verify
#   What: compares the tarball from `pack` with a standard `npm pack` of the checkout
#         (library-solidity/publish/package.test.mjs).
#   Why:  catches any drift between the template and package.json (files, dependencies,
#         ...) before anything is published.
#
# - publish-npmjs
#   What: publishes the verified tarball to npm, with provenance.
#   Why:  the only job with `id-token: write`; it runs no repository or dependency code.
#
# - publish-soldeer (release only)
#   What: publishes library-solidity/ to Soldeer, filtered by .soldeerignore.
#   Why:  runs only after npm succeeded, so the two registries never diverge.
#
# ------------------------------------------------------------------------------

jobs:
  # I. Pack
  # Builds the tarball from a clean checkout, without `npm ci`: the package only ships
  # Solidity sources, so no dependency code runs before it is packed.
  pack:
    name: library-solidity-publish/pack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./library-solidity
    permissions:
      contents: "read" # Required to checkout repository code
    steps:
      # ------------------------------------------------------------------------
      # 1. Checkout
      #    Pinned to a full commit SHA (not a mutable tag) to prevent supply
      #    chain attacks. persist-credentials: false removes the Git token from
      #    the local config so subsequent steps can't accidentally leak it.
      # ------------------------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: "false"

      # ------------------------------------------------------------------------
      # 2. Node.js setup
      #    Provides npm, for `npm pack`. Same patched Node 22 as the other
      #    library-solidity workflows.
      # ------------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ">=22.23.4 <23"

      # ------------------------------------------------------------------------
      # 3. Safe-chain
      # ------------------------------------------------------------------------
      - name: Install safe-chain
        shell: bash
        run: |
          # safe-chain v1.5.3 is distributed as an immutable GitHub release asset —
          # its content is permanently fixed and cannot be modified after the tag is published.
          # Verify immutability: curl -fsSL https://api.github.com/repos/AikidoSec/safe-chain/releases/tags/1.5.3 | grep immutable
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      # ------------------------------------------------------------------------
      # 4. Copy package sources
      #    - copies the shipped sources (the `files` field of the template
      #      decides what npm packs);
      #    - generates the published package.json from `package.json.publish.template`,
      #      with the version taken from package.json. The template has no
      #      devDependencies, scripts, etc.
      # ------------------------------------------------------------------------
      - name: Stage package
        run: |
          out="$RUNNER_TEMP/package"
          mkdir "$out"
          cp -R lib config README.md LICENSE "$out/"
          jq --arg v "$(jq -r .version package.json)" '.version = $v' \
            package.json.publish.template > "$out/package.json"

      # ------------------------------------------------------------------------
      # 5. Run `npm pack`
      #    Packs the staged package into a tarball, the exact file published by
      #    the `publish-npmjs` job:
      #
      #    - `--ignore-scripts`: no lifecycle script (prepack, prepare, …) runs
      #      while packing;
      #    - renames it to a fixed name (npm names it fhevm-solidity-<version>.tgz),
      #      so the `publish-npmjs` job does not need to know the version.
      # ------------------------------------------------------------------------
      - name: Pack package
        run: |
          mkdir "$RUNNER_TEMP/tarball"
          npm pack "$RUNNER_TEMP/package" --ignore-scripts --pack-destination "$RUNNER_TEMP/tarball"
          mv "$RUNNER_TEMP"/tarball/*.tgz "$RUNNER_TEMP/tarball/package.tgz"

      # ------------------------------------------------------------------------
      # 6. Show tarball content
      #    Logs what will be published: the tarball's files and its package.json,
      #    read from the tarball itself.
      # ------------------------------------------------------------------------
      - name: Show tarball content
        run: |
          tar -tvzf "$RUNNER_TEMP/tarball/package.tgz"
          tar -xzOf "$RUNNER_TEMP/tarball/package.tgz" package/package.json

      # ------------------------------------------------------------------------
      # 7. Check tarball contains only Solidity files
      #    Fails if any file other than package.json, README.md and LICENSE is not
      #    a .sol file.
      #
      #    Steps 7-9 use `shell: bash` (`-eo pipefail`) and read the tarball once
      #    into a variable, never through `tar | grep`: a tar error then fails the
      #    step instead of letting a check pass on empty input.
      # ------------------------------------------------------------------------
      - name: Check tarball contains only Solidity files
        shell: bash
        run: |
          fail() { echo "::error::$1"; exit 1; }
          files="$(tar -tzf "$RUNNER_TEMP/tarball/package.tgz")"
          while IFS= read -r file; do
            case "$file" in
              package/package.json | package/README.md | package/LICENSE) ;;
              *.sol) ;;
              *) fail "not a Solidity file: $file" ;;
            esac
          done <<< "$files"

      # ------------------------------------------------------------------------
      # 8. Check tarball structure
      #    Fails if an entry is not a regular file (symlink, hard link, directory),
      #    or if package.json, README.md, LICENSE or any Solidity file is missing.
      # ------------------------------------------------------------------------
      - name: Check tarball structure
        shell: bash
        run: |
          tarball="$RUNNER_TEMP/tarball/package.tgz"
          fail() { echo "::error::$1"; exit 1; }
          entries="$(tar -tvzf "$tarball")"
          files="$(tar -tzf "$tarball")"
          ! grep -qv '^-' <<< "$entries" || fail "the tarball contains entries that are not regular files"
          grep -qx 'package/package.json' <<< "$files" || fail "package.json is missing"
          grep -qx 'package/README.md' <<< "$files" || fail "README.md is missing"
          grep -qx 'package/LICENSE' <<< "$files" || fail "LICENSE is missing"
          grep -q '\.sol$' <<< "$files" || fail "no Solidity file in the tarball"

      # ------------------------------------------------------------------------
      # 9. Check tarball has no bridge contracts
      #    Fails if lib/bridge/ is published, or if a published file imports
      #    OpenZeppelin (not a dependency of the package).
      # ------------------------------------------------------------------------
      - name: Check tarball has no bridge contracts
        shell: bash
        run: |
          tarball="$RUNNER_TEMP/tarball/package.tgz"
          fail() { echo "::error::$1"; exit 1; }
          files="$(tar -tzf "$tarball")"
          extract="$RUNNER_TEMP/tarball-check"
          mkdir "$extract"
          tar -xzf "$tarball" -C "$extract"
          ! grep -q '^package/lib/bridge/' <<< "$files" || fail "bridge contracts must not be published"
          ! grep -rq --include='*.sol' '@openzeppelin/' "$extract" || fail "a published file imports @openzeppelin"

      # ------------------------------------------------------------------------
      # 10. Upload tarball
      #    Hands the tarball over to the `verify` job, then to the `publish-npmjs`
      #    job, the only job allowed to publish it.
      # ------------------------------------------------------------------------
      - name: Upload tarball
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: library-solidity-package
          path: ${{ runner.temp }}/tarball/package.tgz
          if-no-files-found: error

  # II. Verify
  # Checks the tarball from `pack` against a standard `npm pack` of the checkout
  # (library-solidity/publish/package.test.mjs): same files, byte-identical, and an
  # equivalent package.json. No `npm ci`: the test uses Node built-ins only.
  verify:
    name: library-solidity-publish/verify
    needs: pack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./library-solidity
    permissions:
      contents: "read" # Required to checkout repository code
    steps:
      # ------------------------------------------------------------------------
      # 1. Checkout
      #    Source of the standard `npm pack` and of the test.
      # ------------------------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: "false"

      # ------------------------------------------------------------------------
      # 2. Node.js setup
      #    Provides node (test runner) and npm (standard `npm pack`).
      # ------------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ">=22.23.4 <23"

      # ------------------------------------------------------------------------
      # 3. Safe-chain
      #    Not strictly needed (this job installs no package), kept for consistency
      #    with the other jobs.
      # ------------------------------------------------------------------------
      - name: Install safe-chain
        shell: bash
        run: |
          # safe-chain v1.5.3 is distributed as an immutable GitHub release asset —
          # its content is permanently fixed and cannot be modified after the tag is published.
          # Verify immutability: curl -fsSL https://api.github.com/repos/AikidoSec/safe-chain/releases/tags/1.5.3 | grep immutable
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      # ------------------------------------------------------------------------
      # 4. Download tarball
      #    The tarball built by the `pack` job, the one `publish-npmjs` will publish.
      # ------------------------------------------------------------------------
      - name: Download tarball
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: library-solidity-package
          path: ${{ runner.temp }}/tarball

      # ------------------------------------------------------------------------
      # 5. Compare with a standard npm pack
      #    PUBLISH_TARBALL makes the test check the downloaded tarball instead of
      #    building its own from the template.
      # ------------------------------------------------------------------------
      - name: Compare with a standard npm pack
        env:
          PUBLISH_TARBALL: ${{ runner.temp }}/tarball/package.tgz
        run: node --test 'publish/*.test.mjs'

  # III. Publish npmjs
  # Publishes the tarball from `pack`, once `verify` has passed. No checkout and no
  # `npm ci`: the only job with `id-token: write` runs no repository or dependency code.
  publish-npmjs:
    name: library-solidity-publish/publish-npmjs
    needs: [pack, verify]
    runs-on: ubuntu-latest
    permissions:
      id-token: "write" # Required for OIDC authentication
    steps:
      # ------------------------------------------------------------------------
      # 1. Node.js setup
      #    Provides npm. No checkout: this job runs no repository code.
      # ------------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ">=22.23.4 <23"

      # ------------------------------------------------------------------------
      # 2. Update npm
      #    Trusted publishing (OIDC) requires npm >= 11.5.1.
      # ------------------------------------------------------------------------
      - name: Update npm # required by trusted publishing
        run: npm install -g npm@11.7.0

      # ------------------------------------------------------------------------
      # 3. Download tarball
      #    The tarball built and checked by the `pack` job.
      # ------------------------------------------------------------------------
      - name: Download tarball
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: library-solidity-package
          path: ${{ runner.temp }}/tarball

      # ------------------------------------------------------------------------
      # 4. Publish to npm
      #    Publishes the tarball as is, with provenance. Prerelease builds get the
      #    `prerelease` dist-tag, releases get `latest`. dry-run publishes nothing.
      # ------------------------------------------------------------------------
      - name: Publish prerelease to npm
        if: ${{ !inputs.release }}
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: ${{ runner.temp }}/tarball/package.tgz
          tag: prerelease
          provenance: true
          access: public
          dry-run: ${{ inputs.dry-run }}

      - name: Publish release to npm
        if: ${{ inputs.release }}
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: ${{ runner.temp }}/tarball/package.tgz
          provenance: true
          access: public
          dry-run: ${{ inputs.dry-run }}

  # IV. Publish Soldeer
  # Publishes to Soldeer only once `pack` (checks) and `publish-npmjs` (npm) have
  # succeeded, so the two registries never diverge on a failed run.
  publish-soldeer:
    name: library-solidity-publish/publish-soldeer
    # Skipped if `pack` (tarball checks) or `publish-npmjs` (npm) fails: the `if`
    # below has no status function, so GitHub implicitly adds `success()`.
    needs: [pack, publish-npmjs]
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./library-solidity
    permissions:
      contents: "read"
    steps:
      # ------------------------------------------------------------------------
      # 1. Checkout
      #    Pinned to a full commit SHA. persist-credentials: false removes the Git
      #    token from the local config.
      # ------------------------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: "false"

      # ------------------------------------------------------------------------
      # 2. Node.js setup
      #    Only used to read the version from package.json.
      # ------------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ">=22.23.4 <23"

      # ------------------------------------------------------------------------
      # 3. Safe-chain
      # ------------------------------------------------------------------------
      - name: Install safe-chain
        shell: bash
        run: |
          # safe-chain v1.5.3 is distributed as an immutable GitHub release asset —
          # its content is permanently fixed and cannot be modified after the tag is published.
          # Verify immutability: curl -fsSL https://api.github.com/repos/AikidoSec/safe-chain/releases/tags/1.5.3 | grep immutable
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      # ------------------------------------------------------------------------
      # 4. Install Foundry
      #    Provides `forge soldeer`, used to publish to the Soldeer registry.
      # ------------------------------------------------------------------------
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0

      # ------------------------------------------------------------------------
      # 5. Read version
      #    The Soldeer version is the npm version, taken from package.json.
      # ------------------------------------------------------------------------
      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------------
      # 6. Publish to Soldeer
      #    Pushes library-solidity/ as @fhevm-solidity~<version>. What is
      #    published is decided by .soldeerignore, not by the npm `files` field.
      #    dry-run publishes nothing.
      # ------------------------------------------------------------------------
      - name: Publish to Soldeer
        env:
          SOLDEER_API_TOKEN: ${{ secrets.SOLDEER_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            forge soldeer push "@fhevm-solidity~${VERSION}" . --skip-warnings --dry-run
          else
            forge soldeer push "@fhevm-solidity~${VERSION}" . --skip-warnings
          fi
