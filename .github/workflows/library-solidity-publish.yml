name: library-solidity-publish

on:
  release:
    types:
      - published

# No permissions at the workflow level — each job declares only what it needs.
permissions: {}

jobs:
  publish:
    name: library-solidity-publish/publish
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    defaults:
      run:
        working-directory: ./library-solidity
    permissions:
      contents: "read" # Required to checkout repository code
      id-token: "write" # Required for OIDC / npm provenance attestation
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      dist_tag: ${{ steps.release_meta.outputs.dist_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '>=22.23.4 <23'

      - name: Install safe-chain
        shell: bash
        run: |
          # safe-chain v1.5.3 is distributed as an immutable GitHub release asset —
          # its content is permanently fixed and cannot be modified after the tag is published.
          # Verify immutability: curl -fsSL https://api.github.com/repos/AikidoSec/safe-chain/releases/tags/1.5.3 | grep immutable
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      - name: Update npm # required by trusted publishing
        run: npm install -g npm@11.7.0

      # -----------------------------------------------------------------------
      # Resolve release metadata (version + dist-tag) from the tag
      #   vX.Y.Z    → official release   → npm dist-tag "next"
      #   vX.Y.Z-A  → release candidate  → npm dist-tag "alpha"
      # Official releases publish under "next" so the "latest" dist-tag is
      # never moved automatically — promotion to "latest" is done manually
      # with `npm dist-tag add @fhevm/solidity@X.Y.Z latest` once the release
      # has been validated.
      # The version is derived from the tag (strip leading "v") and
      # library-solidity/package.json is patched in place so both the npm
      # publish and the Soldeer push below ship the same version.
      # -----------------------------------------------------------------------
      - name: Resolve release metadata
        id: release_meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            dist_tag="next"
          elif [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            dist_tag="alpha"
          else
            echo "::error::Tag '${RELEASE_TAG}' does not match vX.Y.Z (official) or vX.Y.Z-A (RC)."
            exit 1
          fi
          echo "Release tag ${RELEASE_TAG} -> version=${version}, dist-tag=${dist_tag}"
          npm pkg set version="${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Compile library
        run: npm run compile

      - name: Publish to npm
        uses: JS-DevTools/npm-publish@7f8fe47b3bea1be0c3aec2b717c5ec1f3e03410b # v4.1.1
        with:
          package: ./library-solidity/package.json
          tag: ${{ steps.release_meta.outputs.dist_tag }}
          provenance: true
          access: public

  publish-soldeer:
    name: library-solidity-publish/publish-soldeer
    needs: publish
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    defaults:
      run:
        working-directory: ./library-solidity
    permissions:
      contents: "read"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '>=22.23.4 <23'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0

      - name: Publish to Soldeer
        env:
          SOLDEER_API_TOKEN: ${{ secrets.SOLDEER_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: forge soldeer push "@fhevm-solidity~${VERSION}" . --skip-warnings
