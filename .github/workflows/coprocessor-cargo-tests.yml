name: coprocessor-cargo-test

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-changes:
    name: coprocessor-cargo-test/check-changes
    permissions:
      actions: 'read' # Required to read workflow run information
      contents: 'read' # Required to checkout repository code
      pull-requests: 'read' # Required to read pull request information
    runs-on: ubuntu-latest
    outputs:
      changes-rust-files: ${{ steps.filter.outputs.rust-files }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: filter
        with:
          filters: |
            rust-files:
              - .github/workflows/coprocessor-cargo-tests.yml
              - coprocessor/fhevm-engine/**
              - coprocessor/proto/**
              - host-contracts/rust_bindings/**
  cargo-tests:
    name: coprocessor-cargo-test/${{ matrix.service }}
    needs: check-changes
    if: ${{ needs.check-changes.outputs.changes-rust-files == 'true' }}
    permissions:
      contents: 'read' # Required to checkout repository code
      checks: 'write' # Required to create GitHub checks for test results
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Split across four machines because this job is by far the slowest.
          - service: tfhe-worker-1
            use_nextest: true
            package: tfhe-worker
            needs_localstack: false
            needs_foundry: false
            needs_postgres: true
            shard: 1
            shards: 4
            runner: runs-on=${{ github.run_id }}/runner=16cpu-linux-x64
          - service: tfhe-worker-2
            use_nextest: true
            package: tfhe-worker
            needs_localstack: false
            needs_foundry: false
            needs_postgres: true
            shard: 2
            shards: 4
            runner: runs-on=${{ github.run_id }}/runner=16cpu-linux-x64
          - service: tfhe-worker-3
            use_nextest: true
            package: tfhe-worker
            needs_localstack: false
            needs_foundry: false
            needs_postgres: true
            shard: 3
            shards: 4
            runner: runs-on=${{ github.run_id }}/runner=16cpu-linux-x64
          - service: tfhe-worker-4
            use_nextest: true
            package: tfhe-worker
            needs_localstack: false
            needs_foundry: false
            needs_postgres: true
            shard: 4
            shards: 4
            runner: runs-on=${{ github.run_id }}/runner=16cpu-linux-x64
          - service: sns-worker
            package: sns-worker
            needs_localstack: true
            needs_foundry: false
            runner: runs-on=${{ github.run_id }}/runner=16cpu-linux-x64
          - service: zkproof-worker
            package: zkproof-worker
            needs_localstack: false
            needs_foundry: false
            runner: runs-on=${{ github.run_id }}/runner=16cpu-linux-x64
          - service: transaction-sender
            package: transaction-sender
            needs_localstack: true
            needs_foundry: true
            runner: runs-on=${{ github.run_id }}/runner=16cpu-linux-x64
          - service: gw-listener
            package: gw-listener
            needs_localstack: false
            needs_foundry: true
            runner: runs-on=${{ github.run_id }}/runner=16cpu-linux-x64
          - service: host-listener
            package: host-listener
            needs_localstack: false
            needs_foundry: true
            # Larger disk: coverage build of host-listener plus the restored cargo
            # cache exceeds the default runner disk.
            runner: runs-on=${{ github.run_id }}/runner=16cpu-linux-x64/volume=80gb
          - service: common
            package: fhevm-engine-common
            needs_localstack: false
            needs_foundry: false
            runner: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: 'false'
        lfs: true

    - name: Checkout LFS objects
      run: git lfs checkout

    - name: Setup Rust
      uses: ./.github/actions/setup_rust
      with:
        toolchain-dir: coprocessor/fhevm-engine

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@a37010ded18ff788be4440302bd6830b1ae50d8b # v2.68.25
      with:
        tool: cargo-llvm-cov

    - name: Install cargo-nextest
      if: ${{ matrix.use_nextest }}
      uses: taiki-e/install-action@a37010ded18ff788be4440302bd6830b1ae50d8b # v2.68.25
      with:
        tool: cargo-nextest

    - name: Install cargo dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler mold clang
    - name: Install foundry
      if: ${{ matrix.needs_foundry }}
      uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c

    - name: Cache cargo
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-coverage-${{ matrix.service }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-coverage-${{ matrix.service }}-

    - name: Use Node.js
      uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
      with:
        node-version: 20.x

    - name: Start localstack
      if: ${{ matrix.needs_localstack }}
      run: docker run --rm -d -p 4566:4566 --name localstack localstack/localstack:4.14.0

    # Shared by every test in the job, so the FHE keys are imported once, not per test.
    - name: Start postgres
      if: ${{ matrix.needs_postgres }}
      run: |
        docker run --rm -d -p 5432:5432 --name postgres \
          -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
          postgres:15.7
        for _ in $(seq 1 30); do
          if docker exec postgres pg_isready -U postgres >/dev/null 2>&1; then
            echo "postgres ready"; exit 0
          fi
          sleep 2
        done
        echo "postgres did not become ready"; exit 1

    - name: Run tests with coverage
      if: ${{ !matrix.use_nextest }}
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coprocessor
        SQLX_OFFLINE: 'true'
        TEST_GLOBAL_LOCALSTACK: ${{ matrix.needs_localstack && '1' || '0' }}
        TEST_PACKAGE: ${{ matrix.package }}
        IS_MERGE_QUEUE: ${{ startsWith(github.head_ref, 'mergify/merge-queue/') && '1' || '0' }}
      run: |
        # Merge queue: leave unset so supported_types() defaults to full matrix.
        # PR CI: run only small types (bool through 64-bit) for faster feedback.
        if [ "$IS_MERGE_QUEUE" != "1" ]; then
          export TFHE_WORKER_EVENT_TYPE_MATRIX=local
        fi
        cargo llvm-cov clean --workspace --profile coverage
        cargo llvm-cov test -p "$TEST_PACKAGE" --profile coverage
      working-directory: coprocessor/fhevm-engine

    - name: Run tests with coverage (sharded)
      if: ${{ matrix.use_nextest }}
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coprocessor
        SQLX_OFFLINE: 'true'
        TEST_PACKAGE: ${{ matrix.package }}
        IS_MERGE_QUEUE: ${{ startsWith(github.head_ref, 'mergify/merge-queue/') && '1' || '0' }}
        SHARD: ${{ matrix.shard }}
        SHARDS: ${{ matrix.shards }}
        COPROCESSOR_TEST_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      run: |
        set -euo pipefail
        NEXTEST_FILTER='all()'
        if [ "$IS_MERGE_QUEUE" != "1" ]; then
          export TFHE_WORKER_EVENT_TYPE_MATRIX=local
          NEXTEST_FILTER='not test(/_(u128|u160|u256|u512|u1024|u2048)$/)'
        fi
        echo "$NEXTEST_FILTER" > /tmp/nextest-filter
        cargo llvm-cov clean --workspace --profile coverage
        # `--profile` is ambiguous here, so the nextest profile goes in the env var.
        NEXTEST_PROFILE=ci cargo llvm-cov nextest -p "$TEST_PACKAGE" --profile coverage \
          --partition "count:${SHARD}/${SHARDS}" \
          -E "$NEXTEST_FILTER"
      working-directory: coprocessor/fhevm-engine

    - name: Export LCOV coverage data
      if: ${{ !cancelled() }}
      run: cargo llvm-cov report --lcov --profile coverage --output-path /tmp/lcov.info || true
      working-directory: coprocessor/fhevm-engine

    # What the shard totals are checked against below.
    - name: Record expected test count
      if: ${{ !cancelled() && matrix.use_nextest }}
      env:
        SQLX_OFFLINE: 'true'
        TEST_PACKAGE: ${{ matrix.package }}
      run: |
        set -euo pipefail
        # Same filter the run step used, so the two cannot drift apart.
        NEXTEST_FILTER="$(cat /tmp/nextest-filter)"
        mkdir -p target/nextest/ci
        cargo nextest list -p "$TEST_PACKAGE" --cargo-profile coverage \
          -E "$NEXTEST_FILTER" --message-format json \
          | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for s in d["rust-suites"].values() for c in s["testcases"].values() if c["filter-match"]["status"] == "matches"))' \
          > target/nextest/ci/expected-count.txt
        echo "filter selects $(cat target/nextest/ci/expected-count.txt) tests in total"
      working-directory: coprocessor/fhevm-engine

    # Read by the shard-coverage job below.
    - name: Upload test report
      if: ${{ !cancelled() && matrix.use_nextest }}
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: junit-${{ matrix.service }}
        path: |
          coprocessor/fhevm-engine/target/nextest/ci/junit.xml
          coprocessor/fhevm-engine/target/nextest/ci/expected-count.txt
        retention-days: 1
        if-no-files-found: ignore

    - name: Upload coverage artifact
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: lcov-${{ matrix.service }}
        path: /tmp/lcov.info
        retention-days: 1
        if-no-files-found: ignore

  coverage-report:
    name: coprocessor-cargo-test/coverage-report
    needs: [check-changes, cargo-tests]
    if: ${{ !cancelled() && needs.check-changes.outputs.changes-rust-files == 'true' }}
    permissions:
      contents: 'read' # Required to checkout repository code
      pull-requests: 'write' # Required to post coverage comment on PR
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: 'false'

    - name: Install lcov
      run: sudo apt-get update && sudo apt-get install -y lcov

    - name: Download all coverage artifacts
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        pattern: lcov-*
        path: /tmp/coverage

    - name: Merge LCOV files
      run: |
        LCOV_FILES=$(find /tmp/coverage -name 'lcov.info' -size +0c)
        if [ -z "$LCOV_FILES" ]; then
          echo "No coverage data found"
          exit 0
        fi
        LCOV_ARGS=()
        for f in $LCOV_FILES; do
          LCOV_ARGS+=(-a "$f")
        done
        lcov "${LCOV_ARGS[@]}" -o /tmp/lcov.info

    - name: Generate coverage summary
      if: ${{ !cancelled() }}
      run: |
        {
          echo '## Coverage: coprocessor/fhevm-engine'
          if [ -f /tmp/lcov.info ]; then
            echo '```'
            lcov --summary /tmp/lcov.info 2>&1 || true
            echo '```'
          else
            echo '*No coverage data available (tests may have failed before producing profiling data).*'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Install safe-chain
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        # safe-chain v1.5.3 is distributed as an immutable GitHub release asset —
        # its content is permanently fixed and cannot be modified after the tag is published.
        # Verify immutability: curl -fsSL https://api.github.com/repos/AikidoSec/safe-chain/releases/tags/1.5.3 | grep immutable
        curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

    - name: Diff coverage of changed lines
      if: ${{ !cancelled() }}
      id: diff-cov
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ ! -f /tmp/lcov.info ]; then
          echo "diff_pct=N/A" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        pip install --quiet diff-cover
        diff-cover /tmp/lcov.info \
          --compare-branch="origin/${BASE_REF}" \
          --diff-range-notation='...' \
          --format "json:/tmp/diff-cover.json,markdown:/tmp/diff-cover-report.md" \
          --fail-under 0 || true
        if [ -f /tmp/diff-cover.json ]; then
          DIFF_PCT=$(python3 -c "import json; d=json.load(open('/tmp/diff-cover.json')); n=d.get('total_num_lines',0); print('N/A') if n==0 else print(f\"{d['total_percent_covered']:.1f}%\")" 2>/dev/null || echo "N/A")
        else
          DIFF_PCT="N/A"
        fi
        echo "diff_pct=${DIFF_PCT}" >> "$GITHUB_OUTPUT"

    - name: Build diff coverage comment
      if: ${{ !cancelled() }}
      env:
        DIFF_PCT: ${{ steps.diff-cov.outputs.diff_pct }}
      run: |
        {
          echo '### Coprocessor Changed Lines Coverage'
          echo "Coverage of added/modified lines in \`coprocessor\`: **${DIFF_PCT}**"
          echo ''
          if [ -f /tmp/diff-cover-report.md ]; then
            echo '<details><summary>Per-file breakdown</summary>'
            echo ''
            cat /tmp/diff-cover-report.md
            echo ''
            echo '</details>'
          fi
        } | tee -a "$GITHUB_STEP_SUMMARY" > /tmp/coverage-comment.md

    - name: Post coverage comment on PR
      if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && steps.diff-cov.outputs.diff_pct != 'N/A' }}
      uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
      with:
        path: /tmp/coverage-comment.md

  # A test dropped by the split would leave every shard green, so verify none was.
  shard-coverage:
    name: coprocessor-cargo-test/shard-coverage
    needs: [check-changes, cargo-tests]
    if: ${{ !cancelled() && needs.check-changes.outputs.changes-rust-files == 'true' }}
    permissions: {}
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    steps:
    - name: Download test reports
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        pattern: junit-*
        path: /tmp/reports

    - name: Every test ran in exactly one shard
      run: |
        python3 - <<'PY'
        import glob, sys, xml.etree.ElementTree as ET
        from collections import Counter

        seen = Counter()
        files = sorted(glob.glob("/tmp/reports/**/junit.xml", recursive=True))
        if not files:
            sys.exit("no test reports found; cannot verify shard coverage")
        for path in files:
            for case in ET.parse(path).getroot().iter("testcase"):
                seen[f"{case.get('classname')}::{case.get('name')}"] += 1

        duplicated = sorted(name for name, count in seen.items() if count > 1)
        print(f"{len(files)} shard reports, {len(seen)} distinct tests")
        if duplicated:
            print("tests that ran in more than one shard:")
            for name in duplicated:
                print(f"  {name}")
            sys.exit(1)
        print("no test ran twice")
        PY

    - name: No test was skipped by the split
      run: |
        python3 - <<'PY'
        import glob, sys, xml.etree.ElementTree as ET

        counts = {p: int(open(p).read().strip())
                  for p in glob.glob("/tmp/reports/**/expected-count.txt", recursive=True)}
        if not counts:
            sys.exit("no expected-count.txt found; cannot verify shard coverage")
        if len(set(counts.values())) != 1:
            sys.exit(f"shards disagree on how many tests exist: {counts}")
        expected = next(iter(counts.values()))

        ran = sum(len(list(ET.parse(p).getroot().iter("testcase")))
                  for p in glob.glob("/tmp/reports/**/junit.xml", recursive=True))

        print(f"tests selected by the filter: {expected}")
        print(f"tests the shards actually ran: {ran}")
        if ran != expected:
            sys.exit(f"{expected - ran} test(s) ran in no shard at all")
        print("every selected test ran")
        PY

  cargo-tests-status:
    name: coprocessor-cargo-test/cargo-tests (bpr)
    needs: [check-changes, cargo-tests, coverage-report, shard-coverage]
    if: ${{ always() }}
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    env:
      CHECK_CHANGES_RESULT: ${{ needs.check-changes.result }}
      CARGO_TESTS_RESULT: ${{ needs.cargo-tests.result }}
      COVERAGE_RESULT: ${{ needs.coverage-report.result }}
      SHARD_COVERAGE_RESULT: ${{ needs.shard-coverage.result }}
    steps:
    - name: Check results
      run: |
        if [ "$CHECK_CHANGES_RESULT" = "failure" ] || \
           [ "$CHECK_CHANGES_RESULT" = "cancelled" ] || \
           [ "$CARGO_TESTS_RESULT" = "failure" ] || \
           [ "$CARGO_TESTS_RESULT" = "cancelled" ] || \
           [ "$COVERAGE_RESULT" = "failure" ] || \
           [ "$COVERAGE_RESULT" = "cancelled" ] || \
           [ "$SHARD_COVERAGE_RESULT" = "failure" ] || \
           [ "$SHARD_COVERAGE_RESULT" = "cancelled" ]; then
          echo "One or more jobs failed or were cancelled"
          exit 1
        fi
        echo "All jobs passed or were skipped"
