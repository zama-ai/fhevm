# Preview-env only: build the GCS fleet from Dockerfile.workspace with
# BUILD_STACK_VERSION so compiled STACK_VERSION is newer than BCS.
# common-docker.yml has no extra build-arg input, so this cannot reuse it.
name: coprocessor-gcs-docker-build

on:
  workflow_call:
    inputs:
      build_stack_version:
        description: "Compiled STACK_VERSION for the GCS fleet"
        type: string
        required: false
        default: "0.15.0"
    secrets:
      AWS_ACCESS_KEY_S3_USER:
        required: true
      AWS_SECRET_KEY_S3_USER:
        required: true
      BLOCKCHAIN_ACTIONS_TOKEN:
        required: true
      GHCR_READ_TOKEN:
        required: true
      CGR_USERNAME:
        required: true
      CGR_PASSWORD:
        required: true
    outputs:
      image_tag:
        description: "Tag pushed for every GCS image (short SHA + -gcs)"
        value: ${{ jobs.build.outputs.image_tag }}

permissions: {}

jobs:
  build:
    name: build/coprocessor-gcs
    runs-on: "runs-on=${{ github.run_id }}/runner=16cpu-linux-x64/extras=s3-cache"
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          token: ${{ secrets.BLOCKCHAIN_ACTIONS_TOKEN }}
          submodules: true

      - name: Set image tag
        id: tag
        env:
          COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short=$(git rev-parse --short "${COMMIT_HASH}")
          echo "tag=${short}-gcs" >> "$GITHUB_OUTPUT"

      - name: Read rust toolchain
        run: |
          version=$(grep 'channel' coprocessor/fhevm-engine/rust-toolchain.toml | awk -F' = ' '{print $2}' | tr -d '"')
          echo "RUST_IMAGE_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver-opts: image=moby/buildkit:v0.25.1
          platforms: linux/amd64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Chainguard Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: cgr.dev
          username: ${{ secrets.CGR_USERNAME }}
          password: ${{ secrets.CGR_PASSWORD }}

      - name: Build and push GCS images
        uses: docker/bake-action@v6
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BUILD_STACK_VERSION: ${{ inputs.build_stack_version }}
          RUST_IMAGE_VERSION: ${{ env.RUST_IMAGE_VERSION }}
        with:
          files: ci/preview-env/coprocessor/docker-bake.gcs.hcl
          push: true
          set: |
            *.platform=linux/amd64
