# This workflow verifies that:
# - Dependency licenses compliance
# - Sources and codegen templates are formatted with prettier
name: library-solidity-integrity-checks

on:
  pull_request:

permissions: {}

concurrency:
  group: library-solidity-integrity-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-changes:
    name: library-solidity-integrity-checks/check-changes
    permissions:
      contents: 'read' # Required to checkout repository code
    runs-on: ubuntu-latest
    outputs:
      changes-library-solidity: ${{ steps.filter.outputs.library-solidity }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: filter
        with:
          filters: |
            library-solidity:
              - .github/workflows/library-solidity-integrity-checks.yml
              - library-solidity/**
              - ci/check_spdx_licenses.sh

  contract-integrity-checks:
    name: library-solidity-integrity-checks/contract-integrity-checks (bpr)
    needs: check-changes
    if: ${{ needs.check-changes.outputs.changes-library-solidity == 'true' }}
    permissions:
      contents: 'read' # Required to checkout repository code
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'

      - name: Use Node.js 20.x
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: 20.x

      - name: Cache npm
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install safe-chain
        shell: bash
        run: |
          # safe-chain v1.5.3 is distributed as an immutable GitHub release asset —
          # its content is permanently fixed and cannot be modified after the tag is published.
          # Verify immutability: curl -fsSL https://api.github.com/repos/AikidoSec/safe-chain/releases/tags/1.5.3 | grep immutable
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        working-directory: library-solidity
        run: npm ci --include=optional

      - name: Check formatting
        working-directory: library-solidity
        run: npm run prettier:check

      - name: Check SPDX license headers
        working-directory: library-solidity
        run: make check-spdx-headers
