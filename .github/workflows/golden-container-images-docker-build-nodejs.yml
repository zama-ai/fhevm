name: golden-container-images-docker-build-nodejs

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push the image to the registry'
        default: false
        required: true
        type: boolean
  pull_request:

permissions: {}

concurrency:
  group: golden-nodejs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-changes:
    name: golden-container-images-docker-build-nodejs/check-changes
    permissions:
      actions: 'read' # Required to read workflow run information
      contents: 'read' # Required to checkout repository code
      pull-requests: 'read' # Required to read pull request information
    runs-on: ubuntu-latest
    outputs:
      changes-golden-nodejs: ${{ steps.filter.outputs.golden-nodejs }}
      node-version: ${{ steps.node-version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            golden-nodejs:
              - '.github/workflows/golden-container-images-docker-build-nodejs.yml'
              - 'golden-container-images/nodejs/**'
      - name: Read Node image version
        id: node-version
        shell: bash
        run: |
          version="$(sed -n 's/^ARG NODE_VERSION=//p' golden-container-images/nodejs/Dockerfile)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected one NODE_VERSION=x.y.z argument in the Node Dockerfile" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: golden-container-images-docker-build-nodejs/build
    needs: check-changes
    if: ${{ needs.check-changes.outputs.changes-golden-nodejs == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: zama-ai/ci-templates/.github/workflows/common-docker.yml@cc49b4b7f41819757c6b3999c9cadb8e27be8ab3 # v1.0.11
    secrets:
      AWS_ACCESS_KEY_S3_USER: ${{ secrets.AWS_ACCESS_KEY_S3_USER }}
      AWS_SECRET_KEY_S3_USER: ${{ secrets.AWS_SECRET_KEY_S3_USER }}
      BLOCKCHAIN_ACTIONS_TOKEN: ${{ secrets.BLOCKCHAIN_ACTIONS_TOKEN }}
      CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
      CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}
    permissions:
      actions: 'read' # Required to read workflow run information
      contents: 'read' # Required to checkout repository code
      pull-requests: 'read' # Required to read pull request information
      attestations: 'write' # Required to create build attestations
      packages: 'write' # Required to publish Docker images
      id-token: 'write' # Required for OIDC authentication
    with:
      use-cgr-secrets: true
      working-directory: "."
      push_image: ${{ github.event_name == 'workflow_dispatch' && inputs.push_image }}
      image-name: "fhevm/gci/nodejs"
      image-tag: ${{ needs.check-changes.outputs.node-version }}
      docker-file: "./golden-container-images/nodejs/Dockerfile"
      app-cache-dir: "fhevm-golden-nodejs"
