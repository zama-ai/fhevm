name: golden-container-images-docker-build-nodejs

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push the image to the registry'
        default: false
        required: true
        type: boolean
      tag:
        description: 'Tag to use for the image'
        default: 'latest'
        required: true
        type: string
  pull_request:

permissions: {}

concurrency:
  group: golden-nodejs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-changes:
    name: golden-container-images-docker-build-nodejs/check-changes
    permissions:
      actions: 'read' # Required to read workflow run information
      contents: 'read' # Required to checkout repository code
      pull-requests: 'read' # Required to read pull request information
    runs-on: ubuntu-latest
    outputs:
      changes-golden-nodejs: ${{ steps.filter.outputs.golden-nodejs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            golden-nodejs:
              - '.github/workflows/golden-container-images-docker-build-nodejs.yml'
              - 'golden-container-images/nodejs/**'
  build:
    name: golden-container-images-docker-build-nodejs/build
    needs: check-changes
    if: ${{ needs.check-changes.outputs.changes-golden-nodejs == 'true' || github.event_name == 'release' }}
    uses: zama-ai/ci-templates/.github/workflows/common-docker.yml@cc49b4b7f41819757c6b3999c9cadb8e27be8ab3 # v1.0.11
    secrets:
      AWS_ACCESS_KEY_S3_USER: ${{ secrets.AWS_ACCESS_KEY_S3_USER }}
      AWS_SECRET_KEY_S3_USER: ${{ secrets.AWS_SECRET_KEY_S3_USER }}
      BLOCKCHAIN_ACTIONS_TOKEN: ${{ secrets.BLOCKCHAIN_ACTIONS_TOKEN }}
    permissions:
      actions: 'read' # Required to read workflow run information
      contents: 'read' # Required to checkout repository code
      pull-requests: 'read' # Required to read pull request information
      attestations: 'write' # Required to create build attestations
      packages: 'write' # Required to publish Docker images
      id-token: 'write' # Required for OIDC authentication
    with:
      working-directory: "."
      push_image: true
      image-name: "fhevm/gci/nodejs"
      docker-file: "./golden-container-images/nodejs/Dockerfile"
      app-cache-dir: "fhevm-golden-nodejs"

  build-arm64:
    name: golden-container-images-docker-build-nodejs/build-arm64
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: 'read' # Required to checkout the image source
      packages: 'write' # Required to publish ARM64 and the combined manifest
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify ARM64 image
        run: |
          docker build --platform linux/arm64 --target prod \
            --tag "${IMAGE}-arm64-prod" \
            --file golden-container-images/nodejs/Dockerfile .
          docker run --rm --network none --entrypoint /bin/bash "${IMAGE}-arm64-prod" -c \
            'set -e; node --version; test "$(node -p process.arch)" = arm64; npm --version; bash --version; kubectl version --client; id'
      - name: Publish combined image
        run: |
          docker push "${IMAGE}-arm64-prod"
          docker buildx imagetools create --tag "$IMAGE" \
            "${IMAGE}-amd64-prod" "${IMAGE}-arm64-prod"
          docker buildx imagetools inspect "$IMAGE"
