name: test-suite-e2e-nightly

# Nightly run of the long-running e2e scenarios that are too slow to gate the merge
# queue. Each leg calls the reusable e2e workflow against the newest published main
# bundle (`latest-main`), so a run validates whatever main shipped last.
#
# Scheduled workflows only fire from the default branch. Use the manual dispatch to
# run it on demand.

on:
  schedule:
    # Every night at 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

# One scheduled nightly at a time, never cancelled once in flight. Each manual dispatch
# gets its own group, so it is never replaced while it waits behind another run.
concurrency:
  group: test-suite-e2e-nightly-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'schedule' }}
  cancel-in-progress: false

jobs:
  # RFC-021 blue-green upgrade (2-of-3 operators, two host chains).
  blue-green:
    uses: ./.github/workflows/test-suite-e2e-tests.yml
    permissions:
      contents: 'read' # Required to checkout repository code
      id-token: 'write' # Required for OIDC authentication
      packages: 'read' # Required to read GitHub packages/container registry
    secrets:
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
      CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}
    with:
      orchestrated: false
      build: false
      scenario: blue-green-two-of-three-multi-chain
      test-profile: blue-green

  # Scheduled runs fail silently for most people, so post failures to the #ci-alerts
  # Slack channel. Only runs on main alert: a dispatch from a work-in-progress branch
  # or a run cancelled by hand stays quiet.
  notify-failure:
    needs: [blue-green]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SLACK_CI_ALERTS_WEBHOOK: ${{ secrets.SLACK_CI_ALERTS_WEBHOOK }}
      # Keep in sync with the legs above.
      SCENARIO_DESC: >-
        blue-green-two-of-three-multi-chain - Blue-Green upgrade from v0.14.2 (Blue) to main
        (Green), 3 operators with threshold 2, two host chains, failed-then-successful cutover.
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post to the ci-alerts Slack channel
        run: |
          set -euo pipefail
          # GITHUB_SHA is the head of main at run time, not always the tested revision: Green
          # is built from it, but the other images come from the latest-main bundle, which
          # can lag main. Say so in the alert, so triage does not blame the wrong commit.
          text="@coprocessor-team Nightly e2e failed (${GITHUB_EVENT_NAME}): ${RUN_URL}
          Scenario: ${SCENARIO_DESC}
          main head (Green is built from it): ${GITHUB_SHA:0:9}
          Other images: latest-main bundle, see the 'Resolve stack plan' step in the run log."
          echo "${text}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ -z "${SLACK_CI_ALERTS_WEBHOOK}" ]]; then
            echo "::error::SLACK_CI_ALERTS_WEBHOOK is unset; the failure was not reported"
            exit 1
          fi
          # link_names asks Slack to turn "@coprocessor-team" into a real group mention.
          payload=$(jq -n --arg text "${text}" '{text:$text, link_names:1}')
          curl -fsS -X POST -H 'Content-type: application/json' --data "${payload}" \
            "${SLACK_CI_ALERTS_WEBHOOK}"
