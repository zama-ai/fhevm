# Run hardhat tests
name: protocol-contracts-pauser-set-wrapper-tests

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-protocol-contracts-pauser-set-wrapper-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-changes:
    name: protocol-contracts-pauser-set-wrapper-tests/check-changes
    permissions:
      actions: 'read' # Required to read workflow run information
      contents: 'read' # Required to checkout repository code
      pull-requests: 'read' # Required to read pull request information
    runs-on: ubuntu-latest
    outputs:
      changes-pauser-set-wrapper: ${{ steps.filter.outputs.pauser-set-wrapper }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: filter
        with:
          filters: |
            pauser-set-wrapper:
              - .github/workflows/protocol-contracts-pauser-set-wrapper-tests.yml
              - protocol-contracts/pauserSetWrapper/**
  tests:
    name: protocol-contracts-pauser-set-wrapper-tests/tests (bpr)
    needs: check-changes
    if: ${{ needs.check-changes.outputs.changes-pauser-set-wrapper == 'true' }}
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    permissions:
      contents: 'read' # Required to checkout repository code
    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'

      - name: Setup Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: protocol-contracts/pauserSetWrapper/package-lock.json

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: v1.7.1

      - name: Install safe-chain
        shell: bash
        run: |
          # safe-chain v1.5.3 is distributed as an immutable GitHub release asset —
          # its content is permanently fixed and cannot be modified after the tag is published.
          # Verify immutability: curl -fsSL https://api.github.com/repos/AikidoSec/safe-chain/releases/tags/1.5.3 | grep immutable
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        working-directory: protocol-contracts/pauserSetWrapper
        run: npm ci

      - name: Check contract selectors
        working-directory: protocol-contracts/pauserSetWrapper
        run: make check-selectors

      - name: Run unit tests
        working-directory: protocol-contracts/pauserSetWrapper
        run: make test

      - name: Run coverage
        working-directory: protocol-contracts/pauserSetWrapper
        run: npm run coverage

      - name: Check coverage thresholds (core contracts only)
        working-directory: protocol-contracts/pauserSetWrapper
        run: npm run coverage:check
