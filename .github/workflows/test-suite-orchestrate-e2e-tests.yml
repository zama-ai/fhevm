name: test-suite-orchestrate-e2e-tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - release/*
  workflow_dispatch:
    inputs:
      run-threshold-legs:
        description: "Also run the non-gating threshold-KMS legs (keygen, context-switch, node-swap)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: test-suite-orchestrate-e2e-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  resolve-baseline:
    name: resolve-baseline
    if: &build-trigger-condition |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'mergify/merge-queue/') ||
      startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: 'read' # Required to checkout repository code
      packages: 'read' # Required to list GHCR tags during baseline resolution
    outputs:
      lock-artifact-name: ${{ steps.resolve-baseline.outputs.lock-artifact-name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'

      - id: diff-base
        name: Resolve diff base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            # workflow_dispatch carries no PR payload: baseline against the
            # merge-base with main (the compare API avoids needing git history)
            base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq '.merge_base_commit.sha')"
          fi
          echo "base-sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3

      - name: Install safe-chain
        shell: bash
        run: |
          # safe-chain v1.5.3 is distributed as an immutable GitHub release asset —
          # its content is permanently fixed and cannot be modified after the tag is published.
          # Verify immutability: curl -fsSL https://api.github.com/repos/AikidoSec/safe-chain/releases/tags/1.5.3 | grep immutable
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      - name: Install CLI deps
        working-directory: test-suite/fhevm
        run: bun install --frozen-lockfile

      - id: resolve-baseline
        name: Resolve base-sha baseline lock
        working-directory: test-suite/fhevm
        env:
          BASE_SHA: ${{ steps.diff-base.outputs.base-sha }}
          # Package versions API 403s without read:packages; GITHUB_TOKEN then
          # skips the published-image check and pins unverified missing baselines.
          GH_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          REQUIRE_PUBLISHED_IMAGE_CHECK: "true"
        run: |
          set -euo pipefail
          # Keep resolve diagnostics in the job log; only the last line is the lock path.
          resolve_out="$(./fhevm-cli resolve --target sha --sha "$BASE_SHA" --reset)"
          printf '%s\n' "$resolve_out"
          lock_path="$(printf '%s\n' "$resolve_out" | tail -n 1)"
          artifact_name="fhevm-base-lock-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "lock-path=$lock_path" >> "$GITHUB_OUTPUT"
          echo "lock-artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload baseline lock
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ${{ steps.resolve-baseline.outputs.lock-artifact-name }}
          path: ${{ steps.resolve-baseline.outputs.lock-path }}

  coprocessor-docker-build:
    if: *build-trigger-condition
    uses: ./.github/workflows/coprocessor-docker-build.yml
    with:
      # Empty on workflow_dispatch but dorny/paths-filter falls back to the repo default branch
      path-filter-base-commit: ${{ github.event.pull_request.base.sha }}
    permissions: &docker_permissions
      actions: 'read' # Required to read workflow run information
      contents: 'read' # Required to checkout repository code
      pull-requests: 'read' # Required to read pull request information
      attestations: 'write' # Required to create build attestations
      packages: 'write' # Required to publish Docker images
      id-token: 'write' # Required for OIDC authentication
    secrets: &docker_secrets
      AWS_ACCESS_KEY_S3_USER: ${{ secrets.AWS_ACCESS_KEY_S3_USER }}
      AWS_SECRET_KEY_S3_USER: ${{ secrets.AWS_SECRET_KEY_S3_USER }}
      BLOCKCHAIN_ACTIONS_TOKEN: ${{ secrets.BLOCKCHAIN_ACTIONS_TOKEN }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
      CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}
  listener-docker-build:
    if: *build-trigger-condition
    uses: ./.github/workflows/listener-docker-build.yml
    with:
      path-filter-base-commit: ${{ github.event.pull_request.base.sha }}
    permissions: *docker_permissions
    secrets: *docker_secrets
  gateway-contracts-docker-build:
    if: *build-trigger-condition
    uses: ./.github/workflows/gateway-contracts-docker-build.yml
    with:
      path-filter-base-commit: ${{ github.event.pull_request.base.sha }}
    permissions: *docker_permissions
    secrets: *docker_secrets
  host-contracts-docker-build:
    if: *build-trigger-condition
    uses: ./.github/workflows/host-contracts-docker-build.yml
    with:
      path-filter-base-commit: ${{ github.event.pull_request.base.sha }}
    permissions: *docker_permissions
    secrets: *docker_secrets
  kms-connector-docker-build:
    if: *build-trigger-condition
    uses: ./.github/workflows/kms-connector-docker-build.yml
    with:
      path-filter-base-commit: ${{ github.event.pull_request.base.sha }}
    permissions: *docker_permissions
    secrets: *docker_secrets
  relayer-docker-build:
    if: *build-trigger-condition
    uses: ./.github/workflows/relayer-docker-build.yml
    with:
      path-filter-base-commit: ${{ github.event.pull_request.base.sha }}
    permissions: *docker_permissions
    secrets: *docker_secrets
  test-suite-docker-build:
    if: *build-trigger-condition
    uses: ./.github/workflows/test-suite-docker-build.yml
    with:
      path-filter-base-commit: ${{ github.event.pull_request.base.sha }}
    permissions: *docker_permissions
    secrets: *docker_secrets

  create-e2e-tests-input:
    name: create-e2e-tests-input
    needs:
      - resolve-baseline
      - coprocessor-docker-build
      - listener-docker-build
      - gateway-contracts-docker-build
      - host-contracts-docker-build
      - kms-connector-docker-build
      - relayer-docker-build
      - test-suite-docker-build
    if: |
      needs.resolve-baseline.result == 'success' &&
      (success() || failure()) &&
      (
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.head_ref, 'mergify/merge-queue/') ||
        startsWith(github.base_ref, 'release/')
      )
    # github-script + GHCR wait — a GitHub-hosted runner starts in seconds, while a
    # provisioned runner adds minutes of spin-up variance on the merge-queue
    # critical path for a short job.
    runs-on: ubuntu-latest
    permissions:
      actions: 'read' # Required to download the baseline lock artifact
      contents: 'read' # Required to checkout wait-built-ghcr-tags.cjs
      packages: 'read' # Required to verify lock-selected GHCR tags
    env:
      NEW_COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
      DOCKER_BUILD_RESULTS: ${{ toJSON(needs) }}
      GHCR_USER: ${{ github.actor }}
    outputs:
      coprocessor-db-migration-version: ${{ steps.create-e2e-tests-input.outputs.coprocessor-db-migration-version }}
      coprocessor-gw-listener-version: ${{ steps.create-e2e-tests-input.outputs.coprocessor-gw-listener-version }}
      coprocessor-host-listener-version: ${{ steps.create-e2e-tests-input.outputs.coprocessor-host-listener-version }}
      coprocessor-sns-worker-version: ${{ steps.create-e2e-tests-input.outputs.coprocessor-sns-worker-version }}
      coprocessor-tfhe-worker-version: ${{ steps.create-e2e-tests-input.outputs.coprocessor-tfhe-worker-version }}
      coprocessor-tx-sender-version: ${{ steps.create-e2e-tests-input.outputs.coprocessor-tx-sender-version }}
      coprocessor-zkproof-worker-version: ${{ steps.create-e2e-tests-input.outputs.coprocessor-zkproof-worker-version }}
      coprocessor-consensus-detector-version: ${{ steps.create-e2e-tests-input.outputs.coprocessor-consensus-detector-version }}
      coprocessor-upgrade-controller-version: ${{ steps.create-e2e-tests-input.outputs.coprocessor-upgrade-controller-version }}
      listener-core-version: ${{ steps.create-e2e-tests-input.outputs.listener-core-version }}
      connector-versions: >-
        ${{ format('{{"db-migration":"{0}","gw-listener":"{1}","kms-worker":"{2}","tx-sender":"{3}","endpoint":"{4}"}}',
        steps.create-e2e-tests-input.outputs.connector-db-migration-version,
        steps.create-e2e-tests-input.outputs.connector-gw-listener-version,
        steps.create-e2e-tests-input.outputs.connector-kms-worker-version,
        steps.create-e2e-tests-input.outputs.connector-tx-sender-version,
        steps.create-e2e-tests-input.outputs.connector-endpoint-version) }}
      gateway-version: ${{ steps.create-e2e-tests-input.outputs.gateway-version }}
      host-version: ${{ steps.create-e2e-tests-input.outputs.host-version }}
      kms-core-version: ${{ steps.create-e2e-tests-input.outputs.kms-core-version }}
      lock-artifact-name: ${{ needs.resolve-baseline.outputs.lock-artifact-name }}
      relayer-migrate-version: ${{ steps.create-e2e-tests-input.outputs.relayer-migrate-version }}
      relayer-version: ${{ steps.create-e2e-tests-input.outputs.relayer-version }}
      test-suite-version: ${{ steps.create-e2e-tests-input.outputs.test-suite-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'

      - name: Download frozen baseline lock
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.resolve-baseline.outputs.lock-artifact-name }}
          path: ${{ runner.temp }}/baseline-lock

      - id: create-e2e-tests-input
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v0.8.0
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          LOCK_DIR: ${{ runner.temp }}/baseline-lock
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const waitBuiltGhcrTags = require(`${process.env.GITHUB_WORKSPACE}/ci/preview-env/scripts/wait-built-ghcr-tags.cjs`);
            const { assertLockGhcrTags, selectBaselineGhcrImages } = waitBuiltGhcrTags;
            const headTag = process.env.NEW_COMMIT_HASH.slice(0, 7);
            const buildResults = JSON.parse(process.env.DOCKER_BUILD_RESULTS);
            core.setOutput("kms-core-version", "");
            const mappings = [
              ["coprocessor-docker-build", "db_migration_build_result", "coprocessor-db-migration-version", "fhevm/coprocessor/db-migration", "COPROCESSOR_DB_MIGRATION_VERSION"],
              ["coprocessor-docker-build", "gw_listener_build_result", "coprocessor-gw-listener-version", "fhevm/coprocessor/gw-listener", "COPROCESSOR_GW_LISTENER_VERSION"],
              ["coprocessor-docker-build", "host_listener_build_result", "coprocessor-host-listener-version", "fhevm/coprocessor/host-listener", "COPROCESSOR_HOST_LISTENER_VERSION"],
              ["coprocessor-docker-build", "sns_worker_build_result", "coprocessor-sns-worker-version", "fhevm/coprocessor/sns-worker", "COPROCESSOR_SNS_WORKER_VERSION"],
              ["coprocessor-docker-build", "tfhe_worker_build_result", "coprocessor-tfhe-worker-version", "fhevm/coprocessor/tfhe-worker", "COPROCESSOR_TFHE_WORKER_VERSION"],
              ["coprocessor-docker-build", "tx_sender_build_result", "coprocessor-tx-sender-version", "fhevm/coprocessor/tx-sender", "COPROCESSOR_TX_SENDER_VERSION"],
              ["coprocessor-docker-build", "zkproof_worker_build_result", "coprocessor-zkproof-worker-version", "fhevm/coprocessor/zkproof-worker", "COPROCESSOR_ZKPROOF_WORKER_VERSION"],
              ["coprocessor-docker-build", "consensus_detector_build_result", "coprocessor-consensus-detector-version", "fhevm/coprocessor/consensus-detector", "COPROCESSOR_CONSENSUS_DETECTOR_VERSION"],
              ["coprocessor-docker-build", "upgrade_controller_build_result", "coprocessor-upgrade-controller-version", "fhevm/coprocessor/upgrade-controller", "COPROCESSOR_UPGRADE_CONTROLLER_VERSION"],
              ["listener-docker-build", "build_result", "listener-core-version", "fhevm/listener/listener-core", "LISTENER_CORE_VERSION"],
              ["kms-connector-docker-build", "db_migration_build_result", "connector-db-migration-version", "fhevm/kms-connector/db-migration", "CONNECTOR_DB_MIGRATION_VERSION"],
              ["kms-connector-docker-build", "gw_listener_build_result", "connector-gw-listener-version", "fhevm/kms-connector/gw-listener", "CONNECTOR_GW_LISTENER_VERSION"],
              ["kms-connector-docker-build", "kms_worker_build_result", "connector-kms-worker-version", "fhevm/kms-connector/kms-worker", "CONNECTOR_KMS_WORKER_VERSION"],
              ["kms-connector-docker-build", "tx_sender_build_result", "connector-tx-sender-version", "fhevm/kms-connector/tx-sender", "CONNECTOR_TX_SENDER_VERSION"],
              ["kms-connector-docker-build", "endpoint_build_result", "connector-endpoint-version", "fhevm/kms-connector/endpoint", "CONNECTOR_ENDPOINT_VERSION"],
              ["gateway-contracts-docker-build", "build_result", "gateway-version", "fhevm/gateway-contracts", "GATEWAY_VERSION"],
              ["host-contracts-docker-build", "build_result", "host-version", "fhevm/host-contracts", "HOST_VERSION"],
              ["relayer-docker-build", "relayer_migrate_build_result", "relayer-migrate-version", "fhevm/relayer-migrate", "RELAYER_MIGRATE_VERSION"],
              ["relayer-docker-build", "relayer_build_result", "relayer-version", "fhevm/relayer", "RELAYER_VERSION"],
              ["test-suite-docker-build", "build_result", "test-suite-version", "fhevm/test-suite/e2e", "TEST_SUITE_VERSION"],
            ];

            const lockDir = process.env.LOCK_DIR;
            const lockFile = fs.readdirSync(lockDir).find((name) => name.endsWith(".json"));
            if (!lockFile) {
              throw new Error(`Could not locate downloaded baseline lock in ${lockDir}`);
            }
            const lock = JSON.parse(fs.readFileSync(path.join(lockDir, lockFile), "utf8"));
            if (Array.isArray(lock.sources)) {
              for (const source of lock.sources) {
                core.info(`[baseline-lock] ${source}`);
              }
              const unverified = lock.sources.filter(
                (source) =>
                  source.includes("published-image-check=skipped") ||
                  source.includes("unverified:"),
              );
              if (unverified.length) {
                throw new Error(
                  `baseline lock is unverified; refusing to start e2e:\n` +
                    unverified.map((source) => `  - ${source}`).join("\n"),
                );
              }
            }

            const built = [];
            const skipped = [];
            for (const [job, resultKey, outputName, repo, envKey] of mappings) {
              const result =
                buildResults[job] && buildResults[job].outputs && buildResults[job].outputs[resultKey]
                  ? buildResults[job].outputs[resultKey]
                  : "missing";
              if (result === "success") {
                core.setOutput(outputName, headTag);
                built.push({ repo, tag: headTag });
              } else if (result === "skipped") {
                core.setOutput(outputName, "");
                skipped.push({ envKey, repo });
              } else {
                throw new Error(`Required repo-owned build output failed: ${job}.${resultKey}=${result}`);
              }
            }

            const baseline = selectBaselineGhcrImages({ lockEnv: lock.env || {}, skipped });
            await assertLockGhcrTags({
              core,
              user: process.env.GHCR_USER,
              token: process.env.GHCR_READ_TOKEN,
              images: baseline,
            });
            await waitBuiltGhcrTags({
              core,
              user: process.env.GHCR_USER,
              token: process.env.GHCR_READ_TOKEN,
              images: built,
            });

  # The standard suite is sharded into three parallel legs (compute / decryption /
  # stateful), each booting its own stack — wall-clock is bounded by the slowest
  # shard instead of the full sequential suite. Together the shards run exactly
  # the standard-suite profiles (enforced by a unit test in the fhevm CLI). All
  # three are merge-queue gates in .mergify.yml. This job keeps the historical
  # `run-e2e-tests` id so the `run-e2e-tests / fhevm-e2e-test` check name stays
  # valid while the mergify config transition lands.
  run-e2e-tests:
    needs: [create-e2e-tests-input]
    if: *build-trigger-condition
    uses:
      ./.github/workflows/test-suite-e2e-tests.yml
    permissions: &e2e_permissions
      contents: 'read' # Required to checkout repository code
      id-token: 'write' # Required for OIDC authentication
      packages: 'read' # Required to read GitHub packages/container registry
    secrets: &e2e_secrets
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
      CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}
    with:
      orchestrated: true
      build: false
      coprocessor-db-migration-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-db-migration-version }}
      coprocessor-gw-listener-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-gw-listener-version }}
      coprocessor-host-listener-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-host-listener-version }}
      coprocessor-sns-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-sns-worker-version }}
      coprocessor-tfhe-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-tfhe-worker-version }}
      coprocessor-tx-sender-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-tx-sender-version }}
      coprocessor-zkproof-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-zkproof-worker-version }}
      coprocessor-consensus-detector-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-consensus-detector-version }}
      coprocessor-upgrade-controller-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-upgrade-controller-version }}
      listener-core-version: ${{ needs.create-e2e-tests-input.outputs.listener-core-version }}
      connector-versions: ${{ needs.create-e2e-tests-input.outputs.connector-versions }}
      gateway-version: ${{ needs.create-e2e-tests-input.outputs.gateway-version }}
      host-version: ${{ needs.create-e2e-tests-input.outputs.host-version }}
      kms-core-version: ${{ needs.create-e2e-tests-input.outputs.kms-core-version }}
      lock-artifact-name: ${{ needs.create-e2e-tests-input.outputs.lock-artifact-name }}
      relayer-migrate-version: ${{ needs.create-e2e-tests-input.outputs.relayer-migrate-version }}
      relayer-version: ${{ needs.create-e2e-tests-input.outputs.relayer-version }}
      scenario: two-of-three-multi-chain
      test-profile: standard-shard-compute
      test-suite-version: ${{ needs.create-e2e-tests-input.outputs.test-suite-version }}

  run-e2e-tests-shard-decryption:
    needs: [create-e2e-tests-input]
    if: *build-trigger-condition
    uses:
      ./.github/workflows/test-suite-e2e-tests.yml
    permissions: *e2e_permissions
    secrets: *e2e_secrets
    with:
      orchestrated: true
      build: false
      coprocessor-db-migration-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-db-migration-version }}
      coprocessor-gw-listener-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-gw-listener-version }}
      coprocessor-host-listener-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-host-listener-version }}
      coprocessor-sns-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-sns-worker-version }}
      coprocessor-tfhe-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-tfhe-worker-version }}
      coprocessor-tx-sender-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-tx-sender-version }}
      coprocessor-zkproof-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-zkproof-worker-version }}
      listener-core-version: ${{ needs.create-e2e-tests-input.outputs.listener-core-version }}
      connector-versions: ${{ needs.create-e2e-tests-input.outputs.connector-versions }}
      gateway-version: ${{ needs.create-e2e-tests-input.outputs.gateway-version }}
      host-version: ${{ needs.create-e2e-tests-input.outputs.host-version }}
      kms-core-version: ${{ needs.create-e2e-tests-input.outputs.kms-core-version }}
      lock-artifact-name: ${{ needs.create-e2e-tests-input.outputs.lock-artifact-name }}
      relayer-migrate-version: ${{ needs.create-e2e-tests-input.outputs.relayer-migrate-version }}
      relayer-version: ${{ needs.create-e2e-tests-input.outputs.relayer-version }}
      scenario: two-of-three-multi-chain
      test-profile: standard-shard-decryption
      test-suite-version: ${{ needs.create-e2e-tests-input.outputs.test-suite-version }}

  run-e2e-tests-shard-stateful:
    needs: [create-e2e-tests-input]
    if: *build-trigger-condition
    uses:
      ./.github/workflows/test-suite-e2e-tests.yml
    permissions: *e2e_permissions
    secrets: *e2e_secrets
    with:
      orchestrated: true
      build: false
      coprocessor-db-migration-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-db-migration-version }}
      coprocessor-gw-listener-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-gw-listener-version }}
      coprocessor-host-listener-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-host-listener-version }}
      coprocessor-sns-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-sns-worker-version }}
      coprocessor-tfhe-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-tfhe-worker-version }}
      coprocessor-tx-sender-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-tx-sender-version }}
      coprocessor-zkproof-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-zkproof-worker-version }}
      listener-core-version: ${{ needs.create-e2e-tests-input.outputs.listener-core-version }}
      connector-versions: ${{ needs.create-e2e-tests-input.outputs.connector-versions }}
      gateway-version: ${{ needs.create-e2e-tests-input.outputs.gateway-version }}
      host-version: ${{ needs.create-e2e-tests-input.outputs.host-version }}
      kms-core-version: ${{ needs.create-e2e-tests-input.outputs.kms-core-version }}
      lock-artifact-name: ${{ needs.create-e2e-tests-input.outputs.lock-artifact-name }}
      relayer-migrate-version: ${{ needs.create-e2e-tests-input.outputs.relayer-migrate-version }}
      relayer-version: ${{ needs.create-e2e-tests-input.outputs.relayer-version }}
      scenario: two-of-three-multi-chain
      test-profile: standard-shard-stateful
      test-suite-version: ${{ needs.create-e2e-tests-input.outputs.test-suite-version }}

  # Same orchestrated PR-built images and base-sha lock as run-e2e-tests, exercised against a real
  # 4-party threshold-mode KMS (secure keygen, Test params) via the kms-generation acceptance profile.
  # NOT a merge-queue gate, and since it competes with the gating shards for the same runner pool it
  # deliberately does NOT run on mergify merge-queue PRs — the same coverage runs post-merge on every
  # main push via test-suite-e2e-threshold-post-merge.yml. It still runs here for release branches and
  # manual dispatches with `run-threshold-legs: true`. For a standalone threshold run (no full image
  # build), dispatch the reusable workflow directly:
  #   gh workflow run test-suite-e2e-tests.yml -f scenario=four-party-threshold-kms \
  #     -f test-profile=kms-generation -f build=false
  run-e2e-tests-threshold-kms:
    needs: [create-e2e-tests-input]
    if: &threshold-trigger-condition |
      (github.event_name == 'workflow_dispatch' && inputs.run-threshold-legs) ||
      startsWith(github.base_ref, 'release/')
    uses:
      ./.github/workflows/test-suite-e2e-tests.yml
    permissions: *e2e_permissions
    secrets: *e2e_secrets
    with:
      orchestrated: true
      build: false
      coprocessor-db-migration-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-db-migration-version }}
      coprocessor-gw-listener-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-gw-listener-version }}
      coprocessor-host-listener-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-host-listener-version }}
      coprocessor-sns-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-sns-worker-version }}
      coprocessor-tfhe-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-tfhe-worker-version }}
      coprocessor-tx-sender-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-tx-sender-version }}
      coprocessor-zkproof-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-zkproof-worker-version }}
      coprocessor-consensus-detector-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-consensus-detector-version }}
      coprocessor-upgrade-controller-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-upgrade-controller-version }}
      listener-core-version: ${{ needs.create-e2e-tests-input.outputs.listener-core-version }}
      connector-versions: ${{ needs.create-e2e-tests-input.outputs.connector-versions }}
      gateway-version: ${{ needs.create-e2e-tests-input.outputs.gateway-version }}
      host-version: ${{ needs.create-e2e-tests-input.outputs.host-version }}
      kms-core-version: ${{ needs.create-e2e-tests-input.outputs.kms-core-version }}
      lock-artifact-name: ${{ needs.create-e2e-tests-input.outputs.lock-artifact-name }}
      relayer-migrate-version: ${{ needs.create-e2e-tests-input.outputs.relayer-migrate-version }}
      relayer-version: ${{ needs.create-e2e-tests-input.outputs.relayer-version }}
      scenario: four-party-threshold-kms
      test-profile: kms-generation
      test-suite-version: ${{ needs.create-e2e-tests-input.outputs.test-suite-version }}

  # Same orchestrated images/lock, exercised against the kms-generation-abort acceptance profile on
  # the 4-party committee: abort an in-flight keygen and crsgen, verify the contract and every
  # kms-connector retire the requests, then prove recovery with a fresh keygen/crsgen to full
  # activation. Runs on its own stack, so the active key/CRS rotation it performs cannot disturb the
  # other legs.
  # Standalone: gh workflow run test-suite-e2e-tests.yml -f scenario=four-party-threshold-kms \
  #   -f test-profile=kms-generation-abort -f build=false
  run-e2e-tests-kms-generation-abort:
    needs: [create-e2e-tests-input]
    if: *build-trigger-condition
    uses:
      ./.github/workflows/test-suite-e2e-tests.yml
    permissions: *e2e_permissions
    secrets: *e2e_secrets
    with:
      orchestrated: true
      build: false
      coprocessor-db-migration-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-db-migration-version }}
      coprocessor-gw-listener-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-gw-listener-version }}
      coprocessor-host-listener-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-host-listener-version }}
      coprocessor-sns-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-sns-worker-version }}
      coprocessor-tfhe-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-tfhe-worker-version }}
      coprocessor-tx-sender-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-tx-sender-version }}
      coprocessor-zkproof-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-zkproof-worker-version }}
      listener-core-version: ${{ needs.create-e2e-tests-input.outputs.listener-core-version }}
      connector-versions: ${{ needs.create-e2e-tests-input.outputs.connector-versions }}
      gateway-version: ${{ needs.create-e2e-tests-input.outputs.gateway-version }}
      host-version: ${{ needs.create-e2e-tests-input.outputs.host-version }}
      kms-core-version: ${{ needs.create-e2e-tests-input.outputs.kms-core-version }}
      lock-artifact-name: ${{ needs.create-e2e-tests-input.outputs.lock-artifact-name }}
      relayer-migrate-version: ${{ needs.create-e2e-tests-input.outputs.relayer-migrate-version }}
      relayer-version: ${{ needs.create-e2e-tests-input.outputs.relayer-version }}
      scenario: four-party-threshold-kms
      test-profile: kms-generation-abort
      test-suite-version: ${{ needs.create-e2e-tests-input.outputs.test-suite-version }}

  # Full KMS-context lifecycle leg: kms-context-switch on a 5-core cluster with a 4-node committee +
  # 1 idle spare. Runs a same-committee switch, an epoch rotation, context/epoch destruction (with
  # the spare's benign failure asserted), a post-destroy switch, a stuck-rotation abort + recovery,
  # and finally a node swap — the switch drops a committee node and promotes the spare, exercising
  # the asymmetric two-sets reshare (one node leaves, one joins) and a forced-quorum decrypt that
  # requires the joined node. Non-gating and skipped on merge-queue PRs (covered post-merge on main).
  # Standalone: gh workflow run test-suite-e2e-tests.yml -f scenario=five-party-swap-threshold-kms \
  #   -f test-profile=kms-context-switch -f build=false
  run-e2e-tests-kms-context-switch:
    needs: [create-e2e-tests-input]
    if: *threshold-trigger-condition
    uses:
      ./.github/workflows/test-suite-e2e-tests.yml
    permissions: *e2e_permissions
    secrets: *e2e_secrets
    with:
      orchestrated: true
      build: false
      coprocessor-db-migration-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-db-migration-version }}
      coprocessor-gw-listener-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-gw-listener-version }}
      coprocessor-host-listener-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-host-listener-version }}
      coprocessor-sns-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-sns-worker-version }}
      coprocessor-tfhe-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-tfhe-worker-version }}
      coprocessor-tx-sender-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-tx-sender-version }}
      coprocessor-zkproof-worker-version: ${{ needs.create-e2e-tests-input.outputs.coprocessor-zkproof-worker-version }}
      listener-core-version: ${{ needs.create-e2e-tests-input.outputs.listener-core-version }}
      connector-versions: ${{ needs.create-e2e-tests-input.outputs.connector-versions }}
      gateway-version: ${{ needs.create-e2e-tests-input.outputs.gateway-version }}
      host-version: ${{ needs.create-e2e-tests-input.outputs.host-version }}
      kms-core-version: ${{ needs.create-e2e-tests-input.outputs.kms-core-version }}
      lock-artifact-name: ${{ needs.create-e2e-tests-input.outputs.lock-artifact-name }}
      relayer-migrate-version: ${{ needs.create-e2e-tests-input.outputs.relayer-migrate-version }}
      relayer-version: ${{ needs.create-e2e-tests-input.outputs.relayer-version }}
      scenario: five-party-swap-threshold-kms
      test-profile: kms-context-switch
      test-suite-version: ${{ needs.create-e2e-tests-input.outputs.test-suite-version }}
