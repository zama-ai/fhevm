name: solana-tests

on:
  workflow_dispatch:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # This toolchain, the solana-test-validator in solana-e2e.yml, and the Yellowstone geyser plugin
  # all sit on the agave 4.1 line and must be bumped together — they are one running system.
  #
  # The in-process SVMs are deliberately NOT on it: mollusk-svm is held at 0.12.1-agave-4.0 and
  # litesvm at 0.11 (see the comment at solana/runtime-tests/Cargo.toml). Both need
  # solana-account >= 4.3, which has moved to wincode 0.6 while anchor still pins the 3.x crates on
  # wincode 0.5. They move when that upstream split resolves, not when this pin changes.
  ANCHOR_VERSION: "1.1.2"
  SOLANA_VERSION: "4.1.2"

jobs:
  check-changes:
    name: solana-tests/check-changes
    permissions:
      actions: 'read'
      contents: 'read'
      pull-requests: 'read'
    runs-on: ubuntu-latest
    outputs:
      changes-solana: ${{ steps.filter.outputs.solana }}
      changes-demo-dapp: ${{ steps.filter.outputs.demo-dapp }}
      changes-test-suite-fhevm: ${{ steps.filter.outputs.test-suite-fhevm }}
      changes-dead-surface-check: ${{ steps.filter.outputs.dead-surface-check }}
      changes-dead-surface: ${{ steps.filter.outputs.dead-surface }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            solana:
              - .github/workflows/solana-tests.yml
              - solana/**
              - coprocessor/fhevm-engine/host-listener/build.rs
              - coprocessor/fhevm-engine/host-listener/idl/zama_host.json
            dead-surface-check:
              - solana/scripts/dead-surface-check.sh
            # Every tree dead-surface-check.sh sweeps. The check used to run only inside
            # build-and-test, which is gated on `solana`, so an edit to the proof service, the
            # listener, the kms-connector, the SDK, or the test suite could introduce a retired name
            # or a dead export without it ever running. Keep this list and the script's own
            # RUST_ROOTS/TS_ROOTS/SCRIPT_ROOTS in step.
            dead-surface:
              - .github/workflows/solana-tests.yml
              - .github/workflows/solana-e2e.yml
              - solana/**
              - solana-proof-service/**
              - coprocessor/fhevm-engine/host-listener/src/**
              - kms-connector/crates/**
              - sdk/js-sdk/src/solana/**
              - test-suite/fhevm/**
              # Checks 4 and 5 pin a retrofit and its written justification in these two relayer
              # files. Neither matched any path above, so deleting the justification prose or the
              # last retrofit did not run this job at all — the staleness guards could not fire on
              # the change that invalidated them. Named individually rather than `relayer/**`: only
              # these two files are inputs to the sweep.
              - relayer/src/core/event.rs
              - relayer/src/gateway/arbitrum/transaction_calldata.rs
            demo-dapp:
              - .github/workflows/solana-tests.yml
              - solana/demo-dapp/**
              - sdk/js-sdk/**
              # The source IDLs the generated clients are rendered from. The confidential_batcher
              # and demo_vault IDLs live under solana/demo-dapp/idl and are already matched above;
              # these two are vendored with the listener, so without naming them an IDL change
              # would not run the codegen check that reads it. zama_host feeds the test-suite's
              # generated bootstrap client, whose committed output is also matched so a hand edit
              # to the generated tree runs the check too.
              - coprocessor/fhevm-engine/host-listener/idl/confidential_token.json
              - coprocessor/fhevm-engine/host-listener/idl/zama_host.json
              - test-suite/fhevm/src/solana/internal/generated/**
            test-suite-fhevm:
              - .github/workflows/solana-tests.yml
              - test-suite/fhevm/**
              # The job's `tsc` resolves through the `@sdk-src/*` and `@demo-dapp/*` path aliases
              # into these two trees, so a change confined to either one can break this typecheck.
              # Without them the break surfaces ~40 min into the e2e job (bun strips types rather
              # than checking them), or not at all on a PR targeting main. Retiring the aliases is
              # tracked in fhevm-internal#1878; until then the filter has to name what tsc reads.
              - sdk/js-sdk/**
              - solana/demo-dapp/**

  # Pure grep/sed, no toolchain, half a minute: its own job so it runs for every tree it sweeps,
  # not only the ones that trigger the SBF builds. See fhevm-internal#1859 §7.
  dead-surface:
    name: solana-tests/dead-surface
    needs: check-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.changes-dead-surface == 'true' }}
    permissions:
      contents: 'read'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'

      # DEAD_SURFACE_ONLY_CHECK narrows the script to a single check; the self-test sets it per
      # assertion. Cleared here so no repository variable, no earlier step writing GITHUB_ENV, and no
      # copy of this job in another workflow can leave the gate running one check out of seven. The
      # script also rejects values it does not recognize, but an inherited "6" is a value it does.
      - name: Check for dead surface and rejected vocabulary
        env:
          DEAD_SURFACE_ONLY_CHECK: ''
        run: bash scripts/dead-surface-check.sh

      # The self-test re-runs every check against a fixture that must fail it, which takes several
      # minutes: each assertion runs the script again for the one check its fixture violates. Every
      # one of these greps has been silently vacuous at least once, so it runs whenever the script
      # itself changes — the only commit that can make a check stop firing.
      - name: Self-test the dead-surface checks
        if: ${{ needs.check-changes.outputs.changes-dead-surface-check == 'true' }}
        env:
          DEAD_SURFACE_ONLY_CHECK: ''
        run: bash scripts/dead-surface-check.sh --self-test

      # PendingBurn is derived by handwritten Rust and TypeScript code. A rename on only one side
      # leaves unit tests green until a live transaction fails with ConstraintSeeds.
      - name: Check handwritten PendingBurn seed matches Rust
        run: |
          python3 scripts/check-pda-seeds.py
          python3 scripts/check-pda-seeds.py --self-test

  # The vault module (batch provisioning, settle composition, the address-lookup-table lifecycle)
  # lives in the demo dapp, and its unit tests run nowhere else: js-sdk-tests is scoped to PRs
  # against main/devex, and solana-e2e only builds the dapp. Without this job a regression in
  # settle composition or ALT encoding surfaces first as a live e2e failure.
  demo-dapp:
    name: solana-tests/demo-dapp
    needs: check-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.changes-demo-dapp == 'true' }}
    permissions:
      contents: 'read'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: 1.3.14

      # Same recipe as clean-e2e.sh: the dapp reaches the SDK through a symlink into its source
      # tree (its postinstall swaps bun's `file:` snapshot for one), so the ESM and declaration
      # trees must exist before the dapp's checks run, and the SDK's own dependency graph must be
      # installed at the repository root.
      - name: Build the SDK the dapp consumes
        run: |
          npm ci --workspace=@fhevm/sdk-dev --workspace=@fhevm/sdk --include-workspace-root=false
          ( cd sdk/js-sdk && npm run clean && npm run build:esm && npm run build:types )

      # The dapp does not hand-write the program clients under src/vault/internal/generated: the
      # SDK's Codama codegen renders them from the committed IDLs. Its `--check` mode ran in no
      # workflow, so a client could keep describing an instruction, account, or argument the
      # program no longer has — and the confidential-token client had in fact drifted. The codegen
      # lives with the SDK, so it runs off the graph the previous step installed.
      - name: Check the dapp's generated program clients still match the committed IDLs
        working-directory: sdk/js-sdk
        run: npm run codegen:solana:check

      - name: Install the dapp's frozen dependency graph
        working-directory: solana/demo-dapp
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, and test the demo dapp
        working-directory: solana/demo-dapp
        run: |
          bun run check
          bun run lint
          bun run test

  # The test-suite/fhevm typecheck and offline unit suite otherwise run only in
  # test-suite-e2e-tests.yml, whose job is gated on the `e2e` PR label — so on an ordinary PR
  # nothing ran tsc or the offline assertions (SPL instruction layouts, gateway-read decoding,
  # lifecycle validation). bun strips types at runtime, so the live scenario lane cannot catch a
  # type error on a branch it does not execute.
  test-suite-fhevm:
    name: solana-tests/test-suite-fhevm
    needs: check-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.changes-test-suite-fhevm == 'true' }}
    permissions:
      contents: 'read'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: 1.3.14

      # tsc follows the `@sdk-src`/`@demo-dapp` path aliases into the SDK and dapp sources, so
      # both of their own dependency graphs must exist for their types to resolve.
      - name: Install the SDK's own dependency graph (tsc resolves SDK sources)
        run: npm ci --workspace=@fhevm/sdk-dev --workspace=@fhevm/sdk --include-workspace-root=false

      - name: Install the demo-dapp's frozen dependency graph (tsc resolves the vault module)
        working-directory: solana/demo-dapp
        run: bun install --frozen-lockfile

      - name: Install the test-suite's frozen dependency graph
        working-directory: test-suite/fhevm
        run: bun install --frozen-lockfile

      - name: Typecheck and run the offline unit suites
        working-directory: test-suite/fhevm
        run: |
          bun run check
          bun test src
          bun run test:e2e:harness

  build-and-test:
    name: solana-tests/build-and-test
    needs: check-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.changes-solana == 'true' }}
    permissions:
      contents: 'read'
    runs-on: runs-on=${{ github.run_id }}/runner=16cpu-linux-x64/volume=80gb
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'

      - name: Setup Rust toolchain file
        run: cp rust-toolchain.toml ..

      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1

      - name: Cache Solana CLI and AVM
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.avm
            ~/.local/share/solana
          key: solana-toolchain-${{ runner.os }}-anchor-${{ env.ANCHOR_VERSION }}-solana-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        run: |
          if ! command -v solana >/dev/null; then
            sh -c "$(curl -sSfL "https://release.anza.xyz/v${SOLANA_VERSION}/install")"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI via AVM
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --locked --force
          avm install "${ANCHOR_VERSION}"
          avm use "${ANCHOR_VERSION}"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain versions
        run: |
          solana --version
          anchor --version
          test "$(anchor --version)" = "anchor-cli ${ANCHOR_VERSION}"
          test "$(awk -F'"' '/^anchor_version/ { print $2 }' Anchor.toml)" = "${ANCHOR_VERSION}"

      - name: Build Anchor programs and check host-listener IDL sync
        id: idl-sync
        run: bash scripts/check-zama-host-idl.sh

      # A committed IDL that disagrees with the build is fixed by copying the build's output over
      # it, never by editing the JSON — and whoever hits this may have no local SBF toolchain.
      # These are the files sync-zama-host-idl.sh would have written.
      - name: Upload the freshly built IDLs when the sync check fails
        if: ${{ failure() && steps.idl-sync.conclusion == 'failure' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: solana-built-idls
          path: solana/target/idl/*.json
          if-no-files-found: error

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Solana workspace tests
        id: workspace-tests
        run: cargo test --workspace

      # A cost snapshot test panics on the first profile that moved, so the failure message names
      # one profile even when several changed, and the fix needs an SBF toolchain the author may
      # not have. Re-run the snapshot tests in record mode and hand back the JSON that
      # update-cost-snapshots.sh would have written.
      - name: Regenerate the cost snapshots after a test failure
        id: regen-snapshots
        if: ${{ failure() && steps.workspace-tests.conclusion == 'failure' }}
        run: ZAMA_UPDATE_COST_SNAPSHOT=1 cargo test -p zama-solana-runtime-tests cost_snapshot_
        continue-on-error: true

      # Only publish when regeneration actually succeeded. If the workspace failed to compile, the
      # step above fails too and `continue-on-error` swallows it — uploading then would hand over a
      # byte-identical copy of the committed JSON while implying it is the fix.
      - name: Upload the regenerated cost snapshots
        if: ${{ failure() && steps.regen-snapshots.outcome == 'success' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: solana-cost-snapshots
          path: solana/runtime-tests/cost-snapshots/*.json
          if-no-files-found: error

      - name: Run zama-host decode-feature tests
        run: cargo test -p zama-host --features decode

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Clippy on the zama-host decode feature
        run: cargo clippy -p zama-host --features decode --all-targets -- -D warnings
