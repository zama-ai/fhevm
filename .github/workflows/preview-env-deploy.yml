name: preview-env-deploy

##############################################################################
# Ephemeral per-PR e2e preview environments. Each preview gets its own
# namespace with a fully isolated stack: anvil host+gateway chains (default), a
# dedicated KMS (real keygen), contracts, coprocessor, kms-connector, relayer
# and test-suite. Nothing is shared across PRs.
#
# workflow_dispatch can set use_blockchain_dev=true to skip Anvil and point the
# stack at the shared blockchain-dev Geth (host 1337) + Nitro (gateway 412346)
# nodes instead. That path generates unique wallets, funds them from the
# in-cluster faucets, and still deploys this preview's own contracts (which
# remain on the shared chain after namespace teardown). PR labels ignore it.
#
# Three PR labels control deployment (see check-labels below):
#   - preview-env-e2e: deploy the PR branch. On PRs images are ALWAYS built
#     fresh from the PR HEAD (only changed components; the rest resolve to the
#     change-detection base commit's images). In-repo charts (charts/*) install
#     from this branch's checkout.
#   - preview-env-e2e-tests: same, plus auto-run the e2e test DAG and report
#     pass/fail back to the PR.
#   - preview-env-blue-green: deploy RFC-021 BCS+GCS on each party (forces
#     nb_coprocessor=2). Dispatch encodes the same path as nb_coprocessor=2.
#     With preview-env-e2e-tests (or automated_tests): propose after relayer,
#     run e2e during DryRunStarted (assert GCS computations > 0), wait for
#     versioning=v0.15, then run e2e again on green. Incompatible with
#     deploy_polygon and with N=1.
# The dedicated KMS (env.KMS_REPO_REF/KMS_CORE_TAG) is never built here.
# (A pinned-only run with no builds is still possible via workflow_dispatch
# with build_images=false.)
##############################################################################

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      build_images:
        description: "Build fresh images from the selected branch (the branch picked above via 'Use workflow from'). Uncheck to skip building entirely and deploy what the branch's merge-base with main runs."
        required: true
        default: "true"
      build_test_suite_only:
        description: "When build_images=true, build ONLY the e2e test-suite image and skip every other component build (they resolve to the base commit's images). Handy for iterating on the test-suite / @fhevm/sdk without a full rebuild."
        required: false
        default: "false"
      automated_tests:
        description: "Deploy the Argo Workflow that auto-runs the e2e test DAG (in addition to the idle test-suite Job) and reports pass/fail back to the PR / run summary. Off by default."
        required: false
        default: "false"
      observability:
        description: "Deploy the in-namespace observability stack (Prometheus + Grafana + Jaeger, see ci/preview-env/observability/) and enable OTLP tracing in components. Off by default."
        required: false
        default: "false"
      host_contracts_version:
        description: "Override the image tag for the host-contracts deployer image. Leave empty to resolve it automatically from the change-detection base commit."
        required: false
        default: ""
      gateway_contracts_version:
        description: "Override the image tag for the gateway-contracts deployer image. Leave empty to resolve it automatically from the change-detection base commit."
        required: false
        default: ""
      contracts_chart_version:
        description: "Override with a published contracts Helm chart version. Leave empty to deploy charts/contracts from the selected branch."
        required: false
        default: ""
      coprocessor_version:
        description: "Override the image tag for every coprocessor image. Leave empty to resolve it automatically from the change-detection base commit."
        required: false
        default: ""
      coprocessor_chart_version:
        description: "Override with a published coprocessor Helm chart version. Leave empty to deploy charts/coprocessor from the selected branch."
        required: false
        default: ""
      coprocessor_infra_chart_version:
        description: "Override the coprocessor-infra Helm chart version. Leave empty for the pin in the workflow env."
        required: false
        default: ""
      nb_coprocessor:
        description: "Number of coprocessor parties to deploy"
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"
          - "5"
      kms_connector_version:
        description: "Override the image tag for every kms-connector image. Leave empty to resolve it automatically from the change-detection base commit."
        required: false
        default: ""
      kms_connector_chart_version:
        description: "Override with a published kms-connector Helm chart version. Leave empty to deploy charts/kms-connector from the selected branch."
        required: false
        default: ""
      kms_core_version:
        description: "Override the image tag for the dedicated KMS's kms-core (zama-ai/kms, never built here). Leave empty for the pin in the workflow env."
        required: false
        default: ""
      kms_repo_ref:
        description: "Override the zama-ai/kms git ref for deploy scripts + tkms-infra/kms-core charts. Leave empty for the pin in the workflow env."
        required: false
        default: ""
      nb_kms_core:
        description: "Number of kms-core parties to deploy (1:1 with kms-connector + dedicated Postgres releases)"
        required: true
        type: choice
        default: "4"
        options:
          - "4"
          - "13"
      relayer_version:
        description: "Override the image tag for the relayer/relayer-migrate images. Leave empty to resolve it automatically from the change-detection base commit."
        required: false
        default: ""
      relayer_sdk_version:
        description: "Version of @zama-fhe/relayer-sdk to test. Set: run both e2e suites (fhevm-sdk then relayer-sdk) sequentially. Empty: run the @fhevm/sdk suite only."
        required: false
        default: "0.4.4"
      test_suite_version:
        description: "Override the image tag for the test-suite image. Leave empty to resolve it automatically from the change-detection base commit."
        required: false
        default: ""
      common_chart_version:
        description: "Override the generic `common` Helm chart version (postgres-*, relayer-migrate, relayer, test-suite). Leave empty for the pin in the workflow env."
        required: false
        default: ""
      redis_chart_version:
        description: "Override the Redis Helm chart version (per-party host-listener-consumer broker). Leave empty for the pin in the workflow env."
        required: false
        default: ""
      listener_chart_version:
        description: "Override with a published listener Helm chart version. Leave empty to deploy charts/listener from the selected branch."
        required: false
        default: ""
      listener_version:
        description: "Override the image tag for the listener/listener-core image. Leave empty to resolve it automatically from the change-detection base commit."
        required: false
        default: ""
      deploy_polygon:
        description: "Also deploy a SECOND (Polygon Amoy, 80002) host chain: a fresh local anvil, its own host-contracts (reusing the ETH KMS key via canonical ProtocolConfig mirror), a per-party listener + coprocessor consumer/poller, and - when automated_tests is on - a Polygon e2e run. Roughly doubles the host-side stack. Incompatible with use_blockchain_dev."
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      use_blockchain_dev:
        description: "Skip per-namespace Anvil and connect to the shared blockchain-dev Geth (host 1337) + Nitro (gateway 412346). Generates unique wallets and funds them from the blockchain-dev faucets. Dispatch-only (PR labels stay on Anvil). Incompatible with deploy_polygon. Contracts stay on the shared chain after teardown."
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

concurrency:
  # pull_request: one preview per PR, new pushes cancel the in-flight run.
  # workflow_dispatch: keyed on run_id, so manual runs never cancel each other.
  group: pr-preview-deploy-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

##############################################################################
# Registry refs, plus version pins for the artifacts this repo does NOT own.
#
# There are deliberately no pins for fhevm's own artifacts: in-repo charts
# install from this workflow's checkout, and image tags resolve from the
# change-detection base commit - a preview deploys what the branch actually
# runs, not a hand-maintained release that has quietly gone stale. Any
# *_version dispatch input overrides one of these for a single run (inputs.*
# is empty on pull_request, so PR runs never override).
##############################################################################
env:
  # How far back from the base commit to look for a published image before
  # failing.
  MAX_IMAGE_COMMIT_COUNT: "50"
  NB_COPROCESSOR: ${{ inputs.nb_coprocessor || '1' }}
  NB_KMS_CORE: ${{ inputs.nb_kms_core || '4' }}
  #=====IN-REPO CHARTS=======================================================
  # Install sources are decided in the deploy job's "Resolve chart sources"
  # step; this prefix is only where a *_chart_version override is pulled from.
  FHEVM_CHARTS_OCI_PREFIX: oci://hub.zama.org/ghcr/zama-ai/fhevm/charts
  # Always install charts/anvil-node from this checkout (the dispatch input
  # for anvil-node chart version was dropped: GitHub caps workflow_dispatch
  # at 25 inputs, and use_blockchain_dev took the last slot).
  ANVIL_NODE_CHART_VERSION: ""
  CONTRACTS_CHART_VERSION: ${{ inputs.contracts_chart_version }}
  COPROCESSOR_CHART_VERSION: ${{ inputs.coprocessor_chart_version }}
  KMS_CONNECTOR_CHART_VERSION: ${{ inputs.kms_connector_chart_version }}
  LISTENER_CHART_VERSION: ${{ inputs.listener_chart_version }}
  #=====EXTERNAL PINS (dispatch inputs override)=============================
  # Owned by other repos, so there is no commit of this repo to resolve them
  # from. Pinned to the same known-good releases zama-zws/gitops's fhevm-dev
  # environment runs.
  COPROCESSOR_INFRA_CHART: oci://hub.zama.org/ghcr/zama-zws/crossplane/coprocessor-infra
  COPROCESSOR_INFRA_CHART_VERSION: ${{ inputs.coprocessor_infra_chart_version || '0.6.5' }}
  # Empty (every PR run): run the @fhevm/sdk suite only, no relayer-sdk pass.
  RELAYER_SDK_VERSION: ${{ inputs.relayer_sdk_version }}
  COMMON_CHART: oci://hub.zama.org/ghcr/zama-zws/helm-charts/common
  COMMON_CHART_VERSION: ${{ inputs.common_chart_version || '0.3.3' }}
  #=====KMS==================================================================
  KMS_REPO_REF: ${{ inputs.kms_repo_ref || '35edfa2f0656ee266e3299a004a83ac7d4fe2418' }}
  KMS_CORE_TAG: ${{ inputs.kms_core_version || 'd27c3b5' }}
  #=====REDIS================================================================
  REDIS_CHART: oci://hub.zama.org/cgr/zama.ai/iamguarded-charts/redis
  REDIS_CHART_VERSION: ${{ inputs.redis_chart_version || '25.3.8' }}
  #=====POLYGON=============================================================
  # Second (Polygon Amoy, 80002) host chain: opt-in via the deploy_polygon
  # dispatch input, off by default (inputs.* is empty on PR runs, so PRs never
  # get Polygon).
  DEPLOY_POLYGON: ${{ inputs.deploy_polygon || 'false' }}
  # Shared blockchain-dev Geth+Nitro instead of per-namespace Anvil. Empty on
  # pull_request so labeled PRs never take this path.
  USE_BLOCKCHAIN_DEV: ${{ inputs.use_blockchain_dev || 'false' }}
  #=====TAILSCALE============================================================
  TAILSCALE_HOSTNAME: tailscale-operator-zws-dev.diplodocus-boa.ts.net

jobs:
  ##########################################################################
  # Gate: PRs labeled preview-env-e2e(-tests) or preview-env-blue-green get a
  # preview. On PRs images are always built fresh from the PR branch.
  # workflow_dispatch always deploys (the dispatch itself is the request);
  # build_images comes from its input.
  ##########################################################################
  check-labels:
    name: check-labels
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'preview-env-e2e' ||
      github.event.label.name == 'preview-env-e2e-tests' ||
      github.event.label.name == 'preview-env-blue-green'
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      build_images: ${{ steps.check.outputs.build_images }}
      build_test_suite_only: ${{ steps.check.outputs.build_test_suite_only }}
      automated_tests: ${{ steps.check.outputs.automated_tests }}
      observability: ${{ steps.check.outputs.observability }}
      blue_green: ${{ steps.check.outputs.blue_green }}
      nb_coprocessor: ${{ steps.check.outputs.nb_coprocessor }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BUILD_IMAGES: ${{ inputs.build_images }}
          DISPATCH_BUILD_TEST_SUITE_ONLY: ${{ inputs.build_test_suite_only }}
          DISPATCH_AUTOMATED_TESTS: ${{ inputs.automated_tests }}
          DISPATCH_OBSERVABILITY: ${{ inputs.observability }}
          DISPATCH_NB_COPROCESSOR: ${{ inputs.nb_coprocessor || '1' }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # build_test_suite_only is a dispatch-only knob; label-triggered runs
          # never set it (always build everything they're allowed to).
          echo "build_test_suite_only=false" >> "$GITHUB_OUTPUT"
          # automated_tests defaults off; dispatch reads its input, PR runs opt
          # in via the preview-env-e2e-tests label (handled below).
          echo "automated_tests=false" >> "$GITHUB_OUTPUT"
          # observability is a dispatch-only knob for now (no PR label), off by
          # default.
          echo "observability=false" >> "$GITHUB_OUTPUT"
          # RFC-021 dual fleet. Dispatch: nb_coprocessor=2 encodes the flag
          # (no 26th input). PRs: preview-env-blue-green label, N forced to 2.
          echo "blue_green=false" >> "$GITHUB_OUTPUT"
          echo "nb_coprocessor=${DISPATCH_NB_COPROCESSOR:-1}" >> "$GITHUB_OUTPUT"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            blue_green=false
            nb_coprocessor="${DISPATCH_NB_COPROCESSOR:-1}"
            if [[ "${nb_coprocessor}" == "2" ]]; then
              blue_green=true
            fi
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "build_images=${DISPATCH_BUILD_IMAGES}" >> "$GITHUB_OUTPUT"
            echo "build_test_suite_only=${DISPATCH_BUILD_TEST_SUITE_ONLY:-false}" >> "$GITHUB_OUTPUT"
            echo "automated_tests=${DISPATCH_AUTOMATED_TESTS:-false}" >> "$GITHUB_OUTPUT"
            echo "observability=${DISPATCH_OBSERVABILITY:-false}" >> "$GITHUB_OUTPUT"
            echo "blue_green=${blue_green}" >> "$GITHUB_OUTPUT"
            echo "nb_coprocessor=${nb_coprocessor}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "PR labels: $PR_LABELS"
          # Compute in shell vars and write once at the end: preview-env-e2e-tests
          # must be able to force should_deploy=true on its own (automated tests
          # need a deployed env), which a trailing else branch would otherwise
          # clobber via last-write-wins.
          should_deploy=false
          build_images=false
          automated_tests=false
          blue_green=false
          nb_coprocessor="${DISPATCH_NB_COPROCESSOR:-1}"
          # preview-env-e2e-tests: auto-run the e2e DAG AND deploy the env it needs,
          # so the PR-comment report path is reachable without a manual dispatch.
          if echo "$PR_LABELS" | jq -e '.[] | select(. == "preview-env-e2e-tests")' > /dev/null; then
            automated_tests=true
            should_deploy=true
          fi
          if echo "$PR_LABELS" | jq -e '.[] | select(. == "preview-env-e2e")' > /dev/null; then
            should_deploy=true
          fi
          if echo "$PR_LABELS" | jq -e '.[] | select(. == "preview-env-blue-green")' > /dev/null; then
            blue_green=true
            should_deploy=true
            if [[ "${nb_coprocessor}" == "1" ]]; then
              nb_coprocessor=2
            fi
          fi
          # On PRs we always build fresh images from the PR branch: any preview
          # label that triggers a deploy also builds. There is no pinned-only PR
          # path anymore - use workflow_dispatch with build_images=false for that.
          if [[ "${should_deploy}" == "true" ]]; then
            build_images=true
          fi
          {
            echo "should_deploy=${should_deploy}"
            echo "build_images=${build_images}"
            echo "automated_tests=${automated_tests}"
            echo "blue_green=${blue_green}"
            echo "nb_coprocessor=${nb_coprocessor}"
          } >> "$GITHUB_OUTPUT"

  ##########################################################################
  # Build every fhevm-owned image at this PR's HEAD (or the dispatched
  # branch), only when build_images is on. Each reusable workflow builds+
  # pushes only on relevant path changes; unchanged components report
  # "skipped" and resolve-tags below resolves them to the base commit's image.
  ##########################################################################
  build-host-contracts:
    name: build/host-contracts
    needs: check-labels
    # Anchor covers every NON-test-suite build: skipped when build_test_suite_only
    # is set (build-test-suite below has its own condition without that clause).
    if: &should_build_images >-
      needs.check-labels.outputs.should_deploy == 'true' &&
      needs.check-labels.outputs.build_images == 'true' &&
      needs.check-labels.outputs.build_test_suite_only != 'true'
    uses: ./.github/workflows/host-contracts-docker-build.yml
    # Top-level `permissions: {}` caps every nested reusable-workflow call.
    permissions: &docker_permissions
      actions: 'read' # Required to read workflow run information
      contents: 'read' # Required to checkout repository code
      pull-requests: 'read' # Required to read pull request information
      attestations: 'write' # Required to create build attestations
      packages: 'write' # Required to publish Docker images
      id-token: 'write' # Required for OIDC authentication
    # Explicit secrets (not `secrets: inherit`): every reusable *-docker-build
    secrets: &docker_secrets
      AWS_ACCESS_KEY_S3_USER: ${{ secrets.AWS_ACCESS_KEY_S3_USER }}
      AWS_SECRET_KEY_S3_USER: ${{ secrets.AWS_SECRET_KEY_S3_USER }}
      BLOCKCHAIN_ACTIONS_TOKEN: ${{ secrets.BLOCKCHAIN_ACTIONS_TOKEN }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
      CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}

  build-gateway-contracts:
    name: build/gateway-contracts
    needs: check-labels
    if: *should_build_images
    uses: ./.github/workflows/gateway-contracts-docker-build.yml
    permissions: *docker_permissions
    secrets: *docker_secrets

  build-kms-connector:
    name: build/kms-connector
    needs: check-labels
    if: *should_build_images
    uses: ./.github/workflows/kms-connector-docker-build.yml
    permissions: *docker_permissions
    secrets: *docker_secrets

  build-coprocessor:
    name: build/coprocessor
    needs: check-labels
    if: *should_build_images
    uses: ./.github/workflows/coprocessor-docker-build.yml
    permissions: *docker_permissions
    secrets: *docker_secrets
    with:
      # Blue-green GCS is the same CI images compiled as 0.15.0. BCS stays
      # the registry pin v0.14.0-7. Empty keeps the hardcoded 0.14.0 baseline.
      build_stack_version: ${{ needs.check-labels.outputs.blue_green == 'true' && '0.15.0' || '' }}

  build-listener:
    name: build/listener
    needs: check-labels
    if: *should_build_images
    uses: ./.github/workflows/listener-docker-build.yml
    permissions: *docker_permissions
    secrets: *docker_secrets

  build-relayer:
    name: build/relayer
    needs: check-labels
    if: *should_build_images
    uses: ./.github/workflows/relayer-docker-build.yml
    permissions: *docker_permissions
    secrets: *docker_secrets

  build-test-suite:
    name: build/test-suite
    needs: check-labels
    # No build_test_suite_only clause: this is the one build that must still run
    # when build_test_suite_only is set.
    if: >-
      needs.check-labels.outputs.should_deploy == 'true' &&
      needs.check-labels.outputs.build_images == 'true'
    uses: ./.github/workflows/test-suite-docker-build.yml
    permissions: *docker_permissions
    secrets: *docker_secrets

  ##########################################################################
  # Resolve one real tag per image: this run's 7-char short SHA if it just
  # built the component, else whatever the change-detection base commit
  # publishes (verified against GHCR). Fails the deploy rather than
  # substituting something older. See ci/preview-env/scripts/resolve-tags.cjs.
  ##########################################################################
  resolve-tags:
    name: resolve-tags
    permissions:
      contents: 'read'
    needs:
      - check-labels
      - build-host-contracts
      - build-gateway-contracts
      - build-kms-connector
      - build-coprocessor
      - build-listener
      - build-relayer
      - build-test-suite
    if: >-
      !cancelled() &&
      needs.check-labels.outputs.should_deploy == 'true' &&
      needs.check-labels.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      tags_json: ${{ steps.resolve.outputs.tags_json }}
      namespace: ${{ steps.resolve.outputs.namespace }}
    steps:
      # Sparse-checkout just the resolve-tags script so the github-script step
      # can require() it (this job otherwise has no working tree).
      - name: Checkout resolve-tags script
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: ci/preview-env/scripts/resolve-tags.cjs
          sparse-checkout-cone-mode: false
      - id: resolve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          # Always a defined object ({} on pull_request), so inputs.* is safe.
          INPUTS: ${{ toJSON(inputs) }}
          ACTOR: ${{ github.actor }}
          GHCR_USER: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          script: |
            // Absolute path: github-script resolves relative require() from its
            // own bundle dir, not the workspace, so anchor on GITHUB_WORKSPACE.
            const resolveTags = require(`${process.env.GITHUB_WORKSPACE}/ci/preview-env/scripts/resolve-tags.cjs`)
            await resolveTags({ core, context, github })

  ##########################################################################
  # Deploy the full stack to the per-PR namespace on the zws-dev cluster:
  # anvil chains -> dedicated KMS -> contracts -> coprocessor + kms-connector
  # -> relayer + test-suite.
  ##########################################################################
  deploy:
    name: deploy
    needs: [check-labels, resolve-tags, build-coprocessor]
    if: >-
      !cancelled() &&
      needs.check-labels.outputs.should_deploy == 'true' &&
      needs.resolve-tags.result == 'success' &&
      (needs.check-labels.outputs.blue_green != 'true' || needs.build-coprocessor.result == 'success')
    runs-on: "runs-on=${{ github.run_id }}/runner=8cpu-linux-x64/spot=false"
    # 90m covers a plain deploy; automated_tests adds the sequential e2e DAG
    # (8 tests, each recompiling contracts). Blue-green + tests runs that DAG
    # twice (DryRunStarted, then after cutover), so allow a second suite.
    timeout-minutes: 360
    permissions:
      pull-requests: write # Required to comment on the PR with connection info
    env:
      # Job-specific, computed from needs (everything else - version pins,
      # override inputs - comes straight from the workflow-level env).
      NAMESPACE: ${{ needs.resolve-tags.outputs.namespace }}
      TAGS_JSON: ${{ needs.resolve-tags.outputs.tags_json }}
      # Gate for the automated e2e test workflow (see the test-suite-workflow
      # deploy + report steps): dispatch input or the preview-env-e2e-tests label.
      AUTOMATED_TESTS: ${{ needs.check-labels.outputs.automated_tests }}
      OBSERVABILITY: ${{ needs.check-labels.outputs.observability }}
      BLUE_GREEN: ${{ needs.check-labels.outputs.blue_green }}
      NB_COPROCESSOR: ${{ needs.check-labels.outputs.nb_coprocessor }}
      # Previous-release pin for the BCS fleet (compiled STACK_VERSION=0.14.0).
      BCS_IMAGE_TAG: "v0.14.0-7"
      # In-namespace Jaeger's OTLP gRPC endpoint.
      # Only consumed when OBSERVABILITY is true.
      OTLP_ENDPOINT: "http://jaeger:4317"
    steps:
      - name: Checkout fhevm
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Tooling + cluster access (tailscale, helm/kubectl/yq, kubeconfig, Harbor).
      - name: Setup preview tooling
        uses: ./.github/actions/setup-preview-tooling
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ts-tags: tag:fhevm-ci
          tailscale-hostname: ${{ env.TAILSCALE_HOSTNAME }}
          harbor-url: ${{ secrets.HARBOR_URL }}
          harbor-username: ${{ secrets.HARBOR_READ_LOGIN }}
          harbor-token: ${{ secrets.HARBOR_READ_TOKEN }}

      - name: Resolve chain endpoints
        run: bash ci/preview-env/scripts/resolve-chain.sh

      - name: Fail fast on incompatible blue-green topology
        run: |
          if [[ "${BLUE_GREEN}" != "true" ]]; then
            exit 0
          fi
          if [[ "${NB_COPROCESSOR}" == "1" ]]; then
            echo "::error::RFC-021 blue-green requires nb_coprocessor > 1 (unanimity across N operators)."
            exit 1
          fi
          if [[ "${DEPLOY_POLYGON}" == "true" ]]; then
            echo "::error::RFC-021 first-iteration blue-green is incompatible with deploy_polygon."
            exit 1
          fi
          gcs=$(jq -r .coprocessor_tfhe_worker <<<"${TAGS_JSON}")
          if [[ -z "${gcs}" || "${gcs}" == "null" ]]; then
            echo "::error::blue-green requires GCS images (build_images=true). coprocessor_tfhe_worker tag is empty."
            exit 1
          fi
          echo "RFC-021 blue-green: N=${NB_COPROCESSOR} BCS=${BCS_IMAGE_TAG} GCS=${gcs} (compiled 0.15.0)"

      ######################################################################
      # CHART SOURCES: every in-repo chart installs from this checkout's
      # charts/ directory, so a PR's chart changes deploy without waiting for
      # charts-helm-release. A *_chart_version dispatch override swaps that
      # one chart for the published OCI release, pulled once here - either
      # way the same ${*_CHART} path var feeds every install step below (no
      # per-step --version). None of these charts declares dependencies, so
      # no `helm dependency build` is needed for the local paths.
      ######################################################################
      - name: Resolve chart sources (this checkout, or a pulled OCI override)
        run: |
          chart_source() {
            local var="$1" name="$2" version="$3"
            if [[ -z "${version}" ]]; then
              echo "${var}=${GITHUB_WORKSPACE}/charts/${name}" >> "$GITHUB_ENV"
              echo "${name}: charts/${name} from this checkout"
              return
            fi
            local dir="${RUNNER_TEMP}/preview-charts/${name}"
            mkdir -p "${dir}"
            helm pull "${FHEVM_CHARTS_OCI_PREFIX}/${name}" --version "${version}" --untar --untardir "${dir}"
            echo "${var}=${dir}/${name}" >> "$GITHUB_ENV"
            echo "${name}: published OCI chart ${version} (dispatch override)"
          }
          chart_source ANVIL_NODE_CHART anvil-node "${ANVIL_NODE_CHART_VERSION}"
          chart_source CONTRACTS_CHART contracts "${CONTRACTS_CHART_VERSION}"
          chart_source COPROCESSOR_CHART coprocessor "${COPROCESSOR_CHART_VERSION}"
          chart_source KMS_CONNECTOR_CHART kms-connector "${KMS_CONNECTOR_CHART_VERSION}"
          chart_source LISTENER_CHART listener "${LISTENER_CHART_VERSION}"

      ######################################################################
      # NAMESPACE: destroy-then-recreate every run, cascading deletion of any
      # leftover Crossplane claims (coprocessor-infra, tkms-infra).
      ######################################################################
      - name: Reset namespace
        run: |
          if kubectl get namespace "${NAMESPACE}" > /dev/null 2>&1; then
            echo "Namespace ${NAMESPACE} already exists, destroying it first..."
            helm list -n "${NAMESPACE}" --short | xargs -r -L1 helm uninstall -n "${NAMESPACE}"
            kubectl delete namespace "${NAMESPACE}" --grace-period=1 --timeout=5s --wait=false
            kubectl wait --for=delete "namespace/${NAMESPACE}" --timeout=180s
          fi
          kubectl create namespace "${NAMESPACE}"

      - name: Grant dev-access groups RBAC on preview namespace
        run: |
          kubectl create rolebinding fhevm-ci-dev-binding \
            --clusterrole=admin \
            --group=coprocessor-dev-access \
            --group=kms-dev-access \
            -n "${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

      ######################################################################
      # OBSERVABILITY (opt-in via the `observability` dispatch input): an
      # in-namespace Prometheus + Jaeger (OTLP trace collector) + Grafana,
      # all via the generic `common` chart with official public images.
      # Public Docker Hub images, so no registry-credentials dependency.
      ######################################################################
      - name: Deploy observability stack (Prometheus + Grafana + Jaeger)
        if: env.OBSERVABILITY == 'true'
        run: |
          # Prometheus's RoleBinding SA subject must name the namespace
          # explicitly - same yq patch as the test-suite-workflow release.
          prom_values=$(mktemp --suffix=.yaml)
          cp ci/preview-env/observability/values-prometheus-e2e.yaml "${prom_values}"
          NS="${NAMESPACE}" yq -i \
            '(.additionalResources[] | select(.object.kind == "RoleBinding") | .object.subjects[0].namespace) = strenv(NS)' \
            "${prom_values}"
          # Launched in parallel, but each PID is waited on individually.
          pids=()
          helm upgrade --install prometheus "${COMMON_CHART}" --version "${COMMON_CHART_VERSION}" \
            -n "${NAMESPACE}" -f "${prom_values}" &
          pids+=($!)
          helm upgrade --install jaeger "${COMMON_CHART}" --version "${COMMON_CHART_VERSION}" \
            -n "${NAMESPACE}" -f ci/preview-env/observability/values-jaeger-e2e.yaml &
          pids+=($!)
          helm upgrade --install grafana "${COMMON_CHART}" --version "${COMMON_CHART_VERSION}" \
            -n "${NAMESPACE}" -f ci/preview-env/observability/values-grafana-e2e.yaml &
          pids+=($!)
          rc=0
          for pid in "${pids[@]}"; do
            wait "${pid}" || rc=1
          done
          if [[ "${rc}" -ne 0 ]]; then
            echo "::error::at least one observability release failed to install - see the helm output above"
            exit 1
          fi

      ######################################################################
      # DEDICATED KMS: reuse zama-ai/kms's own deploy pipeline
      # (thresholdWithEnclave, 4 or 13 parties) instead of re-deriving the wiring.
      # Side effect: deploy.sh also installs the namespace's
      # "registry-credentials" Secret (the name every fhevm chart's
      # imagePullSecrets hardcodes), so we don't install sync-secrets ourselves.
      ######################################################################
      - name: Sparse-checkout zama-ai/kms deploy scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: zama-ai/kms
          ref: ${{ env.KMS_REPO_REF }}
          token: ${{ secrets.BLOCKCHAIN_ACTIONS_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            ci/scripts
            ci/pr-preview/thresholdWithEnclave
            ci/pr-preview/registry-credential
            charts/kms-core
          path: .kms-deploy

      - name: Fetch enclave PCR values for KMS_CORE_TAG
        # kms's enclave images are labeled with zama.kms.eif_pcr{0,1,2} (wired
        # into kms-core's trustedReleases). deploy.sh reads them as PCR0/1/2.
        env:
          IMAGE_REPO: hub.zama.org/ghcr/zama-ai/kms
        run: |
          image="${IMAGE_REPO}/core-service-enclave:${KMS_CORE_TAG}"
          docker pull "${image}"
          inspect=$(docker inspect "${image}")
          for n in 0 1 2; do
            pcr=$(jq -r ".[0].Config.Labels[\"zama.kms.eif_pcr${n}\"]" <<<"${inspect}")
            # jq emits the literal "null" for a missing label and command
            # substitution never trips the step's -e, so an absent/empty PCR would
            # otherwise be written verbatim to GITHUB_ENV and only blow up far
            # later inside deploy.sh's --pcr${n} attestation wiring. Validate hex.
            if [[ ! "${pcr}" =~ ^[0-9a-fA-F]+$ ]]; then
              echo "::error::PCR${n} label zama.kms.eif_pcr${n} missing or non-hex on ${image} (got '${pcr}')"
              exit 1
            fi
            echo "PCR${n}=${pcr}" >> "$GITHUB_ENV"
          done

      ######################################################################
      # IN-CLUSTER DATABASES: plain Postgres StatefulSets via the generic
      # `common` chart (not Crossplane/RDS, not Bitnami - its images left the
      # free catalog). One instance per consumer (coprocessor, kms-connector,
      # relayer), mirroring prod's per-RDS topology. Deployed early: no
      # dependencies and ready in seconds.
      ######################################################################
      - name: Deploy in-cluster Postgres for coprocessor
        # One instance PER COPROCESSOR PARTY (postgres-coprocessor-<i>): each
        # independent coprocessor gets its own DB, same as postgres-connector-<i>
        # below. fullnameOverride per release; launched in parallel (seconds each).
        run: |
          for i in $(seq 1 "${NB_COPROCESSOR}"); do
            helm upgrade --install "postgres-coprocessor-${i}" "${COMMON_CHART}" --version "${COMMON_CHART_VERSION}" \
              -n "${NAMESPACE}" -f ci/preview-env/coprocessor-infra/values-postgres-coprocessor-e2e.yaml \
              --set-string "fullnameOverride=postgres-coprocessor-${i}" --wait &
          done
          wait

      - name: Deploy in-cluster Postgres for kms-connector
        # One instance PER PARTY (postgres-connector-<i>): one kms-connector
        # release per kms-core party, each needing its own DB. fullnameOverride
        # per release; launched in parallel since each takes only seconds.
        run: |
          for i in $(seq 1 "${NB_KMS_CORE}"); do
            helm upgrade --install "postgres-connector-${i}" "${COMMON_CHART}" --version "${COMMON_CHART_VERSION}" \
              -n "${NAMESPACE}" -f ci/preview-env/kms-connector/values-postgres-connector-e2e.yaml \
              --set-string "fullnameOverride=postgres-connector-${i}" --wait &
          done
          wait

      - name: Deploy in-cluster Postgres for listener
        # One instance PER COPROCESSOR PARTY (postgres-listener-<i>): the
        # dedicated listener producer keeps its own cursor DB, separate from the
        # coprocessor DB (see listener/values-postgres-listener-e2e.yaml).
        run: |
          for i in $(seq 1 "${NB_COPROCESSOR}"); do
            helm upgrade --install "postgres-listener-${i}" "${COMMON_CHART}" --version "${COMMON_CHART_VERSION}" \
              -n "${NAMESPACE}" -f ci/preview-env/listener/values-postgres-listener-e2e.yaml \
              --set-string "fullnameOverride=postgres-listener-${i}" --wait &
          done
          wait

      - name: Deploy in-cluster Postgres for polygon listener
        # One cursor DB PER COPROCESSOR PARTY for the Polygon listener
        # (postgres-listener-polygon-<i>), separate from the ETH listener's so
        # their schemas/migrations never collide. Same values file, new name.
        if: env.DEPLOY_POLYGON == 'true'
        run: |
          for i in $(seq 1 "${NB_COPROCESSOR}"); do
            helm upgrade --install "postgres-listener-polygon-${i}" "${COMMON_CHART}" --version "${COMMON_CHART_VERSION}" \
              -n "${NAMESPACE}" -f ci/preview-env/listener/values-postgres-listener-e2e.yaml \
              --set-string "fullnameOverride=postgres-listener-polygon-${i}" --wait &
          done
          wait

      - name: Deploy in-cluster Postgres for relayer + relayer-migrate
        run: |
          helm upgrade --install postgres-relayer "${COMMON_CHART}" --version "${COMMON_CHART_VERSION}" \
            -n "${NAMESPACE}" -f ci/preview-env/relayer/values-postgres-relayer-e2e.yaml --wait

      - name: Deploy dedicated KMS (kms's own ci/scripts/deploy.sh)
        working-directory: .kms-deploy
        env:
          # deploy.sh's parse_args takes CLI flags, not env vars, for these
          # (--tag sets both KMS_CORE_TAG and KMS_CLIENT_TAG). TLS is the one
          # env-var exception.
          TLS: "true"
        run: |
          # kms-core OTLP tracing: only when the observability stack is
          # deployed AND the pinned KMS_REPO_REF's deploy.sh already knows the
          # flag.
          tracing_args=()
          if [[ "${OBSERVABILITY}" == "true" ]]; then
            if grep -q -- "--tracing-endpoint" ci/scripts/lib/common.sh; then
              tracing_args=(--tracing-endpoint "${OTLP_ENDPOINT}")
            else
              echo "::warning::KMS_REPO_REF (${KMS_REPO_REF}) predates deploy.sh's --tracing-endpoint - kms-core traces disabled for this run; bump the pin to enable them"
            fi
          fi
          chmod +x ci/scripts/deploy.sh
          ./ci/scripts/deploy.sh \
            --target aws-ci \
            --namespace "${NAMESPACE}" \
            --deployment-type thresholdWithEnclave \
            --tag "${KMS_CORE_TAG}" \
            --num-parties "${NB_KMS_CORE}" \
            --pcr0 "${PCR0}" --pcr1 "${PCR1}" --pcr2 "${PCR2}" \
            "${tracing_args[@]}"

      - name: Discover KMS party signer addresses (S3 public vault)
        id: kms-identity
        # Each party generates its own signer identity (VerfAddress) on boot,
        # separate from keygen. deploy.sh only waits for pod readiness, which
        # can precede identity generation by minutes under Nitro attestation.
        #
        # All parties share one S3 bucket, segmented by a "PUB-p<i>/" prefix.
        # We resolve each party's VerfAddress OBJECT dynamically (newest key
        # under its own PUB-p<i>/VerfAddress/ prefix) instead of assuming a
        # single hardcoded handle: the handle drifts across kms-core versions,
        # and a stale object left in the shared bucket would otherwise hand us a
        # signer that no longer matches the running kms-core. A wrong signer here
        # scrambles the on-chain signer<->tx-sender pairing and makes every
        # prepKeygenResponse revert with KmsSignerDoesNotMatchTxSender, so keygen
        # consensus is never reached and only preprocessing ever runs.
        # FALLBACK_HANDLE is used only if anonymous bucket listing is disabled.
        # Emits s3_endpoint and signers_json (one JSON blob, since step outputs
        # can't be addressed by a looped name later).
        env:
          FALLBACK_HANDLE: "60b7070add74be3827160aa635fb255eeeeb88586c4debf7ab1134ddceb4beee"
        run: |
          s3_endpoint=$(kubectl get configmap "${NAMESPACE}-1" -n "${NAMESPACE}" \
            -o jsonpath='{.data.CORE_CLIENT__S3_ENDPOINT}' 2>/dev/null || echo "")
          if [[ -z "${s3_endpoint}" ]]; then
            echo "::error::could not read public vault bucket from configmap ${NAMESPACE}-1"
            exit 1
          fi
          echo "s3_endpoint=${s3_endpoint}" >> "$GITHUB_OUTPUT"

          signers_json=$(S3_ENDPOINT="${s3_endpoint}" node ci/preview-env/scripts/discover-kms-signers.mjs)
          echo "signers_json=${signers_json}" >> "$GITHUB_OUTPUT"

      # TX-SENDER WALLETS: Anvil uses the well-known Foundry mnemonic (120
      # prefunded accounts). blockchain-dev generates a fresh mnemonic and
      # funds the derived addresses from the in-cluster faucets.
      - name: Capture host head block (blockchain-dev)
        if: env.USE_BLOCKCHAIN_DEV == 'true'
        run: |
          raw=$(bash ci/preview-env/scripts/cluster-rpc.sh "${HOST_HTTP}" \
            '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}')
          hex=$(jq -r '.result' <<<"${raw}")
          if [[ ! "${hex}" =~ ^0x[0-9a-fA-F]+$ ]]; then
            echo "::error::could not read host eth_blockNumber from ${HOST_HTTP} (got '${hex}'; raw='${raw}')"
            exit 1
          fi
          echo "HEAD_BLOCK=$((hex))" >> "$GITHUB_ENV"
          echo "blockchain-dev host head block $((hex))"

      - name: Install ethers for wallet derivation
        run: |
          mkdir -p /tmp/wallet-tools && cd /tmp/wallet-tools
          npm install --silent --no-save ethers@6

      - name: Generate preview mnemonic (blockchain-dev)
        if: env.USE_BLOCKCHAIN_DEV == 'true'
        env:
          NODE_PATH: /tmp/wallet-tools/node_modules
          ROLES_JSON_PATH: /tmp/preview-role-wallets.json
        run: |
          node ci/preview-env/scripts/generate-mnemonic.cjs
          echo "ROLES_JSON_PATH=/tmp/preview-role-wallets.json" >> "$GITHUB_ENV"
          mnemonic=$(jq -r .mnemonic /tmp/preview-role-wallets.json)
          kubectl create secret generic preview-wallets-mnemonic -n "${NAMESPACE}" \
            --from-literal=mnemonic="${mnemonic}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Derive KMS tx-sender wallets
        id: kms-wallets
        # KMS tx-senders (submit KMS responses on-chain). Offset 10 to avoid
        # indices used elsewhere in this namespace.
        env:
          NODE_PATH: /tmp/wallet-tools/node_modules
          COUNT: ${{ env.NB_KMS_CORE }}
          HD_OFFSET: "10"
          OUTPUT_KEY: wallets_json
          LABEL: KMS tx-sender
        run: node ci/preview-env/scripts/derive-wallets.cjs

      - name: Derive coprocessor tx-sender wallets
        id: coproc-wallets
        # Per-party coprocessor identity (tx-sender = signer).
        env:
          NODE_PATH: /tmp/wallet-tools/node_modules
          COUNT: ${{ env.NB_COPROCESSOR }}
          OUTPUT_KEY: wallets_json
          LABEL: coprocessor tx-sender
        run: |
          # Start immediately after the KMS tx-sender range (10 .. 10+NB_KMS_CORE-1)
          # so it never overlaps them for ANY party count - a fixed offset (e.g. 20)
          # collides once nb_kms_core > 10 (the 13-party option spans 10..22),
          # reusing a KMS wallet as a coprocessor tx-sender/signer. This also stays
          # clear of the test signers (#0..#4) and the ACL owner (#9). GitHub
          # expressions have no arithmetic, so compute the offset here.
          HD_OFFSET=$((10 + NB_KMS_CORE))
          export HD_OFFSET
          echo "Coprocessor HD offset: ${HD_OFFSET} (KMS parties: ${NB_KMS_CORE})"
          node ci/preview-env/scripts/derive-wallets.cjs

      - name: Fund wallets from blockchain-dev faucets
        if: env.USE_BLOCKCHAIN_DEV == 'true'
        env:
          WALLETS_JSON: ${{ steps.kms-wallets.outputs.wallets_json }}
          COPROC_WALLETS_JSON: ${{ steps.coproc-wallets.outputs.wallets_json }}
        run: bash ci/preview-env/scripts/fund-wallets.sh

      - name: Apply blockchain-dev values overlays
        if: env.USE_BLOCKCHAIN_DEV == 'true'
        run: bash ci/preview-env/scripts/apply-chain-env.sh

      ######################################################################
      # BLOCKCHAIN: per-PR anvil host + gateway chains, fully isolated.
      # Skipped when use_blockchain_dev points at the shared Geth/Nitro nodes.
      ######################################################################
      - name: Deploy anvil-host
        if: env.USE_BLOCKCHAIN_DEV != 'true'
        run: |
          helm upgrade --install anvil-host "${ANVIL_NODE_CHART}" \
            -n "${NAMESPACE}" -f ci/preview-env/host-chain/values-anvil-host-e2e.yaml --wait

      - name: Deploy anvil-gateway
        if: env.USE_BLOCKCHAIN_DEV != 'true'
        run: |
          helm upgrade --install anvil-gateway "${ANVIL_NODE_CHART}" \
            -n "${NAMESPACE}" -f ci/preview-env/gateway-chain/values-anvil-gateway-e2e.yaml --wait

      - name: Deploy anvil-host-polygon
        # Second (Polygon Amoy, 80002) host chain - fresh local anvil, no fork.
        if: env.DEPLOY_POLYGON == 'true' && env.USE_BLOCKCHAIN_DEV != 'true'
        run: |
          helm upgrade --install anvil-host-polygon "${ANVIL_NODE_CHART}" \
            -n "${NAMESPACE}" -f ci/preview-env/host-chain/values-anvil-host-polygon-e2e.yaml --wait

      ######################################################################
      # COPROCESSOR INFRA: real S3 bucket via Crossplane (same chart as
      # fhevm-dev). Deployed BEFORE the contracts so the gateway-contracts
      # wiring step can read the real bucket name and register it on-chain as
      # the coprocessor's ciphertext S3 URL (COPROCESSOR_S3_BUCKET_URL_0) -
      # otherwise the KMS worker fetches ct128 from a placeholder bucket and
      # user-decrypt 404s. The claim reconciles asynchronously, so we poll
      # rather than rely on `helm --wait` alone.
      ######################################################################
      - name: Deploy coprocessor-infra (Crossplane S3)
        # One release PER COPROCESSOR PARTY (coprocessor-infra-<i>): each gets its
        # own S3 bucket, its own IRSA ServiceAccount (coprocessor-<i>, consumed by
        # that party's S3-touching workers) and its own bucket ConfigMap
        # (coprocessor-<i>, holding S3_BUCKET_NAME). Per-party names come from
        # --set; the base values file stays single.
        run: |
          for i in $(seq 1 "${NB_COPROCESSOR}"); do
            helm upgrade --install "coprocessor-infra-${i}" "${COPROCESSOR_INFRA_CHART}" --version "${COPROCESSOR_INFRA_CHART_VERSION}" \
              -n "${NAMESPACE}" -f ci/preview-env/coprocessor-infra/values-coprocessor-infra-e2e.yaml \
              --set "coprocessorBucket.irsa.serviceAccountName=coprocessor-${i}" \
              --set "coprocessorBucket.configMapTargetRef.name=coprocessor-${i}" --wait &
          done
          wait

      - name: Wait for coprocessor-infra to reconcile
        env:
          NAME_PREFIX: coprocessor-infra-
        run: bash ci/preview-env/scripts/wait-crossplane-s3.sh

      ######################################################################
      # CONTRACTS: gateway first, then host (needs gateway's Decryption /
      # InputVerification addresses), then register the host chain into gateway.
      ######################################################################
      - name: Wire real KMS node info into gateway-contracts values
        id: gateway-contracts-values
        env:
          TARGET: gateway
          SIGNERS_JSON: ${{ steps.kms-identity.outputs.signers_json }}
          WALLETS_JSON: ${{ steps.kms-wallets.outputs.wallets_json }}
          COPROC_WALLETS_JSON: ${{ steps.coproc-wallets.outputs.wallets_json }}
          S3_ENDPOINT: ${{ steps.kms-identity.outputs.s3_endpoint }}
        run: bash ci/preview-env/scripts/wire-contracts-values.sh

      - name: Deploy gateway-contracts
        env:
          # Via env (not inline ${{ }}) so the step-output value is never
          # interpolated into the shell script itself (zizmor template-injection).
          VALUES_FILE: ${{ steps.gateway-contracts-values.outputs.values_file }}
        run: |
          helm upgrade --install gateway-contracts "${CONTRACTS_CHART}" \
            -n "${NAMESPACE}" -f "${VALUES_FILE}" \
            --set-string "scDeploy.image.tag=$(jq -r .gateway_contracts <<<"${TAGS_JSON}")" \
            --wait --wait-for-jobs --timeout=10m

      - name: Wire real KMS node info into host-contracts values
        id: host-contracts-values
        # Mirrors the gateway wiring, with host-contracts' own field names
        # (KMS_NODE_IP_x vs KMS_NODE_IP_ADDRESS_x, KMS_GEN_THRESHOLD vs
        # KMS_GENERATION_THRESHOLD) and only the coprocessor SIGNER on-chain (the
        # host InputVerifier verifies each proof against COPROCESSOR_SIGNER_x, so
        # they must be the SAME derived wallets the gateway registered).
        env:
          TARGET: host
          SIGNERS_JSON: ${{ steps.kms-identity.outputs.signers_json }}
          WALLETS_JSON: ${{ steps.kms-wallets.outputs.wallets_json }}
          COPROC_WALLETS_JSON: ${{ steps.coproc-wallets.outputs.wallets_json }}
          S3_ENDPOINT: ${{ steps.kms-identity.outputs.s3_endpoint }}
        run: bash ci/preview-env/scripts/wire-contracts-values.sh

      - name: Deploy host-contracts
        env:
          # Via env (not inline ${{ }}) so the step-output value is never
          # interpolated into the shell script itself (zizmor template-injection).
          VALUES_FILE: ${{ steps.host-contracts-values.outputs.values_file }}
        run: |
          helm upgrade --install host-contracts "${CONTRACTS_CHART}" \
            -n "${NAMESPACE}" -f "${VALUES_FILE}" \
            --set-string "scDeploy.image.tag=$(jq -r .host_contracts <<<"${TAGS_JSON}")" \
            --wait --wait-for-jobs --timeout=10m

      - name: Register host chain into gateway
        run: |
          helm upgrade --install gateway-add-host-chains "${CONTRACTS_CHART}" \
            -n "${NAMESPACE}" -f ci/preview-env/gateway-chain/values-gateway-add-host-chains-e2e.yaml \
            --set-string "scDeploy.image.tag=$(jq -r .gateway_contracts <<<"${TAGS_JSON}")" \
            --wait --wait-for-jobs --timeout=10m

      ######################################################################
      # POLYGON CONTRACTS (deploy_polygon only): deploy host-contracts on the
      # Polygon anvil, mirroring the canonical ETH ProtocolConfig (reuses the
      # ETH KMS key, no second keygen), then register chain 80002 into gateway.
      # Runs AFTER the ETH host-contracts (needs its protocol_config as the
      # canonical source) and gateway-contracts (Decryption/InputVerification).
      ######################################################################
      - name: Wire real KMS node info into host-contracts-polygon values
        id: host-contracts-polygon-values
        if: env.DEPLOY_POLYGON == 'true'
        env:
          TARGET: host-polygon
          SIGNERS_JSON: ${{ steps.kms-identity.outputs.signers_json }}
          WALLETS_JSON: ${{ steps.kms-wallets.outputs.wallets_json }}
          COPROC_WALLETS_JSON: ${{ steps.coproc-wallets.outputs.wallets_json }}
          S3_ENDPOINT: ${{ steps.kms-identity.outputs.s3_endpoint }}
        run: bash ci/preview-env/scripts/wire-contracts-values.sh

      - name: Deploy host-contracts-polygon
        if: env.DEPLOY_POLYGON == 'true'
        env:
          VALUES_FILE: ${{ steps.host-contracts-polygon-values.outputs.values_file }}
        run: |
          helm upgrade --install host-contracts-polygon "${CONTRACTS_CHART}" \
            -n "${NAMESPACE}" -f "${VALUES_FILE}" \
            --set-string "scDeploy.image.tag=$(jq -r .host_contracts <<<"${TAGS_JSON}")" \
            --wait --wait-for-jobs --timeout=10m

      - name: Register polygon host chain into gateway
        if: env.DEPLOY_POLYGON == 'true'
        run: |
          helm upgrade --install gateway-add-host-chains-polygon "${CONTRACTS_CHART}" \
            -n "${NAMESPACE}" -f ci/preview-env/gateway-chain/values-gateway-add-host-chains-polygon-e2e.yaml \
            --set-string "scDeploy.image.tag=$(jq -r .gateway_contracts <<<"${TAGS_JSON}")" \
            --wait --wait-for-jobs --timeout=10m

      ######################################################################
      # COPROCESSOR + KMS-CONNECTOR: real contract addresses (configMapKeyRef
      # in the values files) + real dedicated-KMS endpoints. DB endpoints are
      # already static in the values files (in-cluster Postgres).
      ######################################################################
      - name: Deploy coprocessor-redis (per-party host-listener-consumer broker)
        # One Redis PER COPROCESSOR PARTY (coprocessor-redis-<i>): the broker
        # between that party's listener producer and its host-listener-consumer
        # (see values-coprocessor-redis-e2e.yaml). Deployed before the listener +
        # coprocessor releases so redis://coprocessor-redis-<i>-master:6379
        # resolves when they start.
        run: |
          for i in $(seq 1 "${NB_COPROCESSOR}"); do
            helm upgrade --install "coprocessor-redis-${i}" "${REDIS_CHART}" --version "${REDIS_CHART_VERSION}" \
              -n "${NAMESPACE}" -f ci/preview-env/coprocessor/values-coprocessor-redis-e2e.yaml \
              --set-string "fullnameOverride=coprocessor-redis-${i}" --wait &
          done
          wait

      - name: Deploy listener (per-party host-chain event producer)
        # One listener PER COPROCESSOR PARTY (listener-<i>): indexes the host
        # chain and publishes events to that party's Redis (coprocessor-redis-<i>),
        # which the coprocessor host-listener-consumer then ingests. Replaces the
        # coprocessor chart's built-in hostListener/poller (disabled in
        # values-coprocessor-e2e.yaml). Its own cursor DB is postgres-listener-<i>.
        run: |
          for i in $(seq 1 "${NB_COPROCESSOR}"); do
            helm upgrade --install "listener-${i}" "${LISTENER_CHART}" \
              -n "${NAMESPACE}" -f ci/preview-env/listener/values-listener-e2e.yaml \
              --set-string "image.tag=$(jq -r .listener <<<"${TAGS_JSON}")" \
              --set-string "env[0].value=postgresql://zama:zama@postgres-listener-${i}:5432/listener?sslmode=disable" \
              --set-string "env[1].value=redis://coprocessor-redis-${i}-master:6379" &
          done
          wait

      - name: Deploy polygon listener (per-party Polygon event producer)
        # One Polygon listener PER COPROCESSOR PARTY (listener-polygon-<i>):
        # indexes the Polygon anvil and publishes chain-80002 events to the SAME
        # per-party Redis the ETH listener uses; the coprocessor's polygon
        # host-listener-consumer filters that chain out by --chain-id. Own cursor
        # DB (postgres-listener-polygon-<i>).
        if: env.DEPLOY_POLYGON == 'true'
        run: |
          for i in $(seq 1 "${NB_COPROCESSOR}"); do
            helm upgrade --install "listener-polygon-${i}" "${LISTENER_CHART}" \
              -n "${NAMESPACE}" -f ci/preview-env/listener/values-listener-polygon-e2e.yaml \
              --set-string "image.tag=$(jq -r .listener <<<"${TAGS_JSON}")" \
              --set-string "env[0].value=postgresql://zama:zama@postgres-listener-polygon-${i}:5432/listener?sslmode=disable" \
              --set-string "env[1].value=redis://coprocessor-redis-${i}-master:6379" &
          done
          wait

      - name: Deploy coprocessor
        # One release PER COPROCESSOR PARTY (coprocessor-<i>), each with its own
        # Postgres (postgres-coprocessor-<i>), IRSA SA + S3 bucket ConfigMap
        # (coprocessor-<i>, from coprocessor-infra-<i>) and tx-sender/sns-worker
        # identity (the derived coprocessor wallet, same address registered on the
        # gateway as COPROCESSOR_*_ADDRESS_<i-1>; the sns-worker signs ciphertext
        # attestations with it, and its own Redis broker (coprocessor-redis-<i>).
        # Image tags are shared across parties.
        #
        # RFC-021 blue-green: that release is the BCS fleet (pinned
        # BCS_IMAGE_TAG). A second release coprocessor-<i>-gcs is the GCS
        # fleet (HEAD images compiled as 0.15.0). Gateway registration stays N.
        env:
          COPROC_WALLETS_JSON: ${{ steps.coproc-wallets.outputs.wallets_json }}
        run: |
          # deploy_polygon: append the Polygon SEED overlay. It adds Polygon (80002)
          # to this release's chains[] so dbMigration seeds its host_chains row, with
          # ALL Polygon roles DISABLED - the actual Polygon consumer/poller run in
          # their own single-chain releases (deployed in the steps below), because
          # the chart glues consecutive per-chain documents and two enabled consumers
          # in one render collapse into one (see values-coprocessor-polygon-e2e.yaml).
          # Extra -f applied after the base file.
          polygon_args=()
          if [[ "${DEPLOY_POLYGON}" == "true" ]]; then
            polygon_args=(-f ci/preview-env/coprocessor/values-coprocessor-polygon-e2e.yaml)
          fi
          bcs_overlay=()
          if [[ "${BLUE_GREEN}" == "true" ]]; then
            bcs_overlay=(-f ci/preview-env/coprocessor/values-coprocessor-bcs-e2e.yaml)
          fi
          # Helm --set-string must be two argv (--set-string, key=value).
          # mapfile + `echo --set-string k=v` collapses them into one and helm
          # reports "unknown flag: --set-string <key>".
          party_common() {
            local i="$1" privkey="$2" suffix="${3:-}"
            common_args=(
              --set-string "commonConfig.databaseEndpoint.value=postgres-coprocessor-${i}:5432"
              --set-string "hostListenerShared.serviceAccountName=coprocessor-${i}"
              --set-string "hostListenerPollerShared.serviceAccountName=coprocessor-${i}"
              --set-string "hostListenerCatchupOnlyShared.serviceAccountName=coprocessor-${i}"
              --set-string "hostListenerConsumerShared.serviceAccountName=coprocessor-${i}"
              --set-string "tfheWorker.serviceAccountName=coprocessor-${i}"
              --set-string "zkProofWorker.serviceAccountName=coprocessor-${i}"
              --set-string "snsWorker.serviceAccountName=coprocessor-${i}"
              --set "snsWorker.config.s3BucketName.valueFrom.configMapKeyRef.name=coprocessor-${i}"
              --set-string "hostListenerConsumerShared.config.brokerUrl.value=redis://coprocessor-redis-${i}-master:6379"
              --set-string "txSender.wallet.secret.value=${privkey}"
              --set-string "snsWorker.wallet.secret.value=${privkey}"
            )
            if [[ "${OBSERVABILITY}" == "true" ]]; then
              common_args+=(
                --set "commonConfig.tracing.enabled=true"
                --set-string "commonConfig.tracing.endpoint=${OTLP_ENDPOINT}"
                --set-string "gwListener.tracing.service=gw-listener-${i}${suffix}"
                --set-string "tfheWorker.tracing.service=tfhe-worker-${i}${suffix}"
                --set-string "zkProofWorker.tracing.service=zkproof-worker-${i}${suffix}"
                --set-string "snsWorker.tracing.service=sns-worker-${i}${suffix}"
                --set-string "txSender.tracing.service=tx-sender-${i}${suffix}"
                --set-string "hostListenerConsumerShared.tracing.service=host-listener-consumer-${i}${suffix}"
              )
            fi
          }
          image_tags() {
            local tag="$1"
            bcs_images=(
              --set-string "gwListener.image.tag=${tag}"
              --set-string "hostListenerShared.image.tag=${tag}"
              --set-string "hostListenerPollerShared.image.tag=${tag}"
              --set-string "hostListenerCatchupOnlyShared.image.tag=${tag}"
              --set-string "hostListenerConsumerShared.image.tag=${tag}"
              --set-string "snsWorker.image.tag=${tag}"
              --set-string "tfheWorker.image.tag=${tag}"
              --set-string "txSender.image.tag=${tag}"
              --set-string "zkProofWorker.image.tag=${tag}"
            )
          }
          for i in $(seq 1 "${NB_COPROCESSOR}"); do
            privkey=$(jq -r --argjson party "${i}" '.[] | select(.party == $party) | .privateKey' <<<"${COPROC_WALLETS_JSON}")
            if [[ -z "${privkey}" || "${privkey}" == "null" ]]; then
              echo "::error::no derived coprocessor wallet for party ${i} in coproc_wallets_json=${COPROC_WALLETS_JSON}"; exit 1
            fi
            if [[ "${BLUE_GREEN}" == "true" ]]; then
              image_tags "${BCS_IMAGE_TAG}"
            else
              # Per-component tags (they can differ when only some images rebuilt).
              bcs_images=(
                --set-string "gwListener.image.tag=$(jq -r .coprocessor_gw_listener <<<"${TAGS_JSON}")"
                --set-string "hostListenerShared.image.tag=$(jq -r .coprocessor_host_listener <<<"${TAGS_JSON}")"
                --set-string "hostListenerPollerShared.image.tag=$(jq -r .coprocessor_host_listener <<<"${TAGS_JSON}")"
                --set-string "hostListenerCatchupOnlyShared.image.tag=$(jq -r .coprocessor_host_listener <<<"${TAGS_JSON}")"
                --set-string "hostListenerConsumerShared.image.tag=$(jq -r .coprocessor_host_listener <<<"${TAGS_JSON}")"
                --set-string "snsWorker.image.tag=$(jq -r .coprocessor_sns_worker <<<"${TAGS_JSON}")"
                --set-string "tfheWorker.image.tag=$(jq -r .coprocessor_tfhe_worker <<<"${TAGS_JSON}")"
                --set-string "txSender.image.tag=$(jq -r .coprocessor_tx_sender <<<"${TAGS_JSON}")"
                --set-string "zkProofWorker.image.tag=$(jq -r .coprocessor_zkproof_worker <<<"${TAGS_JSON}")"
              )
            fi
            party_common "${i}" "${privkey}"
            fleet_json=()
            if [[ "${BLUE_GREEN}" == "true" ]]; then
              fleet_json=(--set-json "commonConfig.extraSelectorLabels={\"fhevm.zama.ai/fleet\":\"${i}-bcs\"}")
            fi
            helm upgrade --install "coprocessor-${i}" "${COPROCESSOR_CHART}" \
              -n "${NAMESPACE}" -f ci/preview-env/coprocessor/values-coprocessor-e2e.yaml \
              "${polygon_args[@]}" \
              "${bcs_overlay[@]}" \
              "${fleet_json[@]}" \
              --set-string "fullnameOverride=coprocessor-${i}" \
              --set-string "dbMigration.image.tag=$(jq -r .coprocessor_db_migration <<<"${TAGS_JSON}")" \
              "${common_args[@]}" \
              "${bcs_images[@]}"
          done
          if [[ "${BLUE_GREEN}" == "true" ]]; then
            for i in $(seq 1 "${NB_COPROCESSOR}"); do
              kubectl wait --for=condition=complete \
                "job/coprocessor-${i}-db-migration-1" -n "${NAMESPACE}" --timeout=180s \
                || kubectl wait --for=condition=complete \
                  -l app=coprocessor-db-migration,app.kubernetes.io/name="coprocessor-${i}-db-migration" \
                  job -n "${NAMESPACE}" --timeout=180s
            done
            # BCS zkproof (v0.14.0-7) snapshots host_chains once at process
            # start. helm applies the Deployment in parallel with db-migration,
            # so a party whose seed finishes a second later keeps
            # `chain_id = ANY('{}')` forever and never claims proofs. Restart
            # after seed so both parties see 1337.
            for i in $(seq 1 "${NB_COPROCESSOR}"); do
              kubectl rollout restart "deploy/coprocessor-${i}-zkproof-worker" -n "${NAMESPACE}"
              kubectl rollout status "deploy/coprocessor-${i}-zkproof-worker" -n "${NAMESPACE}" --timeout=180s
            done
            for i in $(seq 1 "${NB_COPROCESSOR}"); do
              privkey=$(jq -r --argjson party "${i}" '.[] | select(.party == $party) | .privateKey' <<<"${COPROC_WALLETS_JSON}")
              party_common "${i}" "${privkey}" "-gcs"
              # Same repos/tags as the regular coprocessor CI build (compiled 0.15.0).
              gcs_images=(
                --set-string "gwListener.image.tag=$(jq -r .coprocessor_gw_listener <<<"${TAGS_JSON}")"
                --set-string "hostListenerShared.image.tag=$(jq -r .coprocessor_host_listener <<<"${TAGS_JSON}")"
                --set-string "hostListenerPollerShared.image.tag=$(jq -r .coprocessor_host_listener <<<"${TAGS_JSON}")"
                --set-string "hostListenerCatchupOnlyShared.image.tag=$(jq -r .coprocessor_host_listener <<<"${TAGS_JSON}")"
                --set-string "hostListenerConsumerShared.image.tag=$(jq -r .coprocessor_host_listener <<<"${TAGS_JSON}")"
                --set-string "snsWorker.image.tag=$(jq -r .coprocessor_sns_worker <<<"${TAGS_JSON}")"
                --set-string "tfheWorker.image.tag=$(jq -r .coprocessor_tfhe_worker <<<"${TAGS_JSON}")"
                --set-string "txSender.image.tag=$(jq -r .coprocessor_tx_sender <<<"${TAGS_JSON}")"
                --set-string "zkProofWorker.image.tag=$(jq -r .coprocessor_zkproof_worker <<<"${TAGS_JSON}")"
                # UC/CD share this run's SHA with the force-built workers (not in TAGS_JSON).
                --set-string "upgradeController.image.tag=$(jq -r .coprocessor_tfhe_worker <<<"${TAGS_JSON}")"
                --set-string "consensusDetector.image.tag=$(jq -r .coprocessor_tfhe_worker <<<"${TAGS_JSON}")"
              )
              helm upgrade --install "coprocessor-${i}-gcs" "${COPROCESSOR_CHART}" \
                -n "${NAMESPACE}" -f ci/preview-env/coprocessor/values-coprocessor-e2e.yaml \
                -f ci/preview-env/coprocessor/values-coprocessor-gcs-e2e.yaml \
                --set-json "commonConfig.extraSelectorLabels={\"fhevm.zama.ai/fleet\":\"${i}-gcs\"}" \
                --set-string "fullnameOverride=coprocessor-${i}-gcs" \
                --set-string "upgradeController.serviceAccountName=coprocessor-${i}" \
                --set-string "consensusDetector.serviceAccountName=coprocessor-${i}" \
                --set "snsWorker.config.s3BucketName.valueFrom.configMapKeyRef.name=coprocessor-${i}" \
                "${common_args[@]}" \
                "${gcs_images[@]}"
            done
          fi
          sleep 60

      - name: Deploy polygon coprocessor consumer (per-party Polygon consumer)
        # One Polygon host-listener-consumer PER COPROCESSOR PARTY
        # (coprocessor-polygon-<i>), as its OWN single-chain release. Deployed
        # SEPARATELY from the ETH consumer (coprocessor-<i>) because the coprocessor
        # chart glues consecutive per-chain YAML documents together, so two enabled
        # consumers in one render collapse into one and the ETH consumer is silently
        # dropped (see values-coprocessor-polygon-consumer-e2e.yaml). Shares this
        # party's Postgres (host_chains already seeded by coprocessor-<i>'s
        # dbMigration) and Redis; ingests chain-80002 events published by
        # listener-polygon-<i>.
        if: env.DEPLOY_POLYGON == 'true'
        run: |
          for i in $(seq 1 "${NB_COPROCESSOR}"); do
            helm upgrade --install "coprocessor-polygon-${i}" "${COPROCESSOR_CHART}" \
              -n "${NAMESPACE}" -f ci/preview-env/coprocessor/values-coprocessor-polygon-consumer-e2e.yaml \
              --set-string "commonConfig.databaseEndpoint.value=postgres-coprocessor-${i}:5432" \
              --set-string "hostListenerConsumerShared.serviceAccountName=coprocessor-${i}" \
              --set-string "hostListenerConsumerShared.config.brokerUrl.value=redis://coprocessor-redis-${i}-master:6379" \
              --set-string "hostListenerConsumerShared.image.tag=$(jq -r .coprocessor_host_listener <<<"${TAGS_JSON}")" &
          done
          wait

      - name: Deploy coprocessor-poller (per-party key/CRS activation)
        # One poller release PER COPROCESSOR PARTY (coprocessor-poller-<i>), the
        # DB-side background processor that, on a pending kms_key_activation /
        # kms_crs_activation row, DOWNLOADS the ServerKey/PublicKey/CRS material
        # from the KMS public-vault S3 and fills the `keys`/`crs` tables the
        # tfhe/zkproof/sns workers read (see values-coprocessor-poller-e2e.yaml).
        # Mirrors zama-zws/gitops's eth-coproc-listener-poller. Neither the
        # listener producer nor the host-listener-consumer performs that S3
        # download - only the poller does.
        #
        # ORDER MATTERS: this MUST run BEFORE "Trigger KMS keygen" below. The
        # poller anchors at MAX(block) of the (currently empty) coprocessor DB,
        # i.e. block 0 on a fresh anvil, and finalizes blocks IN ORDER as it
        # walks forward. Started before keygen it finalizes the keygen blocks the
        # moment they are mined, so `keys`/`crs` populate within seconds. Started
        # AFTER keygen it would anchor past those blocks and have to grind the
        # entire finalization backlog back down first (minutes), during which the
        # activation gate (block_status='finalized') is unmet and every worker
        # fails "No keys found in database". Shares postgres-coprocessor-<i> with
        # the coprocessor-<i> release, which already ran dbMigration (this release
        # has dbMigration disabled).
        run: |
          for i in $(seq 1 "${NB_COPROCESSOR}"); do
            # Same OTLP tracing gate as the coprocessor step above.
            tracing=()
            if [[ "${OBSERVABILITY}" == "true" ]]; then
              tracing=(
                --set "commonConfig.tracing.enabled=true"
                --set-string "commonConfig.tracing.endpoint=${OTLP_ENDPOINT}"
                --set-string "hostListenerPollerShared.tracing.service=host-listener-poller-${i}"
              )
            fi
            helm upgrade --install "coprocessor-poller-${i}" "${COPROCESSOR_CHART}" \
              -n "${NAMESPACE}" -f ci/preview-env/coprocessor/values-coprocessor-poller-e2e.yaml \
              --set-string "commonConfig.databaseEndpoint.value=postgres-coprocessor-${i}:5432" \
              --set-string "hostListenerPollerShared.serviceAccountName=coprocessor-${i}" \
              --set-string "hostListenerPollerShared.image.tag=$(jq -r .coprocessor_host_listener <<<"${TAGS_JSON}")" \
              "${tracing[@]}" &
          done
          wait

      - name: Deploy polygon coprocessor-poller (per-party Polygon finalization)
        # One Polygon poller PER COPROCESSOR PARTY (coprocessor-poller-polygon-<i>),
        # as its OWN single-chain release (same separator-collision reason as the
        # Polygon consumer above). Finalizes Polygon blocks so the Polygon consumer's
        # block_status='finalized' gate is met. dbMigration disabled - coprocessor-<i>
        # already seeded host_chains for both chains.
        if: env.DEPLOY_POLYGON == 'true'
        run: |
          for i in $(seq 1 "${NB_COPROCESSOR}"); do
            helm upgrade --install "coprocessor-poller-polygon-${i}" "${COPROCESSOR_CHART}" \
              -n "${NAMESPACE}" -f ci/preview-env/coprocessor/values-coprocessor-poller-polygon-e2e.yaml \
              --set-string "commonConfig.databaseEndpoint.value=postgres-coprocessor-${i}:5432" \
              --set-string "hostListenerPollerShared.serviceAccountName=coprocessor-${i}" \
              --set-string "hostListenerPollerShared.image.tag=$(jq -r .coprocessor_host_listener <<<"${TAGS_JSON}")" &
          done
          wait

      - name: Create kms-connector-tx-sender secrets
        env:
          WALLETS_JSON: ${{ steps.kms-wallets.outputs.wallets_json }}
        run: |
          # One Secret PER PARTY: kms-connector's chart needs the wallet Secret
          # to exist before install (no literal option like coprocessor's txSender).
          for i in $(seq 1 "${NB_KMS_CORE}"); do
            private_key=$(jq -r --argjson party "${i}" '.[] | select(.party == $party) | .privateKey' <<<"${WALLETS_JSON}")
            if [[ -z "${private_key}" || "${private_key}" == "null" ]]; then
              echo "::error::no derived tx-sender wallet for party ${i} in wallets_json=${WALLETS_JSON}"
              exit 1
            fi
            kubectl create secret generic "kms-connector-tx-sender-${i}" -n "${NAMESPACE}" \
              --from-literal=kms-wallet="${private_key}" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      - name: Deploy kms-connector
        run: |
          # One kms-connector release PER party (kms-connector-<i>), each wired
          # to its own co-located kms-core, DB (postgres-connector-<i>), and
          # tx-sender Secret. Contract addresses are shared namespace-wide,
          # discovered once and reused; this chart's *ContractAddresses are
          # plain strings (no configMapKeyRef).
          require_nonempty() {
            if [[ -z "${2}" ]]; then
              echo "::error::${1} is empty - refusing to deploy kms-connector with a broken config (see the step that should have populated it above)"
              exit 1
            fi
          }
          decryption=$(kubectl get configmap gw-sc-addresses -n "${NAMESPACE}" -o jsonpath='{.data.decryption\.address}')
          gateway_config=$(kubectl get configmap gw-sc-addresses -n "${NAMESPACE}" -o jsonpath='{.data.gateway_config\.address}')
          kms_generation=$(kubectl get configmap host-sc-addresses -n "${NAMESPACE}" -o jsonpath='{.data.kms_generation\.address}')
          # protocol_config: chart 1.5.4 requires the ProtocolConfig address for
          # every connector component (gw-listener/kms-worker/tx-sender all render
          # KMS_CONNECTOR_PROTOCOL_CONFIG_CONTRACT__ADDRESS); missing it aborts
          # startup with "ProtocolConfig address is not configured".
          protocol_config=$(kubectl get configmap host-sc-addresses -n "${NAMESPACE}" -o jsonpath='{.data.protocol_config\.address}')
          acl=$(kubectl get configmap host-sc-addresses -n "${NAMESPACE}" -o jsonpath='{.data.acl\.address}')
          require_nonempty "gw-sc-addresses[decryption.address]" "${decryption}"
          require_nonempty "gw-sc-addresses[gateway_config.address]" "${gateway_config}"
          require_nonempty "host-sc-addresses[kms_generation.address]" "${kms_generation}"
          require_nonempty "host-sc-addresses[protocol_config.address]" "${protocol_config}"
          require_nonempty "host-sc-addresses[acl.address]" "${acl}"
          # deploy_polygon: add the Polygon host chain to the kms-worker's
          # hostChains (overlay) + inject its ACL (plain string, no configMapKeyRef
          # support in this chart) so the KMS can verify Polygon ciphertext ACLs.
          polygon_args=()
          if [[ "${DEPLOY_POLYGON}" == "true" ]]; then
            polygon_acl=$(kubectl get configmap polygon-sc-addresses -n "${NAMESPACE}" -o jsonpath='{.data.acl\.address}')
            require_nonempty "polygon-sc-addresses[acl.address]" "${polygon_acl}"
            polygon_args=(-f ci/preview-env/kms-connector/values-kms-connector-polygon-e2e.yaml
              --set-string "commonConfig.polygonContractAddresses.acl=${polygon_acl}")
          fi
          # OTLP tracing, only when the observability stack is deployed.
          tracing=()
          if [[ "${OBSERVABILITY}" == "true" ]]; then
            tracing=(
              --set "commonConfig.tracing.enabled=true"
              --set-string "commonConfig.tracing.endpoint=${OTLP_ENDPOINT}"
            )
          fi
          for i in $(seq 1 "${NB_KMS_CORE}"); do
            helm upgrade --install "kms-connector-${i}" "${KMS_CONNECTOR_CHART}" \
              -n "${NAMESPACE}" -f ci/preview-env/kms-connector/values-kms-connector-e2e.yaml \
              "${polygon_args[@]}" \
              --set-string "commonConfig.gatewayContractAddresses.decryption=${decryption}" \
              --set-string "commonConfig.gatewayContractAddresses.gatewayConfig=${gateway_config}" \
              --set-string "commonConfig.ethereumContractAddresses.kmsGeneration=${kms_generation}" \
              --set-string "commonConfig.ethereumContractAddresses.acl=${acl}" \
              --set-string "commonConfig.ethereumContractAddresses.protocolConfig=${protocol_config}" \
              --set-string "commonConfig.databaseUrl=postgresql://zama:zama@postgres-connector-${i}:5432/connector" \
              --set-string "kmsConnectorKmsWorker.config.kmsCoreEndpoints=http://kms-core-${i}-core-${i}:50100" \
              --set-string "kmsConnectorTxSender.wallet.secret.name=kms-connector-tx-sender-${i}" \
              --set-string "kmsConnectorDbMigration.image.name=hub.zama.org/ghcr/zama-ai/fhevm/kms-connector/db-migration" \
              --set-string "kmsConnectorDbMigration.image.tag=$(jq -r .kms_connector_db_migration <<<"${TAGS_JSON}")" \
              --set-string "kmsConnectorGwListener.image.name=hub.zama.org/ghcr/zama-ai/fhevm/kms-connector/gw-listener" \
              --set-string "kmsConnectorGwListener.image.tag=$(jq -r .kms_connector_gw_listener <<<"${TAGS_JSON}")" \
              --set-string "kmsConnectorKmsWorker.image.name=hub.zama.org/ghcr/zama-ai/fhevm/kms-connector/kms-worker" \
              --set-string "kmsConnectorKmsWorker.image.tag=$(jq -r .kms_connector_kms_worker <<<"${TAGS_JSON}")" \
              --set-string "kmsConnectorTxSender.image.name=hub.zama.org/ghcr/zama-ai/fhevm/kms-connector/tx-sender" \
              --set-string "kmsConnectorTxSender.image.tag=$(jq -r .kms_connector_tx_sender <<<"${TAGS_JSON}")" \
              "${tracing[@]}"
          done
          sleep 60

      ######################################################################
      # KMS BOOTSTRAP: trigger the real FHE key + CRS generation on-chain, now
      # that coprocessor + kms-connector are up to react to KMSGeneration
      # events. Targets host-contracts (post-v0.13 migration; gateway no longer
      # ships task:triggerKeygen). The Job polls on-chain for
      # ActivateKey/ActivateCrs before exiting, so --wait-for-jobs means the
      # key + CRS material exists, not just that the request was sent.
      ######################################################################
      - name: Trigger KMS keygen + CRS generation
        run: |
          helm upgrade --install host-trigger-keygen "${CONTRACTS_CHART}" \
            -n "${NAMESPACE}" -f ci/preview-env/host-chain/values-host-trigger-keygen-e2e.yaml \
            --set-string "scDeploy.image.tag=$(jq -r .host_contracts <<<"${TAGS_JSON}")" \
            --wait --wait-for-jobs --timeout=45m

      ######################################################################
      # RELAYER + TEST-SUITE: generic `common` chart + published images.
      ######################################################################
      - name: Deploy relayer-migrate
        run: |
          helm upgrade --install relayer-migrate "${COMMON_CHART}" --version "${COMMON_CHART_VERSION}" \
            -n "${NAMESPACE}" -f ci/preview-env/relayer/values-relayer-migrate-e2e.yaml \
            --set-string "image.tag=$(jq -r .relayer_migrate <<<"${TAGS_JSON}")" \
            --wait --wait-for-jobs --timeout=5m

      - name: Deploy relayer
        run: |
          source ci/preview-env/scripts/lib.sh
          # user_decrypt share reconstruction threshold MUST match the deployed
          # KMS party count (n-t), same math wire-contracts-values.sh registers
          # on-chain. The static value in values-relayer-e2e.yaml is only a
          # placeholder: the relayer pre-seeds the default context (id 0) from it,
          # so a hardcoded mismatch (e.g. a 13-party 9 against the default 4
          # parties) would make context-0 user-decrypt wait for more shares than
          # exist and hang to timeout. Override via the relayer's APP_ env
          # (config-rs coerces the numeric string, same as CHAIN_ID below).
          reconstruct=$(kms_reconstruct "${NB_KMS_CORE}")
          relayer_values=$(mktemp --suffix=.yaml)
          cp ci/preview-env/relayer/values-relayer-e2e.yaml "${relayer_values}"
          UDST="${reconstruct}" yq -i \
            '.env += [{"name": "APP_GATEWAY__CONTRACTS__USER_DECRYPT_SHARES_THRESHOLD", "value": strenv(UDST)}]' \
            "${relayer_values}"
          echo "Relayer user_decrypt_shares_threshold=${reconstruct} (KMS parties: ${NB_KMS_CORE})"
          # deploy_polygon: add the Polygon host chain (host_chains[1]) so the
          # relayer's host ACL readiness check covers Polygon ciphertexts. env is a
          # list Helm replaces wholesale, so append to the same temp copy.
          if [[ "${DEPLOY_POLYGON}" == "true" ]]; then
            yq -i '.env += [
              {"name": "APP_HOST_CHAINS__1__CHAIN_ID", "value": "80002"},
              {"name": "APP_HOST_CHAINS__1__URL", "value": "http://anvil-host-polygon-anvil-node:8545"},
              {"name": "APP_HOST_CHAINS__1__ACL_ADDRESS", "valueFrom": {"configMapKeyRef": {"name": "polygon-sc-addresses", "key": "acl.address"}}}
            ] | (.env[] | select(has("value")) | .value) style="double"' "${relayer_values}"
          fi
          helm upgrade --install relayer "${COMMON_CHART}" --version "${COMMON_CHART_VERSION}" \
            -n "${NAMESPACE}" -f "${relayer_values}" \
            --set-string "image.tag=$(jq -r .relayer <<<"${TAGS_JSON}")"

      - name: Deploy test-suite
        run: |
          helm upgrade --install test-suite "${COMMON_CHART}" --version "${COMMON_CHART_VERSION}" \
            -n "${NAMESPACE}" -f ci/preview-env/test-suite/values-test-suite-e2e.yaml \
            --set-string "image.tag=$(jq -r .test_suite <<<"${TAGS_JSON}")"

      # Propose only after the relayer can serve traffic, so the upgrade
      # window covers in-window e2e instead of helm install time.
      - name: Propose coprocessor upgrade (RFC-021)
        if: env.BLUE_GREEN == 'true'
        env:
          PROPOSAL_ID: ${{ github.run_id }}
        run: |
          kubectl rollout status deploy/relayer -n "${NAMESPACE}" --timeout=5m
          bash ci/preview-env/scripts/propose-coprocessor-upgrade.sh

      ######################################################################
      # AUTOMATED E2E TEST WORKFLOW (opt-in via automated_tests / label).
      # Deploys an Argo Workflow that runs the e2e DAG unattended, alongside
      # the idle test-suite Job above. On the RFC-021 path this runs twice:
      # during DryRunStarted (BCS live, GCS must shadow computations > 0),
      # then again after versioning flips to v0.15 (green).
      ######################################################################
      - name: Deploy automated e2e test workflow
        if: env.AUTOMATED_TESTS == 'true'
        env:
          E2E_IMAGE: hub.zama.org/ghcr/zama-ai/fhevm/test-suite/e2e:${{ fromJSON(needs.resolve-tags.outputs.tags_json).test_suite }}
          E2E_PHASE: ${{ env.BLUE_GREEN == 'true' && 'dry-run' || 'default' }}
        run: bash ci/preview-env/scripts/run-e2e-workflow.sh

      - name: Assert GCS shadowed in-window work
        if: env.BLUE_GREEN == 'true' && env.AUTOMATED_TESTS == 'true'
        run: bash ci/preview-env/scripts/assert-gcs-dry-run.sh

      - name: Wait for e2e workflow and build report
        id: e2e_report
        if: env.AUTOMATED_TESTS == 'true'
        env:
          # Resolved versions surfaced in the report (the "fill in the version"
          # piece). Image tags come from the resolved TAGS_JSON, the dedicated
          # KMS tag + party count from the deploy job env.
          TEST_SUITE_TAG: ${{ fromJSON(needs.resolve-tags.outputs.tags_json).test_suite }}
          HOST_CONTRACTS_TAG: ${{ fromJSON(needs.resolve-tags.outputs.tags_json).host_contracts }}
          GATEWAY_CONTRACTS_TAG: ${{ fromJSON(needs.resolve-tags.outputs.tags_json).gateway_contracts }}
          COPROCESSOR_TAG: ${{ fromJSON(needs.resolve-tags.outputs.tags_json).coprocessor_host_listener }}
          RELAYER_TAG: ${{ fromJSON(needs.resolve-tags.outputs.tags_json).relayer }}
          KMS_CONNECTOR_TAG: ${{ fromJSON(needs.resolve-tags.outputs.tags_json).kms_connector_gw_listener }}
          REPORT_PHASE: ${{ env.BLUE_GREEN == 'true' && 'during DryRunStarted (BCS live, GCS shadowing)' || '' }}
        run: bash ci/preview-env/scripts/build-e2e-report.sh

      - name: Assert RFC-021 cutover
        if: env.BLUE_GREEN == 'true' && env.AUTOMATED_TESTS == 'true'
        env:
          SKIP_PROPOSE: "true"
          ASSERT_CUTOVER: "true"
          TIMEOUT_SECS: "600"
        run: bash ci/preview-env/scripts/propose-coprocessor-upgrade.sh

      - name: Deploy automated e2e after cutover
        if: env.BLUE_GREEN == 'true' && env.AUTOMATED_TESTS == 'true'
        env:
          E2E_IMAGE: hub.zama.org/ghcr/zama-ai/fhevm/test-suite/e2e:${{ fromJSON(needs.resolve-tags.outputs.tags_json).test_suite }}
          E2E_PHASE: green
        run: bash ci/preview-env/scripts/run-e2e-workflow.sh

      - name: Build e2e report after cutover
        id: e2e_report_green
        if: env.BLUE_GREEN == 'true' && env.AUTOMATED_TESTS == 'true'
        env:
          TEST_SUITE_TAG: ${{ fromJSON(needs.resolve-tags.outputs.tags_json).test_suite }}
          HOST_CONTRACTS_TAG: ${{ fromJSON(needs.resolve-tags.outputs.tags_json).host_contracts }}
          GATEWAY_CONTRACTS_TAG: ${{ fromJSON(needs.resolve-tags.outputs.tags_json).gateway_contracts }}
          COPROCESSOR_TAG: ${{ fromJSON(needs.resolve-tags.outputs.tags_json).coprocessor_host_listener }}
          RELAYER_TAG: ${{ fromJSON(needs.resolve-tags.outputs.tags_json).relayer }}
          KMS_CONNECTOR_TAG: ${{ fromJSON(needs.resolve-tags.outputs.tags_json).kms_connector_gw_listener }}
          REPORT_PHASE: "after RFC-021 cutover (GCS live)"
        run: bash ci/preview-env/scripts/build-e2e-report.sh

      - name: Combine e2e reports
        id: e2e_report_combined
        if: env.BLUE_GREEN == 'true' && env.AUTOMATED_TESTS == 'true'
        run: |
          combined=$(mktemp --suffix=.md)
          cat "${{ steps.e2e_report.outputs.report_path }}" > "${combined}"
          echo >> "${combined}"
          cat "${{ steps.e2e_report_green.outputs.report_path }}" >> "${combined}"
          echo "report_path=${combined}" >> "$GITHUB_OUTPUT"

      - name: Comment e2e results on PR
        if: env.AUTOMATED_TESTS == 'true' && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ${{ steps.e2e_report_combined.outputs.report_path || steps.e2e_report.outputs.report_path }}

      ######################################################################
      # DIAGNOSTICS + PR COMMENT
      ######################################################################
      - name: Dump namespace state on failure
        if: failure()
        run: |
          kubectl get all -n "${NAMESPACE}" -o wide || true
          kubectl get events -n "${NAMESPACE}" --sort-by=.lastTimestamp | tail -100 || true

      - name: Comment on PR
        # No PR to comment on for workflow_dispatch - info goes to the run summary.
        if: success() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          reactions: 'rocket'
          body: |
            :rocket: **e2e preview environment deployed** in namespace `${{ env.NAMESPACE }}` on zws-dev.

            Topology: **${{ env.NB_KMS_CORE }}** KMS core ${{ env.NB_KMS_CORE == '1' && 'party' || 'parties' }} · **${{ env.NB_COPROCESSOR }}** coprocessor ${{ env.NB_COPROCESSOR == '1' && 'party' || 'parties' }} (each a full independent stack: its own Postgres, S3 bucket, tx-sender identity, `listener` producer, Redis broker and host-listener-consumer).${{ env.BLUE_GREEN == 'true' && ' **RFC-021 blue-green:** each party also runs a GCS fleet (`coprocessor-<i>-gcs`, compiled 0.15.0) beside BCS (`v0.14.0-7`). Gateway registration stays N.' || '' }}${{ env.DEPLOY_POLYGON == 'true' && ' Plus a **second Polygon Amoy (80002)** host chain (fresh anvil, reusing the ETH KMS key via canonical ProtocolConfig mirror).' || '' }}

            Connect:
            ```bash
            tailscale configure kubeconfig ${{ env.TAILSCALE_HOSTNAME }}
            kubectl get pods -n ${{ env.NAMESPACE }}
            ```

            > Note: each coprocessor party requests substantial `tfhe`/`sns` worker capacity on the `coprocessor` nodepool, so `nb_coprocessor` > 1 multiplies the cluster resources needed. Default stays 1.

            This environment is destroyed automatically when the PR is closed
            (see preview-env-destroy.yml), or on the next push to this PR.

      - name: Write connection info to summary
        if: success() && github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "### :rocket: e2e preview environment deployed"
            echo
            echo "Namespace \`${NAMESPACE}\` on zws-dev."
            echo
            echo "Topology: **${NB_KMS_CORE}** KMS core parties · **${NB_COPROCESSOR}** coprocessor parties (each a full independent stack: its own Postgres, S3 bucket, tx-sender identity, listener producer, Redis broker and host-listener-consumer)$([[ "${BLUE_GREEN}" == "true" ]] && echo " · RFC-021 blue-green (BCS v0.14.0-7 + GCS from this build compiled 0.15.0)")$([[ "${DEPLOY_POLYGON}" == "true" ]] && echo " · a second Polygon Amoy (80002) host chain reusing the ETH KMS key"). Note: each coprocessor party requests substantial tfhe/sns worker capacity on the coprocessor nodepool, so nb_coprocessor > 1 multiplies the cluster resources needed."
            echo
            echo "Connect:"
            echo '```bash'
            echo "tailscale configure kubeconfig ${TAILSCALE_HOSTNAME}"
            echo "kubectl get pods -n ${NAMESPACE}"
            echo '```'
            echo
            if [[ "${OBSERVABILITY}" == "true" ]]; then
              echo "Observability stack deployed (see ci/preview-env/observability/):"
              echo '```bash'
              echo "kubectl port-forward -n ${NAMESPACE} svc/grafana 3000:3000     # http://localhost:3000 (anonymous admin)"
              echo "kubectl port-forward -n ${NAMESPACE} svc/prometheus 9090:9090  # http://localhost:9090"
              echo "kubectl port-forward -n ${NAMESPACE} svc/jaeger 16686:16686    # http://localhost:16686"
              echo '```'
              echo
            fi
            echo "This environment is **not** tied to a PR, so it is only destroyed"
            echo "manually - see preview-env-destroy.yml or clean up the namespace directly."
          } >> "$GITHUB_STEP_SUMMARY"
