# Byte-consensus coverage, on demand.
#
# The selection, the jobs and the case list all come from
# `test-suite/fhevm/consensus/inventory.yaml`, resolved once in the `plan` job.
# That is the point of the plan job rather than a hardcoded `strategy.matrix`:
# the previous shape carried the leg list in `matrix.include` and the selection
# in `if:` conditions, which had three consequences worth removing.
#
#   * A `leg: all` dispatch ran every leg's `if:`, and the GPU job had no
#     condition at all -- so a CPU-only selection still provisioned a GPU
#     instance, and paid for it, before any job could say it was not needed.
#   * `--column all` was documented as omitting the database cells, so a
#     selection named `all` could not include required coverage. Selections are
#     named `smoke`, `standard` and `full` now, and `full` means full.
#   * An unknown column or case id resolved to zero work and reported success.
#     `consensus-inventory.ts plan` rejects an unknown term, before anything is
#     provisioned.
#
# Each leg ends in an assertion over bytes, not a liveness check, and each suite
# carries a deliberately-poisoned canary arm that must go red -- see
# `test/consensus/canary.ts`. The run-validity gates
# (`test/consensus/validity.ts` and `scripts/consensus-validity.sh`) abort a run
# whose preconditions do not hold rather than letting it report numbers, and
# `consensus-inventory.ts aggregate` refuses a run whose results do not match
# the plan it claims to implement.
name: test-suite-consensus

env:
  # Secrets are available only to zama-ai organization members; the slab steps
  # below check this rather than failing on a fork.
  SECRETS_AVAILABLE: ${{ secrets.JOB_SECRET != '' }}

# Manual trigger only, deliberately. These legs bring up three-operator stacks
# and some of them provision GPU instances, so nothing here should fire off a
# clock or off a push: a scheduled run bills hardware nightly whether or not
# anything changed, and a `pull_request` trigger re-runs on every push to a PR
# once it is in scope. Someone asks for a run, naming what they want.
on:
  workflow_dispatch:
    inputs:
      selection:
        description: "What to run (a selection, a family, a CI leg, or a case id)"
        default: "standard"
        type: choice
        options:
          # No-stack contract tests. Cheap, and they are what makes the rest
          # falsifiable.
          - harness
          # Targeted regression tests for this PR's production changes.
          - rust-regression
          # The core byte oracle on one CPU stack.
          - smoke
          # Everything that runs on CPU stacks without hardware.
          - standard
          # Every required case, including the isolated database jobs and the
          # GPU legs. The only selection that can satisfy the delivery gate.
          - full
          # Individual legs.
          - byte-agreement
          - bridge
          - backlog
          - object-integrity
          - host-rpc
          - broker-redelivery
          - storage-pressure
          - submission-partition
          - cpu-scheduling
          - degraded
          - fork
          - leg:failure-matrix
          - failure-matrix-db
          - crash-retry
          - gpu
      build:
        description: "Build repo-owned images from the checked out branch"
        default: true
        type: boolean

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.selection }}-${{ inputs.build }}
  cancel-in-progress: true

# Nothing here signs or federates, so no job gets an OIDC token; each job
# declares the read scopes it needs and nothing else.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the selection before anything is provisioned.
  # ---------------------------------------------------------------------------
  plan:
    name: consensus/plan
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    outputs:
      legs: ${{ steps.resolve.outputs.legs }}
      cpu-legs: ${{ steps.resolve.outputs.cpu-legs }}
      cpu-matrix: ${{ steps.resolve.outputs.cpu-matrix }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      needs-gpu: ${{ steps.resolve.outputs.needs-gpu }}
      gpu-pressure: ${{ steps.resolve.outputs.gpu-pressure }}
      rust-regression-timeout: ${{ steps.resolve.outputs.rust-regression-timeout }}
      gpu-timeout: ${{ steps.resolve.outputs.gpu-timeout }}
      partial: ${{ steps.resolve.outputs.partial == 'true' || inputs.build == false }}
      revision: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3

      - name: Install CLI deps
        working-directory: test-suite/fhevm
        run: bun install --frozen-lockfile

      - name: Validate the coverage inventory
        working-directory: test-suite/fhevm
        run: bun scripts/consensus-inventory.ts validate

      - name: Resolve the selection into a job plan
        id: resolve
        working-directory: test-suite/fhevm
        env:
          SELECTION: ${{ inputs.selection }}
        run: |
          # The named selections live in the inventory, not here: a second copy
          # in a shell `case` is how a selection called `full` came to omit
          # required coverage. A term that is not a named selection is passed
          # through and rejected by the inventory unless it is a real family,
          # leg or case id.
          bun scripts/consensus-inventory.ts plan "$SELECTION" --format github >> "$GITHUB_OUTPUT"
          # And print the readable plan into the job log, so a reader can see
          # what a run was going to do without reconstructing it from the
          # matrix JSON.
          bun scripts/consensus-inventory.ts plan "$SELECTION"

      - name: Show what this selection omits
        working-directory: test-suite/fhevm
        env:
          SELECTION_PARTIAL: ${{ steps.resolve.outputs.partial }}
          BUILD_REQUESTED: ${{ inputs.build }}
        run: |
          if [ "$SELECTION_PARTIAL" = "true" ] || [ "$BUILD_REQUESTED" = "false" ]; then
            echo "::warning::This selection is PARTIAL: it omits required inventory cases and cannot"
            echo "::warning::satisfy the branch delivery gate. Use 'full' with build=true for that."
          fi

  # ---------------------------------------------------------------------------
  # No-stack contract tests. These are what make the stack legs falsifiable, so
  # they run first and cheaply.
  # ---------------------------------------------------------------------------
  harness:
    name: consensus/harness
    needs: plan
    # Stack-only selections also need their harness checked before provisioning.
    if: ${{ contains(needs.plan.outputs.legs, 'harness') || needs.plan.outputs.cpu-legs != '' || needs.plan.outputs.needs-gpu == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      oracle-postgres:
        image: postgres:15.7@sha256:68b988a164c8bdf0752fa7a4ae2d4b34a058e21c6327e69f741c081a38e97254
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    permissions:
      contents: "read"
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3

      - name: Install TLS oracle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl

      - name: Install CLI deps
        working-directory: test-suite/fhevm
        run: bun install --frozen-lockfile

      - name: Setup Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: "22"

      - name: Install standalone comparator dependencies
        run: npm ci --ignore-scripts --workspace @fhevm/e2e-suite

      - name: Exercise committed fault audit SQL in disposable PostgreSQL
        working-directory: test-suite/e2e
        env:
          CONSENSUS_ORACLE_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
          TS_NODE_TRANSPILE_ONLY: "true"
          NODE_OPTIONS: --no-experimental-strip-types
        run: npx --no-install mocha --require ts-node/register test/consensus/faultAuditDatabase.test.ts test/consensus/bridgeEvidence.test.ts test/consensus/inputEvidenceDatabase.test.ts test/consensus/upgradeEvidenceSql.test.ts test/consensus/keyApplicationGate.test.ts test/consensus/hostReportGateDatabase.test.ts

      - name: Typecheck and unit test the CLI
        working-directory: test-suite/fhevm
        run: |
          bun run check
          bun test src

      - name: Verify private journal ownership across harness recreation
        working-directory: test-suite/fhevm
        timeout-minutes: 2
        env:
          RUN_DOCKER_RECOVERY_TESTS: "1"
        run: |
          docker pull debian:12-slim
          bun test src/consensus/recreate-journal.test.ts

      - name: Harness and standalone comparator cases
        # Recorded, not merely run: a bare green step said some commands exited
        # 0, and the aggregate then reported these three NOT_RUN. The runner
        # also refuses a suite that exited 0 having run fewer tests than the
        # case needs, which is what a filter matching nothing looks like.
        working-directory: test-suite/fhevm
        env:
          CONSENSUS_RUN_ID: ${{ github.run_id }}-harness-${{ github.run_attempt }}
        run: ./scripts/run-stackless-cases.sh --leg harness

      - name: Aggregate the harness leg
        if: ${{ always() }}
        working-directory: test-suite/fhevm
        env:
          CONSENSUS_RUN_ID: ${{ github.run_id }}-harness-${{ github.run_attempt }}
        run: |
          mkdir -p /tmp/consensus-artifacts
          cp -r ../../.fhevm/runtime/consensus-results /tmp/consensus-artifacts/ 2>/dev/null || true
          bun scripts/consensus-inventory.ts aggregate --ci \
            --run "$CONSENSUS_RUN_ID" --select harness --select MAT-05-CANARY-CLASSES --partial \
            | tee /tmp/consensus-artifacts/aggregate-harness.txt

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          overwrite: true
          name: consensus-harness
          path: /tmp/consensus-artifacts
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Targeted regression tests for the production changes in this PR. They need a
  # database (testcontainers) but no stack.
  # ---------------------------------------------------------------------------
  rust-regression:
    name: consensus/rust-regression
    needs: plan
    if: ${{ contains(needs.plan.outputs.legs, 'rust-regression') }}
    runs-on: runs-on=${{ github.run_id }}/runner=8cpu-linux-x64/volume=80gb
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.rust-regression-timeout) }}
    permissions:
      contents: "read"
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"

      - name: Setup Rust
        uses: ./.github/actions/setup_rust
        with:
          toolchain-dir: coprocessor/fhevm-engine

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev clang gh

      - name: Setup Bun
        # The recorder is a Bun script, and it is what turns these two cargo
        # runs into results the aggregate can judge.
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3

      - name: Install CLI deps
        working-directory: test-suite/fhevm
        run: bun install --frozen-lockfile

      - name: Regression cases REG-01, REG-02
        working-directory: test-suite/fhevm
        env:
          CONSENSUS_RUN_ID: ${{ github.run_id }}-rust-${{ github.run_attempt }}
        run: ./scripts/run-stackless-cases.sh --leg rust-regression

      - name: Aggregate the regression leg
        if: ${{ always() }}
        working-directory: test-suite/fhevm
        env:
          CONSENSUS_RUN_ID: ${{ github.run_id }}-rust-${{ github.run_attempt }}
        run: |
          mkdir -p /tmp/consensus-artifacts
          cp -r ../../.fhevm/runtime/consensus-results /tmp/consensus-artifacts/ 2>/dev/null || true
          bun scripts/consensus-inventory.ts aggregate --ci \
            --run "$CONSENSUS_RUN_ID" --select rust-regression --partial \
            | tee /tmp/consensus-artifacts/aggregate-rust-regression.txt

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          overwrite: true
          name: consensus-rust-regression
          path: /tmp/consensus-artifacts
          retention-days: 14

  # ---------------------------------------------------------------------------
  # CPU stack legs, one job per (leg, scenario) from the plan.
  # ---------------------------------------------------------------------------
  consensus:
    name: consensus/${{ matrix.leg }}/${{ matrix.scenario }}/${{ matrix.shard }}
    needs: [plan, harness]
    # `cpu-matrix` excludes every leg whose cases declare a hardware capability,
    # so this job can never run a GPU case on a runner that has no GPU and
    # report it green.
    if: ${{ needs.harness.result == 'success' && needs.plan.outputs.cpu-legs != '' }}
    strategy:
      # One leg failing must not cancel the others: they cover different claims,
      # and knowing which of them broke is the point.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cpu-matrix) }}
    permissions:
      contents: "read" # Required to checkout repository code.
      packages: "read" # Required by the CLI's `gh` bundle resolution and to pull published images from GHCR.
    env:
      GH_TOKEN: ${{ github.token }}
      # Build repo-owned images from the branch by default; only an explicit
      # dispatch with build=false uses published images instead.
      BUILD: ${{ inputs.build == false && 'false' || 'true' }}
      LEG: ${{ matrix.leg }}
      SCENARIO: ${{ matrix.scenario }}
      CASES: ${{ join(matrix.cases, ' ') }}
      CAPABILITIES: ${{ join(matrix.capabilities, ' ') }}
      CONSENSUS_SCENARIO: ${{ matrix.scenario }}
      CONSENSUS_OPERATORS: ${{ matrix.operators }}
      CONSENSUS_THRESHOLD: ${{ matrix.threshold }}
    runs-on: runs-on=${{ github.run_id }}/runner=32cpu-linux-x64/volume=160gb
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"
          fetch-depth: 0

      - name: Setup Docker
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3

      - name: Setup Node
        # Host-side phase supervision and deadline timers execute Node directly.
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: "22"

      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0

      - name: Login to GitHub Container Registry
        uses: zama-ai/ci-templates/.github/actions/retry@542103e14b9ae6a9aea27787b8724b3b35bb3918 # v1.0.9
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          command: |
            echo "Logging into ghcr.io..."
            echo "$GHCR_PASSWORD" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      - name: Login to Chainguard Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: cgr.dev
          username: ${{ secrets.CGR_USERNAME }}
          password: ${{ secrets.CGR_PASSWORD }}

      - name: Install safe-chain
        shell: bash
        run: |
          # safe-chain v1.5.3 is distributed as an immutable GitHub release asset —
          # its content is permanently fixed and cannot be modified after the tag is published.
          # Verify immutability: curl -fsSL https://api.github.com/repos/AikidoSec/safe-chain/releases/tags/1.5.3 | grep immutable
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      - name: Install CLI deps
        working-directory: test-suite/fhevm
        run: bun install --frozen-lockfile

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh openssl

      - name: Resolve latest-main lock once
        working-directory: test-suite/fhevm
        run: |
          lock_file="$(./fhevm-cli resolve --target latest-main | tail -n1)"
          if [ ! -f "$lock_file" ]; then
            echo "Could not locate resolved lock file: $lock_file" >&2
            exit 1
          fi
          echo "LOCK_FILE=$lock_file" >> "$GITHUB_ENV"

      - name: Boot the stack
        working-directory: test-suite/fhevm
        run: |
          test_features=()
          if [[ " ${CAPABILITIES:-} " == *" failpoints "* ]]; then
            test_features+=(tfhe-worker/test-failpoints)
          fi
          if [[ " ${CAPABILITIES:-} " == *" broker-failpoints "* ]]; then
            test_features+=(host-listener/test-failpoints)
          fi
          FHEVM_CONSENSUS_TEST_FEATURES="${test_features[*]}"
          export FHEVM_CONSENSUS_TEST_FEATURES
          boot_scenario="$SCENARIO"
          if [[ " $CASES " == *" DEG-06-GW-LISTENER-INFLIGHT "* ]]; then
            # DEG06 must observe the conflicting event without reverting the fleet.
            # Persist the existing per-instance env override in the boot scenario.
            boot_scenario="$(mktemp /tmp/consensus-degraded-XXXXXX.yaml)"
            bun scripts/prepare-degraded-scenario.ts "$SCENARIO" > "$boot_scenario"
          fi
          build_mode=published
          args=(--scenario "$boot_scenario" --lock-file "$LOCK_FILE")
          if [ "$BUILD" = "true" ] || [[ -n "$FHEVM_CONSENSUS_TEST_FEATURES" ]]; then
            # Deterministic crash boundaries require the opt-in test binary.
            args+=(--build)
            build_mode=checkout
          else
            # Published runtime, but this checkout must supply the new test suites.
            args+=(--override test-suite)
          fi
          bun scripts/checkout-build-receipt.ts begin /tmp/consensus-build-receipt.json "$build_mode"
          ./fhevm-cli up "${args[@]}"
          bun scripts/checkout-build-receipt.ts finish /tmp/consensus-build-receipt.json
          echo "CONSENSUS_BUILD_MODE=$build_mode" >> "$GITHUB_ENV"
          echo "CONSENSUS_SOFTWARE_CLASS=$build_mode:${GITHUB_SHA}" >> "$GITHUB_ENV"

      # What code this run actually executed. A checkout SHA alone would label
      # published-image results as branch-built code.
      - name: Record the run's code identity
        working-directory: test-suite/fhevm
        env:
          CONSENSUS_SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p /tmp/consensus-artifacts
          ./scripts/record-run-identity.sh | tee /tmp/consensus-artifacts/run-identity.env
          receipt_identity=$(bun scripts/checkout-build-receipt.ts attach /tmp/consensus-build-receipt.json /tmp/consensus-artifacts/run-identity.env)
          printf '%s\n' "$receipt_identity" >> /tmp/consensus-artifacts/run-identity.env
          echo "CONSENSUS_ARTIFACT_IDENTITIES_FILE=/tmp/consensus-artifacts/run-identity.env" >> "$GITHUB_ENV"
          echo "CONSENSUS_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "CONSENSUS_RUN_ID=${GITHUB_RUN_ID}-${LEG}-${SCENARIO}-${CONSENSUS_SHARD}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      # Every leg below asserts over bytes. The suites run their own validity
      # gates in `before`, so a stack that came up unprovisioned fails here
      # rather than producing a green.

      - name: Committed broker redelivery before acknowledgment
        if: ${{ matrix.leg == 'broker-redelivery' }}
        working-directory: test-suite/fhevm
        run: ./scripts/run-broker-redelivery.sh

      - name: Named storage write backpressure and recovery
        if: ${{ matrix.leg == 'storage-pressure' }}
        working-directory: test-suite/fhevm
        run: ./scripts/run-storage-backpressure.sh

      - name: Compute and submission participation across asymmetric rejoin
        if: ${{ matrix.leg == 'submission-partition' }}
        working-directory: test-suite/fhevm
        run: ./scripts/run-submission-partition.sh

      - name: Host RPC retry and paginated catch-up
        if: ${{ matrix.leg == 'host-rpc' }}
        working-directory: test-suite/fhevm
        env:
          SELECTED_CASES: ${{ join(matrix.cases, ' ') }}
        run: |
          status=0
          for case_id in $SELECTED_CASES; do
            mode="${case_id#FM-HOST-RPC-}"
            ./scripts/run-host-rpc-recovery.sh "${mode,,}" || status=1
          done
          exit "$status"

      - name: Produced object integrity and recovery
        if: ${{ matrix.leg == 'object-integrity' }}
        working-directory: test-suite/fhevm
        run: ./scripts/run-object-integrity.sh

      - name: Durable backlog and paginated host replay
        if: ${{ matrix.leg == 'backlog' }}
        working-directory: test-suite/fhevm
        run: |
          ./scripts/run-failure-matrix.sh --case FM-HOST-LONG-OFFLINE
          ./scripts/run-failure-matrix.sh --case FM-DURABLE-BACKLOG

      - name: Bridge dependency byte agreement
        if: ${{ matrix.leg == 'bridge' }}
        working-directory: test-suite/fhevm
        run: ./scripts/run-materialization-consensus.sh --suite bridge

      - name: CPU scheduling diversity
        if: ${{ matrix.leg == 'cpu-scheduling' }}
        working-directory: test-suite/fhevm
        run: ./scripts/run-materialization-consensus.sh --heterogeneous

      - name: Byte agreement — materialization gate
        if: ${{ matrix.leg == 'byte-agreement' }}
        working-directory: test-suite/fhevm
        run: ./scripts/run-materialization-consensus.sh --suite materialization

      - name: Byte agreement — typed transaction boundaries
        if: ${{ matrix.leg == 'byte-agreement' }}
        working-directory: test-suite/fhevm
        run: ./scripts/run-materialization-consensus.sh --suite typed

      - name: Byte agreement — verified input lists
        if: ${{ matrix.leg == 'byte-agreement' }}
        working-directory: test-suite/fhevm
        run: ./scripts/run-materialization-consensus.sh --suite input

      - name: Byte agreement — replacement-block reorg
        if: ${{ matrix.leg == 'byte-agreement' }}
        working-directory: test-suite/fhevm
        run: ./scripts/run-materialization-consensus.sh --suite reorg

      - name: Degraded cluster — quorum, backlog and in-flight gateway events
        if: ${{ matrix.leg == 'degraded' }}
        working-directory: test-suite/fhevm
        run: |
          if [[ " $CASES " == *" DEG-06-GW-LISTENER-INFLIGHT "* ]]; then
            ./scripts/run-degraded-consensus.sh --case gw
          else
            ./scripts/run-degraded-consensus.sh --case core
          fi

      - name: Fork topology — competing branches, orphans, stale gates, replay
        if: ${{ matrix.leg == 'fork' }}
        working-directory: test-suite/fhevm
        run: ./scripts/run-fork-consensus.sh --case all

      - name: Crash-retry — interruption at three boundaries
        # Interrupts a worker that has DEMONSTRABLY acquired identified work,
        # rather than at the first sign of any pending row anywhere.
        if: ${{ matrix.leg == 'crash-retry' }}
        working-directory: test-suite/fhevm
        run: |
          if [[ " $CASES " =~ (CR-01-INTERRUPT-BEFORE-COMMIT|REG-03-SUPERVISED-DAEMON-RECOVERY|FM-TFHE-CRASH) ]]; then
            ./scripts/run-crash-retry-consensus.sh --victim 1 --boundary before-commit
          fi
          if [[ " $CASES " == *" CR-02-INTERRUPT-AFTER-COMMIT "* ]]; then
            ./scripts/run-crash-retry-consensus.sh --victim 1 --boundary after-commit
          fi
          if [[ " $CASES " == *" CR-03-EXPIRED-LEASE-RECLAIM "* ]]; then
            ./scripts/run-crash-retry-consensus.sh --victim 1 --boundary expired-lease
          fi

      - name: Failure matrix — service-specific workloads
        if: ${{ matrix.leg == 'failure-matrix' }}
        working-directory: test-suite/fhevm
        run: |
          failed=0
          for case_id in $CASES; do
            args=(--case "$case_id")
            if [ "$case_id" = "FM-SMOKE-CELLS" ]; then args+=(--column smoke); fi
            ./scripts/run-failure-matrix.sh "${args[@]}" || failed=1
          done
          exit "$failed"

      - name: Failure matrix — shared database, isolated
        # Its own job in the plan: taking the shared database away affects every
        # operator at once, so a wedged stack here must not contaminate results
        # that were otherwise going to complete.
        if: ${{ matrix.leg == 'failure-matrix-db' }}
        working-directory: test-suite/fhevm
        run: ./scripts/run-failure-matrix.sh --column db --keep-going

      - name: Lock-extension validity gate
        # Reported for every leg, whatever the leg's own outcome: a green that
        # silently included work recomputed by a second worker is not the
        # measurement it appears to be. Scoped to this run's window.
        if: ${{ always() }}
        working-directory: test-suite/fhevm
        run: |
          ./scripts/consensus-validity.sh locks --since "$CONSENSUS_RUN_STARTED_AT" --operators "$CONSENSUS_OPERATORS"
          ./scripts/consensus-validity.sh exclusivity --operators "$CONSENSUS_OPERATORS"

      - name: Aggregate this leg's results against the plan
        # The verdict. It rejects a leg that reported no result for a case it
        # selected, a duplicate with a conflicting state, a result produced
        # against another revision or topology, and a PASS with a failed cleanup
        # or an unobserved fault.
        if: ${{ always() }}
        working-directory: test-suite/fhevm
        run: |
          mkdir -p /tmp/consensus-artifacts
          cp -r ../../.fhevm/runtime/consensus-results /tmp/consensus-artifacts/ 2>/dev/null || true
          cp -r ../../.fhevm/runtime/object-integrity /tmp/consensus-artifacts/ 2>/dev/null || true
          cp -r ../../.fhevm/runtime/host-rpc-evidence /tmp/consensus-artifacts/ 2>/dev/null || true
          cp -r ../../.fhevm/runtime/broker-redelivery /tmp/consensus-artifacts/ 2>/dev/null || true
          cp -r ../../.fhevm/runtime/storage-pressure-evidence /tmp/consensus-artifacts/ 2>/dev/null || true
          cp -r ../../.fhevm/runtime/submission-partition /tmp/consensus-artifacts/ 2>/dev/null || true
          read -r -a case_ids <<< "$CASES"
          selections=()
          for case_id in "${case_ids[@]}"; do
            selections+=(--select "$case_id")
          done
          bun scripts/consensus-inventory.ts aggregate --ci \
            --run "$CONSENSUS_RUN_ID" "${selections[@]}" --partial \
            | tee "/tmp/consensus-artifacts/aggregate-${LEG}.txt"

      - name: Collect diagnostics
        # `|| true` on each command, never on the step that produced the
        # verdict: optional diagnostics must not be able to erase a non-zero
        # test status.
        if: ${{ always() }}
        run: |
          mkdir -p /tmp/consensus-artifacts/logs
          for c in $(docker ps -a --format '{{.Names}}'); do
            docker logs "$c" > "/tmp/consensus-artifacts/logs/$c.log" 2>&1 || true
          done
          docker ps -a > /tmp/consensus-artifacts/logs/containers.txt 2>&1 || true
          cp .fhevm/runtime/env/versions.env /tmp/consensus-artifacts/ 2>/dev/null || true

      - name: Upload results and evidence
        # On success as well as failure: the structured results ARE the
        # deliverable, and a green run whose evidence was discarded cannot be
        # audited afterwards.
        if: ${{ always() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          overwrite: true
          name: consensus-${{ matrix.leg }}-${{ matrix.scenario }}-${{ matrix.shard }}
          path: /tmp/consensus-artifacts
          retention-days: 14

      - name: Tear down
        if: ${{ always() }}
        working-directory: test-suite/fhevm
        run: ./fhevm-cli down || true

  # ---------------------------------------------------------------------------
  # GPU provisioning requires both a GPU plan and successful harness checks.
  # ---------------------------------------------------------------------------
  gpu-setup-instance:
    name: consensus/gpu/setup-instance
    needs: [plan, harness]
    if: ${{ needs.harness.result == 'success' && needs.plan.outputs.needs-gpu == 'true' }}
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    # No checkout and no API call on the workflow token: the provisioning
    # action authenticates with its own SLAB_ACTION_TOKEN.
    permissions: {}
    outputs:
      runner-name: ${{ steps.start-remote-instance.outputs.label }}
    steps:
      - name: Start remote instance
        id: start-remote-instance
        if: env.SECRETS_AVAILABLE == 'true'
        uses: zama-ai/slab-github-runner@d4a5bb6e2a4b8aa19a10f596d7f142006a7e2c21 # v1.6.3
        with:
          mode: start
          github-token: ${{ secrets.SLAB_ACTION_TOKEN }}
          slab-url: ${{ secrets.SLAB_BASE_URL }}
          job-secret: ${{ secrets.JOB_SECRET }}
          backend: hyperstack
          # Three TFHE/SNS/ZK operator sets exceed the L40 memory budget.
          # This remains one physical device, as exercised by the GPU cases.
          profile: single-h100

  gpu:
    name: consensus/gpu
    needs: [plan, gpu-setup-instance]
    if: ${{ needs.gpu-setup-instance.result == 'success' && needs.gpu-setup-instance.outputs.runner-name != '' }}
    runs-on: ${{ needs.gpu-setup-instance.outputs.runner-name }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.gpu-timeout) }}
    permissions:
      contents: "read" # Required to checkout repository code.
      packages: "read" # Required by the CLI's `gh` bundle resolution and to pull published images from GHCR.
    env:
      GH_TOKEN: ${{ github.token }}
      GPU_CONSENSUS_TEST_FAILPOINTS: ${{ needs.plan.outputs.gpu-pressure == 'true' && '1' || '0' }}
      CONSENSUS_OPERATORS: "3"
      CONSENSUS_THRESHOLD: "3"
      # The execution class a result is labelled with. Left at its default it
      # would say `cpu` on a leg whose whole point is the CUDA backend, and a
      # result's value is exactly its label.
      CONSENSUS_BACKEND_CLASS: "gpu-cuda"
      CONSENSUS_RUN_ID: ${{ github.run_id }}-gpu-${{ github.run_attempt }}
      # One knob per operator, so the fleet is heterogeneous along the axis that
      # matters: window composition and partition shape.
      #
      # Both halves of the pair are set for every operator, deliberately. The
      # launcher refuses a resolved pair where work-items-batch-size is below
      # dependence-chains-per-batch, because the adaptive window then turns
      # itself off under load and the run measures non-adaptive scheduling while
      # reporting the shipped configuration. Setting only one half leaves the
      # other at the fleet default and can invert it silently -- which an
      # earlier version of this leg did, with operator 0 on items=1 against the
      # default 20 chains.
      #
      # Operator 0 uses the default batch sizes (100/20), operator 1
      # the serial extreme, operator 2 the wide one. Same software, backend and
      # hardware; only the scheduling surface varies. The suite reads the
      # workers' own counters either side of the workload and requires the
      # EXECUTED batches to differ, so a fleet that was configured differently
      # but scheduled identically fails rather than reporting independence.
      # One physical GPU suffices; the limiter metric must witness overlap
      # under a multi-permit budget and serial execution under budget one.
      GPU_CONSENSUS_STREAMS_PER_DEVICE_0: "4"
      GPU_CONSENSUS_STREAMS_PER_DEVICE_1: "1"
      GPU_CONSENSUS_STREAMS_PER_DEVICE_2: "2"
      GPU_CONSENSUS_WORK_ITEMS_BATCH_SIZE_0: "100"
      GPU_CONSENSUS_COMPONENTS_PER_BATCH_0: "20"
      GPU_CONSENSUS_WORK_ITEMS_BATCH_SIZE_1: "1"
      GPU_CONSENSUS_COMPONENTS_PER_BATCH_1: "1"
      GPU_CONSENSUS_WORK_ITEMS_BATCH_SIZE_2: "200"
      GPU_CONSENSUS_COMPONENTS_PER_BATCH_2: "64"
      GPU_CONSENSUS_ADAPTIVE_BATCH_EXECUTION_0: "true"
      GPU_CONSENSUS_ADAPTIVE_BATCH_EXECUTION_1: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"
          fetch-depth: 0

      - name: Setup GPU
        uses: ./.github/actions/gpu_setup
        with:
          # `gpu_setup` requires its inputs; called bare, the CUDA check ran
          # with no acceptable version and the install step with an empty one.
          # Same pin as every other GPU job.
          cuda-version: "12.8"
          gcc-version: 12

      - name: Setup Rust
        uses: ./.github/actions/setup_rust
        with:
          toolchain-dir: coprocessor/fhevm-engine

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev clang gh

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3

      - name: Setup Node
        # Host-side phase supervision and deadline timers execute Node directly.
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: "22"

      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0

      - name: Login to GitHub Container Registry
        uses: zama-ai/ci-templates/.github/actions/retry@542103e14b9ae6a9aea27787b8724b3b35bb3918 # v1.0.9
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          command: |
            echo "$GHCR_PASSWORD" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      - name: Install CLI deps
        working-directory: test-suite/fhevm
        run: bun install --frozen-lockfile

      - name: Login to Chainguard Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: cgr.dev
          username: ${{ secrets.CGR_USERNAME }}
          password: ${{ secrets.CGR_PASSWORD }}

      - name: Boot the heterogeneous-scheduling stack
        working-directory: test-suite/fhevm
        env:
          SCENARIO: three-of-three-heterogeneous-scheduling
        run: |
          echo "CONSENSUS_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          lock_file="$(./fhevm-cli resolve --target latest-main | tail -n1)"
          bun scripts/checkout-build-receipt.ts begin /tmp/consensus-build-receipt.json checkout
          ./fhevm-cli up --scenario "$SCENARIO" --lock-file "$lock_file" --build
          bun scripts/checkout-build-receipt.ts finish /tmp/consensus-build-receipt.json
          echo "CONSENSUS_SCENARIO=$SCENARIO" >> "$GITHUB_ENV"
          echo "CONSENSUS_BUILD_MODE=checkout" >> "$GITHUB_ENV"
          echo "CONSENSUS_SOFTWARE_CLASS=checkout:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Verify GPU02 cancellation across Docker and PostgreSQL
        working-directory: test-suite/fhevm
        timeout-minutes: 5
        run: |
          docker pull postgres:15.7
          export GPU02_DOCKER_TESTS=1
          GPU02_TEST_NODE_IMAGE="$(docker inspect -f '{{.Image}}' fhevm-test-suite-e2e-debug)"
          export GPU02_TEST_NODE_IMAGE
          bun test src/consensus/gpu02-transport.test.ts src/consensus/gpu02-postgres.test.ts

      - name: Build the GPU worker binaries
        working-directory: test-suite/fhevm
        run: ./scripts/gpu-consensus-workers.sh build

      - name: Swap the container workers for GPU host workers
        working-directory: test-suite/fhevm
        # The host units read their scheduling from the environment, so a
        # heterogeneous scenario has to be restated here or the swap would
        # replace it with a uniform fleet and SCH-01 would report agreement
        # across strategies it never drove. `start` refuses without these, and
        # prints the exact values it wants, so a scenario change fails loudly
        # here rather than silently flattening the fleet.
        env:
          GPU_CONSENSUS_WORK_ITEMS_BATCH_SIZE_0: "100"
          GPU_CONSENSUS_COMPONENTS_PER_BATCH_0: "20"
          GPU_CONSENSUS_WORK_ITEMS_BATCH_SIZE_1: "1"
          GPU_CONSENSUS_COMPONENTS_PER_BATCH_1: "1"
          GPU_CONSENSUS_WORK_ITEMS_BATCH_SIZE_2: "200"
          GPU_CONSENSUS_COMPONENTS_PER_BATCH_2: "64"
        run: ./scripts/gpu-consensus-workers.sh start

      - name: Record the run's code identity
        working-directory: test-suite/fhevm
        run: |
          mkdir -p /tmp/consensus-artifacts
          ./scripts/record-run-identity.sh | tee /tmp/consensus-artifacts/run-identity.env
          receipt_identity=$(bun scripts/checkout-build-receipt.ts attach /tmp/consensus-build-receipt.json /tmp/consensus-artifacts/run-identity.env)
          printf '%s\n' "$receipt_identity" >> /tmp/consensus-artifacts/run-identity.env
          echo "CONSENSUS_ARTIFACT_IDENTITIES_FILE=/tmp/consensus-artifacts/run-identity.env" >> "$GITHUB_ENV"

      - name: Lifecycle cases GPU-01, GPU-03, GPU-02, GPU-04
        # One runner, because each of these needs a structured result and not
        # merely a green step: `fhevm-cli test --profile
        # coprocessor-db-state-revert` exits 0 whether or not it stopped the
        # writers first, which is the defect GPU-02 exists to catch, so the
        # record requires the quiescence line too. Ordered by the runner:
        # GPU-01's deliberate split runs while the fleet is idle, and GPU-04's
        # window covers the cases before it.
        working-directory: test-suite/fhevm
        run: ./scripts/run-gpu-lifecycle-cases.sh --case all --operator 1

      - name: Heterogeneous scheduling agreement (SCH-01)
        # `--heterogeneous` is a flag, not an environment variable: the script
        # resets EXPECT_HETEROGENEOUS to 0 before parsing, so an env would be
        # silently ignored and the run would assert agreement without ever
        # checking the fleet was heterogeneous.
        working-directory: test-suite/fhevm
        run: ./scripts/run-materialization-consensus.sh --heterogeneous --suite materialization

      - name: Bounded GPU reservation pressure
        if: ${{ needs.plan.outputs.gpu-pressure == 'true' }}
        working-directory: test-suite/fhevm
        run: ./scripts/run-gpu-pressure.sh

      - name: Fleet ownership after scheduling agreement
        if: ${{ always() }}
        working-directory: test-suite/fhevm
        run: ./scripts/consensus-validity.sh exclusivity --operators 3

      - name: Report the resolved per-node configuration
        if: ${{ always() }}
        working-directory: test-suite/fhevm
        run: |
          mkdir -p /tmp/consensus-artifacts
          ./scripts/gpu-consensus-workers.sh status > /tmp/consensus-artifacts/gpu-status.txt 2>&1 || true
          cp ../../.fhevm/runtime/gpu-consensus-workers/node-config.env /tmp/consensus-artifacts/ 2>/dev/null || true
          cp ../../.fhevm/runtime/gpu-consensus-workers/build-manifest.env /tmp/consensus-artifacts/ 2>/dev/null || true

      - name: Aggregate the GPU leg's results
        if: ${{ always() }}
        working-directory: test-suite/fhevm
        run: |
          mkdir -p /tmp/consensus-artifacts
          cp -r ../../.fhevm/runtime/consensus-results /tmp/consensus-artifacts/ 2>/dev/null || true
          cp -r ../../.fhevm/runtime/gpu-pressure /tmp/consensus-artifacts/ 2>/dev/null || true
          bun scripts/consensus-inventory.ts aggregate --ci \
            --run "$CONSENSUS_RUN_ID" --select gpu --partial \
            | tee /tmp/consensus-artifacts/aggregate-gpu.txt

      - name: Collect diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p /tmp/consensus-artifacts/logs
          for c in $(docker ps -a --format '{{.Names}}'); do
            docker logs "$c" > "/tmp/consensus-artifacts/logs/$c.log" 2>&1 || true
          done
          if [[ -n "${CONSENSUS_RUN_STARTED_AT:-}" ]]; then
            journalctl --user -u 'fhevm-gpu-consensus-*' --since "$CONSENSUS_RUN_STARTED_AT" --no-pager \
              > /tmp/consensus-artifacts/logs/gpu-units.journal 2>&1 || true
          fi
          nvidia-smi > /tmp/consensus-artifacts/logs/nvidia-smi.txt 2>&1 || true

      - name: Upload results and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          overwrite: true
          name: consensus-gpu
          path: /tmp/consensus-artifacts
          retention-days: 14

      - name: Hand the queues back to the containers
        if: ${{ always() }}
        working-directory: test-suite/fhevm
        run: ./scripts/gpu-consensus-workers.sh stop || true

      - name: Tear down
        if: ${{ always() }}
        working-directory: test-suite/fhevm
        run: ./fhevm-cli down || true

  gpu-teardown:
    name: consensus/gpu/teardown
    # Tied to successful provisioning, and runs after success, failure or
    # cancellation: an instance that was started must be stopped even when the
    # leg that used it was cancelled.
    if: ${{ always() && needs.gpu-setup-instance.result == 'success' }}
    needs: [gpu-setup-instance, gpu]
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    # As for setup-instance: the teardown action carries its own token.
    permissions: {}
    steps:
      - name: Stop remote instance
        if: env.SECRETS_AVAILABLE == 'true'
        uses: zama-ai/slab-github-runner@d4a5bb6e2a4b8aa19a10f596d7f142006a7e2c21 # v1.6.3
        with:
          mode: stop
          github-token: ${{ secrets.SLAB_ACTION_TOKEN }}
          slab-url: ${{ secrets.SLAB_BASE_URL }}
          job-secret: ${{ secrets.JOB_SECRET }}
          label: ${{ needs.gpu-setup-instance.outputs.runner-name }}


  aggregate:
    name: consensus/aggregate
    needs: [plan, harness, rust-regression, consensus, gpu]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3

      - name: Install CLI deps
        working-directory: test-suite/fhevm
        run: bun install --frozen-lockfile

      - name: Download every leg's evidence
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: consensus-*
          path: /tmp/consensus-inputs

      - name: Require the selected coverage at this revision
        working-directory: test-suite/fhevm
        env:
          SELECTION: ${{ inputs.selection }}
          REVISION: ${{ needs.plan.outputs.revision }}
          PARTIAL: ${{ needs.plan.outputs.partial }}
          REQUIRE_BRANCH_BUILD: ${{ inputs.build }}
        run: |
          mkdir -p /tmp/consensus-results
          # Concatenate rather than merge directories: no leg may overwrite
          # another leg's results. Missing or skipped jobs leave missing cases.
          set -euo pipefail
          find /tmp/consensus-inputs -type f -name '*.jsonl' -print0 \
            | xargs -0 -r cat > /tmp/consensus-results/all.jsonl
          args=(--ci --results-dir /tmp/consensus-results --select "$SELECTION" --revision "$REVISION")
          if [ "$REQUIRE_BRANCH_BUILD" = true ]; then args+=(--require-build-mode checkout); fi
          if [ "$PARTIAL" = true ]; then args+=(--partial); fi
          bun scripts/consensus-inventory.ts aggregate "${args[@]}" \
            | tee /tmp/consensus-aggregate.txt

      - name: Require every selected job and its validity gates to succeed
        if: ${{ always() }}
        working-directory: test-suite/fhevm
        shell: bash
        env:
          CONSENSUS_SELECTED_LEGS: ${{ needs.plan.outputs.legs }}
          CONSENSUS_JOB_RESULTS: ${{ toJSON(needs) }}
        run: bun scripts/check-consensus-jobs.ts 2>&1 | tee -a /tmp/consensus-aggregate.txt

      - name: Upload the coverage verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          overwrite: true
          name: consensus-verdict
          path: /tmp/consensus-aggregate.txt
          retention-days: 14
