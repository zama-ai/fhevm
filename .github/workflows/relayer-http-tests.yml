name: relayer-http-test

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-changes:
    name: relayer-http-test/check-changes
    permissions:
      actions: 'read' # Required to read workflow run information
      contents: 'read' # Required to checkout repository code
      pull-requests: 'read' # Required to read pull request information
    runs-on: ubuntu-latest
    outputs:
      changes-rust-files: ${{ steps.filter.outputs.rust-files }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: filter
        with:
          filters: |
            rust-files:
              - .github/workflows/relayer-http-tests.yml
              - relayer-http/**
              # Path dependency (`kms-connector-api`): the request, response and error types
              # exchanged with the connectors, and the workspace manifest it inherits from.
              - kms-connector/crates/api/**
              - kms-connector/Cargo.toml

  test:
    name: relayer-http-test/test (bpr)
    needs: check-changes
    if: ${{ needs.check-changes.outputs.changes-rust-files == 'true' }}
    permissions:
      contents: 'read' # Required to checkout repository code
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    steps:
      - name: Checkout Project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup_rust
        with:
          toolchain-dir: relayer-http

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: relayer-http
          key: rust-build-relayer-http
          cache-targets: true
          cache-all-crates: true

      - name: Format
        working-directory: relayer-http
        # Not `--all`: cargo-fmt would follow the `kms-connector-api` path dependency into the
        # generated contract bindings, which are not rustfmt-clean.
        run: cargo fmt -- --check

      - name: Tests
        working-directory: relayer-http
        run: RUST_BACKTRACE=full cargo test --workspace

  clippy:
    name: relayer-http-test/clippy (bpr)
    needs: check-changes
    if: ${{ needs.check-changes.outputs.changes-rust-files == 'true' }}
    permissions:
      contents: 'read' # Required to checkout repository code
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    steps:
      - name: Checkout Project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup_rust
        with:
          toolchain-dir: relayer-http

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: relayer-http
          key: rust-build-relayer-http

      - name: Clippy
        working-directory: relayer-http
        # Same flags as the relayer-http development guide, so local and CI run the exact same check.
        run: >
          cargo clippy --workspace --all-targets
          -- -W clippy::perf -W clippy::suspicious -W clippy::style -D warnings
