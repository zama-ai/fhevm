name: test-suite-test-engine

# CI of the test engine itself: build, unit/integration tests and the stack-independent smoke
# scenario. It never runs fhEVM scenarios (those are triggered manually, see test-suite/test-engine).
on:
  pull_request:
    paths:
      - .github/workflows/test-suite-test-engine.yml
      - test-suite/test-engine/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: test-suite-test-engine/tests
    runs-on: ubuntu-latest
    permissions:
      contents: 'read' # Required to checkout repository code
    defaults:
      run:
        working-directory: test-suite/test-engine
    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          # Same major as the test-suite/e2e image.
          node-version: 22

      - name: Install safe-chain
        shell: bash
        working-directory: .
        run: |
          # safe-chain v1.5.3 is distributed as an immutable GitHub release asset —
          # its content is permanently fixed and cannot be modified after the tag is published.
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run prettier:check

      - name: Build
        run: npm run build

      - name: Engine tests
        run: npm test

      - name: Validate scenarios (dry-run)
        run: npm run engine -- dry-run --output-dir reports/dry-run

      - name: Run smoke scenario
        run: npm run engine -- run --tags @smoke --output-dir reports/smoke

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-engine-reports
          path: test-suite/test-engine/reports/
          if-no-files-found: ignore
