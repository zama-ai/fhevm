[package]
name        = "example"
version     = "0.2.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "example"
path = "src/main.rs"

[[bin]]
name = "full_block"
path = "src/full_block.rs"

[dependencies]
alloy            = { workspace = true }
alloy-primitives = { workspace = true }
anyhow           = "1"
axum             = { workspace = true, features = ["json", "tokio", "http1"] }
broker           = { path = "../shared/broker" }
consumer         = { path = "../consumer" }
primitives       = { path = "../shared/primitives" }
serde            = { workspace = true, features = ["derive"] }
serde_json       = { workspace = true }
tokio            = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "signal", "fs", "net"] }
tracing          = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid             = { workspace = true }

[dev-dependencies]
tempfile = "3"
