[advisories]
# RUSTSEC-2023-0071 (rsa): no fix released. Reached only via sqlx-mysql, which we never compile (postgres-only).
# RUSTSEC-2025-0111 (tokio-tar): no fix released. Reached only via testcontainers, a dev-dependency.
# RUSTSEC-2026-0387 (crypto-bigint 0.5, via alloy's elliptic-curve): low-risk timing side channel with no reachable fix, also ignored in relayer, kms-connector and coprocessor.
# RUSTSEC-2026-0459 (libsqlite3-sys): reached only via sqlx-sqlite, which we never compile (postgres-only).
ignore = [
  "RUSTSEC-2023-0071",
  "RUSTSEC-2025-0111",
  "RUSTSEC-2026-0387",
  "RUSTSEC-2026-0459",
]
informational_warnings = ["unmaintained"]
severity_threshold = "medium"
