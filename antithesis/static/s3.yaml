# In-cluster S3 replacing the preview-env's Crossplane AWS buckets (coprocessor-infra,
# KMS tkms-infra). Adapted from the KMS team's Antithesis setup on this tenant.
#
# DNS: `minio` is the endpoint the KMS chart and the coprocessor use. The coprocessor's
# S3 clients do not force path-style, so they send virtual-host requests
# (<bucket>.<host>); MINIO_DOMAIN makes MinIO read the bucket from that Host header.
# - coproc-0.minio: the MinIO pod is hostname coproc-0 under the headless `minio` Service.
# - kms-public.s3: the KMS storage URL registered on-chain is http://s3:9000/kms-public,
#   not minio:9000, because host-listener rewrites any "minio:9000" URL to a docker
#   bridge IP (host-listener/src/kms_generation/aws_s3.rs split_url). A socat pod named
#   kms-public under the headless `s3` Service forwards raw TCP, Host header intact.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      hostname: coproc-0
      subdomain: minio
      containers:
        - name: minio
          image: docker.io/scnd/minio-mirror:RELEASE.2025-09-07T16-13-09Z
          args: [server, /data]
          env:
            - {name: MINIO_ROOT_USER, value: minioadmin}
            - {name: MINIO_ROOT_PASSWORD, value: minioadmin}
            - {name: MINIO_DOMAIN, value: "minio,s3"}
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: minio-data}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  clusterIP: None
  selector: {app: minio}
  ports:
    - {name: s3, port: 9000, targetPort: 9000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-kms-public
spec:
  replicas: 1
  selector:
    matchLabels: {app: s3-kms-public}
  template:
    metadata:
      labels: {app: s3-kms-public}
    spec:
      hostname: kms-public
      subdomain: s3
      containers:
        - name: forward
          image: hub.zama.org/zama-protocol/zama.ai/socat:v1.8-dev
          command: [socat, "TCP-LISTEN:9000,fork,reuseaddr", "TCP:minio:9000"]
          ports:
            - containerPort: 9000
          readinessProbe:
            tcpSocket: {port: 9000}
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  clusterIP: None
  selector: {app: s3-kms-public}
  ports:
    - {name: s3, port: 9000, targetPort: 9000}
---
# Buckets and the access key every component uses. kms-public and coproc-0 are
# anonymously readable: the cores fetch peers' CA certs, the coprocessor poller fetches
# keys, and the KMS reads ciphertexts, all without credentials.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-provision
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: docker.io/scnd/mc-mirror:RELEASE.2025-02-04T04-57-50Z
          env:
            - {name: HOME, value: /tmp}
          command: [/bin/sh, -c]
          args:
            - |
              set -e
              mc alias set local http://minio:9000 minioadmin minioadmin
              i=0
              until mc ls local >/dev/null 2>&1; do
                i=$((i + 1)); [ "$i" -gt 60 ] && { echo "minio never became writable"; exit 1; }
                sleep 2
              done
              for b in kms-public kms-private coproc-0; do mc mb --ignore-existing "local/$b"; done
              mc admin user add local kms-access-key-id kms-secret-access-key || true
              mc admin policy attach local readwrite --user kms-access-key-id || echo "policy already attached"
              mc anonymous set public local/kms-public
              mc anonymous set public local/coproc-0
              mc ls local
