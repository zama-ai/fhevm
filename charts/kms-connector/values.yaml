# =============================================================================
# KMS Connector Configuration
# =============================================================================
# This chart deploys the KMS (Key Management Service) connector components
# that bridge between the gateway chain and KMS cores, including:
# - Database migration
# - Gateway listener (processes gateway events)
# - KMS worker (communicates with KMS cores)
# - Transaction sender (submits transactions to gateway)
# - Endpoint (HTTP decryption interface)
# - Proxy (TLS termination and API key authentication in front of the endpoints)
# =============================================================================

# -----------------------------------------------------------------------------
# Common Configuration
# -----------------------------------------------------------------------------
# Shared configuration across all KMS connector components
commonConfig:
  # Database connection string
  databaseUrl: "postgresql://$(DATABASE_ENDPOINT)/connector"

  # Selects a bundled smart contract address preset from
  # configs/contracts-<network>.yaml. Allowed values: "" (no preset), "devnet",
  # "testnet", "mainnet". An unrecognized value fails the render. The per-chain
  # *ContractAddresses below override individual preset entries when set.
  network: ""

  # Gateway chain RPC node endpoint (HTTP)
  gatewayUrl: "http://gateway-node:8546"
  # Gateway chain identifier (override the network preset when set)
  gatewayChainId: ""
  # Gateway smart contract addresses (override the network preset when set)
  gatewayContractAddresses:
    decryption: ""
    gatewayConfig: ""

  # Host chains, shared by every component (ACL checks in kms-worker, accepted
  # handles in endpoint). `name` selects the preset entry (ethereum, polygon,
  # bnb_testnet); chainId and aclAddress override the preset when set. An
  # "ethereum" entry is required by gw-listener and tx-sender.
  hostChains:
    - name: ethereum
      url: "http://ethereum-node:8545"
      chainId: ""
      aclAddress: ""
    - name: polygon
      url: "http://polygon-node:8545"
      chainId: ""
      aclAddress: ""

  ethereumContractAddresses:
    # ProtocolConfig and KMSGeneration are only listened on Ethereum, not other host chains
    kmsGeneration: ""
    protocolConfig: ""

  # Distributed tracing configuration
  tracing:
    enabled: false
    endpoint: "http://otel-deployment-opentelemetry-collector.observability.svc.cluster.local:4317"

  # Environment variables (can be overridden per component)
  env:
    # Example: Database configuration from secrets
    # - name: DATABASE_ENDPOINT
    #   valueFrom:
    #     secretKeyRef:
    #       name: connector-database
    #       key: endpoint
    # - name: PGUSER
    #   valueFrom:
    #     secretKeyRef:
    #       name: connector-database
    #       key: username
    # - name: PGPASSWORD
    #   valueFrom:
    #     secretKeyRef:
    #       name: connector-database
    #       key: password

# -----------------------------------------------------------------------------
# Database Migration
# -----------------------------------------------------------------------------
# Sets up the database schema for KMS connector
kmsConnectorDbMigration:
  enabled: true
  nameOverride:
  annotations:

  image:
    name: ghcr.io/zama-ai/fhevm/kms-connector/db-migration
    tag: v0.15.0

  # Command to run database migrations
  command:
    - "sqlx"
    - "migrate"
    - "run"
    - "--source"
    - "/migrations"

  # Environment variables for database migration
  env:

  serviceAccountName:

  # Size of the non-persistent volume for migration
  storage:
    size: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  nodeSelector:
  affinity:
  tolerations:

# -----------------------------------------------------------------------------
# Gateway Listener
# -----------------------------------------------------------------------------
# Listens to gateway events and processes them
kmsConnectorGwListener:
  enabled: true
  nameOverride:

  image:
    name: ghcr.io/zama-ai/fhevm/kms-connector/gw-listener
    tag: v0.15.0

  replicas: 1

  # Component-specific configuration
  config:
    # Override commonConfig.gatewayUrl if needed
    # gatewayUrl:

  # Additional environment variables
  env:

  # Distributed tracing (inherits from commonConfig but can be overridden)
  tracing:
    enabled: false

  # Service ports
  ports:
    monitoring: 9100

  # Prometheus ServiceMonitor for metrics collection
  serviceMonitor:
    enabled: false

  serviceAccountName:

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Health check probes
  probes:
    liveness:
      enabled: true
      httpGet:
        path: /healthz
        port: monitoring
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 5
    readiness:
      enabled: true
      httpGet:
        path: /healthz
        port: monitoring
      initialDelaySeconds: 5
      periodSeconds: 10

  nodeSelector:
  affinity:
  tolerations:

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# -----------------------------------------------------------------------------
# KMS Worker
# -----------------------------------------------------------------------------
# Communicates with KMS cores to perform cryptographic operations
kmsConnectorKmsWorker:
  enabled: true
  nameOverride:

  image:
    name: ghcr.io/zama-ai/fhevm/kms-connector/kms-worker
    tag: v0.15.0

  replicas: 1

  # Component-specific configuration
  config:
    # KMS core endpoints for communication
    kmsCoreEndpoints: "http://kms-core:50051"

    # Override commonConfig.gatewayUrl if needed
    # gatewayUrl:

  # Additional environment variables
  env:

  # Distributed tracing (inherits from commonConfig but can be overridden)
  tracing:
    enabled: false

  # Service ports
  ports:
    monitoring: 9100

  # Prometheus ServiceMonitor for metrics collection
  serviceMonitor:
    enabled: false

  serviceAccountName:

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Health check probes
  probes:
    liveness:
      enabled: true
      httpGet:
        path: /healthz
        port: monitoring
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 5
    readiness:
      enabled: true
      httpGet:
        path: /healthz
        port: monitoring
      initialDelaySeconds: 5
      periodSeconds: 10

  nodeSelector:
  affinity:
  tolerations:

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# -----------------------------------------------------------------------------
# Transaction Sender
# -----------------------------------------------------------------------------
# Submits transactions to the gateway chain
kmsConnectorTxSender:
  enabled: true
  nameOverride:

  image:
    name: ghcr.io/zama-ai/fhevm/kms-connector/tx-sender
    tag: v0.15.0

  replicas: 1

  # Component-specific configuration
  config:
    # Override commonConfig.gatewayUrl if needed
    # gatewayUrl:

  # Additional environment variables
  env:

  # Wallet configuration for transaction signing
  wallet:
    awsKms:
      # If set to true, will use the AWS KMS key specified in the configmap instead of the private key specified in the secret
      enabled: false
      configmap:
        name: mpc-party
        key: KMS_CONNECTOR__TX_SENDER_AWS_KMS_KEY_ID
    secret:
      name: kms-connector-tx-sender
      key: kms-wallet

  # Distributed tracing (inherits from commonConfig but can be overridden)
  tracing:
    enabled: true

  # Service ports
  ports:
    monitoring: 9100

  # Prometheus ServiceMonitor for metrics collection
  serviceMonitor:
    enabled: false

  serviceAccountName:

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Health check probes
  probes:
    liveness:
      enabled: true
      httpGet:
        path: /healthz
        port: monitoring
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 5
    readiness:
      enabled: true
      httpGet:
        path: /healthz
        port: monitoring
      initialDelaySeconds: 5
      periodSeconds: 10

  nodeSelector:
  affinity:
  tolerations:

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# -----------------------------------------------------------------------------
# Endpoint
# -----------------------------------------------------------------------------
# Serves the HTTP decryption interface, reached through the proxy only
kmsConnectorEndpoint:
  enabled: true
  nameOverride:

  image:
    name: ghcr.io/zama-ai/fhevm/kms-connector/endpoint
    tag: v0.15.0

  replicas: 1

  # Additional environment variables (KMS_CONNECTOR_* settings of the service)
  env:

  # Distributed tracing (inherits from commonConfig but can be overridden)
  tracing:
    enabled: false

  # Service ports
  ports:
    http: 8080
    monitoring: 9100

  # Prometheus ServiceMonitor for metrics collection
  serviceMonitor:
    enabled: false

  serviceAccountName:

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Health check probes
  probes:
    liveness:
      enabled: true
      httpGet:
        path: /healthz
        port: monitoring
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 5
    readiness:
      enabled: true
      httpGet:
        path: /healthz
        port: monitoring
      initialDelaySeconds: 5
      periodSeconds: 10

  nodeSelector:
  affinity:
  tolerations:

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# -----------------------------------------------------------------------------
# Proxy
# -----------------------------------------------------------------------------
# Terminates TLS, authenticates the relayer with an API key and forwards
# requests to the endpoint Service
kmsConnectorProxy:
  enabled: true
  nameOverride:

  image:
    name: ghcr.io/zama-ai/fhevm/kms-connector/proxy
    tag: v0.15.0

  replicas: 1

  # SHA-256 digest of the accepted API key (`printf '%s' "$API_KEY" | sha256sum`),
  # read from a secret unless `value` is set
  apiKeyDigest:
    value: ""
    secret:
      name: kms-connector-proxy
      key: api-key-digest

  # `kubernetes.io/tls` secret (tls.crt, tls.key) served by the proxy, not created by this chart
  tls:
    secretName: kms-connector-proxy-tls

  # Additional environment variables (KMS_CONNECTOR_* settings of the service)
  env:

  # Distributed tracing (inherits from commonConfig but can be overridden)
  tracing:
    enabled: false

  # Service ports
  ports:
    https: 8443
    monitoring: 9100

  # Prometheus ServiceMonitor for metrics collection
  serviceMonitor:
    enabled: false

  serviceAccountName:

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # Health check probes
  probes:
    liveness:
      enabled: true
      httpGet:
        path: /healthz
        port: monitoring
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 5
    readiness:
      enabled: true
      httpGet:
        path: /healthz
        port: monitoring
      initialDelaySeconds: 5
      periodSeconds: 10

  nodeSelector:
  affinity:
  tolerations:

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# -----------------------------------------------------------------------------
# Global Pod Configuration
# -----------------------------------------------------------------------------
# Pod annotations for additional metadata
# See: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}

# Pod labels for selection and organization
# See: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}
