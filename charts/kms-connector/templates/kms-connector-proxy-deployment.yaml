{{- if .Values.kmsConnectorProxy.enabled -}}
{{- if not .Values.kmsConnectorEndpoint.enabled }}{{ fail "kmsConnectorProxy requires kmsConnectorEndpoint.enabled" }}{{ end -}}
{{- $contracts := include "kmsConnector.contracts" . | fromYaml -}}
{{- $ethereum := include "kmsConnector.ethereumHostChain" . | fromYaml -}}
{{- $shutdownGrace := int (default 60 .Values.kmsConnectorProxy.shutdownGracePeriodSeconds) -}}
{{- $scheme := include "kmsConnectorProxyScheme" . -}}
{{- $tlsEnabled := eq $scheme "https" -}}
{{- if not $tlsEnabled }}
{{- /* TLS settings left in the env would make the proxy serve TLS on its `http` port */}}
{{- range concat (default list .Values.commonConfig.env) (default list .Values.kmsConnectorProxy.env) }}
{{- if hasPrefix "KMS_CONNECTOR_TLS_CONFIG" (toString .name) }}
{{- fail (printf "%s is set in the env but kmsConnectorProxy.tls.enabled is false" .name) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kms-connector-proxy
    app.kubernetes.io/name: {{ include "kmsConnectorProxyName" . }}
  name: {{ include "kmsConnectorProxyName" . }}
spec:
  replicas: {{ .Values.kmsConnectorProxy.replicas }}
  selector:
    matchLabels:
      app: kms-connector-proxy
  {{- if .Values.kmsConnectorProxy.updateStrategy }}
  strategy:
    {{- toYaml .Values.kmsConnectorProxy.updateStrategy | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        app: kms-connector-proxy
        app.kubernetes.io/name: {{ include "kmsConnectorProxyName" . }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
        - name: registry-credentials
      restartPolicy: Always
      # The shutdown grace period, then Pingora's 5s to close what is left, then 5s margin.
      terminationGracePeriodSeconds: {{ add $shutdownGrace 10 }}
      {{- with .Values.kmsConnectorProxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kmsConnectorProxy.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kmsConnectorProxy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.kmsConnectorProxy.serviceAccountName }}
      serviceAccountName: {{ .Values.kmsConnectorProxy.serviceAccountName }}
      {{- end }}
      {{- if $tlsEnabled }}
      volumes:
        - name: tls
          secret:
            secretName: {{ required "kmsConnectorProxy.tls.secretName must be set when kmsConnectorProxy.tls.enabled is true" (dig "secretName" "" (default dict .Values.kmsConnectorProxy.tls)) | quote }}
      {{- end }}
      containers:
        - name: kms-connector-proxy
          image: {{ .Values.kmsConnectorProxy.image.name }}:{{ .Values.kmsConnectorProxy.image.tag }}
          {{- if $tlsEnabled }}
          volumeMounts:
            - name: tls
              mountPath: /etc/kms-connector/proxy
              readOnly: true
          {{- end }}
          env:
            # Listen addresses derived from `ports`. Declared first so entries in
            # `commonConfig.env` / `kmsConnectorProxy.env` take precedence.
            - name: KMS_CONNECTOR_MONITORING_ENDPOINT
              value: {{ printf "0.0.0.0:%v" .Values.kmsConnectorProxy.ports.monitoring | quote }}
            - name: KMS_CONNECTOR_PROXY_BIND_ADDRESS
              value: {{ printf "0.0.0.0:%v" (include "kmsConnectorProxyPort" .) | quote }}
          {{- with .Values.commonConfig.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.kmsConnectorProxy.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
            # Set from `shutdownGracePeriodSeconds`, after `env`, so it always matches
            # `terminationGracePeriodSeconds`.
            - name: KMS_CONNECTOR_SHUTDOWN_GRACE_PERIOD
              value: "{{ $shutdownGrace }}s"
          {{- if $tlsEnabled }}
            - name: KMS_CONNECTOR_TLS_CONFIG__CERT_PATH
              value: /etc/kms-connector/proxy/tls.crt
            - name: KMS_CONNECTOR_TLS_CONFIG__KEY_PATH
              value: /etc/kms-connector/proxy/tls.key
          {{- end }}
            - name: KMS_CONNECTOR_ENDPOINT_ADDRESSES
              value: {{ printf "%s:%v" (include "kmsConnectorEndpointName" .) .Values.kmsConnectorEndpoint.ports.http | quote }}
            - name: KMS_CONNECTOR_ETHEREUM_CHAIN_ID
              value: {{ $ethereum.chainId | quote }}
            - name: KMS_CONNECTOR_PROTOCOL_CONFIG_CONTRACT__ADDRESS
              value: {{ $contracts.ethereumProtocolConfig | quote }}
            - name: KMS_CONNECTOR_ALLOWED_SENDERS
              value: {{ .Values.kmsConnectorProxy.allowedSenders | join "," | required "kmsConnectorProxy.allowedSenders must list at least one address" | quote }}
            - name: KMS_CONNECTOR_TX_SENDER_ADDRESS
              value: {{ required "kmsConnectorProxy.txSenderAddress must be set" .Values.kmsConnectorProxy.txSenderAddress | quote }}
          {{- if default .Values.commonConfig.tracing.enabled .Values.kmsConnectorProxy.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.commonConfig.tracing.endpoint }}
            - name: KMS_CONNECTOR_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          {{- end }}
          ports:
            {{- range $portName, $portValue := .Values.kmsConnectorProxy.ports }}
            {{- /* Only one of the `https` and `http` ports is served, depending on TLS */}}
            {{- if or (eq $portName $scheme) (not (has $portName (list "https" "http"))) }}
            - name: {{ $portName }}
              containerPort: {{ $portValue }}
              protocol: TCP
            {{- end }}
            {{- end }}
          {{- with .Values.kmsConnectorProxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and .Values.kmsConnectorProxy.probes .Values.kmsConnectorProxy.probes.liveness.enabled }}
          livenessProbe:
            {{- toYaml (omit .Values.kmsConnectorProxy.probes.liveness "enabled") | nindent 12 }}
          {{- end }}
          {{- if and .Values.kmsConnectorProxy.probes .Values.kmsConnectorProxy.probes.readiness.enabled }}
          readinessProbe:
            {{- toYaml (omit .Values.kmsConnectorProxy.probes.readiness "enabled") | nindent 12 }}
          {{- end }}
{{- end -}}
