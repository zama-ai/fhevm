{{- if .Values.kmsConnectorProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  labels:
    app: kms-connector-proxy
    app.kubernetes.io/name: {{ include "kmsConnectorProxyName" . }}
  name: {{ include "kmsConnectorProxyName" . }}
spec:
  ports:
    {{- $scheme := include "kmsConnectorProxyScheme" . }}
    - name: {{ $scheme }}
      port: {{ include "kmsConnectorProxyPort" . }}
      targetPort: {{ $scheme }}
    - name: monitoring
      port: {{ .Values.kmsConnectorProxy.ports.monitoring }}
      targetPort: monitoring
  selector:
    app: kms-connector-proxy
    app.kubernetes.io/name: {{ include "kmsConnectorProxyName" . }}
  type: ClusterIP
{{- end }}
