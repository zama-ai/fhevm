{{- if .Values.kmsConnectorGwListener.enabled -}}
{{- $contracts := include "kmsConnector.contracts" . | fromYaml -}}
{{- $ethereum := include "kmsConnector.ethereumHostChain" . | fromYaml -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kms-connector-gw-listener
    app.kubernetes.io/name: {{ include "kmsConnectorGwListenerName" . }}
  name: {{ include "kmsConnectorGwListenerName" . }}
spec:
  replicas: {{ .Values.kmsConnectorGwListener.replicas }}
  selector:
    matchLabels:
      app: kms-connector-gw-listener
  {{- if .Values.kmsConnectorGwListener.updateStrategy }}
  strategy:
    {{- toYaml .Values.kmsConnectorGwListener.updateStrategy | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        app: kms-connector-gw-listener
        app.kubernetes.io/name: {{ include "kmsConnectorGwListenerName" . }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
        - name: registry-credentials
      restartPolicy: Always
      {{- with .Values.kmsConnectorGwListener.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kmsConnectorGwListener.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kmsConnectorGwListener.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.kmsConnectorGwListener.serviceAccountName }}
      serviceAccountName: {{ .Values.kmsConnectorGwListener.serviceAccountName }}
      {{- end }}
      containers:
        - name: kms-connector-gw-listener
          image: {{ .Values.kmsConnectorGwListener.image.name }}:{{ .Values.kmsConnectorGwListener.image.tag }}
          env:
            # Listen addresses derived from `ports`. Declared first so entries in
            # `commonConfig.env` / `kmsConnectorGwListener.env` take precedence.
            - name: KMS_CONNECTOR_MONITORING_ENDPOINT
              value: {{ printf "0.0.0.0:%v" .Values.kmsConnectorGwListener.ports.monitoring | quote }}
          {{- with .Values.commonConfig.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.kmsConnectorGwListener.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
            - name: KMS_CONNECTOR_DATABASE_URL
              value: {{ .Values.commonConfig.databaseUrl | quote }}
            - name: KMS_CONNECTOR_GATEWAY_URL
              value: {{ default .Values.commonConfig.gatewayUrl (.Values.kmsConnectorGwListener.config).gatewayUrl | quote }}
            - name: KMS_CONNECTOR_GATEWAY_CHAIN_ID
              value: {{ $contracts.gatewayChainId | quote }}
            - name: KMS_CONNECTOR_DECRYPTION_CONTRACT__ADDRESS
              value: {{ $contracts.decryption | quote }}
            - name: KMS_CONNECTOR_GATEWAY_CONFIG_CONTRACT__ADDRESS
              value: {{ $contracts.gatewayConfig | quote }}
            - name: KMS_CONNECTOR_KMS_GENERATION_CONTRACT__ADDRESS
              value: {{ $contracts.ethereumKmsGeneration | quote }}
            - name: KMS_CONNECTOR_ETHEREUM_URL
              value: {{ $ethereum.url | quote }}
            - name: KMS_CONNECTOR_ETHEREUM_CHAIN_ID
              value: {{ $ethereum.chainId | quote }}
            - name: KMS_CONNECTOR_PROTOCOL_CONFIG_CONTRACT__ADDRESS
              value: {{ $contracts.ethereumProtocolConfig | quote }}
          {{- if default .Values.commonConfig.tracing.enabled .Values.kmsConnectorGwListener.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.commonConfig.tracing.endpoint }}
            - name: KMS_CONNECTOR_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          {{- end }}
          ports:
            {{- range $portName, $portValue := .Values.kmsConnectorGwListener.ports }}
            - name: {{ $portName }}
              containerPort: {{ $portValue }}
              protocol: TCP
            {{- end }}
          {{- with .Values.kmsConnectorGwListener.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and .Values.kmsConnectorGwListener.probes .Values.kmsConnectorGwListener.probes.liveness.enabled }}
          livenessProbe:
            {{- toYaml (omit .Values.kmsConnectorGwListener.probes.liveness "enabled") | nindent 12 }}
          {{- end }}
          {{- if and .Values.kmsConnectorGwListener.probes .Values.kmsConnectorGwListener.probes.readiness.enabled }}
          readinessProbe:
            {{- toYaml (omit .Values.kmsConnectorGwListener.probes.readiness "enabled") | nindent 12 }}
          {{- end }}
{{- end -}}
