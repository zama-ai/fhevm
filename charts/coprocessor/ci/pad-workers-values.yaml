# ct lint renders the chart once per file of this directory: this one is a pad release with two
# pad-workers and no other component. Test values only.
dbMigration:
  enabled: false
tfheWorker:
  enabled: false
commonConfig:
  databaseUrl: "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@coprocessor-db:5432/coprocessor"
padWorkers:
  - prfId: 0
    keyId: "0x01"
  - prfId: 1
    keyId: "0x02"
    image:
      tag: v0.0.0-test
padWorkerShared:
  databaseUser:
    value: pad_worker
  config:
    s3BucketName:
      value: coprocessor-bucket
