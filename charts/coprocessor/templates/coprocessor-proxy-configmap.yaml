{{- if and .Values.coprocessorProxy.enabled .Values.coprocessorProxy.config -}}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: coprocessor-proxy
    app.kubernetes.io/name: {{ include "coprocessorProxyName" . }}
  name: {{ include "coprocessorProxyName" . }}
data:
  proxy.toml: |
    {{- .Values.coprocessorProxy.config | nindent 4 }}
{{- end -}}
