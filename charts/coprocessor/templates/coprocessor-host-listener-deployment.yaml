{{- define "coprocessor.hostListener.args" -}}
{{- $mode := .mode -}}
{{- $chain := .chain -}}
{{- $c := .c -}}
{{- $broker := ($c.config | default dict).brokerUrl | default dict -}}
{{- $tenant := .root.Values.commonConfig.tenantApiKey | default dict -}}
- --database-url=$(DATABASE_URL)
{{- if eq $mode.rpc "ws" }}
- --url=$(ETHEREUM_RPC_URL)
{{- else if eq $mode.rpc "http" }}
- --url=$(ETHEREUM_RPC_HTTP_URL)
{{- end }}
- --acl-contract-address=$(ACL_CONTRACT_ADDRESS)
- --tfhe-contract-address=$(FHEVM_EXECUTOR_CONTRACT_ADDRESS)
{{- if or $chain.kmsGenerationContractAddress $chain.kmsGenerationContractAddressValueFrom }}
- --kms-generation-address=$(KMS_GENERATION_ADDRESS)
{{- end }}
{{- if or $chain.protocolConfigContractAddress $chain.protocolConfigContractAddressValueFrom }}
- --protocol-config-address=$(PROTOCOL_CONFIG_ADDRESS)
{{- end }}
{{- if and $mode.chainIdArg $chain.chainId }}
- --chain-id={{ $chain.chainId }}
{{- end }}
{{- if and $mode.broker (or $broker.value $broker.valueFrom) }}
- --broker-url=$(BROKER_URL)
{{- end }}
- --health-port={{ $c.ports.healthcheck }}
{{- if $mode.metricsArg }}
- --metrics-addr=0.0.0.0:{{ $c.ports.metrics }}
{{- end }}
{{- with coalesce .cfg.serviceName $c.serviceName }}
- --service-name={{ . }}
{{- end }}
{{- if and $mode.tenant (or $tenant.value $tenant.valueFrom) }}
- --coprocessor-api-key=$(TENANT_API_KEY)
{{- end }}
{{- end -}}

{{- define "coprocessor.hostListener.env" -}}
{{- include "coprocessor.env.database" .root }}
{{- if .mode.tenant }}
{{- include "coprocessor.env.tenant" .root }}
{{- end }}
{{- if .mode.broker }}
{{- include "coprocessor.envVar" (dict "root" .root "name" "BROKER_URL" "spec" (.c.config | default dict).brokerUrl) }}
{{- end }}
{{- include "coprocessor.env.chain" (dict "root" .root "chain" .chain "rpc" .mode.rpc) }}
{{- include "coprocessor.env.tracing" . }}
{{- include "coprocessor.env.extra" (dict "root" .root "lists" (list .c.env .cfg.env)) }}
{{- end -}}

{{- range $instance := (include "coprocessor.hostListenerInstances" . | fromYaml).instances }}
{{- $_ := set $instance "root" $ }}
---
{{ include "coprocessor.deployment" (dict
  "root" $
  "c" $instance.c
  "name" $instance.name
  "appLabel" $instance.appLabel
  "container" (printf "coprocessor-%s" $instance.mode.suffix)
  "command" $instance.mode.command
  "args" (include "coprocessor.hostListener.args" $instance)
  "extraArgs" (list $instance.c.extraArgs $instance.cfg.extraArgs)
  "env" (include "coprocessor.hostListener.env" $instance)
  "extraSelectorLabels" $instance.mode.extraSelectorLabels) }}
{{- end }}
