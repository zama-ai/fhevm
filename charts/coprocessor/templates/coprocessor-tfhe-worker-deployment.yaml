{{- define "coprocessor.tfheWorker.args" -}}
- --database-url=$(DATABASE_URL)
- --metrics-addr=0.0.0.0:{{ .c.ports.metrics }}
- --health-check-port={{ .c.ports.healthcheck }}
{{- end -}}

{{- define "coprocessor.tfheWorker.env" -}}
{{- include "coprocessor.env.forceLegacyServerKey" .root }}
{{- include "coprocessor.env.database" .root }}
{{- include "coprocessor.env.tracing" . }}
{{- include "coprocessor.env.extra" (dict "root" .root "lists" (list .c.env)) }}
{{- end -}}

{{- if .Values.tfheWorker.enabled }}
{{- $ctx := dict "root" . "c" .Values.tfheWorker }}
{{- include "coprocessor.deployment" (merge (dict
  "name" (include "tfheWorkerName" .)
  "appLabel" "coprocessor-tfhe-worker"
  "container" "coprocessor-tfhe-worker"
  "command" "tfhe_worker"
  "args" (include "coprocessor.tfheWorker.args" $ctx)
  "extraArgs" (list $ctx.c.extraArgs)
  "env" (include "coprocessor.tfheWorker.env" $ctx)
  "extraSelectorLabels" true) $ctx) }}
{{- end }}
