{{- define "coprocessor.upgradeController.env" -}}
{{- include "coprocessor.env.database" .root }}
{{- include "coprocessor.env.tracing" . }}
{{- include "coprocessor.env.extra" (dict "root" .root "lists" (list .c.env)) }}
{{- end -}}

{{- with include "coprocessor.workload" (dict "root" . "key" "upgradeController") | fromYaml }}
{{- $ctx := dict "root" $ "c" .c }}
{{- include "coprocessor.deployment" (merge (dict
  "name" .name
  "appLabel" .appLabel
  "container" .appLabel
  "command" "upgrade-controller"
  "args" "- --database-url=$(DATABASE_URL)"
  "extraArgs" (list $ctx.c.extraArgs)
  "env" (include "coprocessor.upgradeController.env" $ctx)
  "extraSelectorLabels" true) $ctx) }}
{{- end }}
