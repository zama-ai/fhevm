{{- define "coprocessor.txSender.args" -}}
{{- $hostChainUrl := (.c.config | default dict).hostChainUrl | default dict -}}
- --database-url=$(DATABASE_URL)
- --gateway-url=$(GATEWAY_URL)
{{- if or $hostChainUrl.value $hostChainUrl.valueFrom }}
- --host-chain-url=$(HOST_CHAIN_URL)
{{- end }}
- --input-verification-address=$(INPUT_VERIFICATION_ADDRESS)
- --ciphertext-commits-address=$(CIPHERTEXT_COMMITS_ADDRESS)
- --multichain-acl-address=$(MULTICHAIN_ACL_ADDRESS)
{{- include "coprocessor.args.wallet" (dict "wallet" .c.wallet) }}
- --health-check-port={{ .c.ports.healthcheck }}
- --metrics-addr=0.0.0.0:{{ .c.ports.metrics }}
{{- end -}}

{{- define "coprocessor.txSender.env" -}}
{{- $config := .c.config | default dict -}}
{{- include "coprocessor.env.database" .root }}
{{- include "coprocessor.envVar" (dict "root" .root "name" "GATEWAY_URL" "spec" ($config.gatewayUrl | default .root.Values.commonConfig.gatewayUrl)) }}
{{- include "coprocessor.envVar" (dict "root" .root "name" "HOST_CHAIN_URL" "spec" $config.hostChainUrl) }}
{{- include "coprocessor.env.gateway" (dict "root" .root "fields" (list "inputVerification" "ciphertextCommits" "multichainAcl")) }}
{{- include "coprocessor.env.wallet" (dict "wallet" .c.wallet) }}
{{- include "coprocessor.env.tracing" . }}
{{- include "coprocessor.env.extra" (dict "root" .root "lists" (list .c.env)) }}
{{- end -}}

{{- with include "coprocessor.workload" (dict "root" . "key" "txSender") | fromYaml }}
{{- $ctx := dict "root" $ "c" .c }}
{{- include "coprocessor.deployment" (merge (dict
  "name" .name
  "appLabel" .appLabel
  "container" .appLabel
  "command" "transaction_sender"
  "args" (include "coprocessor.txSender.args" $ctx)
  "extraArgs" (list $ctx.c.extraArgs)
  "env" (include "coprocessor.txSender.env" $ctx)
  "extraSelectorLabels" true) $ctx) }}
{{- end }}
