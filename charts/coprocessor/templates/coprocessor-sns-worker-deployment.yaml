{{- define "coprocessor.snsWorker.args" -}}
{{- $tenant := .root.Values.commonConfig.tenantApiKey | default dict -}}
- --database-url=$(DATABASE_URL)
{{- if or $tenant.value $tenant.valueFrom }}
- --tenant-api-key=$(TENANT_API_KEY)
{{- end }}
- --bucket-name=$(S3_BUCKET_NAME)
{{- if .c.wallet.enabled }}
{{- include "coprocessor.args.wallet" (dict "wallet" .c.wallet) }}
{{- end }}
- --metrics-addr=0.0.0.0:{{ .c.ports.metrics }}
- --health-check-port={{ .c.ports.healthcheck }}
{{- end -}}

{{- define "coprocessor.snsWorker.env" -}}
{{- $config := .c.config | default dict -}}
{{- include "coprocessor.env.forceLegacyServerKey" .root }}
{{- include "coprocessor.env.database" .root }}
{{- include "coprocessor.env.tenant" .root }}
{{- include "coprocessor.envVar" (dict "root" .root "name" "S3_BUCKET_NAME" "spec" $config.s3BucketName) }}
{{- with $config.s3Migration }}
{{- with .mode }}
- name: S3_MIGRATION_MODE
  value: {{ . | quote }}
{{- end }}
{{- with .sleepDuration }}
- name: S3_MIGRATION_SLEEP_DURATION
  value: {{ . | quote }}
{{- end }}
{{- with .maxRetries }}
- name: S3_MIGRATION_MAX_RETRIES
  value: {{ . | quote }}
{{- end }}
{{- end }}
{{- if .c.wallet.enabled }}
{{- include "coprocessor.env.wallet" (dict "wallet" .c.wallet) }}
{{- end }}
{{- include "coprocessor.env.tracing" . }}
{{- include "coprocessor.env.extra" (dict "root" .root "lists" (list .c.env)) }}
{{- end -}}

{{- if .Values.snsWorker.enabled }}
{{- $ctx := dict "root" . "c" .Values.snsWorker }}
{{- include "coprocessor.deployment" (merge (dict
  "name" (include "snsWorkerName" .)
  "appLabel" "coprocessor-sns-worker"
  "container" "coprocessor-sns-worker"
  "command" "sns_worker"
  "args" (include "coprocessor.snsWorker.args" $ctx)
  "extraArgs" (list $ctx.c.extraArgs)
  "env" (include "coprocessor.snsWorker.env" $ctx)
  "extraSelectorLabels" true) $ctx) }}
{{- end }}
