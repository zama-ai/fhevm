{{- if .Values.prfService.enabled -}}
{{- /* prf-service trusts X-Fhevm-Signer: only the proxy may reach it. */}}
{{- if not (and .Values.coprocessorProxy.enabled .Values.coprocessorProxy.prfServiceNetworkPolicy.enabled) }}
{{- fail "prfService needs coprocessorProxy.enabled and coprocessorProxy.prfServiceNetworkPolicy.enabled" }}
{{- end }}
{{- $component := .Values.prfService -}}
{{- /* A policy that does not select these pods leaves their port open. */}}
{{- $pod := dict "app" "coprocessor-prf-service" "app.kubernetes.io/name" (include "prfServiceName" .) }}
{{- $pod = mergeOverwrite $pod (.Values.commonConfig.extraSelectorLabels | default dict) }}
{{- with .Values.commonConfig.stackVersion }}{{ $_ := set $pod "app.kubernetes.io/version" . }}{{ end }}
{{- $pod = mergeOverwrite $pod (.Values.podLabels | default dict) ($component.podLabels | default dict) }}
{{- range $k, $v := .Values.coprocessorProxy.prfServiceNetworkPolicy.podSelector }}
{{- if ne (toString $v) (toString (get $pod $k)) }}
{{- fail (printf "coprocessorProxy.prfServiceNetworkPolicy.podSelector %s does not select the prf-service pods" $k) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: coprocessor-prf-service
    app.kubernetes.io/name: {{ include "prfServiceName" . }}
  name: {{ include "prfServiceName" . }}
spec:
  replicas: {{ $component.replicas }}
  selector:
    matchLabels:
      app: coprocessor-prf-service
      {{- include "coprocessor.extraSelectorLabels" . | nindent 6 }}
  {{- with $component.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        app: coprocessor-prf-service
        app.kubernetes.io/name: {{ include "prfServiceName" . }}
        {{- include "coprocessor.extraSelectorLabels" . | nindent 8 }}
        {{- with .Values.commonConfig.stackVersion }}
        app.kubernetes.io/version: {{ . | quote }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $component.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
        - name: registry-credentials
      restartPolicy: Always
      {{- with $component.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $component.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $component.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $component.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      containers:
        - name: coprocessor-prf-service
          image: {{ $component.image.name }}:{{ $component.image.tag }}
          command: ["prf-service"]
          {{- if .Values.commonConfig.stackVersionProbe.enabled }}
          startupProbe:
            exec:
              command: ["prf-service", "--stack-version"]
            periodSeconds: {{ .Values.commonConfig.stackVersionProbe.periodSeconds | default 10 }}
            failureThreshold: {{ .Values.commonConfig.stackVersionProbe.failureThreshold | default 30 }}
          {{- end }}
          args:
            - --http-endpoint=0.0.0.0:{{ $component.ports.http }}
            - --health-check-port={{ $component.ports.healthcheck }}
            - --metrics-addr=0.0.0.0:{{ $component.ports.metrics }}
            - --database-url=$(DATABASE_URL)
            - --database-pool-size={{ $component.databasePoolSize }}
            - --max-concurrent-per-connector={{ int64 $component.limits.maxConcurrentPerConnector }}
            - --max-in-flight-per-connector={{ $component.limits.maxInFlightPerConnector }}
            {{- with $component.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- /* The prf_service role when set: it can only add and read pads rows. */}}
            {{- with (default .Values.commonConfig.databaseUser $component.databaseUser) }}
            - name: DATABASE_USER
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- include "coprocessor.valueFrom" (dict "root" $ "valueFrom" .valueFrom) | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- with .Values.commonConfig.databaseEndpoint }}
            - name: DATABASE_ENDPOINT
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- include "coprocessor.valueFrom" (dict "root" $ "valueFrom" .valueFrom) | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- if eq (include "coprocessorDatabaseAuthMode" .) "password" }}
            {{- with (default .Values.commonConfig.databasePassword $component.databasePassword) }}
            - name: DATABASE_PASSWORD
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- include "coprocessor.valueFrom" (dict "root" $ "valueFrom" .valueFrom) | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.commonConfig.databaseUrl }}
            - name: DATABASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if eq (include "coprocessorDatabaseAuthMode" .) "iam" }}
            - name: DATABASE_IAM_AUTH_ENABLED
              value: "true"
            {{- with .Values.commonConfig.databaseIamRegion }}
            - name: DATABASE_IAM_REGION
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- include "coprocessor.valueFrom" (dict "root" $ "valueFrom" .valueFrom) | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- if eq (include "coprocessor.databaseSslRootCertEnvEnabled" .) "true" }}
            {{- include "coprocessor.databaseSslRootCertEnv" . | nindent 12 }}
            {{- end }}
            {{- end }}
          {{- if default .Values.commonConfig.tracing.enabled $component.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.commonConfig.tracing.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              {{- if $component.tracing.service }}
              value: {{ $component.tracing.service | quote }}
              {{- else }}
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
              {{- end }}
          {{- end }}
          {{- with .Values.commonConfig.env }}
            {{- include "coprocessor.valueFrom" (dict "root" $ "valueFrom" .) | nindent 12 }}
          {{- end }}
          {{- with $component.env }}
            {{- include "coprocessor.valueFrom" (dict "root" $ "valueFrom" .) | nindent 12 }}
          {{- end }}
          ports:
            {{- range $portName, $portValue := $component.ports }}
            - name: {{ $portName }}
              containerPort: {{ $portValue }}
              protocol: TCP
            {{- end }}
          {{- include "coprocessor.containerResources" $component.resources | nindent 10 }}
          {{- if $component.probes.liveness.enabled }}
          livenessProbe:
            {{- toYaml (omit $component.probes.liveness "enabled") | nindent 12 }}
          {{- end }}
          {{- if $component.probes.readiness.enabled }}
          readinessProbe:
            {{- toYaml (omit $component.probes.readiness "enabled") | nindent 12 }}
          {{- end }}
          {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
          {{- include "coprocessor.databaseSslRootCertVolumeMount" . | nindent 10 }}
          {{- end }}
      {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
      {{- include "coprocessor.databaseSslRootCertVolume" . | nindent 6 }}
      {{- end }}
{{- end -}}
