{{- define "coprocessor.gwListener.args" -}}
{{- $gwAddrs := include "coprocessor.gatewayContractAddresses" .root | fromYaml -}}
- --database-url=$(DATABASE_URL)
- --gw-url=$(GATEWAY_URL)
- --input-verification-address=$(INPUT_VERIFICATION_ADDRESS)
{{- if or $gwAddrs.ciphertextCommits.value $gwAddrs.ciphertextCommits.valueFrom }}
- --ciphertext-commits-address=$(CIPHERTEXT_COMMITS_ADDRESS)
{{- end }}
{{- if or $gwAddrs.gatewayConfig.value $gwAddrs.gatewayConfig.valueFrom }}
- --gateway-config-address=$(GATEWAY_CONFIG_ADDRESS)
{{- end }}
- --health-check-port={{ .c.ports.healthcheck }}
- --metrics-addr=0.0.0.0:{{ .c.ports.metrics }}
{{- end -}}

{{- define "coprocessor.gwListener.env" -}}
{{- include "coprocessor.env.database" .root }}
{{- include "coprocessor.envVar" (dict "root" .root "name" "GATEWAY_URL" "spec" .root.Values.commonConfig.gatewayUrl) }}
{{- include "coprocessor.env.gateway" (dict "root" .root "fields" (list "inputVerification" "ciphertextCommits" "gatewayConfig")) }}
{{- with (.c.config | default dict).chainId }}
- name: CHAIN_ID
  value: {{ . | quote }}
{{- end }}
{{- include "coprocessor.env.tracing" . }}
{{- include "coprocessor.env.extra" (dict "root" .root "lists" (list .c.env)) }}
{{- end -}}

{{- with include "coprocessor.workload" (dict "root" . "key" "gwListener") | fromYaml }}
{{- $ctx := dict "root" $ "c" .c }}
{{- include "coprocessor.deployment" (merge (dict
  "name" .name
  "appLabel" .appLabel
  "container" .appLabel
  "command" "gw_listener"
  "args" (include "coprocessor.gwListener.args" $ctx)
  "extraArgs" (list $ctx.c.extraArgs)
  "env" (include "coprocessor.gwListener.env" $ctx)
  "extraSelectorLabels" true) $ctx) }}
{{- end }}
