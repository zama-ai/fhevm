{{- if and .Values.coprocessorProxy.enabled .Values.coprocessorProxy.endpointNetworkPolicy.enabled -}}
{{- $policy := .Values.coprocessorProxy.endpointNetworkPolicy -}}
{{- if not $policy.podSelector }}
{{- fail "coprocessorProxy.endpointNetworkPolicy.podSelector must select the endpoint pods" }}
{{- end }}
# Only the proxy reaches the endpoints: they trust what it forwards no more than any caller, but
# nothing else may bypass its checks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app: coprocessor-proxy
    app.kubernetes.io/name: {{ include "coprocessorProxyName" . }}
  name: {{ include "coprocessorProxyName" . }}-endpoints
spec:
  podSelector:
    matchLabels:
      {{- toYaml $policy.podSelector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: coprocessor-proxy
              app.kubernetes.io/name: {{ include "coprocessorProxyName" . }}
              {{- include "coprocessor.extraSelectorLabels" . | nindent 14 }}
    {{- with $policy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end -}}
