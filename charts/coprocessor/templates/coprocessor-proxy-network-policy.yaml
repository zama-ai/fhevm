{{- if and .Values.coprocessorProxy.enabled .Values.coprocessorProxy.prfServiceNetworkPolicy.enabled -}}
{{- $policy := .Values.coprocessorProxy.prfServiceNetworkPolicy -}}
{{- if not $policy.podSelector }}
{{- fail "coprocessorProxy.prfServiceNetworkPolicy.podSelector must select the prf-service pods" }}
{{- end }}
{{- if not $policy.ports }}
{{- fail "coprocessorProxy.prfServiceNetworkPolicy.ports must list the prf-service pod ports" }}
{{- end }}
{{- /* With prf-service in this release, the policy must admit its PRF port. */}}
{{- if .Values.prfService.enabled }}
{{- $http := toString (int .Values.prfService.ports.http) }}
{{- $admitted := false }}
{{- range $policy.ports }}
{{- if has (toString .port) (list $http "http") }}
{{- $admitted = true }}
{{- end }}
{{- end }}
{{- if not $admitted }}
{{- fail (printf "coprocessorProxy.prfServiceNetworkPolicy.ports must include prfService.ports.http (%s)" $http) }}
{{- end }}
{{- end }}
{{- range $policy.extraIngress }}
{{- if not .from }}
{{- fail "coprocessorProxy.prfServiceNetworkPolicy.extraIngress rules must set `from`: a rule without it admits every source" }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app: coprocessor-proxy
    app.kubernetes.io/name: {{ include "coprocessorProxyName" . }}
  name: {{ include "coprocessorProxyName" . }}-prf-service
spec:
  podSelector:
    matchLabels:
      {{- toYaml $policy.podSelector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: coprocessor-proxy
              app.kubernetes.io/name: {{ include "coprocessorProxyName" . }}
              {{- include "coprocessor.extraSelectorLabels" . | nindent 14 }}
      ports:
        {{- toYaml $policy.ports | nindent 8 }}
    {{- with $policy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end -}}
