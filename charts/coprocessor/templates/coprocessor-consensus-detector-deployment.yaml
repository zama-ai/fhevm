{{- if .Values.consensusDetector.enabled -}}
{{- $disabled := default (list) .Values.consensusDetector.disabledArgs -}}
{{- $myBucket := .Values.consensusDetector.myBucket | default dict -}}
{{- if not (or $myBucket.value $myBucket.valueFrom) -}}
{{- $myBucket = ((.Values.snsWorker.config).s3BucketName) | default dict -}}
{{- end -}}
{{- $s3Endpoint := .Values.consensusDetector.s3Endpoint | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: coprocessor-consensus-detector
    app.kubernetes.io/name: {{ include "consensusDetectorName" . }}
  name: {{ include "consensusDetectorName" . }}
spec:
  replicas: {{ .Values.consensusDetector.replicas }}
  selector:
    matchLabels:
      app: coprocessor-consensus-detector
      {{- include "coprocessor.extraSelectorLabels" . | nindent 6 }}
  {{- if .Values.consensusDetector.updateStrategy }}
  strategy:
    {{- toYaml .Values.consensusDetector.updateStrategy | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        app: coprocessor-consensus-detector
        app.kubernetes.io/name: {{ include "consensusDetectorName" . }}
        {{- include "coprocessor.extraSelectorLabels" . | nindent 8 }}
        {{- with .Values.commonConfig.stackVersion }}
        app.kubernetes.io/version: {{ . | quote }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.consensusDetector.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
        - name: registry-credentials
      restartPolicy: Always
      {{- with .Values.consensusDetector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.consensusDetector.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.consensusDetector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.consensusDetector.serviceAccountName }}
      serviceAccountName: {{ .Values.consensusDetector.serviceAccountName }}
      {{- end }}
      containers:
        - name: coprocessor-consensus-detector
          image: {{ .Values.consensusDetector.image.name }}:{{ .Values.consensusDetector.image.tag }}
          command: ["consensus-detector"]
          {{- if .Values.commonConfig.stackVersionProbe.enabled }}
          startupProbe:
            exec:
              command: ["consensus-detector", "--stack-version"]
            periodSeconds: {{ .Values.commonConfig.stackVersionProbe.periodSeconds | default 10 }}
            failureThreshold: {{ .Values.commonConfig.stackVersionProbe.failureThreshold | default 30 }}
          {{- end }}
          args:
            {{- if not (has "database-url" $disabled) }}
            - --database-url=$(DATABASE_URL)
            {{- end }}
            {{- if not (has "gw-url" $disabled) }}
            - --gw-url=$(GATEWAY_URL)
            {{- end }}
            {{- if and (or .Values.commonConfig.gatewayContractAddresses.gatewayConfig.value .Values.commonConfig.gatewayContractAddresses.gatewayConfig.valueFrom) (not (has "gateway-config-address" $disabled)) }}
            - --gateway-config-address=$(GATEWAY_CONFIG_ADDRESS)
            {{- end }}
            {{- if and (or $myBucket.value $myBucket.valueFrom) (not (has "my-bucket" $disabled)) }}
            - --my-bucket=$(S3_BUCKET_NAME)
            {{- end }}
            {{- if and (or $s3Endpoint.value $s3Endpoint.valueFrom) (not (has "s3-endpoint" $disabled)) }}
            - --s3-endpoint=$(S3_ENDPOINT)
            {{- end }}
            {{- with .Values.consensusDetector.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- with .Values.commonConfig.databaseUser }}
            - name: DATABASE_USER
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- with .Values.commonConfig.databaseEndpoint }}
            - name: DATABASE_ENDPOINT
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- if eq (include "coprocessorDatabaseAuthMode" .) "password" }}
            {{- with .Values.commonConfig.databasePassword }}
            - name: DATABASE_PASSWORD
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.commonConfig.databaseUrl }}
            - name: DATABASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if eq (include "coprocessorDatabaseAuthMode" .) "iam" }}
            - name: DATABASE_IAM_AUTH_ENABLED
              value: "true"
            {{- with .Values.commonConfig.databaseIamRegion }}
            - name: DATABASE_IAM_REGION
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- if eq (include "coprocessor.databaseSslRootCertEnvEnabled" .) "true" }}
            {{- include "coprocessor.databaseSslRootCertEnv" . | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- with .Values.commonConfig.gatewayUrl }}
            - name: GATEWAY_URL
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- with .Values.commonConfig.gatewayContractAddresses.gatewayConfig }}
            - name: GATEWAY_CONFIG_ADDRESS
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- if or $myBucket.value $myBucket.valueFrom }}
            - name: S3_BUCKET_NAME
              {{- if $myBucket.value }}
              value: {{ $myBucket.value | quote }}
              {{- else if $myBucket.valueFrom }}
              valueFrom:
                {{- toYaml $myBucket.valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- if or $s3Endpoint.value $s3Endpoint.valueFrom }}
            - name: S3_ENDPOINT
              {{- if $s3Endpoint.value }}
              value: {{ $s3Endpoint.value | quote }}
              {{- else if $s3Endpoint.valueFrom }}
              valueFrom:
                {{- toYaml $s3Endpoint.valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
          {{- if default .Values.commonConfig.tracing.enabled .Values.consensusDetector.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.commonConfig.tracing.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.consensusDetector.tracing.service | quote }}
          {{- end }}
          {{- with .Values.commonConfig.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.consensusDetector.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: {{ .Values.consensusDetector.resources.requests.cpu | default "100m" }}
              memory: {{ .Values.consensusDetector.resources.requests.memory | default "256Mi" }}
            limits:
              cpu: {{ .Values.consensusDetector.resources.limits.cpu | default "500m" }}
              memory: {{ .Values.consensusDetector.resources.limits.memory | default "512Mi" }}
          {{- if and .Values.consensusDetector.probes .Values.consensusDetector.probes.liveness.enabled }}
          livenessProbe:
            {{- toYaml (omit .Values.consensusDetector.probes.liveness "enabled") | nindent 12 }}
          {{- end }}
          {{- if and .Values.consensusDetector.probes .Values.consensusDetector.probes.readiness.enabled }}
          readinessProbe:
            {{- toYaml (omit .Values.consensusDetector.probes.readiness "enabled") | nindent 12 }}
          {{- end }}
          {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
          {{- include "coprocessor.databaseSslRootCertVolumeMount" . | nindent 10 }}
          {{- end }}
      {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
      {{- include "coprocessor.databaseSslRootCertVolume" . | nindent 6 }}
      {{- end }}
{{- end -}}
