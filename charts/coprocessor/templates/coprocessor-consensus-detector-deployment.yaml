{{- define "coprocessor.consensusDetector.args" -}}
{{- $c := .c -}}
{{- $config := $c.config -}}
{{- $disabled := $c.disabledArgs | default list -}}
- --database-url=$(DATABASE_URL)
- --gw-url=$(GATEWAY_URL)
- --gateway-config-address=$(GATEWAY_CONFIG_ADDRESS)
- --my-bucket=$(S3_BUCKET_NAME)
- --manifest-discovery-interval={{ $config.manifestDiscoveryInterval }}
{{- range $config.manifestPublicationCadence }}
- --manifest-publication-cadence={{ . }}
{{- end }}
- --manifest-publication-retry-delay={{ $config.manifestPublicationRetryDelay }}
- --manifest-publication-retry-count={{ $config.manifestPublicationRetryCount }}
- --manifest-verification-delay={{ $config.manifestVerificationDelay }}
- --manifest-verification-retry-delay={{ $config.manifestVerificationRetryDelay }}
- --manifest-verification-retry-count={{ $config.manifestVerificationRetryCount }}
- --manifest-healing-batch-size={{ $config.manifestHealingBatchSize }}
- --manifest-healing-poll-interval={{ $config.manifestHealingPollInterval }}
- --manifest-healing-containment-timeout={{ $config.manifestHealingContainmentTimeout }}
- --manifest-healing-max-attempts={{ $config.manifestHealingMaxAttempts }}
- --incomplete-block-timeout={{ $config.incompleteBlockTimeout }}
- --incomplete-manifest-max-lag={{ $config.incompleteManifestMaxLag }}
{{- if $c.wallet.enabled }}
{{- include "coprocessor.args.wallet" (dict "wallet" $c.wallet) }}
{{- end }}
{{- if not (has "metrics-addr" $disabled) }}
- --metrics-addr=0.0.0.0:{{ $c.ports.metrics }}
- --gauge-update-interval-secs={{ $config.gaugeUpdateIntervalSecs }}
{{- end }}
{{- if or .s3Endpoint.value .s3Endpoint.valueFrom }}
- --s3-endpoint=$(S3_ENDPOINT)
{{- end }}
{{- end -}}

{{- define "coprocessor.consensusDetector.env" -}}
{{- include "coprocessor.env.database" .root }}
{{- include "coprocessor.envVar" (dict "root" .root "name" "GATEWAY_URL" "spec" .root.Values.commonConfig.gatewayUrl) }}
{{- include "coprocessor.env.gateway" (dict "root" .root "fields" (list "gatewayConfig")) }}
{{- include "coprocessor.envVar" (dict "root" .root "name" "S3_ENDPOINT" "spec" .s3Endpoint) }}
{{- include "coprocessor.envVar" (dict "root" .root "name" "S3_BUCKET_NAME" "spec" .bucket) }}
{{- if .c.wallet.enabled }}
{{- include "coprocessor.env.wallet" (dict "wallet" .c.wallet) }}
{{- end }}
{{- include "coprocessor.env.tracing" . }}
{{- include "coprocessor.env.extra" (dict "root" .root "lists" (list .c.env)) }}
{{- end -}}

{{- with include "coprocessor.workload" (dict "root" . "key" "consensusDetector") | fromYaml }}
{{- $w := . }}
{{- $c := .c }}
{{- $disabled := $c.disabledArgs | default list }}
{{- $bucket := $c.config.s3BucketName | default dict }}
{{- if not (or $bucket.value $bucket.valueFrom) }}
{{- $bucket = $c.myBucket | default dict }}
{{- end }}
{{- if not (or $bucket.value $bucket.valueFrom) }}
{{- $bucket = ($.Values.snsWorker.config).s3BucketName | default dict }}
{{- end }}
{{- if not (or $bucket.value $bucket.valueFrom) }}
{{- fail "consensusDetector.config.s3BucketName must set value or valueFrom when consensusDetector is enabled" }}
{{- end }}
{{- if and (or $bucket.valueFrom (ne ($bucket.value | default "") "none")) (not $c.wallet.enabled) }}
{{- fail "consensusDetector.wallet.enabled must be true when manifest publication is enabled" }}
{{- end }}
{{- /* Both are required by the binary: an unset variable leaves the literal
     $(VAR) in the argument, which fails to parse and crash-loops the pod. */}}
{{- $gatewayUrl := $.Values.commonConfig.gatewayUrl | default dict }}
{{- if and (not (has "gw-url" $disabled)) (not (or $gatewayUrl.value $gatewayUrl.valueFrom)) }}
{{- fail "commonConfig.gatewayUrl must set value or valueFrom when consensusDetector is enabled" }}
{{- end }}
{{- $gatewayConfig := (include "coprocessor.gatewayContractAddresses" $ | fromYaml).gatewayConfig | default dict }}
{{- if and (not (has "gateway-config-address" $disabled)) (not (or $gatewayConfig.value $gatewayConfig.valueFrom)) }}
{{- fail "commonConfig.gatewayContractAddresses.gatewayConfig must set value or valueFrom (or commonConfig.network must provide gateway.gateway_config.address) when consensusDetector is enabled" }}
{{- end }}
{{- $ctx := dict "root" $ "c" $c "bucket" $bucket "s3Endpoint" ($c.s3Endpoint | default dict) }}
{{- include "coprocessor.deployment" (merge (dict
  "name" $w.name
  "appLabel" $w.appLabel
  "container" $w.appLabel
  "command" "consensus-detector"
  "args" (include "coprocessor.consensusDetector.args" $ctx)
  "extraArgs" (list $c.extraArgs)
  "env" (include "coprocessor.consensusDetector.env" $ctx)
  "extraSelectorLabels" true) $ctx) }}
{{- end }}
