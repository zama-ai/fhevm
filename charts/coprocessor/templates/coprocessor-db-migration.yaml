{{- /*
Declarative host-chains seeding. Rendered from the coprocessor.chains helper
(commonConfig.network preset merged with .Values.chains) so the dbMigration Job
seeds the `host_chains` Postgres table from the same source of truth the
listeners use. Each entry produces the env vars consumed by
initialize_db.sh -> seed_host_chains:
  HOST_CHAIN_<i>_ID    (literal chainId)
  HOST_CHAIN_<i>_NAME  (literal name)
  HOST_CHAIN_<i>_ACL   (literal aclContractAddress, or valueFrom pointing at
                        the same ConfigMap the per-chain listener uses)
Empty chains[] is a no-op (no host_chains rows seeded).
*/ -}}
{{- define "coprocessor.dbMigration.hostChainsEnv" -}}
{{- $root := . -}}
{{- $chains := (include "coprocessor.chains" . | fromYaml).chains -}}
{{- if $chains }}
- name: HOST_CHAINS_COUNT
  value: {{ len $chains | quote }}
{{- range $i, $chain := $chains }}
- name: HOST_CHAIN_{{ $i }}_ID
  value: {{ $chain.chainId | quote }}
- name: HOST_CHAIN_{{ $i }}_NAME
  value: {{ $chain.name | quote }}
{{- include "coprocessor.envVar" (dict "root" $root "name" (printf "HOST_CHAIN_%d_ACL" $i) "spec" (dict "value" $chain.aclContractAddress "valueFrom" $chain.aclContractAddressValueFrom)) }}
{{- end }}
{{- end }}
{{- end -}}

{{- if .Values.dbMigration.enabled }}
{{- $c := include "coprocessor.componentValues" (dict "root" . "key" "dbMigration") | fromYaml }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-migration-{{ .Release.Revision }}
  labels:
    app: coprocessor-db-migration
    app.kubernetes.io/name: {{ .Release.Name }}-db-migration
  namespace: {{ .Release.Namespace }}
  {{- with $c.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: coprocessor-db-migration
        app.kubernetes.io/name: {{ .Release.Name }}-db-migration
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $c.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      containers:
      - name: db-migration
        image: {{ include "coprocessor.image" (dict "root" . "image" $c.image) }}
        {{- with $c.command }}
        command:
          {{- toYaml . | nindent 10 }}
        {{- else }}
        command: ["/initialize_db.sh"]
        {{- end }}
        env:
          - name: ALLOW_DB_BOOTSTRAP
            value: {{ ternary "true" "false" ($c.allowBootstrap | default false) | quote }}
          {{- include "coprocessor.env.dbConnection" . | nindent 10 }}
          {{- include "coprocessor.env.tenant" . | nindent 10 }}
          {{- include "coprocessor.dbMigration.hostChainsEnv" . | nindent 10 }}
          {{- include "coprocessor.env.dbIam" . | nindent 10 }}
          {{- include "coprocessor.env.extra" (dict "root" . "lists" (list $c.env)) | nindent 10 }}
        {{- include "coprocessor.containerResources" $c.resources | nindent 8 }}
        {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
        {{- include "coprocessor.databaseSslRootCertVolumeMount" . | nindent 8 }}
        {{- end }}
      {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
      {{- if hasKey ($c.annotations | default dict) "helm.sh/hook" }}
      volumes:
        - name: rds-ca-cert
          configMap:
            name: {{ .Release.Name }}-mig-ca
      {{- else }}
      {{- include "coprocessor.databaseSslRootCertVolume" . | nindent 6 }}
      {{- end }}
      {{- end }}
{{- end -}}
