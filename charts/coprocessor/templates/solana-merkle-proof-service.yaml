{{- /* The coprocessor database's connection components, with DATABASE_URL naming the Merkle record's own database instead. */}}
{{- define "coprocessor.solanaMerkleDatabaseEnv" -}}
{{- with .Values.commonConfig.databaseUser }}
- name: DATABASE_USER
  {{- if .value }}
  value: {{ .value | quote }}
  {{- else if .valueFrom }}
  valueFrom:
    {{- toYaml .valueFrom | nindent 4 }}
  {{- end }}
{{- end }}
{{- with .Values.commonConfig.databaseEndpoint }}
- name: DATABASE_ENDPOINT
  {{- if .value }}
  value: {{ .value | quote }}
  {{- else if .valueFrom }}
  valueFrom:
    {{- toYaml .valueFrom | nindent 4 }}
  {{- end }}
{{- end }}
{{- if eq (include "coprocessorDatabaseAuthMode" $) "password" }}
{{- with .Values.commonConfig.databasePassword }}
- name: DATABASE_PASSWORD
  {{- if .value }}
  value: {{ .value | quote }}
  {{- else if .valueFrom }}
  valueFrom:
    {{- toYaml .valueFrom | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
- name: DATABASE_URL
  value: {{ required "solanaHostListener.merkleDatabaseUrl is required" .Values.solanaHostListener.merkleDatabaseUrl | quote }}
{{- if eq (include "coprocessorDatabaseAuthMode" $) "iam" }}
- name: DATABASE_IAM_AUTH_ENABLED
  value: "true"
{{- with .Values.commonConfig.databaseIamRegion }}
- name: DATABASE_IAM_REGION
  {{- if .value }}
  value: {{ .value | quote }}
  {{- else if .valueFrom }}
  valueFrom:
    {{- toYaml .valueFrom | nindent 4 }}
  {{- end }}
{{- end }}
{{- if eq (include "coprocessor.databaseSslRootCertEnvEnabled" $) "true" }}
{{- include "coprocessor.databaseSslRootCertEnv" $ | nindent 0 }}
{{- end }}
{{- end }}
{{- with .Values.commonConfig.env }}
{{- toYaml . | nindent 0 }}
{{- end }}
{{- end }}
{{- if .Values.solanaHostListener.enabled }}
{{- $listener := .Values.solanaHostListener }}
{{- $indexer := $listener.merkleIndexer }}
{{- $server := $listener.proofServer }}
{{- $indexerName := printf "%s-solana-merkle-indexer" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $serverName := printf "%s-solana-merkle-proof-server" .Release.Name | trunc 63 | trimSuffix "-" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $indexerName }}
spec:
  # The record's checkpoint is a singleton: one writer at a time.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $indexerName }}
  template:
    metadata:
      labels:
        {{- merge (dict "app.kubernetes.io/name" $indexerName) ($indexer.podLabels | default dict) (.Values.podLabels | default dict) | toYaml | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
        - name: registry-credentials
      {{- with $listener.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with $listener.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $listener.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $listener.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: solana-merkle-indexer
          image: {{ $listener.image.name }}:{{ $listener.image.tag }}
          command: ["solana_merkle_indexer"]
          # SOLANA_GRPC_X_TOKEN and SOLANA_ARCHIVE_URL are read from the environment by the binary.
          args:
            - --database-url=$(DATABASE_URL)
            - --url=$(SOLANA_RPC_URL)
            - --grpc-url=$(SOLANA_GRPC_URL)
            - --program-id=$(SOLANA_HOST_PROGRAM_ID)
            - --start-slot={{ required "solanaHostListener.merkleIndexer.startSlot is required: a slot before the first encrypted store was created" $indexer.startSlot }}
            - --http-port={{ $indexer.httpPort }}
            - --metrics-addr=0.0.0.0:{{ $indexer.metricsPort }}
          env:
            {{- include "coprocessor.solanaMerkleDatabaseEnv" . | trim | nindent 12 }}
            {{- with $listener.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $indexer.httpPort }}
            - name: metrics
              containerPort: {{ $indexer.metricsPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml $indexer.resources | nindent 12 }}
          securityContext:
            {{- toYaml $listener.securityContext | nindent 12 }}
          {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
          {{- include "coprocessor.databaseSslRootCertVolumeMount" . | nindent 10 }}
          {{- end }}
      {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
      {{- include "coprocessor.databaseSslRootCertVolume" . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $indexerName }}
  labels:
    app.kubernetes.io/name: {{ $indexerName }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $indexerName }}
  ports:
    - name: metrics
      port: {{ $indexer.metricsPort }}
      targetPort: metrics
{{- if $listener.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $indexerName }}
  labels:
    app.kubernetes.io/name: {{ $indexerName }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $indexerName }}
  endpoints:
    - port: metrics
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serverName }}
spec:
  # Stateless: it only reads the record, so replicas and rolling updates are safe.
  replicas: {{ $server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $serverName }}
  template:
    metadata:
      labels:
        {{- merge (dict "app.kubernetes.io/name" $serverName) ($server.podLabels | default dict) (.Values.podLabels | default dict) | toYaml | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
        - name: registry-credentials
      {{- with $listener.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with $listener.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $listener.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $listener.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: solana-merkle-proof-server
          image: {{ $listener.image.name }}:{{ $listener.image.tag }}
          command: ["solana_merkle_proof_server"]
          # SOLANA_PROOF_API_KEY is read from the environment by the binary.
          args:
            - --database-url=$(DATABASE_URL)
            - --database-pool-size={{ $server.databasePoolSize }}
            - --http-port={{ $server.httpPort }}
          env:
            {{- include "coprocessor.solanaMerkleDatabaseEnv" . | trim | nindent 12 }}
            {{- with $server.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $server.httpPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml $server.resources | nindent 12 }}
          securityContext:
            {{- toYaml $listener.securityContext | nindent 12 }}
          {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
          {{- include "coprocessor.databaseSslRootCertVolumeMount" . | nindent 10 }}
          {{- end }}
      {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
      {{- include "coprocessor.databaseSslRootCertVolume" . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serverName }}
  labels:
    app.kubernetes.io/name: {{ $serverName }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $serverName }}
  ports:
    - name: http
      port: {{ $server.httpPort }}
      targetPort: http
{{- end }}
