{{- /* The coprocessor database's connection components, with DATABASE_URL naming the Merkle record's own database instead. */}}
{{- define "coprocessor.solanaMerkleDatabaseEnv" -}}
{{- with .Values.commonConfig.databaseUser }}
- name: DATABASE_USER
  {{- if .value }}
  value: {{ .value | quote }}
  {{- else if .valueFrom }}
  valueFrom:
    {{- toYaml .valueFrom | nindent 4 }}
  {{- end }}
{{- end }}
{{- with .Values.commonConfig.databaseEndpoint }}
- name: DATABASE_ENDPOINT
  {{- if .value }}
  value: {{ .value | quote }}
  {{- else if .valueFrom }}
  valueFrom:
    {{- toYaml .valueFrom | nindent 4 }}
  {{- end }}
{{- end }}
{{- if eq (include "coprocessorDatabaseAuthMode" $) "password" }}
{{- with .Values.commonConfig.databasePassword }}
- name: DATABASE_PASSWORD
  {{- if .value }}
  value: {{ .value | quote }}
  {{- else if .valueFrom }}
  valueFrom:
    {{- toYaml .valueFrom | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
- name: DATABASE_URL
  value: {{ required "solanaHostListener.merkleDatabaseUrl is required" .Values.solanaHostListener.merkleDatabaseUrl | quote }}
{{- if eq (include "coprocessorDatabaseAuthMode" $) "iam" }}
- name: DATABASE_IAM_AUTH_ENABLED
  value: "true"
{{- with .Values.commonConfig.databaseIamRegion }}
- name: DATABASE_IAM_REGION
  {{- if .value }}
  value: {{ .value | quote }}
  {{- else if .valueFrom }}
  valueFrom:
    {{- toYaml .valueFrom | nindent 4 }}
  {{- end }}
{{- end }}
{{- if eq (include "coprocessor.databaseSslRootCertEnvEnabled" $) "true" }}
{{- include "coprocessor.databaseSslRootCertEnv" $ | nindent 0 }}
{{- end }}
{{- end }}
{{- with .Values.commonConfig.env }}
{{- toYaml . | nindent 0 }}
{{- end }}
{{- end }}
{{- if .Values.solanaHostListener.enabled }}
{{- $listener := .Values.solanaHostListener }}
{{- $indexer := $listener.merkleIndexer }}
{{- $server := $listener.proofServer }}
{{- $indexerName := printf "%s-solana-merkle-indexer" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $startSlot := required "solanaHostListener.merkleIndexer.startSlot is required: a slot before the first encrypted store was created" $indexer.startSlot }}
{{- /* A YAML number arrives as a float, which would render in exponent form. */}}
{{- if kindIs "float64" $startSlot }}{{- $startSlot = int64 $startSlot }}{{- end }}
{{- if not (regexMatch "^[0-9]+$" (toString $startSlot)) }}
{{- fail (printf "solanaHostListener.merkleIndexer.startSlot must be a slot number, got %v" $startSlot) }}
{{- end }}
{{- $serverName := printf "%s-solana-merkle-proof-server" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- /* The proof server reads its callers from the canonical chain's ProtocolConfig. */}}
{{- $canonicalChainId := required "commonConfig.canonicalProtocolConfigChainId is required: the Merkle proof server reads its callers from that chain's ProtocolConfig" .Values.commonConfig.canonicalProtocolConfigChainId | toString }}
{{- $canonical := dict }}
{{- range .Values.chains }}
{{- if eq (toString .chainId) $canonicalChainId }}{{- $canonical = . }}{{- end }}
{{- end }}
{{- if not $canonical }}
{{- fail (printf "the Merkle proof server needs a chains entry with chainId %s, the canonicalProtocolConfigChainId" $canonicalChainId) }}
{{- end }}
{{- if not (or $canonical.httpUrl $canonical.httpUrlValueFrom) }}
{{- fail (printf "chains entry %s needs httpUrl or httpUrlValueFrom for the Merkle proof server" $canonical.name) }}
{{- end }}
{{- if not (or $canonical.protocolConfigContractAddress $canonical.protocolConfigContractAddressValueFrom) }}
{{- fail (printf "chains entry %s needs protocolConfigContractAddress or protocolConfigContractAddressValueFrom for the Merkle proof server" $canonical.name) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $indexerName }}
spec:
  # The record's checkpoint is a singleton: one writer at a time.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $indexerName }}
  template:
    metadata:
      labels:
        {{- merge (dict "app.kubernetes.io/name" $indexerName) ($indexer.podLabels | default dict) (.Values.podLabels | default dict) | toYaml | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
        - name: registry-credentials
      {{- with $listener.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with $listener.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $listener.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $listener.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: solana-merkle-indexer
          image: {{ $listener.image.name }}:{{ $listener.image.tag }}
          command: ["solana_merkle_indexer"]
          # SOLANA_GRPC_X_TOKEN and SOLANA_ARCHIVE_URL are read from the environment by the binary.
          args:
            - --database-url=$(DATABASE_URL)
            - --url=$(SOLANA_RPC_URL)
            - --grpc-url=$(SOLANA_GRPC_URL)
            - --program-id=$(SOLANA_HOST_PROGRAM_ID)
            - --http-port={{ $indexer.httpPort }}
            - --metrics-addr=0.0.0.0:{{ $indexer.metricsPort }}
          env:
            # An env var rather than an argument, so a preview reset can set it without the chart.
            - name: SOLANA_MERKLE_START_SLOT
              value: {{ $startSlot | quote }}
            {{- include "coprocessor.solanaMerkleDatabaseEnv" . | trim | nindent 12 }}
            {{- with $listener.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $indexer.httpPort }}
            - name: metrics
              containerPort: {{ $indexer.metricsPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml $indexer.resources | nindent 12 }}
          securityContext:
            {{- toYaml $listener.securityContext | nindent 12 }}
          {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
          {{- include "coprocessor.databaseSslRootCertVolumeMount" . | nindent 10 }}
          {{- end }}
      {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
      {{- include "coprocessor.databaseSslRootCertVolume" . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $indexerName }}
  labels:
    app.kubernetes.io/name: {{ $indexerName }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $indexerName }}
  ports:
    - name: metrics
      port: {{ $indexer.metricsPort }}
      targetPort: metrics
{{- if $listener.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $indexerName }}
  labels:
    app.kubernetes.io/name: {{ $indexerName }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $indexerName }}
  endpoints:
    - port: metrics
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serverName }}
spec:
  # Stateless: it only reads the record, so replicas and rolling updates are safe.
  replicas: {{ $server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $serverName }}
  template:
    metadata:
      labels:
        {{- merge (dict "app.kubernetes.io/name" $serverName) ($server.podLabels | default dict) (.Values.podLabels | default dict) | toYaml | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
        - name: registry-credentials
      {{- with $listener.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with $listener.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $listener.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $listener.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: solana-merkle-proof-server
          image: {{ $listener.image.name }}:{{ $listener.image.tag }}
          command: ["solana_merkle_proof_server"]
          args:
            - --database-url=$(DATABASE_URL)
            - --database-pool-size={{ $server.databasePoolSize }}
            - --http-port={{ $server.httpPort }}
            - --metrics-addr=0.0.0.0:{{ $server.metricsPort }}
            - --ethereum-rpc-url=$(ETHEREUM_RPC_URL)
            - --protocol-config-address=$(PROTOCOL_CONFIG_ADDRESS)
          env:
            - name: ETHEREUM_RPC_URL
              {{- if $canonical.httpUrl }}
              value: {{ $canonical.httpUrl | quote }}
              {{- else }}
              valueFrom:
                {{- toYaml $canonical.httpUrlValueFrom | nindent 16 }}
              {{- end }}
            - name: PROTOCOL_CONFIG_ADDRESS
              {{- if $canonical.protocolConfigContractAddress }}
              value: {{ $canonical.protocolConfigContractAddress | quote }}
              {{- else }}
              valueFrom:
                {{- toYaml $canonical.protocolConfigContractAddressValueFrom | nindent 16 }}
              {{- end }}
            {{- include "coprocessor.solanaMerkleDatabaseEnv" . | trim | nindent 12 }}
            {{- with $server.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $server.httpPort }}
            - name: metrics
              containerPort: {{ $server.metricsPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml $server.resources | nindent 12 }}
          securityContext:
            {{- toYaml $listener.securityContext | nindent 12 }}
          {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
          {{- include "coprocessor.databaseSslRootCertVolumeMount" . | nindent 10 }}
          {{- end }}
      {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
      {{- include "coprocessor.databaseSslRootCertVolume" . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serverName }}
  labels:
    app.kubernetes.io/name: {{ $serverName }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $serverName }}
  ports:
    - name: http
      port: {{ $server.httpPort }}
      targetPort: http
    - name: metrics
      port: {{ $server.metricsPort }}
      targetPort: metrics
{{- if $listener.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $serverName }}
  labels:
    app.kubernetes.io/name: {{ $serverName }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $serverName }}
  endpoints:
    - port: metrics
{{- end }}
{{- end }}
