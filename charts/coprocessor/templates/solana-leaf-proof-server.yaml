{{- if .Values.solanaHostListener.enabled }}
{{- $listener := .Values.solanaHostListener }}
{{- $server := $listener.proofServer }}
{{- $name := printf "%s-solana-leaf-proof-server" .Release.Name | trunc 63 | trimSuffix "-" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  # Stateless: it only reads the leaf record, so replicas and rolling updates are safe.
  replicas: {{ $server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- merge (dict "app.kubernetes.io/name" $name) ($server.podLabels | default dict) (.Values.podLabels | default dict) | toYaml | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
        - name: registry-credentials
      {{- with $listener.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with $listener.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $listener.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $listener.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: solana-leaf-proof-server
          image: {{ $listener.image.name }}:{{ $listener.image.tag }}
          command: ["solana_leaf_proof_server"]
          # SOLANA_PROOF_API_KEY is read from the environment by the binary.
          args:
            - --database-url=$(DATABASE_URL)
            - --database-pool-size={{ $server.databasePoolSize }}
            - --http-port={{ $server.httpPort }}
          env:
            {{- with .Values.commonConfig.databaseUser }}
            - name: DATABASE_USER
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- with .Values.commonConfig.databaseEndpoint }}
            - name: DATABASE_ENDPOINT
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- if eq (include "coprocessorDatabaseAuthMode" $) "password" }}
            {{- with .Values.commonConfig.databasePassword }}
            - name: DATABASE_PASSWORD
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.commonConfig.databaseUrl }}
            - name: DATABASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if eq (include "coprocessorDatabaseAuthMode" $) "iam" }}
            - name: DATABASE_IAM_AUTH_ENABLED
              value: "true"
            {{- with .Values.commonConfig.databaseIamRegion }}
            - name: DATABASE_IAM_REGION
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- if eq (include "coprocessor.databaseSslRootCertEnvEnabled" $) "true" }}
            {{- include "coprocessor.databaseSslRootCertEnv" $ | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- with .Values.commonConfig.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $server.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $server.httpPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml $server.resources | nindent 12 }}
          securityContext:
            {{- toYaml $listener.securityContext | nindent 12 }}
          {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
          {{- include "coprocessor.databaseSslRootCertVolumeMount" . | nindent 10 }}
          {{- end }}
      {{- if eq (include "coprocessor.databaseSslRootCertMountEnabled" .) "true" }}
      {{- include "coprocessor.databaseSslRootCertVolume" . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $server.httpPort }}
      targetPort: http
{{- end }}
