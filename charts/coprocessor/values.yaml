# =============================================================================
# FHEVM Coprocessor
# =============================================================================
# Components (each toggled by <component>.enabled):
#   dbMigration        Job: schema migration and host_chains seeding
#   hostListener       host chain events (listener, poller, catchupOnly, consumer)
#   gwListener         gateway chain events
#   tfheWorker         FHE computation
#   zkProofWorker      input proof verification
#   snsWorker          ciphertext switch-and-squash and S3 upload
#   consensusDetector  manifest publication and peer verification
#   txSender           gateway transaction submission
#   upgradeController  RFC-021 GCS upgrade FSM (green fleet only)
#
# Every workload block is overlaid on `defaults` (see below). Keys accepted by
# every component: enabled, nameOverride (resource name, default
# <release>-<component>), image, env, disabledArgs (template-injected flags to
# drop, kebab-case without `--`), extraArgs (raw flags appended after the
# template-injected ones) and every `defaults` key.
# =============================================================================

commonConfig:
  # Single switch for contract configuration. Selects the bundled
  # configs/<network>.yaml preset: "" (off), "devnet", "testnet" or "mainnet".
  # When set (and contractConfigMap.enabled is true), the chart:
  #   - renders the <release>-contract-addresses ConfigMap (see contractConfigMap);
  #   - generates chains[] entries for every host chain in the preset;
  #   - fills empty gatewayContractAddresses fields from the preset.
  # Values set explicitly always win over the preset.
  #
  # Minimal gateway release:
  #   commonConfig:
  #     network: testnet
  #     gatewayUrl: {valueFrom: {secretKeyRef: {name: conduit-credentials, key: conduit-rpc-ws-url}}}
  #   gwListener: {enabled: true}
  #   txSender: {enabled: true}
  #
  # Minimal host listener release:
  #   commonConfig:
  #     network: testnet
  #   chains:
  #     - name: sepolia                 # must match <prefix>.name in the preset
  #       wsUrlValueFrom: {secretKeyRef: {name: rpc-credentials, key: ethereum-rpc-ws-url}}
  #       hostListener:
  #         listener: {enabled: true, useLegacyName: true}
  network: ""

  # Keep production Blue on legacy material during a compressed-key migration.
  # Fresh and GPU deployments must disable this safeguard explicitly.
  forceLegacyServerKey: true

  # Fields documented as "value spec" accept either a literal `value` or a
  # `valueFrom` block (secretKeyRef / configMapKeyRef); unset injects nothing.

  # Database connection (value specs).
  databaseUser: {}
  databasePassword: {}
  databaseEndpoint: {}

  # Plain string. May reference $(DATABASE_USER), $(DATABASE_PASSWORD) and
  # $(DATABASE_ENDPOINT), which are declared before DATABASE_URL.
  #   password mode: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_ENDPOINT)/coprocessor"
  #   iam mode:      "postgresql://$(DATABASE_USER)@$(DATABASE_ENDPOINT)/coprocessor"
  databaseUrl: ""

  # "password" injects DATABASE_PASSWORD. "iam" injects
  # DATABASE_IAM_AUTH_ENABLED=true, DATABASE_IAM_REGION and
  # DATABASE_SSL_ROOT_CERT_PATH; the runtime replaces the URL password with a
  # short-lived RDS IAM token from the pod's AWS identity.
  databaseAuthMode: password

  # iam mode only (value spec). Unset lets the AWS SDK resolve the region.
  databaseIamRegion: {}

  # iam mode only. Mounts the RDS CA bundle (configs/global-rds-ca-root.pem, or
  # `content` when set) into every component and sets
  # DATABASE_SSL_ROOT_CERT_PATH to mountPath/fileName (verify-full TLS).
  databaseSslRootCert:
    enabled: false
    mountPath: /etc/ssl/rds
    fileName: global-rds-ca-root.pem
    content: ""

  # iam mode only (value spec): path of a CA bundle you mount yourself. Ignored
  # when databaseSslRootCert.enabled is true.
  databaseSslRootCertPath: {}

  # v0.11 only (value spec). Injected as TENANT_API_KEY into dbMigration, host
  # listeners and snsWorker, which also get --coprocessor-api-key /
  # --tenant-api-key.
  tenantApiKey: {}

  # Chain id of the chain hosting the ProtocolConfig contract. Only the host
  # listener of that chain decodes CoprocessorUpgradeProposed events.
  canonicalProtocolConfigChainId: ""

  # Stack version compiled into the images (`<binary> --stack-version`).
  # Surfaced as the app.kubernetes.io/version pod label for blue/green
  # selection, and appended to the contract ConfigMap name.
  stackVersion: ""

  # Extra Deployment/Service matchLabels, for a second fleet in the same
  # namespace (blue-green), e.g. {fhevm.zama.ai/fleet: bcs}. Selectors are
  # immutable: leave empty for a single release.
  extraSelectorLabels: {}

  # Startup probe running `<binary> --stack-version` to check the image.
  stackVersionProbe:
    enabled: false
    periodSeconds: 10
    failureThreshold: 30

  # Gateway chain (value specs), used by gwListener, txSender and
  # consensusDetector. With commonConfig.network set, empty address fields
  # default to the preset.
  gatewayUrl: {}              # required by gwListener, txSender, consensusDetector
  gatewayContractAddresses:
    inputVerification: {}     # required by gwListener, txSender
    ciphertextCommits: {}     # required by txSender; optional for gwListener (drift detection)
    gatewayConfig: {}         # required by consensusDetector; optional for gwListener (drift detection)
    multichainAcl: {}         # v0.11 txSender only; add multichain-acl-address to txSender.disabledArgs otherwise

  tracing:
    enabled: false
    endpoint: "http://otel-deployment-opentelemetry-collector.observability.svc.cluster.local:4317"

  # Env vars for every component, before component-level env (which wins).
  env: []

# -----------------------------------------------------------------------------
# Workload defaults
# -----------------------------------------------------------------------------
# Base values for every workload (components, host listener modes and the
# dbMigration Job). A component block overlays them: maps deep-merge, any
# other value replaces the default (false, 0 and "" included); null keeps the
# default.
# Example: one tag and service account for the whole release:
#   defaults:
#     image: {tag: v0.14.1}
#     serviceAccountName: coprocessor
#   tfheWorker:
#     image: {tag: v0.14.1-gpu}
defaults:
  # <registry>/<repository>:<tag>. Components set repository. An empty tag
  # means the chart appVersion.
  image:
    registry: hub.zama.org/zama-protocol/zama-ai/fhevm
    tag: ""

  imagePullSecrets:
    - name: registry-credentials

  replicas: 1

  # Existing service account (e.g. IRSA). Unset uses the namespace default.
  serviceAccountName:

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Ignored by the dbMigration Job. consensusDetector and upgradeController
  # have no healthcheck port and must keep them off.
  probes:
    liveness:
      enabled: false
      httpGet:
        path: /liveness
        port: healthcheck
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      enabled: false
      httpGet:
        path: /healthz
        port: healthcheck
      initialDelaySeconds: 5
      periodSeconds: 10

  # tracing.enabled unset follows commonConfig.tracing.enabled. An empty
  # service falls back to the pod name, which fragments traces across pods.
  tracing:
    service: ""

  serviceMonitor:
    enabled: false

  # CPU-based HorizontalPodAutoscaler, per component (hpa.enabled: true).
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        selectPolicy: Max
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
          - type: Pods
            value: 2
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
        selectPolicy: Min
        policies:
          - type: Percent
            value: 40
            periodSeconds: 60

  podLabels: {}
  podAnnotations: {}

  nodeSelector: {}
  affinity: {}
  tolerations: []

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# -----------------------------------------------------------------------------
# Contract ConfigMap
# -----------------------------------------------------------------------------
# Rendered when commonConfig.network is set, from configs/<network>.yaml (keys
# prefixed by chain, e.g. ethereum.acl.address). Default name:
# <release>-contract-addresses, suffixed with commonConfig.stackVersion when
# set. valueFrom blocks and env lists go through tpl, so reference it with:
#   configMapKeyRef:
#     name: '{{ include "coprocessor.contractConfigMapName" . }}'
contractConfigMap:
  # false skips the ConfigMap and every preset-derived default.
  enabled: true
  # Name override.
  name: ""
  # Deep-merged on top of the preset; also feeds the generated defaults.
  #   addresses:
  #     ethereum.acl.address: "0xabc..."
  #     polygon.acl.address: "0xdef..."     # enables the polygon chain entry
  addresses: {}

# -----------------------------------------------------------------------------
# Database Migration
# -----------------------------------------------------------------------------
# Migrates the schema and seeds host_chains from chains[].
dbMigration:
  enabled: true
  # Allow this release to create the database. Only for the first install of
  # an operator; the green (new release) fleet keeps it false.
  allowBootstrap: false

  # Job annotations. Services read their role from a column this migration
  # adds, so a green fleet must start after its Job: enable the hook below so
  # Helm runs it before the Deployments. Hooks run before the chart's other
  # resources, so the Job must not depend on chart-created ConfigMaps on a
  # fresh install (the RDS CA hook runs just before it).
  annotations: {}
  # annotations:
  #   "helm.sh/hook": "pre-install,pre-upgrade"
  #   "helm.sh/hook-weight": "5"
  #   "helm.sh/hook-delete-policy": "before-hook-creation"

  image:
    repository: coprocessor/db-migration

  # Container command; defaults to ["/initialize_db.sh"].
  command:

# -----------------------------------------------------------------------------
# Host Listener
# -----------------------------------------------------------------------------
# Four modes, each deployed once per chains[] entry that enables it
# (chains[].hostListener.<mode>.enabled):
#   listener     host_listener, WebSocket subscription + catchup
#   poller       host_listener_poller, HTTP polling
#   catchupOnly  host_listener restricted to the catchup loop
#   consumer     host_listener_consumer, reads listener events from the broker
#
# Effective values of a mode: defaults, then common, then modes.<mode>.
# env, extraArgs and disabledArgs are concatenated instead: common, then
# modes.<mode>, then the chain entry. serviceName sets --service-name
# (chains[].hostListener.<mode>.serviceName wins). For the consumer it is the
# telemetry label only: the broker identity is compiled in, so renaming a
# release cannot move it to other queues.
#
# Template-injected args: --database-url, --url (not consumer),
# --acl-contract-address, --tfhe-contract-address, --kms-generation-address
# and --protocol-config-address (when the chain has them), --health-port,
# --service-name, and per mode: --metrics-addr (poller, consumer),
# --chain-id and --broker-url (consumer), --coprocessor-api-key (v0.11, when
# commonConfig.tenantApiKey is set).
#
# Flags shared by all modes (extraArgs):
#   --log-level=INFO
#   --dependence-cache-size=10000
#   --dependence-by-connexity                # connected components instead of linear chains
#   --dependence-cross-block                 # chains across blocks; on by default
#   --dependent-ops-max-per-chain=0          # 0 disables slow-lane decisions
#   --confidential-bridge-address=<address>
#   --disable-synthetic-ops                  # stop the synthetic work a GCS listener uses to anchor consensus
hostListener:
  common:
    image:
      repository: coprocessor/host-listener
    ports:
      metrics: 9100
      healthcheck: 8080

  modes:
    # host_listener flags:
    #   --initial-block-time=12                  # replaced by the observed block time
    #   --reorg-maximum-duration-in-blocks=50
    #   --catchup-finalization-in-blocks=20
    #   --catchup-margin=5
    #   --catchup-paging=100
    #   --start-at-block=-40                     # negative: from the latest block
    #   --end-at-block=-15
    #   --catchup-loop-sleep-secs=60
    #   --timeout-request-websocket=15           # seconds
    listener: {}

    # host_listener_poller flags:
    #   --finality-lag=15
    #   --batch-size=100                         # blocks per iteration
    #   --poll-interval-ms=6000
    #   --retry-interval-ms=1000
    #   --max-http-retries=45
    #   --rpc-compute-units-per-second=1000
    #   --seed-start-block=-10000                # first startup only (existing state wins);
    #                                            # negative: blocks behind head. Set it when
    #                                            # onboarding a chain to avoid walking from genesis.
    poller: {}

    # host_listener flags, typically:
    #   --only-catchup-loop                      # requires --end-at-block
    #   --end-at-block=-15
    #   --start-at-block=-30
    #   --catchup-loop-sleep-secs=60
    catchupOnly: {}

    # host_listener_consumer flags:
    #   --database-retry-interval=1000           # ms
    consumer:
      config:
        # Broker URL (value spec), e.g.
        #   brokerUrl: {value: "redis://coprocessor-redis-master.coproc.svc.cluster.local:6379"}
        brokerUrl: {}

# -----------------------------------------------------------------------------
# Chains
# -----------------------------------------------------------------------------
# Host chains, and which host listener modes run for each of them.
#
# With commonConfig.network set, one entry is generated per host chain of the
# preset that has an ACL address, with name, chainId and the contract address
# refs. Entries below with the same name are merged on top and win, so they
# usually only add RPC URLs and the listener switches. Entries with no
# matching generated chain are used as-is.
#
# Resources are named <release>-<mode suffix>-<name>; useLegacyName (on one
# chain per mode) drops the chain suffix.
#
# chains:
#   - name: sepolia
#     chainId: "11155111"               # quoted; required by the consumer
#     wsUrl: "ws://eth-node:8546"       # listener, catchupOnly (or wsUrlValueFrom)
#     httpUrl: "http://eth-node:8545"   # poller (or httpUrlValueFrom)
#     aclContractAddress: "0x..."       # each address also accepts <field>ValueFrom
#     fhevmExecutorContractAddress: "0x..."
#     kmsGenerationContractAddress: "0x..."     # optional
#     protocolConfigContractAddress: "0x..."    # optional
#     hostListener:
#       listener:
#         enabled: true
#         useLegacyName: true
#         serviceName: ""
#         extraArgs: []
#         disabledArgs: []
#         env: []
#       poller: {enabled: true}
#       catchupOnly: {enabled: true}
#       consumer: {enabled: true, useLegacyName: true}   # suffixed names can exceed 63 chars
chains: []

# -----------------------------------------------------------------------------
# Gateway Listener
# -----------------------------------------------------------------------------
gwListener:
  enabled: false

  image:
    repository: coprocessor/gw-listener

  config:
    # Host chain id, rendered as CHAIN_ID.
    chainId: ""

  # Template-injected args: --database-url, --gw-url,
  # --input-verification-address, --ciphertext-commits-address and
  # --gateway-config-address (when set), --health-check-port, --metrics-addr.
  # Other gw_listener flags:
  #   --database-pool-size=16
  #   --verify-proof-req-database-channel=event_zkpok_new_work
  #   --error-sleep-initial-secs=1
  #   --error-sleep-max-secs=10
  #   --health-check-timeout=4s
  #   --provider-max-retries=4294967295
  #   --provider-retry-interval=4s
  #   --log-level=INFO
  #   --get-logs-poll-interval=500ms
  #   --get-logs-block-batch-size=100
  #   --log-last-processed-every-number-of-updates=50
  #   --service-name=gw-listener
  #   --gateway-config-refresh-interval=30m
  #   --drift-no-consensus-timeout=5m
  #   --drift-post-consensus-grace=5m
  #   --drift-auto-revert-enabled=false
  #     SAFETY: only enable with a majority quorum — >= 3 coprocessors and a
  #     strict-majority coprocessor threshold. Never enable with <= 2
  #     coprocessors. See docs/protocol/architecture/coprocessor.md.
  #   --drift-auto-revert-grace-period=120s
  #   --drift-auto-revert-max-recent-attempts=10
  #   --drift-auto-revert-recent-attempts-window=30m
  extraArgs: []

  ports:
    metrics: 9100
    healthcheck: 8080

# -----------------------------------------------------------------------------
# TFHE Worker
# -----------------------------------------------------------------------------
tfheWorker:
  enabled: true

  image:
    repository: coprocessor/tfhe-worker

  # Additional raw CLI flags, appended after template-injected args.
  #
  # COMPLETE tfhe_worker CLI with every compiled-in default recorded, so a
  # deployment never depends on a default it cannot see here. Keep in sync
  # with `Args` in coprocessor/fhevm-engine/tfhe-worker/src/daemon_cli.rs;
  # the `chart_documents_every_cli_flag_and_default` test in that file fails
  # the build if a flag or default is added, changed or removed without a
  # corresponding edit to this block.
  #
  # Two conventions in the list below:
  #   `--flag=value`  takes a value; the value shown is the compiled default.
  #   `--flag`        is PRESENCE-ONLY. clap rejects `--flag=false` and the
  #                   worker exits on the unknown value, so a switch is turned
  #                   ON by listing it and OFF by omitting it. A switch that
  #                   defaults to ON can therefore only be turned off through
  #                   its environment variable (noted inline), not extraArgs.
  #
  #   built-in via template (do not repeat in extraArgs; suppress with disabledArgs):
  #     --database-url=<url>                     # from DATABASE_URL; no default
  #     --metrics-addr=0.0.0.0:9100              # set from .ports.metrics
  #     --health-check-port=8080                 # set from .ports.healthcheck
  #     --stack-version                          # presence-only; used by the startupProbe
  #
  #   worker loop:
  #     --run-bg-worker                          # presence-only; default OFF.
  #                                              # Without it the process idles
  #                                              # and never polls `computations`.
  #     --worker-polling-interval-ms=1000
  #     --work-items-batch-size=100              # unit depends on the adaptive
  #                                              # window; see below
  #     --dependence-chains-per-batch=20         # chains held concurrently per cycle
  #     --coprocessor-fhe-threads=32
  #     --tokio-threads=4
  #     --pg-pool-max-connections=10
  #     --key-cache-size=32                      # alias: --tenant-key-cache-size
  #     --max-batch-ttl-secs=300                 # env: TFHE_WORKER_MAX_BATCH_TTL_SECS
  #                                              # liveness budget for one in-flight
  #                                              # batch; a batch older than this
  #                                              # stops keeping the pod alive
  #     --service-name=tfhe-worker               # env: OTEL_SERVICE_NAME
  #     --log-level=INFO
  #     --generate-fhe-keys                      # presence-only; unsafe, testing only
  #
  #   confidential bridge worker:
  #     --bridge-polling-interval-ms=1000        # minimum 10
  #     --bridge-associate-batch-size=128
  #
  #   dependence-chain (DCID) locking:
  #     --worker-id=<uuid>                       # no default; a random UUID is
  #                                              # generated per process. Set it to
  #                                              # a stable value only if you want
  #                                              # locks reclaimable across restarts.
  #     --dcid-ttl-sec=30                        # lock TTL in seconds. Must be >= 1;
  #                                              # zero would make every lock
  #                                              # steal-eligible the instant it is
  #                                              # taken. Keep it comfortably above
  #                                              # --worker-polling-interval-ms, or a
  #                                              # worker loses its chains just by
  #                                              # waiting for the next cycle (the
  #                                              # worker warns at startup if not),
  #                                              # and above how long a batch takes
  #                                              # to execute -- leases renew only
  #                                              # BETWEEN cycles, so a longer batch
  #                                              # is stealable while it runs. Watch
  #                                              # coprocessor_worker_dcid_lease_lost_*.
  #     --dcid-timeslice-sec=90                  # release the lock after this slice.
  #                                              # Must be >= 1; zero releases every
  #                                              # chain on the cycle that took it.
  #     --processed-dcid-ttl-sec=172800          # delete processed chains older
  #                                              # than this during idle time (48 h)
  #     --dcid-cleanup-interval-sec=3600         # expired lock cleanup interval, and
  #                                              # the throttle on the idle sweep that
  #                                              # re-arms demoted chains. Must be
  #                                              # >= 1: the sweep is called from the
  #                                              # worker loop, so zero runs a join
  #                                              # across `computations` every
  #                                              # iteration.
  #     --dcid-max-no-progress-cycles=2
  #     --dcid-ignore-dependency-count-threshold=100
  #     --dcid-stale-gate-age-secs=300           # minimum age before the idle-time
  #                                              # repair path may adopt an unowned,
  #                                              # dependency-gated chain. Must be
  #                                              # > 0: zero drops the guard that
  #                                              # keeps the repair from racing a
  #                                              # listener mid-arm, and a negative
  #                                              # value inverts it into matching
  #                                              # nearly every gated chain.
  #     --disable-dcid-locking                   # presence-only; default OFF.
  #                                              # UNSAFE: multiple workers may then
  #                                              # process the same chain and
  #                                              # duplicate DCID work.
  #
  #   batched chain execution (post-v0.14 images only; absent from v0.14 and
  #   earlier, where passing them makes the worker exit on an unknown argument):
  #     --dcid-batch-execution                   # presence-only; default ON.
  #                                              # env: FHEVM_DCID_BATCH_EXECUTION
  #                                              # Set that env var to "false" to
  #                                              # disable — extraArgs cannot.
  #                                              # Acquires and executes up to
  #                                              # --dependence-chains-per-batch
  #                                              # independent chains per cycle so
  #                                              # DB acquisition and boundary prep
  #                                              # overlap FHE execution.
  #     --dcid-adaptive-batch-execution          # presence-only; default ON.
  #                                              # env: FHEVM_DCID_ADAPTIVE_BATCH_EXECUTION
  #                                              # Shares each work window across the
  #                                              # acquired chains so one large chain
  #                                              # cannot monopolize the batch. It is
  #                                              # the fairness mitigation for the
  #                                              # head-of-line blocking that
  #                                              # --dcid-batch-execution introduces:
  #                                              # disable BOTH or NEITHER.
  #                                              #
  #                                              # NOTE this changes the unit of
  #                                              # --work-items-batch-size. The
  #                                              # adaptive window counts (chain,
  #                                              # transaction) GROUPS; the
  #                                              # non-adaptive one counts computation
  #                                              # ROWS, with no residual row cap. A
  #                                              # value tuned for rows admits roughly
  #                                              # rows-per-transaction times as many
  #                                              # rows here, so retune both together.
  #                                              #
  #                                              # Each acquired chain gets
  #                                              # ceil(work-items-batch-size /
  #                                              # acquired-chains) transactions, so
  #                                              # keep --work-items-batch-size well
  #                                              # ABOVE --dependence-chains-per-batch.
  #                                              # Equal values yield one transaction
  #                                              # per chain per cycle; a larger
  #                                              # chains-per-batch disables the
  #                                              # adaptive window at runtime, silently,
  #                                              # leaving the blocking without its
  #                                              # remedy.
  #     --computation-retry-demote-threshold=3   # env: FHEVM_COMPUTATION_RETRY_DEMOTE_THRESHOLD
  #                                              # RETRYABLE re-stamps on one
  #                                              # computation before the row is
  #                                              # DEMOTED to the slow lane. Demotion
  #                                              # is not condemnation: the row keeps
  #                                              # its stamp and stays pending, it just
  #                                              # stops consuming fast-lane slots so
  #                                              # its chain can retire and discharge
  #                                              # dependents. An hourly sweep re-arms
  #                                              # demoted chains at slow priority with
  #                                              # the count reset.
  #                                              #
  #                                              # Must be >= 1; the worker refuses to
  #                                              # start otherwise, because a
  #                                              # non-positive threshold excludes a
  #                                              # retryable row from the moment it is
  #                                              # stamped and a sweep cannot bring it
  #                                              # back. Ignored entirely under
  #                                              # --disable-dcid-locking, where the
  #                                              # re-arm sweep does not run: that mode
  #                                              # retries without demoting.
  #
  #   GPU images only (CPU builds parse and ignore these):
  #     --gpu-streams-per-device=16              # env: FHEVM_GPU_STREAMS_PER_DEVICE
  #                                              # Concurrent CUDA streams per visible
  #                                              # GPU, bounding partition dispatch.
  #                                              # 16 is the measured plateau on H100;
  #                                              # 1 serializes dispatch.
  #     --gpu-memory-reservation-timeout-ms=20000 # env: FHEVM_GPU_MEMORY_RESERVATION_TIMEOUT_MS
  #                                              # How long a GPU op waits for memory
  #                                              # before failing so its batch retries.
  #                                              # CAPPED at 0.8 * --dcid-ttl-sec
  #                                              # (24 s at the default 30 s TTL): the
  #                                              # wait blocks inside batch execution
  #                                              # while the lease renews only between
  #                                              # cycles, so a longer wait guarantees
  #                                              # the lease lapses mid-batch and
  #                                              # another worker recomputes the chain.
  #                                              # Raising it past the cap only logs a
  #                                              # startup warning — raise
  #                                              # --dcid-ttl-sec as well.
  #
  #   metrics histogram buckets (min:max:width):
  #     --metric-rerand-batch-latency=0.1:5.0:0.01
  #     --metric-fhe-batch-latency=0.2:5.0:0.05
  #
  #   removed after v0.11 (listed so an older pinned image stays deployable):
  #     --tenant-key-cache-size=32               # renamed to --key-cache-size
  #     --coprocessor-private-key=/path/to/key
  #     --run-server
  #     --server-addr=...
  #     --server-maximum-ciphertexts-to-get=...
  #     --server-maximum-ciphertexts-to-schedule=...
  #     --maximum-compact-inputs-upload=...
  #     --maximum-handles-per-input=...
  extraArgs: []

  ports:
    metrics: 9100
    healthcheck: 8080

  tracing:
    service: "tfhe-worker"

# -----------------------------------------------------------------------------
# ZK Proof Worker
# -----------------------------------------------------------------------------
zkProofWorker:
  enabled: false

  image:
    repository: coprocessor/zkproof-worker

  # Template-injected args: --database-url, --metrics-addr, --health-check-port.
  # Required:
  #   --pg-listen-channel=event_zkpok_new_work
  #   --pg-notify-channel=event_zkpok_computed
  # Other zkproof_worker flags:
  #   --pg-polling-interval=60
  #   --pg-pool-connections=5
  #   --pg-timeout=15s
  #   --pg-auto-explain-with-min-duration=30s
  #   --worker-thread-count=8
  #   --service-name=zkproof-worker
  #   --log-level=INFO
  #   --metric-zkverify-op-latency=0.01:2.0:0.01
  extraArgs: []

  ports:
    metrics: 9100
    healthcheck: 8080

# -----------------------------------------------------------------------------
# SNS Worker
# -----------------------------------------------------------------------------
snsWorker:
  enabled: false

  image:
    repository: coprocessor/sns-worker

  config:
    # Ciphertext bucket (value spec), rendered as S3_BUCKET_NAME. ct64 and
    # ct128 objects live under the ct64/ and ct128/ prefixes.
    s3BucketName: {}
    # S3 object format migration, rendered as env vars (S3_MIGRATION_MODE,
    # S3_MIGRATION_SLEEP_DURATION, S3_MIGRATION_MAX_RETRIES) so older images
    # ignore them. mode: no, before, before-and-quit, concurrent or dry-run.
    s3Migration:
      mode: concurrent
      sleepDuration: 5m
      maxRetries: 100

  # Optional ciphertext attestation signer. When disabled, no signer args or
  # env are rendered and the pod needs no coprocessor-tx-sender Secret.
  wallet:
    enabled: false
    awsKms:
      # Use the AWS KMS key id from this ConfigMap instead of the private key.
      enabled: false
      configmap:
        name: coprocessor-tx-sender
        key: AWS_KEY_ID
    secret:
      name: coprocessor-tx-sender
      key: private-key
      value: ""  # devnet only: raw private key instead of the Secret

  # Template-injected args: --database-url, --bucket-name, --metrics-addr,
  # --health-check-port, --signer-type and --private-key (wallet.enabled),
  # --tenant-api-key (v0.11, when commonConfig.tenantApiKey is set).
  # Other sns_worker flags:
  #   --pg-listen-channels event_pbs_computations event_ciphertext_computed
  #   --pg-notify-channel=event_ciphertext128_computed
  #   --work-items-batch-size=4
  #   --pg-polling-interval=60
  #   --pg-pool-connections=10
  #   --pg-timeout=15s
  #   --pg-auto-explain-with-min-duration=30s
  #   --service-name=sns-executor
  #   --s3-max-concurrent-uploads=100
  #   --s3-max-retries-per-upload=100
  #   --s3-max-backoff=10s
  #   --s3-max-retries-timeout=120s
  #   --s3-recheck-duration=2s
  #   --s3-regular-recheck-duration=120s
  #   --s3-disable-sha256-checksum             # S3-compatible servers without checksum support
  #   --s3-migration-max-concurrent-handles=16
  #   --cleanup-interval=15min
  #   --gc-batch-size=1000                     # 0 disables GC
  #   --log-level=INFO
  #   --liveness-threshold=70s
  #   --lifo=false
  #   --enable-compression=true
  #   --schedule-policy=rayon_parallel
  #   --metric-sns-op-latency=0.1:10.0:0.1
  #   --gauge-update-interval-secs=10          # on a few workers only, to limit DB load
  extraArgs: []

  ports:
    metrics: 9100
    healthcheck: 8080

# -----------------------------------------------------------------------------
# Consensus Detector
# -----------------------------------------------------------------------------
# Publishes generation-scoped manifests and verifies peer manifests.
consensusDetector:
  enabled: false

  image:
    repository: coprocessor/consensus-detector

  # Compatibility with the GCS control-plane configuration. config.s3BucketName
  # takes precedence, then myBucket, then snsWorker.config.s3BucketName.
  myBucket: {}
  s3Endpoint: {}

  config:
    # Value spec; empty uses the bucket fallback above. The literal `none`
    # disables manifest publication, verification and ct64 healing: drift is
    # then neither detected nor healed.
    s3BucketName: {}
    # Interval between host-block discovery ticks. Extreme values can miss
    # pruned host_chain_blocks_valid rows (10_000 blocks retained).
    manifestDiscoveryInterval: 10s
    # Per-chain publication cadence overlays (`CHAIN_ID:CADENCE`). Empty keeps
    # the built-in table (Ethereum mainnet/Sepolia/Hoodi 5, Polygon/Amoy and
    # unknown 30). Applied at insert time; every coprocessor must match. Do not
    # set a fleet-wide override here.
    manifestPublicationCadence: []
    manifestPublicationRetryDelay: 1m
    # Attempts after the first; exhausting them skips that manifest.
    manifestPublicationRetryCount: 30
    # Delay after publication before the first peer verification.
    manifestVerificationDelay: 10s
    manifestVerificationRetryDelay: 10s
    manifestVerificationRetryCount: 59
    # Concurrent ct64 downloads per healing pass.
    manifestHealingBatchSize: 8
    # Fallback poll while waiting for event_healing_work.
    manifestHealingPollInterval: 30s
    # Delay after detection before an uncontained ct64 drift is healed anyway.
    manifestHealingContainmentTimeout: 5m
    # Failed healing attempts (one every 30s) before a finding is abandoned.
    manifestHealingMaxAttempts: 120
    # Stall with no newly computed handle before missing ciphertext may be
    # sealed as uncomputed.
    incompleteBlockTimeout: 5m
    # Host-chain lag, in due manifests, before missing ciphertext may be
    # sealed as uncomputed.
    incompleteManifestMaxLag: 3
    # Manifest gauge refresh interval (seconds). Disable with
    # disabledArgs: [gauge-update-interval-secs].
    gaugeUpdateIntervalSecs: 10

  # Manifest signer, required unless s3BucketName is `none`. Same sources as
  # snsWorker and txSender.
  wallet:
    enabled: true
    awsKms:
      enabled: false
      configmap:
        name: coprocessor-tx-sender
        key: AWS_KEY_ID
    secret:
      name: coprocessor-tx-sender
      key: private-key
      value: ""  # devnet only: raw private key instead of the Secret

  # No healthcheck port: keep probes disabled.
  ports:
    metrics: 9100

# -----------------------------------------------------------------------------
# Transaction Sender
# -----------------------------------------------------------------------------
txSender:
  enabled: false

  image:
    repository: coprocessor/tx-sender

  config:
    # Sender-specific gateway URL (value spec). HTTP sender builds need
    # http(s) here while commonConfig.gatewayUrl can stay ws(s) for
    # gwListener. Unset falls back to commonConfig.gatewayUrl.
    gatewayUrl: {}
    # v0.11 only (value spec): host chain RPC URL for delegation management,
    # rendered as HOST_CHAIN_URL and --host-chain-url.
    hostChainUrl: {}

  wallet:
    awsKms:
      # Use the AWS KMS key id from this ConfigMap instead of the private key.
      enabled: false
      configmap:
        name: coprocessor-tx-sender
        key: AWS_KEY_ID
    secret:
      name: coprocessor-tx-sender
      key: private-key
      value: ""  # devnet only: raw private key instead of the Secret

  # Template-injected args: --database-url, --gateway-url,
  # --input-verification-address, --ciphertext-commits-address,
  # --signer-type, --private-key (unless wallet.awsKms.enabled),
  # --health-check-port, --metrics-addr, --host-chain-url (v0.11, when set),
  # --multichain-acl-address (v0.11 only: add multichain-acl-address to
  # disabledArgs on later images).
  # Other transaction_sender flags:
  #   --database-pool-size=10
  #   --database-polling-interval-secs=1
  #   --verify-proof-resp-database-channel=event_zkpok_computed
  #   --add-ciphertexts-database-channel=event_ciphertexts_uploaded
  #   --verify-proof-resp-batch-limit=128
  #   --verify-proof-resp-max-retries=6
  #   --verify-proof-remove-after-max-retries=true
  #   --add-ciphertexts-batch-limit=10
  #   --add-ciphertexts-max-retries=2147483647
  #   --error-sleep-initial-secs=1
  #   --error-sleep-max-secs=4
  #   --send-txn-sync-timeout-secs=4
  #   --review-after-unlimited-retries=30
  #   --provider-retry-interval=4s
  #   --health-check-timeout=4s
  #   --log-level=INFO
  #   --gas-limit-overprovision-percent=300
  #   --graceful-shutdown-timeout=8s
  #   --service-name=txn-sender
  #   --metric-host-txn-latency=0.1:60.0:0.1
  #   --metric-zkproof-txn-latency=0.1:60.0:0.1
  #   --gauge-update-interval-secs=10
  extraArgs: []

  ports:
    metrics: 9100
    healthcheck: 8080

# -----------------------------------------------------------------------------
# Upgrade Controller
# -----------------------------------------------------------------------------
# RFC-021 GCS control plane: owns the per-operator upgrade FSM and
# execute_cutover. Enable only on the green fleet.
upgradeController:
  enabled: false

  image:
    repository: coprocessor/upgrade-controller

  tracing:
    service: "upgrade-controller"
