[package]
authors = ["Zama"]
name = "fhevm-sig-proxy"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause-Clear"
description = "HTTPS reverse proxy on Pingora that authenticates each request's FhevmSig before forwarding it"

[dependencies]
alloy = { version = "2", default-features = false, features = [
    "providers",
    "reqwest-rustls-tls",
    "std",
    "transport-http",
] }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
fhevm-sig-auth = { path = "../fhevm-sig-auth", features = ["protocol-config"] }
http = "1"
pingora = { version = "=0.9.0", default-features = false, features = [
    "openssl",
    "lb",
    "proxy",
] }
tokio = { version = "1", default-features = false, features = ["time"] }
tracing = "0.1"

[dev-dependencies]
alloy = { version = "2", default-features = false, features = ["signer-local"] }
fhevm_host_bindings = { path = "../../host-contracts/rust_bindings", default-features = false }
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = [
    "aws_lc_rs",
    "crypto",
    "pem",
] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
rstest = "0.26"
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
    "macros",
    "net",
    "rt-multi-thread",
] }
