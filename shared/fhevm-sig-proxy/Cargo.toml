[package]
authors = ["Zama"]
name = "fhevm-sig-proxy"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause-Clear"
description = "HTTPS reverse proxy on Pingora that authenticates each request's FhevmSig before forwarding it"

[dependencies]
alloy = { version = "2", default-features = false, features = [
    "providers",
    "reqwest-rustls-tls",
    "serde",
    "std",
    "transport-http",
] }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
fhevm-sig-auth = { path = "../fhevm-sig-auth", features = ["protocol-config"] }
http = "1"
humantime-serde = "1"
pingora = { version = "=0.9.0", default-features = false, features = [
    "openssl",
    "lb",
    "proxy",
] }
prometheus = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["time"] }
tracing = "0.1"
url = { version = "2", features = ["serde"] }

# Only for the `conformance` feature.
fhevm_host_bindings = { path = "../../host-contracts/rust_bindings", default-features = false, optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", default-features = false, features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
rcgen = { version = "0.14", default-features = false, features = [
    "aws_lc_rs",
    "crypto",
    "pem",
], optional = true }
serde_json = { version = "1", optional = true }

[features]
# The black-box conformance suite of the proxy binaries built on this library, and its toolbox.
# Test-only: enabled from dev-dependencies.
conformance = [
    "alloy/rpc-types",
    "alloy/signer-local",
    "dep:fhevm_host_bindings",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:rcgen",
    "dep:serde_json",
    "tokio/macros",
    "tokio/net",
    "tokio/rt",
]

[dev-dependencies]
fhevm-sig-proxy = { path = ".", features = ["conformance"] }
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
rstest = "0.26"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
