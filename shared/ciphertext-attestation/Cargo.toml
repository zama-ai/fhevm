[package]
authors = ["Zama"]
name = "ciphertext-attestation"
version = "0.14.0"
edition = "2024"
license = "BSD-3-Clause-Clear"

[features]
# Networked half (on-chain registry mirroring, S3 HEAD attestation fetch, consensus fan-out).
# Opt-in: a consumer that only needs the wire types, signing, and `consensus::evaluate` should
# not be made to pull in alloy, tokio, and the rest of this feature's dependencies.
client = ["dep:alloy", "dep:anyhow", "dep:futures", "dep:tokio", "dep:tokio-util", "dep:fhevm_gateway_bindings"]

[dependencies]
alloy-primitives = { version = "1", default-features = false, features = ["std", "serde"] }
alloy-signer = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha3 = { version = "0.10.8", default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["std"] }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false }

# `client` feature only, see [features] above.
alloy = { version = "2", default-features = false, optional = true, features = [
    "essentials",
    "reqwest-rustls-tls",
    "std",
] }
anyhow = { version = "1", default-features = false, optional = true, features = ["std"] }
futures = { version = "0.3", default-features = false, optional = true }
tokio = { version = "1", default-features = false, optional = true, features = ["rt", "time"] }
tokio-util = { version = "0.7", default-features = false, optional = true }
fhevm_gateway_bindings = { path = "../../gateway-contracts/rust_bindings", default-features = false, optional = true }

[dev-dependencies]
alloy-signer-local = { version = "2", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }
# Used only by the `client` feature's own integration tests.
wiremock = "0.6.5"
