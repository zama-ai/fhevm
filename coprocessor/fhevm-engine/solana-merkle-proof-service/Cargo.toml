[package]
name = "solana-merkle-proof-service"
version = "0.7.0"
authors.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
path = "src/bin/solana_merkle_indexer.rs"
name = "solana_merkle_indexer"
test = false
bench = false

[[bin]]
path = "src/bin/solana_merkle_proof_server.rs"
name = "solana_merkle_proof_server"
test = false
bench = false

[dependencies]
alloy = { workspace = true }
anyhow = { workspace = true }
# HTTP/2 without TLS (prior knowledge), as the KMS connector sends it.
axum = { workspace = true, features = ["http2"] }
bs58 = "0.5.1"
ciborium = "0.2.2"
clap = { workspace = true }
# Already in the tree through solana-streamer.
governor = "0.6.3"
prometheus = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = "0.11.19"
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
# The Merkle proof route's committed OpenAPI document.
utoipa = { workspace = true }

# The store check reads each recorded store's account at finalized commitment.
solana-client = "3.0"
solana-sdk = "3.0"

fhevm-engine-common = { path = "../fhevm-engine-common" }
fhevm_host_bindings = { path = "../../../host-contracts/rust_bindings", default-features = false }
kms-context = { path = "../../../shared/kms-context" }
request-authorization = { path = "../../../shared/request-authorization" }
solana-host-follower = { path = "../solana-host-follower" }
# Leaf commitments and MMR of the leaf record, shared with the on-chain host.
zama-solana-acl = { path = "../../../solana/crates/zama-solana-acl" }

[dev-dependencies]
# Encodes host instructions for the indexer tests' blocks.
anchor-lang = "1.2.0"
# Encodes the encrypted store accounts of the store check tests.
borsh = "1"
zama-host = { path = "../../../solana/programs/zama-host", default-features = false, features = ["no-entrypoint", "decode"] }
hex = { workspace = true }
reqwest = { workspace = true, features = ["http2"] }
serde_json = { workspace = true }
serial_test = { workspace = true }
test-harness = { path = "../test-harness" }

[lints]
workspace = true
