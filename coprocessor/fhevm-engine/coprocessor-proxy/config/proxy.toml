# Configuration of the coprocessor proxy, shipped in its image at
# /etc/coprocessor-proxy/proxy.toml. Every key is a field of fhevm_sig_proxy::ProxyConfig, or
# log_level, healthcheck_port or metrics_endpoint; a timing left out takes the library default.
#
# The deployment sets the rest in environment variables prefixed with `COPROCESSOR_PROXY_`, with
# `__` between nested keys, which also override any key below. FhevmSig (RFC-038): the EIP-712
# domain is (ethereum chain id, ProtocolConfig), the audience is this coprocessor's signer, and the
# allowed signers are the KMS tx-senders of the Active KMS contexts ProtocolConfig lists:
#   COPROCESSOR_PROXY_ETHEREUM_CHAIN_ID
#   COPROCESSOR_PROXY_PROTOCOL_CONFIG_ADDRESS
#   COPROCESSOR_PROXY_AUDIENCE
#   COPROCESSOR_PROXY_SIGNERS__PROTOCOL_CONFIG__RPC_URL

bind_address = "0.0.0.0:8443"
service_name = "coprocessor-proxy"

# prf-service keeps per-connector slots, so it needs the caller's identity: with the signed header
# it verifies that identity itself instead of trusting one the proxy sets. Without this key the
# proxy removes the header, and prf-service has no identity to accept.
forward_authorization = true

[tls_config]
cert_path = "/etc/coprocessor-proxy/tls/tls.crt"
key_path = "/etc/coprocessor-proxy/tls/tls.key"

[[upstreams]]
name = "prf-service"
endpoint_addresses = ["prf-service:8080"]
healthcheck_path = "/healthz"

# The PRF route of RFC-038.
[[routes]]
methods = ["GET", "HEAD"]
path = "/v1/prf/{prf}/labels/{label}/{padLength}"
upstream = "prf-service"
# Must exceed the time the endpoint holds a request for a pad not yet computed.
endpoint_response_timeout = "120s"
max_body_bytes = 0
