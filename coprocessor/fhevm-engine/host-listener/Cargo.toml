[package]
name = "host-listener"
version = "0.7.0"
edition = "2021"
license.workspace = true

[features]
test-failpoints = ["consumer/test-failpoints"]
default = []
test_bypass_key_extraction = []

[[bin]]
path = "src/bin/main.rs"
name = "host_listener"
test = false
bench = false

[[bin]]
path = "src/bin/poller.rs"
name = "host_listener_poller"
test = false
bench = false

[[bin]]
path = "src/bin/consumer.rs"
name = "host_listener_consumer"
test = false

[[bin]]
path = "src/bin/solana_host_listener.rs"
name = "solana_host_listener"
test = false
bench = false

[[bin]]
path = "src/bin/migration_test_key.rs"
name = "migration_test_key"
required-features = ["test-failpoints"]
test = false
bench = false

[dependencies]
# workspace dependencies
anyhow = { workspace = true }
alloy = { workspace = true }
alloy-primitives = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
aws-sdk-s3 = { workspace = true }
bigdecimal = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
lru = { workspace = true }
prometheus = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha3 = { workspace = true }
sqlx = { workspace = true }
tfhe = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
union-find = { workspace = true}

url = "2.5.7"
solana-sdk = "3.0"
# Solana reconstruction.
# no-entrypoint builds the program crate as a host library so we can call its
# deterministic computed_*_handle functions directly (parity, not a copy).
zama-host = { path = "../../../solana/programs/zama-host", default-features = false, features = ["no-entrypoint", "decode"] }
# AnchorDeserialize for reusing zama-host's FheExecuteArgs to decode the fhe_execute batch.
anchor-lang = "1.2.0"
# Follows the zama-host program over Yellowstone gRPC.
solana-host-follower = { path = "../solana-host-follower" }

# local dependencies
fhevm-engine-common = { path = "../fhevm-engine-common" }
fhevm_host_bindings = { path = "../../../host-contracts/rust_bindings", default-features = false }
# TODO: integrate github or better path when available
consumer = { path = "../../../listener/crates/consumer" }
primitives = { path = "../../../listener/crates/shared/primitives" }

[dev-dependencies]
alloy = { workspace = true, features = ["node-bindings"] }
anyhow = { workspace = true }
aws-smithy-mocks = "0.1.1"
bs58 = "0.5.1"
serial_test = { workspace = true }
test-harness = { path = "../test-harness" }
tracing-test = { workspace = true }

# Enable test bypass features for integration tests
[dev-dependencies.host-listener]
path = "."
features = ["test_bypass_key_extraction"]

[build-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
