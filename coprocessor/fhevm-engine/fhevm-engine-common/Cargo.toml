[package]
name = "fhevm-engine-common"
version = "0.6.1"
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# workspace dependencies
anyhow = { workspace = true }
alloy = { workspace = true, features = ["providers", "provider-ws"] }
bs58 = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
aws-sigv4 = { workspace = true }
bigdecimal = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
lru = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
sha3 = { workspace = true }
strum = { workspace = true }
sqlx = {workspace = true, features = ["bigdecimal"]}
tfhe = { workspace = true }
tonic  = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
bytesize = { workspace = true}
tokio-util = { workspace = true}
axum = { workspace = true}
serde_json = { workspace = true}
http = {workspace = true}
thiserror = { workspace = true }
prometheus = { workspace = true }
url = { workspace = true }


# crates.io dependencies
lazy_static = "1.5.0"
rand_chacha = "0.3.1"
futures = "0.3.31"

# opentelemetry support
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }

[features]
nightly-avx512 = ["tfhe/nightly-avx512"]
gpu = ["tfhe/gpu"]
latency = []
throughput = []
compact-hex = []
# Local runs only: take the versions from BUILD_CONSENSUS_VERSION and
# BUILD_STACK_VERSION so a second stack builds from the same tree. A cutover
# needs both to move, so they are normally used together.
consensus-version-override = []
stack-version-override = []

[build-dependencies]
tonic-prost-build = { workspace = true }

[[bin]]
name = "generate-keys"
path = "src/bin/generate_keys.rs"

[[bin]]
name = "resolve_database_url"
path = "src/bin/resolve_database_url.rs"

[[bin]]
name = "bootstrap_versioning"
path = "src/bin/bootstrap_versioning.rs"

[lints]
workspace = true
