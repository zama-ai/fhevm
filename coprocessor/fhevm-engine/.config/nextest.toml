# How tests are run in this workspace.
#
# tfhe-worker tests fall into two groups with very different costs. Tests that load
# the FHE keys need about 5 GB each, so only a few can run at once. The rest only talk
# to a database and cost almost nothing, so they should not be held back by that.

[profile.default]
# Set for the cheap, database-bound tests, which are the majority. The expensive ones
# are limited separately below.
test-threads = 16

# Long FHE tests are normal, so report a slow test but never kill it. The workflow
# timeout is what stops a genuinely stuck run.
slow-timeout = { period = "120s" }

# Each test deletes its database as it finishes, without this the test can be reported as leaky.
leak-timeout = "10s"

[test-groups]
# These check how workers hand locks between each other, using timeouts of a second
# or two. Running them alongside anything else makes them flaky.
serial-db = { max-threads = 1 }

# Each of these holds an FHE key in memory, roughly 5 GB. Four plus a database fits
# the 32 GB CI machine; more would run it out of memory.
fhe-keys = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'test(/^tests::dependence_chain::/)'
test-group = "serial-db"

[[profile.default.overrides]]
# The two `*_split_*` checks are pure computation with no database, so they are
# excluded and can run alongside anything.
filter = 'test(/^tests::(operators_from_events|scheduling_bench|random|errors|inputs|materialization|db_key_cache|health_check)::/) and not test(/_split_/)'
test-group = "fhe-keys"

# Used by CI, which also wants a JUnit report for per-test timings.
[profile.ci]
inherits = "default"
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
