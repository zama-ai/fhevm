# All of the options which can be passed via CLI arguments can also be
# permanently specified in this file.

[advisories]
# The ignored vulnerability RUSTSEC-2023-0071 is due to sqlx-mysql which is not used
# The ignored vulnerability RUSTSEC-2025-0111 is affecting only the testcontainers only used for testing
# The ignored vulnerability RUSTSEC-2026-0258 low severity and a real fix is tracked in https://github.com/zama-ai/fhevm-internal/issues/1923
# The ignored vulnerabilities RUSTSEC-2026-0391/0398/0403 (zstd via pingora) are not reachable, and RUSTSEC-2026-0387 (crypto-bigint via alloy)
# is a low-risk timing side channel. No upgrade available yet, tracked in https://github.com/zama-ai/fhevm-internal/issues/2256
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2025-0111",
    "RUSTSEC-2026-0258",
    "RUSTSEC-2026-0387",
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
]
informational_warnings = ["unmaintained"]
severity_threshold = "medium"

# Advisory Database Configuration
[database]
path = ".cargo/advisory-db"                        # Path where advisory git repo will be cloned
url = "https://github.com/RustSec/advisory-db.git" # URL to git repo
fetch = true                                       # Perform a `git fetch` before auditing (default: true)
stale = false                                      # Allow stale advisory DB (i.e. no commits for 90 days, default: false)

# Output Configuration
[output]
deny = []           # exit on error if unmaintained dependencies are found
format = "terminal" # "terminal" (human readable report) or "json"
quiet = false       # Only print information on error
show_tree = false   # Show inverse dependency trees along with advisories (default: true)

# Target Configuration
[target]
os = "linux"
# arch = "x86_64"

[yanked]
enabled = true      # Warn for yanked crates in Cargo.lock (default: true)
update_index = true # Auto-update the crates.io index (default: true)
