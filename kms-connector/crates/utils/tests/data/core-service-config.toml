# Config for `kms-server` in the KMS Core test container. It runs one threshold party without a
# peer list: the server starts and serves gRPC health, but it has no MPC context and cannot run
# MPC requests (key generation, decryption, ...).

[service]
listen_address = "0.0.0.0"
listen_port = 50051
timeout_secs = 360
grpc_max_message_size = 104857600 # 100 MiB

[telemetry]
tracing_service_name = "kms-threshold-test-1"
tracing_otlp_timeout_ms = 10000
metrics_bind_address = "0.0.0.0:9646"
enable_sys_metrics = true

[telemetry.batch]
max_queue_size = 8192
max_export_batch_size = 2048
max_concurrent_exports = 4
scheduled_delay_ms = 500
export_timeout_ms = 5000

[aws]
region = "eu-west-1"
s3_endpoint = "http://object-store:9000"

[public_vault.storage.s3]
bucket = "kms-public"
prefix = "PUB"

[private_vault.storage.file]
path = "./keys"

[threshold]
listen_address = "0.0.0.0"
listen_port = 50001
my_id = 1
threshold = 1
dec_capacity = 10000
min_dec_cache = 6000
decryption_mode = "NoiseFloodSmall"

# Written by `kms-gen-tls-certs` before the server starts. Secure builds require TLS for the
# core-to-core network, even without peers.
[threshold.tls.manual]
cert.path = "certs/cert_kms-threshold-test-1.pem"
key.path = "certs/key_kms-threshold-test-1.pem"
